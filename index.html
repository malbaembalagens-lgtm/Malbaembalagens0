// Helper: renderiza célula de responsável considerando defaultAssigneeId (V8.5.1)
function renderAssigneeCell(it, canEdit) {
  var effectiveAssignee = it.instance.assigneeId;
  var isDefault = false;
  if (!effectiveAssignee) {
    var tpl = getTaskTpl(it.code);
    if (tpl && tpl.defaultAssigneeId) {
      effectiveAssignee = tpl.defaultAssigneeId;
      isDefault = true;
    }
  }
  if (canEdit) {
    return '<select class="ed assignee-select" data-assignee data-m="' + esc(it.monthKey) + '" data-d="' + esc(String(it.day)) + '" data-c="' + esc(it.code) + '">' + userOpts(effectiveAssignee) + '</select>';
  } else {
    var u = getUser(effectiveAssignee);
    if (u) {
      return '<div class="assignee-cell"><div class="avatar avatar-xs" style="background:' + esc(u.color || '#0A0A0A') + '">' + esc(u.initials || u.name.substring(0,2).toUpperCase()) + '</div>' +
        '<span style="font-size:12px">' + esc(u.name.split(' ')[0]) + (isDefault ? ' <span style="font-size:9px;color:#9A9A9A">(padrão)</span>' : '') + '</span></div>';
    }
    return '<span style="color:#C5C5C5;font-size:11px">— sem responsável —</span>';
  }
}

function renderLista() {
  var monthIdx = state.ui.monthSel;
  var monthKey = MONTHS_KEY[monthIdx];
  var monthName = MONTHS[monthIdx];
  var daysInMonth = new Date(2026, monthIdx + 1, 0).getDate();

  // Coletar todos os items do mês
  var items = [];
  var i, j, t;
  for (i = 1; i <= daysInMonth; i++) {
    var date = new Date(2026, monthIdx, i);
    for (j = 0; j < state.tpl.diarias.length; j++) {
      t = state.tpl.diarias[j];
      var inst = peekInst(monthKey, i, t.code);
      if (!canViewTask(inst, t)) continue;
      items.push({
        type: 'diaria', monthKey: monthKey, day: i, date: date,
        code: t.code, title: t.title, area: t.area, priority: t.priority, instance: inst,
        desc: t.desc || ''
      });
    }
  }
  for (i = 1; i <= daysInMonth; i++) {
    if (new Date(2026, monthIdx, i).getDay() === 1) {
      var wn = Math.ceil(i / 7);
      for (j = 0; j < state.tpl.semanais.length; j++) {
        t = state.tpl.semanais[j];
        var inst2 = peekInst(monthKey, 'w' + wn, t.code);
        if (!canViewTask(inst2, t)) continue;
        items.push({
          type: 'semanal', monthKey: monthKey, day: 'w' + wn, date: new Date(2026, monthIdx, i),
          code: t.code, title: t.title, area: t.area, priority: t.priority, instance: inst2,
          desc: t.desc || ''
        });
      }
    }
  }
  for (j = 0; j < state.tpl.mensais.length; j++) {
    t = state.tpl.mensais[j];
    var inst3 = peekInst(monthKey, 'm', t.code);
    if (!canViewTask(inst3, t)) continue;
    items.push({
      type: 'mensal', monthKey: monthKey, day: 'm', date: new Date(2026, monthIdx, 1),
      code: t.code, title: t.title, area: t.area, priority: t.priority, instance: inst3,
      desc: t.desc || ''
    });
  }

  // === STATS ANTES DE FILTRAR ===
  var statsTotal = items.length;
  var statsAFazer = 0, statsAndamento = 0, statsConcluido = 0, statsBloqueado = 0, statsSemResp = 0;
  for (i = 0; i < items.length; i++) {
    var st = items[i].instance.status;
    if (st === 'Concluído') statsConcluido++;
    else if (st === 'Em andamento') statsAndamento++;
    else if (st === 'Bloqueado') statsBloqueado++;
    else statsAFazer++;

    // Sem responsável (considera default)
    var aId = items[i].instance.assigneeId;
    if (!aId) {
      var tplTask = getTaskTpl(items[i].code);
      if (!tplTask || !tplTask.defaultAssigneeId) statsSemResp++;
    }
  }

  // === Aplicar filtros ===
  var filtered = items;
  if (state.ui.fArea && state.ui.fArea !== 'todas') {
    filtered = filtered.filter(function(it) { return it.area === state.ui.fArea; });
  }
  if (state.ui.fStatus && state.ui.fStatus !== 'todos') {
    filtered = filtered.filter(function(it) { return it.instance.status === state.ui.fStatus; });
  }
  if (state.ui.fAssignee && state.ui.fAssignee !== 'todos') {
    if (state.ui.fAssignee === 'sem') {
      filtered = filtered.filter(function(it) {
        var assigneeId = it.instance.assigneeId;
        if (!assigneeId) {
          var tpl = getTaskTpl(it.code);
          if (tpl && tpl.defaultAssigneeId) assigneeId = tpl.defaultAssigneeId;
        }
        return !assigneeId;
      });
    } else {
      filtered = filtered.filter(function(it) {
        var assigneeId = it.instance.assigneeId;
        if (!assigneeId) {
          var tpl = getTaskTpl(it.code);
          if (tpl && tpl.defaultAssigneeId) assigneeId = tpl.defaultAssigneeId;
        }
        return assigneeId === state.ui.fAssignee;
      });
    }
  }
  if (state.ui.fType && state.ui.fType !== 'todos') {
    filtered = filtered.filter(function(it) { return it.type === state.ui.fType; });
  }
  if (state.ui.fSearch) {
    var q = state.ui.fSearch.toLowerCase();
    filtered = filtered.filter(function(it) {
      return it.title.toLowerCase().indexOf(q) !== -1 ||
             it.code.toLowerCase().indexOf(q) !== -1 ||
             it.area.toLowerCase().indexOf(q) !== -1;
    });
  }

  // Áreas únicas
  var areasSet = ['todas'];
  var seen = {};
  for (i = 0; i < items.length; i++) {
    if (!seen[items[i].area]) { seen[items[i].area] = true; areasSet.push(items[i].area); }
  }

  // === MODO DE VISUALIZAÇÃO ===
  var viewMode = state.ui.listaView || 'tabela'; // 'tabela' | 'agrupada'

  // === RENDER ITEMS ===
  var contentHTML = '';
  if (filtered.length === 0) {
    contentHTML = '<div class="empty"><div class="empty-icon">📋</div>' +
      '<div class="empty-title">Nenhuma tarefa encontrada</div>' +
      '<div class="empty-text">Tente limpar os filtros ou criar novas tarefas</div></div>';
  } else if (viewMode === 'agrupada') {
    // Agrupar por dia/data
    var groups = {};
    for (i = 0; i < filtered.length; i++) {
      var it0 = filtered[i];
      var key = '';
      if (it0.type === 'mensal') key = 'mes';
      else if (it0.type === 'semanal') key = 'sem' + it0.day.replace('w','');
      else key = 'dia' + it0.day;
      if (!groups[key]) groups[key] = { items: [], date: it0.date, type: it0.type, day: it0.day };
      groups[key].items.push(it0);
    }
    // Ordenar grupos
    var orderedKeys = Object.keys(groups).sort(function(a, b) {
      var ga = groups[a], gb = groups[b];
      if (ga.type === 'mensal') return -1;
      if (gb.type === 'mensal') return 1;
      if (ga.type === 'semanal' && gb.type !== 'semanal') return -1;
      if (gb.type === 'semanal' && ga.type !== 'semanal') return 1;
      return ga.date.getTime() - gb.date.getTime();
    });

    contentHTML = '';
    for (var gk = 0; gk < orderedKeys.length; gk++) {
      var grp = groups[orderedKeys[gk]];
      var grpLabel = '';
      if (grp.type === 'mensal') grpLabel = '📊 Mensal — ' + monthName;
      else if (grp.type === 'semanal') grpLabel = '📅 Semana ' + grp.day.replace('w','');
      else {
        var dt = grp.date;
        var dow = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][dt.getDay()];
        grpLabel = dow + ' · ' + dt.getDate() + ' de ' + monthName;
        var today = new Date();
        if (today.getFullYear() === 2026 && today.getMonth() === monthIdx && today.getDate() === dt.getDate()) {
          grpLabel = '🟠 HOJE — ' + grpLabel;
        }
      }

      var grpDone = 0;
      for (var gi = 0; gi < grp.items.length; gi++) if (grp.items[gi].instance.status === 'Concluído') grpDone++;
      var grpPct = grp.items.length > 0 ? Math.round(grpDone / grp.items.length * 100) : 0;

      contentHTML += '<div class="lista-group">' +
        '<div class="lista-group-head">' +
          '<div class="lista-group-title">' + esc(grpLabel) + '</div>' +
          '<div class="lista-group-stats">' + grpDone + '/' + grp.items.length + ' · ' + grpPct + '%</div>' +
        '</div>';

      for (i = 0; i < grp.items.length; i++) {
        contentHTML += renderTaskListItem(grp.items[i], 'agrupada');
      }
      contentHTML += '</div>';
    }
  } else {
    // Modo tabela
    var rowsHtml = '';
    for (i = 0; i < filtered.length; i++) {
      rowsHtml += renderTaskListItem(filtered[i], 'tabela');
    }
    contentHTML = '<div class="card" style="padding:0"><div class="tbl-wrap"><table class="tbl tbl-tasks">' +
      '<thead><tr>' +
        '<th class="cbox-col"></th>' +
        '<th class="code-col">Código</th>' +
        '<th>Tarefa</th>' +
        '<th class="date-col">Data</th>' +
        '<th class="prio-col">Prioridade</th>' +
        '<th class="resp-col">Responsável</th>' +
        '<th class="status-col">Status</th>' +
        '<th class="actions-col"></th>' +
      '</tr></thead>' +
      '<tbody>' + rowsHtml + '</tbody></table></div></div>';
  }

  // Filtros UI com contadores
  var areaOpts = '';
  for (i = 0; i < areasSet.length; i++) {
    var a = areasSet[i];
    areaOpts += '<option value="' + esc(a) + '"' + (state.ui.fArea === a ? ' selected' : '') + '>' + (a === 'todas' ? 'Todas as áreas' : esc(a)) + '</option>';
  }
  var monthPickerOpts = '';
  for (i = 0; i < 12; i++) {
    monthPickerOpts += '<option value="' + i + '"' + (i === monthIdx ? ' selected' : '') + '>' + MONTHS[i] + '</option>';
  }
  var assigneeOpts = '<option value="todos">Todos responsáveis</option><option value="sem"' + (state.ui.fAssignee === 'sem' ? ' selected' : '') + '>Sem responsável (' + statsSemResp + ')</option>';
  for (i = 0; i < state.users.length; i++) {
    var ucount = 0;
    for (var ic = 0; ic < items.length; ic++) {
      var aId2 = items[ic].instance.assigneeId;
      if (!aId2) {
        var tplI = getTaskTpl(items[ic].code);
        if (tplI && tplI.defaultAssigneeId) aId2 = tplI.defaultAssigneeId;
      }
      if (aId2 === state.users[i].id) ucount++;
    }
    if (ucount > 0 || state.ui.fAssignee === state.users[i].id) {
      assigneeOpts += '<option value="' + esc(state.users[i].id) + '"' + (state.ui.fAssignee === state.users[i].id ? ' selected' : '') + '>' + esc(state.users[i].name) + ' (' + ucount + ')</option>';
    }
  }

  var hasFilters = state.ui.fArea !== 'todas' || state.ui.fStatus !== 'todos' || state.ui.fSearch || state.ui.fAssignee !== 'todos' || (state.ui.fType && state.ui.fType !== 'todos');

  // === STATS CARDS CLICÁVEIS ===
  var statsHTML =
    '<div class="lista-stats">' +
      '<div class="stat-card' + (state.ui.fStatus === 'todos' ? ' active' : '') + '" data-filter-status="todos">' +
        '<div class="stat-value">' + statsTotal + '</div>' +
        '<div class="stat-label">Total</div>' +
      '</div>' +
      '<div class="stat-card afazer' + (state.ui.fStatus === 'A fazer' ? ' active' : '') + '" data-filter-status="A fazer">' +
        '<div class="stat-value">' + statsAFazer + '</div>' +
        '<div class="stat-label">A fazer</div>' +
      '</div>' +
      '<div class="stat-card andamento' + (state.ui.fStatus === 'Em andamento' ? ' active' : '') + '" data-filter-status="Em andamento">' +
        '<div class="stat-value">' + statsAndamento + '</div>' +
        '<div class="stat-label">Em andamento</div>' +
      '</div>' +
      '<div class="stat-card concluido' + (state.ui.fStatus === 'Concluído' ? ' active' : '') + '" data-filter-status="Concluído">' +
        '<div class="stat-value">' + statsConcluido + '</div>' +
        '<div class="stat-label">Concluídas</div>' +
      '</div>' +
      (statsBloqueado > 0 ?
        '<div class="stat-card bloqueado' + (state.ui.fStatus === 'Bloqueado' ? ' active' : '') + '" data-filter-status="Bloqueado">' +
          '<div class="stat-value">' + statsBloqueado + '</div>' +
          '<div class="stat-label">Bloqueadas</div>' +
        '</div>' : '') +
    '</div>';

  return '<div class="page-head">' +
      '<div><h2 class="page-title">📋 Tarefas</h2>' +
      '<p class="page-sub">' + monthName + ' 2026 — ' + filtered.length + ' de ' + statsTotal + ' tarefa' + (statsTotal !== 1 ? 's' : '') + '</p></div>' +
      (canManage() ? '<button class="btn btn-primary" id="btnNewTpl"><span class="icon">+</span> Nova tarefa modelo</button>' : '') +
    '</div>' +

    // Stats clicáveis
    statsHTML +

    // Navegação de mês
    '<div class="month-nav">' +
      '<button class="btn btn-icon" id="prevMonth" title="Mês anterior"><span class="icon" style="display:inline-flex">' + ICON.prev + '</span></button>' +
      '<select class="input month-picker" id="monthPicker">' + monthPickerOpts + '</select>' +
      '<button class="btn btn-icon" id="nextMonth" title="Próximo mês"><span class="icon" style="display:inline-flex">' + ICON.next + '</span></button>' +

      // Toggle de visualização
      '<div class="view-toggle">' +
        '<button class="view-btn' + (viewMode === 'tabela' ? ' active' : '') + '" data-view="tabela" title="Tabela">📊 Tabela</button>' +
        '<button class="view-btn' + (viewMode === 'agrupada' ? ' active' : '') + '" data-view="agrupada" title="Agrupada por dia">📅 Por dia</button>' +
      '</div>' +
    '</div>' +

    // Filtros
    '<div class="filters">' +
      '<span class="filters-label">Filtros:</span>' +
      '<select class="input" id="filterArea" style="width:auto;height:32px;font-size:12px">' + areaOpts + '</select>' +
      '<select class="input" id="filterType" style="width:auto;height:32px;font-size:12px">' +
        '<option value="todos"' + (!state.ui.fType || state.ui.fType === 'todos' ? ' selected' : '') + '>Todos os tipos</option>' +
        '<option value="diaria"' + (state.ui.fType === 'diaria' ? ' selected' : '') + '>Apenas diárias</option>' +
        '<option value="semanal"' + (state.ui.fType === 'semanal' ? ' selected' : '') + '>Apenas semanais</option>' +
        '<option value="mensal"' + (state.ui.fType === 'mensal' ? ' selected' : '') + '>Apenas mensais</option>' +
      '</select>' +
      (isAdmin() ? '<select class="input" id="filterAssignee" style="width:auto;height:32px;font-size:12px;min-width:180px">' + assigneeOpts + '</select>' : '') +
      (hasFilters ? '<button class="btn btn-sm btn-ghost" id="clearFilters">✕ Limpar filtros</button>' : '') +
    '</div>' +

    contentHTML;
}

// Helper: renderiza um item da lista (formato tabela ou linha agrupada)
function renderTaskListItem(it, mode) {
  var checked = it.instance.status === 'Concluído';
  var canEdit = canEditTask(it.instance, it);
  var subTotal = (it.instance.subtasks || []).length;
  var subDone = 0;
  for (var sii = 0; sii < subTotal; sii++) if (it.instance.subtasks[sii].done) subDone++;
  var typeLabel = it.type === 'diaria' ? 'Diária' : it.type === 'semanal' ? 'Semanal' : 'Mensal';

  var dataAttr = ' data-m="' + esc(it.monthKey) + '" data-d="' + esc(String(it.day)) + '" data-c="' + esc(it.code) + '"';

  if (mode === 'agrupada') {
    // Card horizontal compacto
    var areaInfo = getArea(it.area);
    return '<div class="task-row task-card' + (checked ? ' done' : '') + '" data-task-row' + dataAttr + '>' +
      '<span class="cbox lg' + (checked ? ' checked' : '') + (canEdit ? '' : '" aria-disabled="true') + '" data-toggle' + dataAttr + ' onclick="event.stopPropagation()"></span>' +
      '<div class="task-card-info">' +
        '<div class="task-card-title">' + esc(it.title) + '</div>' +
        '<div class="task-card-meta">' +
          '<span class="code">' + esc(it.code) + '</span>' +
          '<span class="type-bdg ' + esc(it.type) + '">' + typeLabel + '</span>' +
          (it.area ? '<span class="area-tag" style="background:' + esc(areaInfo.color) + '20;color:' + esc(areaInfo.color) + '">' + esc(areaInfo.emoji + ' ' + it.area) + '</span>' : '') +
          '<span class="prio ' + esc(it.priority || 'media') + '">' + esc(it.priority || 'media') + '</span>' +
          (subTotal > 0 ? '<span style="font-size:11px;color:#6B6B6B">📋 ' + subDone + '/' + subTotal + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="task-card-resp" onclick="event.stopPropagation()">' +
        renderAssigneeCell(it, canEdit) +
      '</div>' +
      '<div class="task-card-status" onclick="event.stopPropagation()">' +
        (canEdit ?
          '<select class="pill ' + statusCls(it.instance.status) + '" data-status' + dataAttr + '>' + statusOpts(it.instance.status) + '</select>' :
          pillStatus(it.instance.status)) +
      '</div>' +
      '<button class="btn-icon task-card-action" data-detail' + dataAttr + ' onclick="event.stopPropagation()" title="Abrir detalhes">' + ICON.edit + '</button>' +
    '</div>';
  } else {
    // Modo tabela
    var dateStr;
    if (it.type === 'mensal') dateStr = MONTHS[state.ui.monthSel];
    else if (it.type === 'semanal') dateStr = 'Sem ' + it.day.replace('w', '');
    else dateStr = fmtShort(it.date.getTime());

    return '<tr data-task-row' + dataAttr + ' style="cursor:pointer"' + (checked ? ' class="row-done"' : '') + '>' +
      '<td class="center cbox-col"><span class="cbox' + (checked ? ' checked' : '') + (canEdit ? '' : '" aria-disabled="true') + '" data-toggle' + dataAttr + '></span></td>' +
      '<td class="code-col"><span class="code">' + esc(it.code) + '</span><div style="font-size:9px;color:#9A9A9A;margin-top:2px">' + typeLabel + '</div></td>' +
      '<td class="task-cell"><div class="task-cell-title">' + esc(it.title) + '</div><div class="task-cell-area">' + (it.area ? areaTag(it.area) : '') + (subTotal > 0 ? '<span style="font-size:10px;color:#6B6B6B;margin-left:6px">📋 ' + subDone + '/' + subTotal + '</span>' : '') + '</div></td>' +
      '<td class="date-col" style="font-size:12px;color:#6B6B6B;white-space:nowrap">' + esc(dateStr) + '</td>' +
      '<td class="prio-col"><span class="prio ' + esc(it.priority || 'media') + '">' + esc(it.priority || 'media') + '</span></td>' +
      '<td class="resp-col" onclick="event.stopPropagation()">' + renderAssigneeCell(it, canEdit) + '</td>' +
      '<td class="status-col" onclick="event.stopPropagation()">' +
        (canEdit ?
          '<select class="pill ' + statusCls(it.instance.status) + '" data-status' + dataAttr + '>' + statusOpts(it.instance.status) + '</select>' :
          pillStatus(it.instance.status)) +
      '</td>' +
      '<td class="actions-col center" onclick="event.stopPropagation()"><button class="btn-icon" data-detail' + dataAttr + ' title="Abrir detalhes">' + ICON.edit + '</button></td>' +
    '</tr>';
  }
}

function attachLista() {
  var pm = document.getElementById('prevMonth');
  if (pm) pm.addEventListener('click', function() { state.ui.monthSel = Math.max(0, state.ui.monthSel - 1); renderPage(); });
  var nm = document.getElementById('nextMonth');
  if (nm) nm.addEventListener('click', function() { state.ui.monthSel = Math.min(11, state.ui.monthSel + 1); renderPage(); });
  var mp = document.getElementById('monthPicker');
  if (mp) mp.addEventListener('change', function() { state.ui.monthSel = parseInt(mp.value, 10); renderPage(); });
  var fa = document.getElementById('filterArea');
  if (fa) fa.addEventListener('change', function() { state.ui.fArea = fa.value; renderPage(); });
  var ft = document.getElementById('filterType');
  if (ft) ft.addEventListener('change', function() { state.ui.fType = ft.value; renderPage(); });
  var fAs = document.getElementById('filterAssignee');
  if (fAs) fAs.addEventListener('change', function() { state.ui.fAssignee = fAs.value; renderPage(); });

  // Stats cards clicáveis (filtram por status)
  var statCards = document.querySelectorAll('[data-filter-status]');
  for (var sc = 0; sc < statCards.length; sc++) {
    (function(card) {
      card.addEventListener('click', function() {
        state.ui.fStatus = card.getAttribute('data-filter-status');
        renderPage();
      });
    })(statCards[sc]);
  }

  // View toggle (tabela vs agrupada)
  var viewBtns = document.querySelectorAll('[data-view]');
  for (var vb = 0; vb < viewBtns.length; vb++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        state.ui.listaView = btn.getAttribute('data-view');
        renderPage();
      });
    })(viewBtns[vb]);
  }

  // Botão Nova Tarefa (abre catálogo)
  var btnNewTpl = document.getElementById('btnNewTpl');
  if (btnNewTpl) btnNewTpl.addEventListener('click', function() {
    if (typeof openTaskTplModal === 'function') openTaskTplModal('diarias');
  });

  var cf = document.getElementById('clearFilters');
  if (cf) cf.addEventListener('click', function() {
    state.ui.fArea = 'todas'; state.ui.fStatus = 'todos'; state.ui.fSearch = '';
    state.ui.fAssignee = 'todos'; state.ui.fType = 'todos';
    var s = document.getElementById('globalSearch');
    if (s) s.value = '';
    renderPage();
  });

  var toggles = document.querySelectorAll('[data-toggle]');
  for (var i = 0; i < toggles.length; i++) {
    (function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        if (el.getAttribute('aria-disabled') === 'true') { toast('Sem permissão', 'error'); return; }
        var m = el.getAttribute('data-m'), d = el.getAttribute('data-d'), c = el.getAttribute('data-c');
        var tk = getTaskTpl(c);
        var inst = peekInst(m, d, c);
        if (!canEditTask(inst, tk)) { toast('Sem permissão', 'error'); return; }
        var ns = inst.status === 'Concluído' ? 'A fazer' : 'Concluído';
        setTask(m, d, c, 'status', ns);
        renderShell();
        renderPage();
        toast(ns === 'Concluído' ? 'Tarefa concluída ✓' : 'Tarefa reaberta', 'success');
      });
    })(toggles[i]);
  }

  var statuses = document.querySelectorAll('[data-status]');
  for (var sx = 0; sx < statuses.length; sx++) {
    (function(el) {
      el.addEventListener('change', function() {
        var m = el.getAttribute('data-m'), d = el.getAttribute('data-d'), c = el.getAttribute('data-c');
        var tk = getTaskTpl(c);
        var inst = peekInst(m, d, c);
        if (!canEditTask(inst, tk)) { toast('Sem permissão', 'error'); return; }
        setTask(m, d, c, 'status', el.value);
        renderPage();
        toast('Status atualizado', 'success');
      });
    })(statuses[sx]);
  }

  var assignees = document.querySelectorAll('[data-assignee]');
  for (var ax = 0; ax < assignees.length; ax++) {
    (function(el) {
      el.addEventListener('change', function() {
        var m = el.getAttribute('data-m'), d = el.getAttribute('data-d'), c = el.getAttribute('data-c');
        var tk = getTaskTpl(c);
        var inst = peekInst(m, d, c);
        if (!canEditTask(inst, tk)) { toast('Sem permissão', 'error'); return; }
        // Garantir que a instância existe (cria se não existir) e atualiza
        var realInst = getInst(m, d, c);
        realInst.assigneeId = el.value || null;
        save();
        if (typeof window !== 'undefined') window.sbLastUserAction = Date.now();
        if (window.sbSaveTaskInst) window.sbSaveTaskInst(m, d, c, realInst);
        var u = getUser(el.value);
        logActivity('task', 'atribuiu ' + c + ' a ' + (u ? u.name : 'ninguém'));
        renderPage();
        toast(u ? 'Atribuída a ' + u.name : 'Responsável removido', 'success');
      });
    })(assignees[ax]);
  }

  var details = document.querySelectorAll('[data-detail]');
  for (var dt = 0; dt < details.length; dt++) {
    (function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        openTaskDetailModal(el.getAttribute('data-m'), el.getAttribute('data-d'), el.getAttribute('data-c'));
      });
    })(details[dt]);
  }

  var rows = document.querySelectorAll('[data-task-row]');
  for (var rw = 0; rw < rows.length; rw++) {
    (function(el) {
      el.addEventListener('click', function() {
        openTaskDetailModal(el.getAttribute('data-m'), el.getAttribute('data-d'), el.getAttribute('data-c'));
      });
    })(rows[rw]);
  }
}

// ========================================================
// TASK DETAIL MODAL — com subtasks!
// ========================================================
function openTaskDetailModal(monthKey, day, code) {
  var task = getTaskTpl(code);
  if (!task) return;
  var inst = getInst(monthKey, day, code);
  if (!canViewTask(inst, task)) { toast('Sem permissão para ver', 'error'); return; }
  var canEdit = canEditTask(inst, task);

  // Comentários
  var commentsHTML = '';
  if (!inst.comments || inst.comments.length === 0) {
    commentsHTML = '<div style="color:#6B6B6B;font-size:13px;text-align:center;padding:16px">Nenhum comentário</div>';
  } else {
    for (var i = 0; i < inst.comments.length; i++) {
      var c = inst.comments[i];
      var u = getUser(c.userId);
      commentsHTML += '<div class="comment">' + avatar(u, 'sm') +
        '<div class="comment-content"><div class="comment-head">' +
        '<span class="comment-author">' + esc(u ? u.name : 'Usuário') + '</span>' +
        '<span class="comment-time">' + timeAgo(c.timestamp) + '</span></div>' +
        '<div class="comment-body">' + esc(c.text) + '</div></div></div>';
    }
  }

  // Subtarefas
  if (!inst.subtasks) inst.subtasks = [];
  var subTotal = inst.subtasks.length;
  var subDone = 0;
  for (var si = 0; si < subTotal; si++) if (inst.subtasks[si].done) subDone++;
  var subPct = subTotal > 0 ? Math.round((subDone / subTotal) * 100) : 0;

  var subsHTML = '';
  if (subTotal === 0) {
    subsHTML = '<div style="color:#6B6B6B;font-size:12px;text-align:center;padding:12px">Nenhuma subtarefa. Adicione abaixo para quebrar a tarefa em passos.</div>';
  } else {
    for (var sj = 0; sj < inst.subtasks.length; sj++) {
      var sub = inst.subtasks[sj];
      subsHTML += '<div class="sub-row' + (sub.done ? ' done' : '') + '">' +
        '<span class="cbox' + (sub.done ? ' checked' : '') + '" data-sub-toggle data-sid="' + esc(sub.id) + '"></span>' +
        '<span class="sub-text">' + esc(sub.text) + '</span>' +
        (canEdit ? '<button class="btn-icon danger" data-sub-del data-sid="' + esc(sub.id) + '"><span style="display:inline-flex">' + ICON.trash + '</span></button>' : '') +
      '</div>';
    }
  }

  var html = '<div class="modal-bg" id="modalBg"><div class="modal lg">' +
    '<div class="modal-head"><div>' +
      '<div style="font-size:11px;color:#6B6B6B;font-weight:500;text-transform:uppercase;letter-spacing:0.5px">Tarefa ' + esc(task.code) + (canEdit ? '' : ' (somente leitura)') + '</div>' +
      '<div class="modal-title">' + esc(task.title) + '</div>' +
    '</div><button class="modal-close" data-close><span class="icon">' + ICON.close + '</span></button></div>' +
    '<div class="modal-body">' +
      '<div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">' +
        '<span class="prio ' + esc(task.priority || 'media') + '">' + esc(task.priority || 'media') + '</span>' +
        areaTag(task.area) +
      '</div>' +
      // Descrição
      (task.desc ? '<div style="background:#F7F7F5;border-left:3px solid #C8C8C8;padding:12px 14px;border-radius:4px;font-size:13px;line-height:1.6;color:#404040;margin-bottom:16px;white-space:pre-wrap">' + esc(task.desc) + '</div>' : '') +
      // Tags
      ((task.tags && task.tags.length > 0) ?
        '<div style="margin-bottom:16px"><div class="field-label" style="margin-bottom:6px">Tags</div><div style="display:flex;gap:4px;flex-wrap:wrap">' +
        task.tags.map(function(t) { return '<span class="tag-chip"># ' + esc(t) + '</span>'; }).join('') +
        '</div></div>' : '') +
      // Links
      ((task.links && task.links.length > 0) ?
        '<div style="margin-bottom:16px"><div class="field-label" style="margin-bottom:6px">Links</div>' +
        task.links.map(function(l) {
          return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener" class="link-row" style="text-decoration:none;color:#0A0A0A;display:flex;padding:8px 12px;background:#F7F7F5;border-radius:6px;border:1px solid #F0F0EE;margin-bottom:4px"><span style="font-size:13px">🔗 ' + esc(l.label || l.url) + '</span></a>';
        }).join('') +
        '</div>' : '') +
      '<div class="field-row" style="margin-bottom:16px">' +
        '<div class="field"><label class="field-label">Status</label>' +
          (canEdit ?
            '<select class="input" id="dtlStatus">' + statusOpts(inst.status) + '</select>' :
            '<div class="input" style="display:flex;align-items:center">' + pillStatus(inst.status) + '</div>'
          ) + '</div>' +
        '<div class="field"><label class="field-label">Responsável</label>' +
          (canEdit ?
            '<select class="input" id="dtlAssignee">' + userOpts(inst.assigneeId) + '</select>' :
            '<div class="input" style="display:flex;align-items:center">' + (getUser(inst.assigneeId) ? esc(getUser(inst.assigneeId).name) : '—') + '</div>'
          ) + '</div>' +
      '</div>' +
      '<div class="field" style="margin-bottom:16px">' +
        '<label class="field-label">Observações</label>' +
        (canEdit ?
          '<textarea class="input" id="dtlNotes" rows="3" placeholder="Anotações...">' + esc(inst.notes || '') + '</textarea>' :
          '<div class="input" style="min-height:80px;padding:10px 12px;line-height:1.5">' + (inst.notes ? esc(inst.notes) : '<span style="color:#9A9A9A">Sem observações</span>') + '</div>'
        ) + '</div>' +
      (inst.completedAt ? '<div style="background:#E8F2EA;color:#2D7A3E;padding:10px 12px;border-radius:6px;font-size:12px;margin-bottom:16px">✓ Concluída em ' + fmtDate(inst.completedAt) + (inst.completedBy ? ' por ' + esc((getUser(inst.completedBy) || {}).name || '') : '') + '</div>' : '') +
      '<div style="border-top:1px solid #F0F0EE;padding-top:16px;margin-top:16px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
          '<label class="field-label" style="margin:0">Subtarefas (' + subDone + '/' + subTotal + ')</label>' +
          (subTotal > 0 ? '<span style="font-size:11px;color:#6B6B6B;font-weight:600">' + subPct + '%</span>' : '') +
        '</div>' +
        (subTotal > 0 ? '<div class="prog-bar" style="margin-bottom:10px"><div class="prog-fill ' + (subPct >= 80 ? 'green' : subPct >= 50 ? 'amber' : '') + '" style="width:' + subPct + '%"></div></div>' : '') +
        '<div class="sub-list" id="subList">' + subsHTML + '</div>' +
        (canEdit ? '<div class="sub-input-row"><input type="text" id="newSubInput" placeholder="Adicionar subtarefa..."><button class="btn btn-primary btn-sm" id="btnAddSub"><span style="display:inline-flex">' + ICON.plus + '</span></button></div>' : '') +
      '</div>' +
      '<div style="border-top:1px solid #F0F0EE;padding-top:16px;margin-top:16px">' +
        '<label class="field-label" style="margin-bottom:8px;display:block">Comentários (' + (inst.comments || []).length + ')</label>' +
        '<div style="max-height:240px;overflow-y:auto;margin-bottom:12px">' + commentsHTML + '</div>' +
        '<div style="display:flex;gap:8px"><input class="input" id="dtlNewComment" placeholder="Adicione um comentário..." style="flex:1"><button class="btn btn-primary" id="dtlAddComment">Enviar</button></div>' +
      '</div>' +
    '</div>' +
    '<div class="modal-foot">' +
      (canManage() ? '<button class="btn" id="dtlEditTpl" title="Editar a tarefa modelo (afeta todas as datas)" style="margin-right:auto"><span style="display:inline-flex">' + ICON.edit + '</span> Editar tarefa</button>' +
                     '<button class="btn" id="dtlDelTpl" style="color:#B33A3A;border-color:#FAEDED"><span style="display:inline-flex">' + ICON.trash + '</span> Excluir tarefa</button>' : '') +
      '<button class="btn" data-close>Fechar</button>' +
      (canEdit ? '<button class="btn btn-primary" id="dtlSave">Salvar</button>' : '') +
    '</div>' +
    '</div></div>';

  showModal(html);

  if (canEdit) {
    document.getElementById('dtlSave').addEventListener('click', function() {
      setTask(monthKey, day, code, 'status', document.getElementById('dtlStatus').value);
      setTask(monthKey, day, code, 'assigneeId', document.getElementById('dtlAssignee').value || null);
      setTask(monthKey, day, code, 'notes', document.getElementById('dtlNotes').value);
      logActivity('task', 'atualizou tarefa ' + code);
      save();
      closeModal();
      renderShell();
      renderPage();
      toast('Salvo ✓', 'success');
    });

    var addSubBtn = document.getElementById('btnAddSub');
    var subInp = document.getElementById('newSubInput');
    function addSub() {
      var text = subInp.value.trim();
      if (!text) return;
      inst.subtasks.push({ id: genId('s'), text: text, done: false, doneAt: null, doneBy: null });
      logActivity('task', 'adicionou subtarefa em ' + code);
      save();
      if (window.sbSaveTaskInst) window.sbSaveTaskInst(monthKey, day, code, inst);
      closeModal();
      openTaskDetailModal(monthKey, day, code);
    }
    if (addSubBtn) addSubBtn.addEventListener('click', addSub);
    if (subInp) subInp.addEventListener('keypress', function(e) { if (e.key === 'Enter') addSub(); });

    var subDels = document.querySelectorAll('[data-sub-del]');
    for (var sd = 0; sd < subDels.length; sd++) {
      (function(b) {
        b.addEventListener('click', function() {
          if (!confirm('Excluir esta subtarefa?')) return;
          var sid = b.getAttribute('data-sid');
          inst.subtasks = inst.subtasks.filter(function(x) { return x.id !== sid; });
          save();
          if (window.sbSaveTaskInst) window.sbSaveTaskInst(monthKey, day, code, inst);
          closeModal();
          openTaskDetailModal(monthKey, day, code);
        });
      })(subDels[sd]);
    }
  }

  // Toggle subtask (qualquer um pode, se canEdit)
  var subToggles = document.querySelectorAll('[data-sub-toggle]');
  for (var st = 0; st < subToggles.length; st++) {
    (function(b) {
      b.addEventListener('click', function() {
        if (!canEdit) { toast('Sem permissão', 'error'); return; }
        var sid = b.getAttribute('data-sid');
        for (var i = 0; i < inst.subtasks.length; i++) {
          if (inst.subtasks[i].id === sid) {
            inst.subtasks[i].done = !inst.subtasks[i].done;
            inst.subtasks[i].doneAt = inst.subtasks[i].done ? Date.now() : null;
            inst.subtasks[i].doneBy = inst.subtasks[i].done ? state.user.id : null;
            break;
          }
        }
        save();
        if (window.sbSaveTaskInst) window.sbSaveTaskInst(monthKey, day, code, inst);
        closeModal();
        openTaskDetailModal(monthKey, day, code);
      });
    })(subToggles[st]);
  }

  var ncInput = document.getElementById('dtlNewComment');
  function addComment() {
    var text = ncInput.value.trim();
    if (!text) return;
    if (!inst.comments) inst.comments = [];
    inst.comments.push({ id: genId('c'), userId: state.user.id, text: text, timestamp: Date.now() });
    logActivity('task', 'comentou em ' + code);
    save();
    if (window.sbSaveTaskInst) window.sbSaveTaskInst(monthKey, day, code, inst);
    closeModal();
    openTaskDetailModal(monthKey, day, code);
  }
  document.getElementById('dtlAddComment').addEventListener('click', addComment);
  ncInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') addComment(); });

  // Editar tarefa template (admin)
  var btnEditTpl = document.getElementById('dtlEditTpl');
  if (btnEditTpl) btnEditTpl.addEventListener('click', function() {
    var type = getTaskTplType(code);
    if (!type) { toast('Tarefa não encontrada', 'error'); return; }
    closeModal();
    openTaskTplModal(type, code);
  });

  // Excluir tarefa template (admin)
  var btnDelTpl = document.getElementById('dtlDelTpl');
  if (btnDelTpl) btnDelTpl.addEventListener('click', function() {
    var type = getTaskTplType(code);
    if (!type) return;
    if (!confirm('Excluir a tarefa "' + task.title + '"?\n\nTODAS as datas dessa tarefa (passadas e futuras) serão removidas. Esta ação não pode ser desfeita.')) return;
    state.tpl[type] = state.tpl[type].filter(function(t) { return t.code !== code; });
    for (var k in state.inst) {
      if (state.inst.hasOwnProperty(k) && k.indexOf('|' + code) !== -1) delete state.inst[k];
    }
    logActivity('catalog', 'excluiu tarefa ' + code + ' (' + task.title + ')');
    save();
    if (window.sbDelTpl) window.sbDelTpl(code);
    closeModal();
    renderShell();
    renderPage();
    toast('Tarefa excluída', 'success');
  });
}

// ========================================================
// KANBAN
// ========================================================
function renderKanban() {
  var today = new Date();
  var monthIdx = today.getFullYear() === 2026 ? today.getMonth() : 0;
  var monthKey = MONTHS_KEY[monthIdx];
  var day = today.getFullYear() === 2026 ? today.getDate() : 1;
  var todayYMD = ymdLocal(today.getFullYear() === 2026 ? today : new Date(2026, 0, 1));

  // Colunas usando status do banco
  var cols = [
    { key: 'A fazer', label: 'A fazer', color: '#1565C0' },
    { key: 'Em andamento', label: 'Em andamento', color: '#F57C00' },
    { key: 'Concluído', label: 'Concluído', color: '#2E7D32' }
  ];
  var cards = { 'A fazer': [], 'Em andamento': [], 'Concluído': [] };

  function pushCard(status, item) {
    // Aceita variações de status (compat antigo)
    if (status === 'Pendente' || !status) status = 'A fazer';
    if (status === 'Doing') status = 'Em andamento';
    if (cards[status]) cards[status].push(item);
  }

  // Diárias
  var i;
  for (i = 0; i < state.tpl.diarias.length; i++) {
    var t = state.tpl.diarias[i];
    var inst = peekInst(monthKey, day, t.code);
    if (!canViewTask(inst, t)) continue;
    pushCard(inst.status, {
      code: t.code, title: t.title, area: t.area, priority: t.priority,
      instance: inst, monthKey: monthKey, day: day, type: 'diaria',
      tplDefaultAssignee: t.defaultAssigneeId,
      startTime: t.startTime, endTime: t.endTime, durationMin: t.durationMin
    });
  }

  // Semanais — só na semana atual
  var wn = Math.ceil(day / 7);
  for (i = 0; i < state.tpl.semanais.length; i++) {
    var t2 = state.tpl.semanais[i];
    var inst2 = peekInst(monthKey, 'w' + wn, t2.code);
    if (!canViewTask(inst2, t2)) continue;
    pushCard(inst2.status, {
      code: t2.code, title: t2.title, area: t2.area, priority: t2.priority,
      instance: inst2, monthKey: monthKey, day: 'w' + wn, type: 'semanal',
      tplDefaultAssignee: t2.defaultAssigneeId,
      weekday: t2.weekday
    });
  }

  // Mensais
  for (i = 0; i < state.tpl.mensais.length; i++) {
    var t3 = state.tpl.mensais[i];
    var inst3 = peekInst(monthKey, 'm', t3.code);
    if (!canViewTask(inst3, t3)) continue;
    pushCard(inst3.status, {
      code: t3.code, title: t3.title, area: t3.area, priority: t3.priority,
      instance: inst3, monthKey: monthKey, day: 'm', type: 'mensal',
      tplDefaultAssignee: t3.defaultAssigneeId,
      monthDay: t3.monthDay
    });
  }

  // V8.5: Tarefas pontuais HOJE
  if (state.oneTimes) {
    var oneTimesToday = getOneTimesForDate(todayYMD, state.ui.scope === 'tudo' && isAdmin() ? null : (state.user ? state.user.id : null));
    for (i = 0; i < oneTimesToday.length; i++) {
      var ott = oneTimesToday[i];
      pushCard(ott.inst.status, {
        code: 'PT', title: ott.task.title, area: ott.task.area, priority: ott.task.priority,
        instance: ott.inst, oneTimeId: ott.task.id, ymd: ott.ymd, type: 'pontual',
        isOneTime: true
      });
    }
  }

  // V8.8: Etapas de projeto que são para HOJE
  if (state.projects) {
    for (i = 0; i < state.projects.length; i++) {
      var pr = state.projects[i];
      if (!canViewProject(pr)) continue;
      if (!pr.milestones) continue;
      for (var mi = 0; mi < pr.milestones.length; mi++) {
        var ms = pr.milestones[mi];
        if (ms.date !== todayYMD) continue;
        var pInst = peekProjInst(pr.id, ms.id);
        var effectiveAssignee = pInst.assigneeId || ms.assigneeId || pr.responsibleId;
        // Filtrar pelo usuário (a menos que seja admin no modo Tudo)
        if (!(isAdmin() && state.ui.scope === 'tudo')) {
          if (effectiveAssignee && effectiveAssignee !== state.user.id) continue;
        }
        pushCard(pInst.status, {
          code: 'P', title: pr.name + ' · ' + ms.name, area: pr.area || '',
          priority: pr.priority || 'media',
          instance: pInst, projectId: pr.id, milestoneId: ms.id, type: 'projeto',
          isProject: true
        });
      }
    }
  }

  // V8.8: Tarefas de Campanha que são para HOJE
  if (state.campaigns) {
    var activeCamps2 = getActiveCampaigns(todayYMD);
    for (var ac = 0; ac < activeCamps2.length; ac++) {
      var camp2 = activeCamps2[ac];
      if (!camp2.tasks) continue;
      for (var ct = 0; ct < camp2.tasks.length; ct++) {
        var ctask = camp2.tasks[ct];
        var cInst = peekCampInst(camp2.id, ctask.id, todayYMD);
        // Filtrar
        var ceffAssignee = cInst.assigneeId;
        if (!(isAdmin() && state.ui.scope === 'tudo')) {
          // Para campanhas, mostra a usuários do time da campanha
          var inCamp = isInCampaign(camp2, state.user.id);
          if (!inCamp && (!ceffAssignee || ceffAssignee !== state.user.id)) continue;
        }
        pushCard(cInst.status, {
          code: 'C', title: camp2.name + ' · ' + ctask.title, area: camp2.area || '',
          priority: ctask.priority || 'media',
          instance: cInst, campId: camp2.id, campTaskId: ctask.id, ymd: todayYMD,
          type: 'campanha', isCamp: true,
          campColor: camp2.color
        });
      }
    }
  }

  function cardHTML(it) {
    var assigneeId = it.instance.assigneeId || it.tplDefaultAssignee;
    if (it.isProject) {
      var pr = getProject(it.projectId);
      var ms = pr ? pr.milestones.filter(function(m){return m.id === it.milestoneId})[0] : null;
      assigneeId = it.instance.assigneeId || (ms && ms.assigneeId) || (pr && pr.responsibleId);
    }
    var u = getUser(assigneeId);
    var typeLabel = '';
    var typeBg = '';
    var borderColor = '';
    if (it.type === 'diaria') { typeLabel = 'Diária'; typeBg = ''; }
    else if (it.type === 'semanal') { typeLabel = 'Semanal'; typeBg = ''; }
    else if (it.type === 'mensal') { typeLabel = 'Mensal'; typeBg = ''; }
    else if (it.type === 'pontual') { typeLabel = '📌 Pontual'; typeBg = 'background:#F3E5F5;color:#7B1FA2'; borderColor = '#9C27B0'; }
    else if (it.type === 'projeto') { typeLabel = '📁 Projeto'; typeBg = 'background:#FCE4EC;color:#C2185B'; borderColor = '#E91E63'; }
    else if (it.type === 'campanha') { typeLabel = '🎯 Campanha'; typeBg = 'background:#FFEBEE;color:#C62828'; borderColor = it.campColor || '#F44336'; }

    var subTotal = (it.instance.subtasks || []).length;
    var subDone = 0;
    for (var si = 0; si < subTotal; si++) if (it.instance.subtasks[si].done) subDone++;
    var subInfo = subTotal > 0 ? '<span style="margin-left:6px">📋 ' + subDone + '/' + subTotal + '</span>' : '';

    // Horário
    var timeInfo = '';
    if (it.startTime || it.endTime) {
      timeInfo = '<span style="font-size:11px;color:#6B6B6B;margin-left:6px">🕐 ' + (it.startTime || '?') + (it.endTime ? '-' + it.endTime : '') + '</span>';
    } else if (it.durationMin) {
      timeInfo = '<span style="font-size:11px;color:#6B6B6B;margin-left:6px">⏱ ' + it.durationMin + 'min</span>';
    }

    var canEdit = it.isOneTime || it.isProject || it.isCamp || canEditTask(it.instance, { area: it.area });
    var dataAttrs;
    if (it.isOneTime) {
      dataAttrs = ' data-onetime="' + esc(it.oneTimeId) + '" data-ymd="' + esc(it.ymd) + '"';
    } else if (it.isProject) {
      dataAttrs = ' data-project="' + esc(it.projectId) + '" data-ms="' + esc(it.milestoneId) + '"';
    } else if (it.isCamp) {
      dataAttrs = ' data-camp="' + esc(it.campId) + '" data-ctask="' + esc(it.campTaskId) + '" data-ymd="' + esc(it.ymd) + '"';
    } else {
      dataAttrs = ' data-m="' + esc(it.monthKey) + '" data-d="' + esc(String(it.day)) + '" data-c="' + esc(it.code) + '"';
    }

    var borderStyle = borderColor ? 'border-left:3px solid ' + borderColor + ';' : '';
    return '<div class="kb-card"' + (canEdit ? ' draggable="true"' : '') + dataAttrs + ' style="' + borderStyle + '">' +
      '<div class="kb-card-top">' +
        (['PT','P','C'].indexOf(it.code) === -1 ? '<span class="code">' + esc(it.code) + '</span>' : '') +
        '<span class="type-bdg ' + esc(it.type) + '" style="' + typeBg + '">' + typeLabel + '</span>' +
        '<span class="prio ' + esc(it.priority || 'media') + '" style="margin-left:auto">' + esc(it.priority || 'media') + '</span>' +
      '</div>' +
      '<div class="kb-card-title">' + esc(it.title) + '</div>' +
      '<div class="kb-card-foot">' +
        '<span>' + areaTag(it.area || '') + subInfo + timeInfo + '</span>' +
        (u ? avatar(u, 'sm') : '<span style="color:#9A9A9A;font-size:11px">— sem dono —</span>') +
      '</div></div>';
  }

  var colsHTML = '';
  for (var c2 = 0; c2 < cols.length; c2++) {
    var status = cols[c2].key;
    var cardList = cards[status];
    var inner = cardList.length === 0
      ? '<div style="text-align:center;padding:32px 12px;color:#9A9A9A;font-size:12px">Sem tarefas</div>'
      : cardList.map(cardHTML).join('');
    colsHTML += '<div class="kb-col" data-status="' + esc(status) + '">' +
      '<div class="kb-col-head" style="border-top:3px solid ' + cols[c2].color + '">' +
        '<span>' + esc(cols[c2].label) + '</span>' +
        '<span class="kb-count">' + cardList.length + '</span>' +
      '</div>' + inner + '</div>';
  }

  var todayLabel = today.getFullYear() === 2026
    ? 'Hoje, ' + day + ' de ' + MONTHS[monthIdx]
    : MONTHS[monthIdx] + ' 2026';

  // Total de cards
  var totalCards = cards['A fazer'].length + cards['Em andamento'].length + cards['Concluído'].length;

  return '<div class="page-head"><div><h2 class="page-title">📊 Kanban</h2>' +
    '<p class="page-sub">' + esc(todayLabel) + ' · ' + totalCards + ' tarefa' + (totalCards !== 1 ? 's' : '') + ' · arraste para mudar o status</p></div></div>' +
    (totalCards === 0 ? '<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Sem tarefas para hoje</div><div class="empty-text">Atribua tarefas em Gestão → Atribuição em Massa</div></div>' : '') +
    '<div class="kanban">' + colsHTML + '</div>';
}

function attachKanban() {
  var dragged = null;
  var cards = document.querySelectorAll('.kb-card');
  for (var i = 0; i < cards.length; i++) {
    (function(card) {
      card.addEventListener('dragstart', function(e) {
        dragged = card;
        card.classList.add('dragging');
        if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', function() {
        card.classList.remove('dragging');
        dragged = null;
        var cs = document.querySelectorAll('.kb-col');
        for (var j = 0; j < cs.length; j++) cs[j].classList.remove('drag-over');
      });
      card.addEventListener('click', function() {
        var oneTimeId = card.getAttribute('data-onetime');
        var projId = card.getAttribute('data-project');
        var campId = card.getAttribute('data-camp');
        if (oneTimeId) {
          if (typeof openOneTimeDetailModal === 'function') openOneTimeDetailModal(oneTimeId, card.getAttribute('data-ymd'));
        } else if (projId) {
          openProjectModal(projId);
        } else if (campId) {
          if (typeof openCampTaskModal === 'function') openCampTaskModal(campId, card.getAttribute('data-ctask'), card.getAttribute('data-ymd'));
        } else {
          openTaskDetailModal(card.getAttribute('data-m'), card.getAttribute('data-d'), card.getAttribute('data-c'));
        }
      });
    })(cards[i]);
  }

  var cols = document.querySelectorAll('.kb-col');
  for (var k = 0; k < cols.length; k++) {
    (function(col) {
      col.addEventListener('dragover', function(e) {
        e.preventDefault();
        col.classList.add('drag-over');
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      });
      col.addEventListener('dragleave', function() { col.classList.remove('drag-over'); });
      col.addEventListener('drop', function(e) {
        e.preventDefault();
        col.classList.remove('drag-over');
        if (!dragged) return;
        var newStatus = col.getAttribute('data-status');
        var oneTimeId = dragged.getAttribute('data-onetime');
        var projId = dragged.getAttribute('data-project');
        var campId = dragged.getAttribute('data-camp');
        if (oneTimeId) {
          var ymd = dragged.getAttribute('data-ymd');
          setOneTime(oneTimeId, ymd, 'status', newStatus);
        } else if (projId) {
          var msId = dragged.getAttribute('data-ms');
          setProjMilestone(projId, msId, 'status', newStatus);
        } else if (campId) {
          var ctaskId = dragged.getAttribute('data-ctask');
          var cymd = dragged.getAttribute('data-ymd');
          setCampTask(campId, ctaskId, cymd, 'status', newStatus);
        } else {
          var m = dragged.getAttribute('data-m'), d = dragged.getAttribute('data-d'), c = dragged.getAttribute('data-c');
          var inst = peekInst(m, d, c);
          var tk = getTaskTpl(c);
          if (!canEditTask(inst, tk)) { toast('Sem permissão', 'error'); renderPage(); return; }
          setTask(m, d, c, 'status', newStatus);
        }
        renderPage();
        toast('Movida para "' + newStatus + '"', 'success');
      });
    })(cols[k]);
  }
}

// CALENDÁRIO — com etapas de projetos!
// ========================================================
function renderCal() {
  var monthIdx = state.ui.calMonth;
  var monthKey = MONTHS_KEY[monthIdx];
  var monthName = MONTHS[monthIdx];
  var daysInMonth = new Date(2026, monthIdx + 1, 0).getDate();
  var firstDay = new Date(2026, monthIdx, 1).getDay();
  var today = new Date();

  var cells = '';
  var i, d;
  for (i = 0; i < firstDay; i++) cells += '<div class="cal-day empty"></div>';

  for (d = 1; d <= daysInMonth; d++) {
    var dow = new Date(2026, monthIdx, d).getDay();
    var isWeekend = dow === 0 || dow === 6;
    var isToday = today.getFullYear() === 2026 && today.getMonth() === monthIdx && today.getDate() === d;
    var dayYMD = '2026-' + pad(monthIdx + 1) + '-' + pad(d);

    var done = 0, pending = 0;
    for (var j = 0; j < state.tpl.diarias.length; j++) {
      var tpl = state.tpl.diarias[j];
      var inst = peekInst(monthKey, d, tpl.code);
      if (!canViewTask(inst, tpl)) continue;
      if (inst.status === 'Concluído') done++;
      else if (inst.status !== 'N/A') pending++;
    }

    // Etapas de projeto neste dia
    var projsThisDay = 0;
    var dayISO = dayYMD;
    for (var pi = 0; pi < state.projects.length; pi++) {
      var pr = state.projects[pi];
      if (!canViewProject(pr) || !pr.milestones) continue;
      for (var mi = 0; mi < pr.milestones.length; mi++) {
        if (pr.milestones[mi].date === dayISO) projsThisDay++;
      }
    }

    // Campanhas ativas neste dia
    var campsThisDay = getActiveCampaigns(dayYMD);
    // Filtrar só as que o user vê
    var visibleCamps = [];
    for (var cci = 0; cci < campsThisDay.length; cci++) {
      var cc = campsThisDay[cci];
      if (isAdmin() || isInCampaign(cc, state.user.id)) visibleCamps.push(cc);
    }

    var campBars = '';
    if (visibleCamps.length > 0) {
      campBars = '<div class="cal-camp-bars">';
      for (var vc = 0; vc < Math.min(visibleCamps.length, 3); vc++) {
        campBars += '<div class="cal-camp-bar" style="background:' + esc(visibleCamps[vc].color || '#E8561A') + '" title="' + esc(visibleCamps[vc].name) + '"></div>';
      }
      if (visibleCamps.length > 3) campBars += '<div class="cal-camp-bar-more">+' + (visibleCamps.length - 3) + '</div>';
      campBars += '</div>';
    }

    var badges = '';
    if (state.tpl.diarias.length > 0) {
      if (done > 0) badges += '<span class="cal-bdg done">' + done + ' feita' + (done > 1 ? 's' : '') + '</span>';
      if (pending > 0) badges += '<span class="cal-bdg pending">' + pending + ' pend.</span>';
    }
    if (dow === 1 && state.tpl.semanais.length > 0) badges += '<span class="cal-bdg weekly">Semanal</span>';
    if (d === 1 && state.tpl.mensais.length > 0) badges += '<span class="cal-bdg monthly">Mensal</span>';
    if (projsThisDay > 0) badges += '<span class="cal-bdg project">' + projsThisDay + ' projeto' + (projsThisDay > 1 ? 's' : '') + '</span>';
    if (visibleCamps.length > 0) {
      badges += '<span class="cal-bdg campaign" style="background:' + esc(visibleCamps[0].color || '#E8561A') + '20;color:' + esc(visibleCamps[0].color || '#E8561A') + '">🎯 ' + visibleCamps.length + ' camp.</span>';
    }

    var cls = 'cal-day';
    if (isWeekend) cls += ' weekend';
    if (isToday) cls += ' today';
    cells += '<div class="' + cls + '" data-day="' + d + '">' + campBars + '<div class="cal-day-num">' + d + '</div>' + badges + '</div>';
  }

  var dhead = '';
  for (i = 0; i < DAYS_SHORT.length; i++) dhead += '<div class="cal-dh">' + DAYS_SHORT[i] + '</div>';

  var monthOpts = '';
  for (i = 0; i < 12; i++) {
    monthOpts += '<option value="' + i + '"' + (i === monthIdx ? ' selected' : '') + '>' + MONTHS[i] + '</option>';
  }

  return '<div class="page-head"><div><h2 class="page-title">Calendário</h2>' +
    '<p class="page-sub">Tarefas e etapas de projetos no calendário · clique em qualquer dia para ver os detalhes</p></div></div>' +
    '<div class="month-nav">' +
      '<button class="btn btn-icon" id="prevCal"><span class="icon" style="display:inline-flex">' + ICON.prev + '</span></button>' +
      '<div class="month-nav-label">' + monthName + ' 2026</div>' +
      '<button class="btn btn-icon" id="nextCal"><span class="icon" style="display:inline-flex">' + ICON.next + '</span></button>' +
      '<select class="input" id="calPicker" style="width:auto;min-width:140px;height:36px">' + monthOpts + '</select>' +
    '</div>' +
    '<div class="card"><div class="cal-head">' + dhead + '</div><div class="cal-grid">' + cells + '</div></div>';
}

function attachCal() {
  var pc = document.getElementById('prevCal');
  if (pc) pc.addEventListener('click', function() { state.ui.calMonth = Math.max(0, state.ui.calMonth - 1); renderPage(); });
  var nc = document.getElementById('nextCal');
  if (nc) nc.addEventListener('click', function() { state.ui.calMonth = Math.min(11, state.ui.calMonth + 1); renderPage(); });
  var cp = document.getElementById('calPicker');
  if (cp) cp.addEventListener('change', function() { state.ui.calMonth = parseInt(cp.value, 10); renderPage(); });

  var days = document.querySelectorAll('.cal-day[data-day]');
  for (var i = 0; i < days.length; i++) {
    (function(cell) {
      cell.addEventListener('click', function() {
        openDayModal(state.ui.calMonth, parseInt(cell.getAttribute('data-day'), 10));
      });
    })(days[i]);
  }
}

function openDayModal(monthIdx, day) {
  var monthKey = MONTHS_KEY[monthIdx];
  var monthName = MONTHS[monthIdx];
  var date = new Date(2026, monthIdx, day);
  var dayName = DAYS_LONG[date.getDay()];
  var wn = Math.ceil(day / 7);
  var dayISO = '2026-' + pad(monthIdx + 1) + '-' + pad(day);

  function rowHTML(task, type, taskDay) {
    var inst = peekInst(monthKey, taskDay, task.code);
    if (!canViewTask(inst, task)) return '';
    var checked = inst.status === 'Concluído';
    var u = getUser(inst.assigneeId);
    var typeLabel = type === 'diaria' ? 'Diária' : type === 'semanal' ? 'Semanal' : 'Mensal';
    var canEdit = canEditTask(inst, task);
    return '<div class="day-task-row">' +
      '<span class="cbox' + (checked ? ' checked' : '') + (canEdit ? '' : '" aria-disabled="true') + '" data-mod-toggle data-m="' + esc(monthKey) + '" data-d="' + esc(String(taskDay)) + '" data-c="' + esc(task.code) + '"></span>' +
      '<div class="day-task-info">' +
        '<div class="day-task-title">' + esc(task.title) + '</div>' +
        '<div class="day-task-meta">' +
          '<span class="code">' + esc(task.code) + '</span>' +
          '<span class="type-bdg ' + type + '">' + typeLabel + '</span>' +
          areaTag(task.area) +
          (u ? avatar(u, 'sm') + '<span style="font-size:11px">' + esc(u.name) + '</span>' : '<span style="color:#9A9A9A;font-size:11px">sem dono</span>') +
        '</div>' +
      '</div>' +
      (canEdit ?
        '<select class="pill ' + statusCls(inst.status) + '" data-mod-status data-m="' + esc(monthKey) + '" data-d="' + esc(String(taskDay)) + '" data-c="' + esc(task.code) + '">' + statusOpts(inst.status) + '</select>' :
        pillStatus(inst.status)
      ) +
    '</div>';
  }

  function projRowHTML(proj, milestone, inst) {
    var pu = getUser(inst.assigneeId);
    return '<div class="day-task-row">' +
      '<span class="cbox' + (inst.status === 'Concluído' ? ' checked' : '') + '" data-pmod-toggle data-pid="' + esc(proj.id) + '" data-mid="' + esc(milestone.id) + '"></span>' +
      '<div class="day-task-info">' +
        '<div class="day-task-title">' + esc(milestone.name) + '</div>' +
        '<div class="day-task-meta">' +
          '<span class="type-bdg projeto">Projeto</span>' +
          '<span style="font-size:11px;color:#6B6B6B">' + esc(proj.name) + '</span>' +
          (pu ? avatar(pu, 'sm') + '<span style="font-size:11px">' + esc(pu.name) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<select class="pill ' + statusCls(inst.status) + '" data-pmod-status data-pid="' + esc(proj.id) + '" data-mid="' + esc(milestone.id) + '">' + statusOpts(inst.status) + '</select>' +
    '</div>';
  }

  var rows = '';
  if (state.tpl.diarias.length) {
    var diaRows = '';
    for (var i = 0; i < state.tpl.diarias.length; i++) diaRows += rowHTML(state.tpl.diarias[i], 'diaria', day);
    if (diaRows) rows += '<div style="font-size:11px;font-weight:500;color:#6B6B6B;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Diárias</div>' + diaRows;
  }
  if (date.getDay() === 1 && state.tpl.semanais.length) {
    var semRows = '';
    for (var s = 0; s < state.tpl.semanais.length; s++) semRows += rowHTML(state.tpl.semanais[s], 'semanal', 'w' + wn);
    if (semRows) rows += '<div style="font-size:11px;font-weight:500;color:#6B6B6B;text-transform:uppercase;letter-spacing:0.5px;margin-top:16px;margin-bottom:8px">Semanais</div>' + semRows;
  }
  if (day === 1 && state.tpl.mensais.length) {
    var menRows = '';
    for (var m = 0; m < state.tpl.mensais.length; m++) menRows += rowHTML(state.tpl.mensais[m], 'mensal', 'm');
    if (menRows) rows += '<div style="font-size:11px;font-weight:500;color:#6B6B6B;text-transform:uppercase;letter-spacing:0.5px;margin-top:16px;margin-bottom:8px">Mensais</div>' + menRows;
  }

  // Etapas de projetos
  var projRows = '';
  for (var pi = 0; pi < state.projects.length; pi++) {
    var pr = state.projects[pi];
    if (!canViewProject(pr) || !pr.milestones) continue;
    for (var mi = 0; mi < pr.milestones.length; mi++) {
      var ms = pr.milestones[mi];
      if (ms.date === dayISO) {
        var pInst = peekProjInst(pr.id, ms.id);
        projRows += projRowHTML(pr, ms, pInst);
      }
    }
  }
  if (projRows) rows += '<div style="font-size:11px;font-weight:500;color:#6B6B6B;text-transform:uppercase;letter-spacing:0.5px;margin-top:16px;margin-bottom:8px">Etapas de Projetos</div>' + projRows;

  // Campanhas ativas neste dia
  var campRowsHTML = '';
  var dayCamps = getActiveCampaigns(dayISO);
  for (var ci = 0; ci < dayCamps.length; ci++) {
    var camp = dayCamps[ci];
    var visible = isAdmin() || isInCampaign(camp, state.user.id);
    if (!visible) continue;
    if (!camp.tasks || camp.tasks.length === 0) continue;
    campRowsHTML += '<div class="camp-day-block" style="border-left:3px solid ' + esc(camp.color || '#E8561A') + '"><div class="camp-day-name" style="color:' + esc(camp.color || '#E8561A') + '">🎯 ' + esc(camp.name) + '</div>';
    for (var cti = 0; cti < camp.tasks.length; cti++) {
      var ctk = camp.tasks[cti];
      var cInst = peekCampInst(camp.id, ctk.id, dayISO);
      var canMark2 = isAdmin() || isInCampaign(camp, state.user.id);
      var checkedC = cInst.status === 'Concluído';
      campRowsHTML += '<div class="day-task-row">' +
        '<span class="cbox' + (checkedC ? ' checked' : '') + '" data-camp-mod-toggle data-cid="' + esc(camp.id) + '" data-tid="' + esc(ctk.id) + '" data-ymd="' + esc(dayISO) + '"></span>' +
        '<div class="day-task-info">' +
          '<div class="day-task-title">' + esc(ctk.title) + '</div>' +
          '<div class="day-task-meta">' +
            '<span class="prio ' + esc(ctk.priority || 'media') + '">' + esc(ctk.priority || 'media') + '</span>' +
            (camp.area ? areaTag(camp.area) : '') +
          '</div>' +
        '</div>' +
        '<button class="btn btn-sm" data-camp-mod-detail data-cid="' + esc(camp.id) + '" data-tid="' + esc(ctk.id) + '" data-ymd="' + esc(dayISO) + '">Detalhes</button>' +
      '</div>';
    }
    campRowsHTML += '</div>';
  }
  if (campRowsHTML) rows += '<div style="font-size:11px;font-weight:500;color:#6B6B6B;text-transform:uppercase;letter-spacing:0.5px;margin-top:16px;margin-bottom:8px">🎯 Campanhas</div>' + campRowsHTML;

  var html = '<div class="modal-bg" id="modalBg"><div class="modal lg">' +
    '<div class="modal-head"><div>' +
      '<div style="font-size:11px;color:#6B6B6B;font-weight:500;text-transform:uppercase;letter-spacing:0.5px">' + esc(dayName) + '</div>' +
      '<div class="modal-title">' + day + ' de ' + esc(monthName) + ' 2026</div>' +
    '</div><button class="modal-close" data-close><span class="icon">' + ICON.close + '</span></button></div>' +
    '<div class="modal-body">' + (rows || '<div class="empty"><div class="empty-icon">' + ICON.task + '</div><div class="empty-text">Nenhuma tarefa neste dia</div></div>') + '</div>' +
    '<div class="modal-foot"><button class="btn btn-primary" data-close>Fechar</button></div>' +
    '</div></div>';

  showModal(html);

  var toggles = document.querySelectorAll('[data-mod-toggle]');
  for (var t = 0; t < toggles.length; t++) {
    (function(el) {
      el.addEventListener('click', function() {
        if (el.getAttribute('aria-disabled') === 'true') { toast('Sem permissão', 'error'); return; }
        var mk = el.getAttribute('data-m'), dy = el.getAttribute('data-d'), cd = el.getAttribute('data-c');
        var tk = getTaskTpl(cd);
        var inst = peekInst(mk, dy, cd);
        if (!canEditTask(inst, tk)) { toast('Sem permissão', 'error'); return; }
        var ns = inst.status === 'Concluído' ? 'A fazer' : 'Concluído';
        setTask(mk, dy, cd, 'status', ns);
        logActivity('task', (ns === 'Concluído' ? 'concluiu' : 'reabriu') + ' ' + cd);
        save();
        closeModal();
        openDayModal(monthIdx, day);
      });
    })(toggles[t]);
  }

  var statuses = document.querySelectorAll('[data-mod-status]');
  for (var st = 0; st < statuses.length; st++) {
    (function(el) {
      el.addEventListener('change', function() {
        var mk = el.getAttribute('data-m'), dy = el.getAttribute('data-d'), cd = el.getAttribute('data-c');
        var tk = getTaskTpl(cd);
        var inst = peekInst(mk, dy, cd);
        if (!canEditTask(inst, tk)) { toast('Sem permissão', 'error'); return; }
        setTask(mk, dy, cd, 'status', el.value);
        logActivity('task', 'alterou status de ' + cd);
        save();
        closeModal();
        openDayModal(monthIdx, day);
      });
    })(statuses[st]);
  }

  // Project milestone toggles
  var pTog = document.querySelectorAll('[data-pmod-toggle]');
  for (var pt = 0; pt < pTog.length; pt++) {
    (function(el) {
      el.addEventListener('click', function() {
        var pid = el.getAttribute('data-pid'), mid = el.getAttribute('data-mid');
        var inst = peekProjInst(pid, mid);
        var ns = inst.status === 'Concluído' ? 'A fazer' : 'Concluído';
        setProjMilestone(pid, mid, 'status', ns);
        logActivity('project', (ns === 'Concluído' ? 'concluiu' : 'reabriu') + ' etapa');
        save();
        closeModal();
        openDayModal(monthIdx, day);
      });
    })(pTog[pt]);
  }

  var pSt = document.querySelectorAll('[data-pmod-status]');
  for (var ps = 0; ps < pSt.length; ps++) {
    (function(el) {
      el.addEventListener('change', function() {
        var pid = el.getAttribute('data-pid'), mid = el.getAttribute('data-mid');
        setProjMilestone(pid, mid, 'status', el.value);
        save();
        closeModal();
        openDayModal(monthIdx, day);
      });
    })(pSt[ps]);
  }

  // Toggle de tarefa de campanha
  var cmTog = document.querySelectorAll('[data-camp-mod-toggle]');
  for (var cmt = 0; cmt < cmTog.length; cmt++) {
    (function(el) {
      el.addEventListener('click', function() {
        var cid = el.getAttribute('data-cid'), tid = el.getAttribute('data-tid'), ymd = el.getAttribute('data-ymd');
        var camp = null;
        for (var ci = 0; ci < state.campaigns.length; ci++) if (state.campaigns[ci].id === cid) { camp = state.campaigns[ci]; break; }
        if (!camp) return;
        if (!isAdmin() && !isInCampaign(camp, state.user.id)) { toast('Você não é participante desta campanha', 'error'); return; }
        var inst = peekCampInst(cid, tid, ymd);
        var ns = inst.status === 'Concluído' ? 'A fazer' : 'Concluído';
        setCampTask(cid, tid, ymd, 'status', ns);
        logActivity('camp', (ns === 'Concluído' ? 'concluiu' : 'reabriu') + ' tarefa de campanha');
        closeModal();
        openDayModal(monthIdx, day);
      });
    })(cmTog[cmt]);
  }

  // Botão detalhes de tarefa de campanha
  var cmDet = document.querySelectorAll('[data-camp-mod-detail]');
  for (var cmd = 0; cmd < cmDet.length; cmd++) {
    (function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        closeModal();
        openCampTaskModal(el.getAttribute('data-cid'), el.getAttribute('data-tid'), el.getAttribute('data-ymd'));
      });
    })(cmDet[cmd]);
  }
}
