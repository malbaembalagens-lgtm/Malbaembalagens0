<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALBA Work OS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   MALBA Work OS — ESTILOS
   v1: Fundação · v2: módulo Tarefas. Paleta V13.
   ============================================================ */
:root {
  --u-bg: #F4F6FB; --u-bg2: #EEF1F8; --u-card: #FFFFFF; --u-card2: #FBFCFF;
  --u-border: rgba(15,23,42,.08); --u-border2: rgba(15,23,42,.13); --u-line: rgba(15,23,42,.05);
  --u-text: #0F172A; --u-text2: #5A6884; --u-text3: #94A0B8;
  --u-accent: #3B6FF7; --u-accent-soft: #EAF0FE; --u-accent-2: #6366F1; --u-accent-hover: #2657E0;
  --u-green: #16A34A; --u-green-soft: #E3F6EA; --u-red: #EF4444; --u-red-soft: #FDEBEB;
  --u-amber: #F59E0B; --u-amber-soft: #FEF3DD; --u-purple: #8B5CF6;
  --u-shadow: 0 4px 20px rgba(15,23,42,.07), 0 1px 4px rgba(15,23,42,.04);
  --u-shadow-md: 0 12px 34px rgba(15,23,42,.10);
  --u-shadow-lg: 0 20px 50px rgba(15,23,42,.13);
  --u-glow-blue: 0 8px 24px rgba(59,111,247,.28);
  --u-grad-blue: linear-gradient(135deg, #3B6FF7, #6366F1);
  --u-grad-hero: linear-gradient(120deg, #1a1040, #0d1b4d 45%, #0a2540);
  --u-font-display: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
  --u-font-body: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  --radius: 16px; --radius-sm: 12px;
}
html.dark {
  --u-bg: #0E1525; --u-bg2: #161F30; --u-card: #1A2336; --u-card2: #202B41;
  --u-border: rgba(255,255,255,.09); --u-border2: rgba(255,255,255,.15); --u-line: rgba(255,255,255,.06);
  --u-text: #E8ECF4; --u-text2: #A6B2C8; --u-text3: #6E7C96;
  --u-accent: #5A85FF; --u-accent-soft: rgba(90,133,255,.16); --u-accent-2: #7C7FF5; --u-accent-hover: #7B9DFF;
  --u-green: #22C55E; --u-green-soft: rgba(34,197,94,.16); --u-red: #F87171; --u-red-soft: rgba(248,113,113,.15);
  --u-amber: #FBBF24; --u-amber-soft: rgba(251,191,36,.15); --u-purple: #A78BFA;
  --u-shadow: 0 4px 20px rgba(0,0,0,.40), 0 1px 4px rgba(0,0,0,.30);
  --u-shadow-md: 0 12px 34px rgba(0,0,0,.46);
  --u-shadow-lg: 0 20px 50px rgba(0,0,0,.55);
  --u-glow-blue: 0 8px 24px rgba(90,133,255,.30);
  --u-grad-hero: linear-gradient(120deg, #141033, #0c1638 45%, #0a1c30);
  color-scheme: dark;
}
html.dark .sector-ico { background: color-mix(in srgb, var(--c) 24%, #161F30); }
html.dark .screen-title { color: var(--u-text2); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: var(--u-font-body); background: var(--u-bg); color: var(--u-text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, textarea, select { font-family: inherit; }
svg { width: 1em; height: 1em; display: block; }

.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: auto; background: var(--u-bg); }
.screen::before { content:''; position:absolute; inset:0; z-index:0; pointer-events:none; background:
  radial-gradient(600px 460px at 50% 8%, rgba(59,111,247,.10), transparent 55%),
  radial-gradient(500px 460px at 85% 90%, rgba(139,92,246,.07), transparent 55%); }
.screen::before { content: ''; position: absolute; inset: 0; background: radial-gradient(60% 50% at 20% 10%, rgba(99,102,241,.10), transparent 70%), radial-gradient(50% 50% at 90% 30%, rgba(59,111,247,.10), transparent 70%); pointer-events: none; }
.screen-inner { position: relative; z-index: 1; width: 100%; max-width: 880px; display: flex; flex-direction: column; align-items: center; }
.brand-mark { display: flex; align-items: baseline; gap: 10px; font-family: var(--u-font-display); }
.brand-1 { font-size: 34px; font-weight: 800; letter-spacing: -1px; color: var(--u-text); }
.brand-2 { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -.2px; background: var(--u-grad-blue); padding: 4px 12px; border-radius: 999px; box-shadow: var(--u-glow-blue); }
.screen-title { margin: 30px 0 28px; font-family: var(--u-font-display); font-size: 20px; font-weight: 700; color: var(--u-text2); }
.sector-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; width: 100%; }
.sector-card { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 30px 16px; border-radius: 24px; background: var(--u-card); border: 1px solid var(--u-border); box-shadow: var(--u-shadow); transition: transform .25s cubic-bezier(.4,0,.2,1), box-shadow .25s, border-color .25s; }
.sector-card:hover { transform: translateY(-6px); box-shadow: var(--u-shadow-lg); border-color: rgba(59,111,247,.3); }
.sector-ico { width: 84px; height: 84px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--c) 12%, white); color: var(--c); font-size: 36px; transition: all .25s; }
.sector-card:hover .sector-ico { background: var(--c); color: #fff; box-shadow: 0 8px 24px color-mix(in srgb, var(--c) 40%, transparent); transform: scale(1.05); }
.sector-name { font-family: var(--u-font-display); font-size: 16px; font-weight: 700; }
.sector-sub { font-size: 10px; color: var(--u-text3); font-weight: 600; letter-spacing: .6px; text-transform: uppercase; margin-top: -8px; text-align: center; }
.login-inner { max-width: 400px; }
.login-card { width: 100%; background: var(--u-card); border: 1px solid var(--u-border); border-radius: 24px; box-shadow: var(--u-shadow-md); padding: 36px 32px; display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
.login-ico { width: 64px; height: 64px; border-radius: 20px; align-self: center; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--c) 12%, white); color: var(--c); font-size: 28px; margin-bottom: 4px; }
.login-h { font-family: var(--u-font-display); font-size: 24px; font-weight: 800; text-align: center; }
.login-sub { text-align: center; color: var(--u-text2); margin: -8px 0 8px; font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field span { font-size: 12px; font-weight: 700; color: var(--u-text2); }
.field input { padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--u-border2); background: var(--u-card2); font-size: 14px; color: var(--u-text); outline: none; transition: border-color .15s, box-shadow .15s; }
.field input:focus { border-color: var(--u-accent); box-shadow: 0 0 0 3px var(--u-accent-soft); }
.login-err { color: var(--u-red); font-size: 13px; min-height: 18px; font-weight: 600; }
.btn { padding: 13px 18px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; transition: all .15s; }
.btn-primary { background: var(--u-grad-blue); color: #fff; box-shadow: var(--u-glow-blue); }
.btn-primary:hover { filter: brightness(1.05); transform: translateY(-1px); }
.btn-primary:disabled { opacity: .6; cursor: default; transform: none; }
.btn-ghost { background: var(--u-bg2); color: var(--u-text2); }
.btn-ghost:hover { background: var(--u-border); color: var(--u-text); }
.btn-danger { background: var(--u-red-soft); color: var(--u-red); }
.btn-danger:hover { background: var(--u-red); color: #fff; }
.btn-link { background: none; color: var(--u-text2); font-size: 13px; font-weight: 600; padding: 6px; align-self: center; }
.btn-link:hover { color: var(--u-accent); }
.version { margin-top: 18px; font-size: 11px; color: var(--u-text3); text-align: center; }
.spinner { width: 42px; height: 42px; border-radius: 50%; border: 4px solid var(--u-accent-soft); border-top-color: var(--u-accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.app-shell { display: flex; min-height: 100vh; }
.side { width: 248px; flex-shrink: 0; background: var(--u-card); border-right: 1px solid var(--u-border); padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.side-brand { display: flex; align-items: center; gap: 11px; padding: 6px 8px 14px; }
.side-brand-ico { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--c); color: #fff; font-size: 20px; box-shadow: 0 6px 16px color-mix(in srgb, var(--c) 35%, transparent); }
.side-brand-txt { display: flex; flex-direction: column; line-height: 1.25; }
.side-brand-txt b { font-family: var(--u-font-display); font-size: 14px; font-weight: 800; }
.side-brand-txt i { font-style: normal; font-size: 11px; color: var(--u-text3); font-weight: 600; }
.side-user { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--radius-sm); background: var(--u-bg2); margin-bottom: 6px; width: 100%; text-align: left; transition: background .12s; }
.side-user:hover { background: var(--u-border); }
.avatar { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 13px; }
.side-user-txt { display: flex; flex-direction: column; line-height: 1.3; }
.side-user-txt b { font-size: 13px; font-weight: 700; }
.side-user-txt i { font-style: normal; font-size: 11px; color: var(--u-text3); }
.nav { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: var(--radius-sm); color: var(--u-text2); font-size: 13.5px; font-weight: 600; text-align: left; transition: background .15s, color .15s; position: relative; }
.nav-item svg { font-size: 18px; flex-shrink: 0; }
.nav-group { font-size: 11px; font-weight: 800; letter-spacing: .6px; color: var(--u-text3); text-transform: uppercase; padding: 15px 12px 6px; }
.nav-group:first-child { padding-top: 4px; }
.nav-item:not(:disabled):hover { background: var(--u-bg2); color: var(--u-text); }
.nav-item.active { background: var(--u-accent-soft); color: var(--u-accent); }
.nav-item:disabled { opacity: .45; cursor: default; }
.nav-soon { margin-left: auto; font-size: 9px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--u-text3); background: var(--u-bg2); padding: 2px 6px; border-radius: 6px; }
.btn-logout { margin-top: 10px; display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: var(--radius-sm); color: var(--u-text2); font-size: 13.5px; font-weight: 600; }
.btn-logout svg { font-size: 18px; }
.btn-logout:hover { background: var(--u-red-soft); color: var(--u-red); }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.top { height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 24px; border-bottom: 1px solid var(--u-border); background: var(--u-card); }
.top-title { font-family: var(--u-font-display); font-size: 18px; font-weight: 800; }
.top-search { position: relative; max-width: 320px; display: flex; align-items: center; gap: 9px; padding: 9px 14px; border-radius: var(--radius-sm); background: var(--u-bg2); color: var(--u-text3); transition: box-shadow .15s; }
.top-search:focus-within { box-shadow: 0 0 0 3px var(--u-accent-soft); }
.top-search .ts-ico { display: flex; }
.top-search svg { font-size: 17px; flex-shrink: 0; }
.top-search input { border: none; background: none; outline: none; font-size: 13.5px; color: var(--u-text); width: 180px; }
.ts-results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--u-card); border: 1px solid var(--u-border); border-radius: 14px; box-shadow: var(--u-shadow-lg); padding: 6px; display: none; z-index: 50; max-height: 360px; overflow: auto; }
.ts-results.on { display: block; }
.ts-item { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 9px 11px; border-radius: 9px; transition: background .1s; }
.ts-item:hover { background: var(--u-bg2); }
.ts-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.ts-l { flex: 1; font-size: 13.5px; font-weight: 600; color: var(--u-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ts-s { font-size: 11px; color: var(--u-text3); flex-shrink: 0; }
.ts-empty { padding: 14px; text-align: center; font-size: 13px; color: var(--u-text3); }
.top-online { display: flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 100px; background: var(--u-green-soft); color: var(--u-green); font-size: 12.5px; font-weight: 700; }
.top-online i { width: 8px; height: 8px; border-radius: 50%; background: var(--u-green); box-shadow: 0 0 7px var(--u-green); }
.top-online.off { background: var(--u-bg2); color: var(--u-text3); }
.top-online.off i { background: var(--u-text3); box-shadow: none; }
.top-theme { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: var(--u-bg2); color: var(--u-text2); font-size: 18px; transition: color .15s, background .15s; flex-shrink: 0; }
.bling-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 700; background: var(--u-accent-soft); color: var(--u-accent); flex-shrink: 0; transition: background .12s, transform .1s; }
.bling-btn:hover { transform: translateY(-1px); }
.bling-btn svg { font-size: 15px; }
.bling-btn.on { background: var(--u-green-soft); color: var(--u-green); }
.bling-row { gap: 14px; }
.bling-help { font-size: 12px; color: var(--u-text3); line-height: 1.45; margin: 4px 0 10px; }
.bling-ok-note { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--u-green); background: var(--u-green-soft); padding: 10px 13px; border-radius: 10px; margin-bottom: 12px; }
.bling-ok-note svg { font-size: 16px; }
.cfg-head-btns { display: flex; gap: 10px; align-items: center; }
.btn-sync { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 11px; font-size: 13.5px; font-weight: 700; background: var(--u-green-soft); color: var(--u-green); transition: transform .1s; }
.btn-sync:hover { transform: translateY(-1px); }
.btn-sync svg { font-size: 16px; }
.btn-sync:disabled { opacity: .6; cursor: default; }
.bling-err { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--u-red); background: var(--u-red-soft); padding: 5px 9px; border-radius: 8px; display: inline-block; max-width: 520px; line-height: 1.35; }
.top-theme:hover { color: var(--u-accent); background: var(--u-accent-soft); }
.top-novo { padding: 9px 18px; }
.ts-kbd { font-size: 10.5px; font-weight: 700; color: var(--u-text3); background: var(--u-card); border: 1px solid var(--u-border2); border-radius: 6px; padding: 2px 7px; flex-shrink: 0; cursor: pointer; }
.ts-kbd:hover { color: var(--u-accent); border-color: var(--u-accent); }

/* ===== Paleta de comandos (Ctrl/Cmd+K) ===== */
.cmdk-bg { position: fixed; inset: 0; background: rgba(15,20,40,.45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; animation: cmdkIn .12s ease; }
@keyframes cmdkIn { from { opacity: 0; } to { opacity: 1; } }
.cmdk { width: 100%; max-width: 580px; background: var(--u-card); border: 1px solid var(--u-border); border-radius: 16px; box-shadow: 0 24px 60px rgba(15,20,40,.35); overflow: hidden; }
.cmdk-input-wrap { display: flex; align-items: center; gap: 11px; padding: 16px 18px; border-bottom: 1px solid var(--u-border); }
.cmdk-input-wrap svg { font-size: 19px; color: var(--u-text3); flex-shrink: 0; }
.cmdk-input-wrap input { flex: 1; border: none; background: none; outline: none; font-size: 16px; color: var(--u-text); }
.cmdk-esc { font-size: 10.5px; font-weight: 700; color: var(--u-text3); background: var(--u-bg2); border-radius: 6px; padding: 3px 8px; }
.cmdk-list { max-height: 56vh; overflow-y: auto; padding: 8px; }
.cmdk-cat { font-size: 10.5px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--u-text3); padding: 10px 10px 5px; }
.cmdk-item { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 10px 11px; border-radius: 10px; }
.cmdk-item svg { font-size: 17px; color: var(--u-text2); flex-shrink: 0; }
.cmdk-l { flex: 1; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmdk-s { font-size: 11.5px; color: var(--u-text3); flex-shrink: 0; }
.cmdk-item.on { background: var(--u-accent); }
.cmdk-item.on svg, .cmdk-item.on .cmdk-l, .cmdk-item.on .cmdk-s { color: #fff; }
.cmdk-empty { padding: 26px; text-align: center; color: var(--u-text3); font-size: 14px; }
.sh-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
.sh-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 6px; border-bottom: 1px solid var(--u-line); }
.sh-row:last-child { border-bottom: none; }
.sh-desc { font-size: 14px; color: var(--u-text2); }
.sh-keys { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.sh-plus { color: var(--u-text3); font-size: 12px; }
.sh-list kbd { font-family: var(--u-font-body); font-size: 11.5px; font-weight: 700; color: var(--u-text2); background: var(--u-bg2); border: 1px solid var(--u-border2); border-bottom-width: 2px; border-radius: 6px; padding: 3px 8px; min-width: 24px; text-align: center; }
@media (max-width: 600px) { .ts-kbd { display: none; } }
.top-novo svg { font-size: 16px; }
@media (max-width: 720px) { .top-online span { display: none; } .top-search input { width: 110px; } }
.top-spacer { flex: 1; }
.icon-btn { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: var(--u-text2); background: var(--u-bg2); font-size: 18px; }
.content { padding: 24px; flex: 1; }

.dash-hero { background: var(--u-grad-hero); border-radius: var(--radius); padding: 28px 30px; color: #fff; margin-bottom: 22px; position: relative; overflow: hidden; }
.dash-hero::after { content:''; position:absolute; right:-40px; top:-40px; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, rgba(99,102,241,.5), transparent 70%); }
.dash-hero h2 { font-family: var(--u-font-display); font-size: 24px; font-weight: 800; margin-bottom: 4px; position: relative; }
.dash-hero p { opacity: .9; font-size: 14px; position: relative; }
/* hero premium (igual ao site no ar) */
.dash-hero.hero-pro::after { content:''; position:absolute; inset:0; background:
  radial-gradient(600px 320px at 82% 18%, rgba(139,92,246,.45), transparent 60%),
  radial-gradient(520px 420px at 12% 88%, rgba(56,189,248,.32), transparent 55%);
  width:auto; height:auto; border-radius:0; top:0; right:0; }
.hero-grid { position:absolute; inset:0; opacity:.4;
  background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); }
.hero-c { position: relative; z-index: 2; }
.hero-tag { display:inline-flex; align-items:center; gap:7px; padding:6px 14px; border-radius:100px; background:rgba(56,189,248,.15); color:#38BDF8; border:1px solid rgba(56,189,248,.3); font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; margin-bottom:14px; }
.hero-tag::before { content:''; width:6px; height:6px; border-radius:50%; background:#38BDF8; box-shadow:0 0 8px #38BDF8; }
.dash-hero.hero-pro h2 { font-size: 28px; }
.hero-name { background: linear-gradient(90deg,#5b8bff,#a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
.dash-sec-h { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 14px; }
.dash-sec-h h3 { font-family: var(--u-font-display); font-size: 22px; font-weight: 800; }
.dash-sec-h span { font-size: 13px; color: var(--u-text3); font-weight: 600; text-transform: capitalize; }
.stat-pro { background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius); box-shadow: var(--u-shadow); padding: 18px 18px 0; overflow: hidden; position: relative; transition: transform .12s, box-shadow .12s; }
.stat-pro:hover { transform: translateY(-2px); box-shadow: var(--u-shadow-md); }
.stat-pro-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.stat-pro-l { font-size: 13px; color: var(--u-text2); font-weight: 600; }

var SESSION_KEY = 'malba_session';
function getSession() { try { var raw=sessionStorage.getItem(SESSION_KEY); return raw?JSON.parse(raw):null; } catch(e){ return null; } }
function saveSession(s) { try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch(e){ console.error(e); } }
function clearSession() {
  try { sessionStorage.removeItem(SESSION_KEY); } catch(e){}
  ['malba_vl_session','malba_sector','malba_v8_2_session'].forEach(function(k){ try{ sessionStorage.removeItem(k); }catch(e){} });
}
function iniciais(n){ return (n||'U').split(' ').map(function(w){return w.charAt(0);}).slice(0,2).join('').toUpperCase(); }

function login(email, password, sector) {
  var em=(email||'').toLowerCase().trim(), pw=password||'';
  if (!em||!pw) return Promise.resolve({ ok:false, msg:'Preencha e-mail e senha.' });
  if (!sb) return Promise.resolve({ ok:false, msg:'Sem conexão com o banco.' });
  return sb.from('malba_users').select('*').eq('email', em).maybeSingle().then(function(r){
    if (r.error) return { ok:false, msg:'Erro ao consultar usuário.' };
    var d=r.data;
    if (!d) return { ok:false, msg:'E-mail não encontrado.' };
    var guardada = (d.password!=null) ? d.password : d.password_hash;
    if (guardada !== pw) return { ok:false, msg:'Senha incorreta.' };
    var isSuperUser = d.role==='admin';
    if (!isSuperUser && d.sector && d.sector!==sector) return { ok:false, msg:'Este usuário não pertence ao setor selecionado.' };
    var session = { sector:sector, user:{ id:d.id, name:d.name||'Usuário', email:d.email, role:d.role||'user', access_level:d.access_level||null, sector_role:d.sector_role||null, sector:d.sector||sector, color:d.color||null, initials:d.initials||iniciais(d.name), avatar:d.avatar||null, phone:d.phone||'', position:d.position||'', bio:d.bio||'' } };
    saveSession(session);
    return { ok:true, session:session };
  }).catch(function(){ return { ok:false, msg:'Erro de conexão com o banco.' }; });
}
function logout() { clearSession(); location.hash=''; location.reload(); }
function isSuper(s) { if(!s||!s.user) return false; var u=s.user; return u.role==='admin' || u.access_level==='super'; }
// admin = super admin OU admin do setor. Só admin gerencia equipe/metas/config.
// Resiliente: o banco pode marcar admin de setor via role, access_level ou sector_role.
function isAdmin(s) { if(!s||!s.user) return false; if(isSuper(s)) return true; var u=s.user; return u.access_level==='sector_admin' || u.role==='sector_admin' || u.sector_role==='admin'; }

function loadData() {
  var sector = ST.sector;
  if (!sb) return Promise.resolve();
  return Promise.all([
    sb.from('malba_store_units').select('*').order('store_number'),
    sb.from('malba_vl_tasks').select('*').eq('sector', sector).order('created_at', { ascending:false }),
    sb.from('malba_users').select('*'),
    sb.from('malba_store_members').select('*').order('created_at'),
    sb.from('malba_sales_goals').select('*'),
    sb.from('malba_crm_clients').select('*').order('updated_at', { ascending:false }),
    sb.from('malba_vl_projects').select('*').eq('sector', sector).order('created_at', { ascending:false }),
    sb.from('malba_vl_milestones').select('*'),
    sb.from('malba_banners').select('*').order('position'),
    sb.from('malba_campaigns').select('*'),
    sb.from('malba_comissoes').select('*').order('created_at', { ascending:false }),
    sb.from('malba_avaliacoes').select('*').order('created_at', { ascending:false }),
    sb.from('malba_bling_estado').select('*'),
    sb.from('malba_bling_faturamento').select('*')
  ]).then(function(r){
    ST.storeUnits = (r[0]&&r[0].data) || [];
    ST.tasks      = (r[1]&&r[1].data) || [];
    var allUsers  = (r[2]&&r[2].data) || [];
    ST.allUsers = allUsers;
    ST.users = allUsers.filter(function(u){ return u.sector===sector || u.role==='admin'; });
    ST.members    = (r[3]&&r[3].data) || [];
    ST.goals      = ((r[4]&&r[4].data) || []).filter(function(g){ return g.sector===sector; });
    ST.clients    = (r[5]&&r[5].data) || [];
    ST.projects   = (r[6]&&r[6].data) || [];
    ST.milestones = (r[7]&&r[7].data) || [];
    ST.banners    = (r[8]&&r[8].data) || [];
    ST.campaigns  = (r[9]&&r[9].data) || [];
    ST.comissoes  = (r[10]&&r[10].data) || [];
    ST.avaliacoes = (r[11]&&r[11].data) || [];
    ST.bling      = (r[12]&&r[12].data) || [];
    ST.blingFat   = (r[13]&&r[13].data) || [];
    ST.store = null;
    if (sector==='lojas' && ST.session.user) {
      for (var i=0;i<ST.storeUnits.length;i++) {
        if (ST.storeUnits[i].user_id === ST.session.user.id) { ST.store = ST.storeUnits[i]; break; }
      }
    }
    ST.loaded = true;
  }).catch(function(e){ console.error('[load]', e); ST.loaded = true; });
}

function visibleTasks() {
  if (ST.sector==='lojas' && ST.store && !isSuper(ST.session)) {
    return ST.tasks.filter(function(t){ return t.store_unit_id === ST.store.id; });
  }
  return ST.tasks;
}

  var emailEl=document.getElementById('email'), senhaEl=document.getElementById('senha'), errEl=document.getElementById('err'), btn=document.getElementById('btnEntrar');

    errEl.textContent=''; btn.disabled=true; btn.textContent='Entrando...';

  el.classList.toggle('off', !on);
  var txt=el.querySelector('span'); if(txt) txt.textContent = on?'Online':'Offline';
}
function novoContextual() {
  var pg=ST.page;
  if (pg==='campanhas') return openCampaignModal(null);
  if (pg==='crm') return openClientModal(null);
  if (pg==='projetos') { if(ST.openProject) return openTaskModal(null); return openProjectModal(null); }

// mini-gráfico decorativo (visual; ganha dados reais com histórico/Bling)
function miniSpark(color, seed) {
  var w=140,h=34,n=12,s=seed||1,pts=[];
  for (var i=0;i<n;i++) pts.push(Math.sin((i+s)*0.7)*0.5+0.5);
  var coords=pts.map(function(v,i){ return [(i/(n-1))*w, h-(v*(h-7))-3]; });
  var d=coords.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
  var id='sp'+Math.random().toString(36).slice(2,6);
  return '<svg class="stat-spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".22"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+d+' L '+w+' '+h+' L 0 '+h+' Z" fill="url(#'+id+')"/>'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".65"/></svg>';
}
