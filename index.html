// ========================================================
// MEU DIA — tela principal do usuário
// ========================================================
function renderMeuDia() {
  var u = state.user;
  var t = new Date();
  var firstName = u.name.split(' ')[0];
  var dateStr = DAYS_LONG[t.getDay()] + ', ' + t.getDate() + ' de ' + MONTHS[t.getMonth()];

  // Coletar tarefas do usuário hoje
  var tasks = [];
  var i;

  if (t.getFullYear() === 2026) {
    var monthKey = MONTHS_KEY[t.getMonth()];
    var day = t.getDate();
    var wn = Math.ceil(day / 7);
    var todayWeekday = t.getDay(); // 0-6 (dom-sab)

    // Diárias — todo dia
    for (i = 0; i < state.tpl.diarias.length; i++) {
      var d = state.tpl.diarias[i];
      var inst = peekInst(monthKey, day, d.code);
      if (canViewTask(inst, d)) {
        tasks.push({ tpl: d, inst: inst, type: 'diaria', monthKey: monthKey, day: day });
      }
    }

    // Semanais — V8.7: respeitar weekday configurado (default segunda-feira se não configurado)
    for (i = 0; i < state.tpl.semanais.length; i++) {
      var s = state.tpl.semanais[i];
      // Se weekday for definido, só mostrar nesse dia. Caso contrário, dia 1 (segunda)
      var targetDayS = (s.weekday !== null && s.weekday !== undefined) ? parseInt(s.weekday, 10) : 1;
      if (todayWeekday !== targetDayS) continue;
      var inst2 = peekInst(monthKey, 'w' + wn, s.code);
      if (canViewTask(inst2, s)) {
        tasks.push({ tpl: s, inst: inst2, type: 'semanal', monthKey: monthKey, day: 'w' + wn });
      }
    }

    // Mensais — V8.7: respeitar monthDay configurado (default dia 1 se não configurado)
    for (i = 0; i < state.tpl.mensais.length; i++) {
      var m = state.tpl.mensais[i];
      var targetDayM = (m.monthDay !== null && m.monthDay !== undefined) ? parseInt(m.monthDay, 10) : 1;
      if (day !== targetDayM) continue;
      var inst3 = peekInst(monthKey, 'm', m.code);
      if (canViewTask(inst3, m)) {
        tasks.push({ tpl: m, inst: inst3, type: 'mensal', monthKey: monthKey, day: 'm' });
      }
    }
  }

  // Filtrar por usuário se for admin no modo "Meus" - considera defaultAssigneeId também
  if (isAdmin() && state.ui.scope === 'meu') {
    tasks = tasks.filter(function(it) {
      var aId = it.inst.assigneeId || (it.tpl && it.tpl.defaultAssigneeId);
      return aId === u.id || (!aId); // Admin vê dele ou sem responsável
    });
  }
  // User comum: canViewTask já cuida disso (considera defaultAssigneeId)

  // Coletar etapas de projetos com data de hoje
  var todayISO = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
  var projTasks = [];
  for (i = 0; i < state.projects.length; i++) {
    var pr = state.projects[i];
    if (!canViewProject(pr)) continue;
    if (!pr.milestones) continue;
    for (var mi = 0; mi < pr.milestones.length; mi++) {
      var ms = pr.milestones[mi];
      var pInst = peekProjInst(pr.id, ms.id);
      if (ms.date === todayISO) {
        // V8.8: considerar tb assigneeId definido na ETAPA (ms.assigneeId), não só na instância
        var effectiveAssignee = pInst.assigneeId || ms.assigneeId || pr.responsibleId;
        // User comum: só mostra se for ele ou sem dono
        if (!isAdmin()) {
          if (effectiveAssignee && effectiveAssignee !== u.id) continue;
        }
        // Admin no modo "meu": só mostra se for ele ou sem dono
        if (isAdmin() && state.ui.scope === 'meu' && effectiveAssignee && effectiveAssignee !== u.id) continue;
        projTasks.push({ project: pr, milestone: ms, inst: pInst, effectiveAssignee: effectiveAssignee });
      }
    }
  }

  // ===== TAREFAS DE CAMPANHA HOJE =====
  var campTasks = [];
  var todayYMD = ymdLocal(t);
  var activeCamps = getActiveCampaigns(todayYMD);
  for (i = 0; i < activeCamps.length; i++) {
    var camp = activeCamps[i];
    // Só mostrar se o usuário está envolvido (admin no scope "tudo" vê todas)
    var isInvolved = isInCampaign(camp, u.id);
    if (!isInvolved && !(isAdmin() && state.ui.scope === 'tudo')) continue;
    if (isAdmin() && state.ui.scope === 'meu' && !isInvolved) continue;
    if (!camp.tasks) continue;
    for (var ct = 0; ct < camp.tasks.length; ct++) {
      var ctask = camp.tasks[ct];
      var cInst = peekCampInst(camp.id, ctask.id, todayYMD);
      campTasks.push({ camp: camp, task: ctask, inst: cInst, ymd: todayYMD });
    }
  }

  // ===== TAREFAS PONTUAIS HOJE (V8.5) =====
  var oneTimeTasks = getOneTimesForDate(todayYMD, state.ui.scope === 'tudo' && isAdmin() ? null : u.id);

  // Filtro por busca
  if (state.ui.fSearch) {
    var q = state.ui.fSearch.toLowerCase();
    tasks = tasks.filter(function(it) { return it.tpl.title.toLowerCase().indexOf(q) !== -1 || it.tpl.code.toLowerCase().indexOf(q) !== -1; });
    projTasks = projTasks.filter(function(it) { return it.milestone.name.toLowerCase().indexOf(q) !== -1 || it.project.name.toLowerCase().indexOf(q) !== -1; });
    campTasks = campTasks.filter(function(it) { return it.task.title.toLowerCase().indexOf(q) !== -1 || it.camp.name.toLowerCase().indexOf(q) !== -1; });
    oneTimeTasks = oneTimeTasks.filter(function(it) { return it.task.title.toLowerCase().indexOf(q) !== -1; });
  }

  // Ordenar: pendentes primeiro, depois por horário de início, depois por prioridade
  var prioOrder = { 'alta': 0, 'media': 1, 'baixa': 2 };
  tasks.sort(function(a, b) {
    // 1. Concluídas vão pro fim
    if ((a.inst.status === 'Concluído') !== (b.inst.status === 'Concluído')) {
      return a.inst.status === 'Concluído' ? 1 : -1;
    }
    // 2. Tarefas com horário definido aparecem antes (e em ordem cronológica)
    var aTime = a.tpl.startTime || '';
    var bTime = b.tpl.startTime || '';
    if (aTime && !bTime) return -1;
    if (!aTime && bTime) return 1;
    if (aTime && bTime && aTime !== bTime) return aTime.localeCompare(bTime);
    // 3. Por prioridade
    return (prioOrder[a.tpl.priority || 'media'] || 1) - (prioOrder[b.tpl.priority || 'media'] || 1);
  });

  // Stats
  var totalActive = 0, doneActive = 0;
  for (i = 0; i < tasks.length; i++) {
    if (tasks[i].inst.status === 'N/A') continue;
    totalActive++;
    if (tasks[i].inst.status === 'Concluído') doneActive++;
  }
  for (i = 0; i < projTasks.length; i++) {
    totalActive++;
    if (projTasks[i].inst.status === 'Concluído') doneActive++;
  }
  for (i = 0; i < campTasks.length; i++) {
    totalActive++;
    if (campTasks[i].inst.status === 'Concluído') doneActive++;
  }
  var pct = totalActive > 0 ? Math.round((doneActive / totalActive) * 100) : 0;

  // HTML das tarefas
  var taskRows = '';
  for (i = 0; i < tasks.length; i++) {
    var it = tasks[i];
    var doneCls = it.inst.status === 'Concluído' ? ' done' : '';
    var u2 = getUser(it.inst.assigneeId);
    var subTotal = (it.inst.subtasks || []).length;
    var subDone = 0;
    for (var si = 0; si < subTotal; si++) if (it.inst.subtasks[si].done) subDone++;
    var subInfo = subTotal > 0 ? '<span style="font-size:11px;color:#6B6B6B">📋 ' + subDone + '/' + subTotal + '</span>' : '';
    var typeLabel = it.type === 'diaria' ? 'Diária' : it.type === 'semanal' ? 'Semanal' : 'Mensal';

    taskRows += '<div class="meudia-task-item' + doneCls + '" data-md-task data-m="' + esc(it.monthKey) + '" data-d="' + esc(String(it.day)) + '" data-c="' + esc(it.tpl.code) + '">' +
      '<span class="cbox lg' + (it.inst.status === 'Concluído' ? ' checked' : '') + '" data-md-toggle data-m="' + esc(it.monthKey) + '" data-d="' + esc(String(it.day)) + '" data-c="' + esc(it.tpl.code) + '" onclick="event.stopPropagation()"></span>' +
      '<div class="meudia-task-info">' +
        '<div class="meudia-task-title">' + esc(it.tpl.title) + '</div>' +
        '<div class="meudia-task-meta">' +
          '<span class="code">' + esc(it.tpl.code) + '</span>' +
          '<span class="type-bdg ' + esc(it.type) + '">' + typeLabel + '</span>' +
          areaTag(it.tpl.area) +
          '<span class="prio ' + esc(it.tpl.priority || 'media') + '">' + esc(it.tpl.priority || 'media') + '</span>' +
          (u2 ? avatar(u2, 'sm') : '') + (u2 ? '<span style="font-size:11px">' + esc(u2.name) + '</span>' : '') +
          subInfo +
        '</div>' +
      '</div>' +
      '<span class="meudia-task-arrow">' + ICON.arrow + '</span>' +
    '</div>';
  }

  // Etapas de projeto
  var projRows = '';
  for (i = 0; i < projTasks.length; i++) {
    var pt = projTasks[i];
    var doneCls2 = pt.inst.status === 'Concluído' ? ' done' : '';
    var pu = getUser(pt.inst.assigneeId);
    projRows += '<div class="meudia-task-item' + doneCls2 + '" data-md-proj data-pid="' + esc(pt.project.id) + '" data-mid="' + esc(pt.milestone.id) + '">' +
      '<span class="cbox lg' + (pt.inst.status === 'Concluído' ? ' checked' : '') + '" data-md-proj-toggle data-pid="' + esc(pt.project.id) + '" data-mid="' + esc(pt.milestone.id) + '" onclick="event.stopPropagation()"></span>' +
      '<div class="meudia-task-info">' +
        '<div class="meudia-task-title">' + esc(pt.milestone.name) + '</div>' +
        '<div class="meudia-task-meta">' +
          '<span class="type-bdg projeto">Projeto</span>' +
          '<span style="font-size:11px;color:#6B6B6B">' + esc(pt.project.name) + '</span>' +
          (pu ? avatar(pu, 'sm') : '') + (pu ? '<span style="font-size:11px">' + esc(pu.name) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<span class="meudia-task-arrow">' + ICON.arrow + '</span>' +
    '</div>';
  }

  // Tarefas de Campanha
  var campRows = '';
  for (i = 0; i < campTasks.length; i++) {
    var ctt = campTasks[i];
    var doneClsC = ctt.inst.status === 'Concluído' ? ' done' : '';
    var campColor = ctt.camp.color || '#E8561A';
    campRows += '<div class="meudia-task-item' + doneClsC + '" data-md-camp data-cid="' + esc(ctt.camp.id) + '" data-tid="' + esc(ctt.task.id) + '" data-ymd="' + esc(ctt.ymd) + '" style="border-left:3px solid ' + esc(campColor) + '">' +
      '<span class="cbox lg' + (ctt.inst.status === 'Concluído' ? ' checked' : '') + '" data-md-camp-toggle data-cid="' + esc(ctt.camp.id) + '" data-tid="' + esc(ctt.task.id) + '" data-ymd="' + esc(ctt.ymd) + '" onclick="event.stopPropagation()"></span>' +
      '<div class="meudia-task-info">' +
        '<div class="meudia-task-title">' + esc(ctt.task.title) + '</div>' +
        '<div class="meudia-task-meta">' +
          '<span class="type-bdg campanha" style="background:' + esc(campColor) + '20;color:' + esc(campColor) + '">🎯 ' + esc(ctt.camp.name) + '</span>' +
          '<span class="prio ' + esc(ctt.task.priority || 'media') + '">' + esc(ctt.task.priority || 'media') + '</span>' +
          (ctt.camp.area ? areaTag(ctt.camp.area) : '') +
          (ctt.task.desc ? '<span style="font-size:11px;color:#6B6B6B">' + esc(ctt.task.desc) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<span class="meudia-task-arrow">' + ICON.arrow + '</span>' +
    '</div>';
  }

  // V8.5: Tarefas Pontuais
  var oneTimeRows = '';
  for (i = 0; i < oneTimeTasks.length; i++) {
    var ott = oneTimeTasks[i];
    var doneClsO = ott.inst.status === 'Concluído' ? ' done' : '';
    var oneAssignee = getUser(ott.inst.assigneeId || ott.task.assigneeId);
    oneTimeRows += '<div class="meudia-task-item' + doneClsO + '" data-md-onetime data-tid="' + esc(ott.task.id) + '" data-ymd="' + esc(ott.ymd) + '" style="border-left:3px solid #9C27B0">' +
      '<span class="cbox lg' + (ott.inst.status === 'Concluído' ? ' checked' : '') + '" data-md-onetime-toggle data-tid="' + esc(ott.task.id) + '" data-ymd="' + esc(ott.ymd) + '" onclick="event.stopPropagation()"></span>' +
      '<div class="meudia-task-info">' +
        '<div class="meudia-task-title">' + esc(ott.task.title) + '</div>' +
        '<div class="meudia-task-meta">' +
          '<span class="type-bdg" style="background:#F3E5F5;color:#7B1FA2">📌 Pontual</span>' +
          '<span class="prio ' + esc(ott.task.priority || 'media') + '">' + esc(ott.task.priority || 'media') + '</span>' +
          (ott.task.area ? areaTag(ott.task.area) : '') +
          (oneAssignee ? avatar(oneAssignee, 'sm') : '') + (oneAssignee ? '<span style="font-size:11px">' + esc(oneAssignee.name) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<span class="meudia-task-arrow">' + ICON.arrow + '</span>' +
    '</div>';
  }

  var contentHTML = '';
  if (tasks.length === 0 && projTasks.length === 0 && campTasks.length === 0 && oneTimeTasks.length === 0) {
    contentHTML = '<div class="empty"><div class="empty-icon">' + ICON.check + '</div>' +
      '<div class="empty-title">' + (t.getFullYear() === 2026 ? 'Nada para hoje' : 'Aguardando início de 2026') + '</div>' +
      '<div class="empty-text">' + (t.getFullYear() === 2026 ? 'Você está em dia! 🎉' : 'As tarefas começam em janeiro de 2026') + '</div></div>';
  } else {
    if (campTasks.length > 0) {
      contentHTML += '<div style="padding:14px 20px 8px;font-size:11px;font-weight:600;color:#0A0A0A;text-transform:uppercase;letter-spacing:0.5px;background:linear-gradient(90deg, #FFF8F2 0%, transparent 100%);border-left:3px solid var(--accent)">🎯 Campanhas Ativas</div>';
      contentHTML += campRows;
    }
    if (oneTimeTasks.length > 0) {
      contentHTML += '<div style="padding:14px 20px 8px;font-size:11px;font-weight:600;color:#7B1FA2;text-transform:uppercase;letter-spacing:0.5px;background:linear-gradient(90deg, #F3E5F5 0%, transparent 100%);border-left:3px solid #9C27B0">📌 Tarefas Pontuais</div>';
      contentHTML += oneTimeRows;
    }
    if (tasks.length > 0) {
      if (campTasks.length > 0 || oneTimeTasks.length > 0) contentHTML += '<div style="padding:14px 20px 8px;font-size:11px;font-weight:500;color:#6B6B6B;text-transform:uppercase;letter-spacing:0.5px;border-top:1px solid #F0F0EE;background:#FAFAF8">Tarefas Recorrentes</div>';
      contentHTML += taskRows;
    }
    if (projTasks.length > 0) {
      contentHTML += '<div style="padding:14px 20px 8px;font-size:11px;font-weight:500;color:#6B6B6B;text-transform:uppercase;letter-spacing:0.5px;border-top:1px solid #F0F0EE;background:#FAFAF8">Etapas de Projetos</div>';
      contentHTML += projRows;
    }
  }

  // === V8.4: Notificações de tarefas atrasadas ===
  var notifBanner = '';
  if (t.getFullYear() === 2026) {
    var monthKeyN = MONTHS_KEY[t.getMonth()];
    var todayN = t.getDate();
    var overdueCount = 0;
    var overdueExamples = [];
    // Olhar últimos 7 dias
    for (var dN = Math.max(1, todayN - 7); dN < todayN; dN++) {
      for (var tN = 0; tN < state.tpl.diarias.length; tN++) {
        var tkN = state.tpl.diarias[tN];
        var instN = peekInst(monthKeyN, dN, tkN.code);
        var aIdN = instN.assigneeId || tkN.defaultAssigneeId;
        if (aIdN === u.id && instN.status !== 'Concluído' && instN.status !== 'N/A') {
          overdueCount++;
          if (overdueExamples.length < 2) overdueExamples.push(tkN.code + ' (dia ' + dN + ')');
        }
      }
    }
    if (overdueCount > 0) {
      notifBanner = '<div class="alert-overdue" style="margin-bottom:12px">⚠️ <strong>' + overdueCount + '</strong> tarefa(s) atrasada(s)' +
        (overdueExamples.length > 0 ? ': ' + overdueExamples.join(', ') + (overdueCount > overdueExamples.length ? '...' : '') : '') +
      '</div>';
    }
    // Sugestão IA-style
    if (tasks.length > 0) {
      var firstPending = null;
      for (var tx = 0; tx < tasks.length; tx++) {
        if (tasks[tx].inst.status !== 'Concluído') { firstPending = tasks[tx]; break; }
      }
      if (firstPending) {
        var prio = firstPending.tpl.priority || 'media';
        var prioIcon = prio === 'alta' ? '🔴' : prio === 'media' ? '🟡' : '⚪';
        notifBanner += '<div class="suggestion-banner">' +
          '<div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px">🤖</span>' +
          '<div style="flex:1"><strong>Sugestão:</strong> Comece pela tarefa ' + prioIcon + ' <strong>' + esc(firstPending.tpl.code) + '</strong> — ' + esc(firstPending.tpl.title.substring(0, 60)) + (firstPending.tpl.title.length > 60 ? '...' : '') + '</div>' +
          '<button class="btn btn-sm btn-primary" data-md-task-suggest data-m="' + esc(firstPending.monthKey) + '" data-d="' + firstPending.day + '" data-c="' + esc(firstPending.tpl.code) + '">Abrir</button>' +
          '</div></div>';
      }
    }
  }

  return notifBanner +
    '<div class="meudia-hero">' +
    '<div class="meudia-hello">Olá</div>' +
    '<h2 class="meudia-name">' + esc(firstName) + '</h2>' +
    '<div class="meudia-date">' + esc(dateStr) + (t.getFullYear() !== 2026 ? ' (sistema 2026)' : '') + '</div>' +
    '<div class="meudia-progress">' +
      '<div class="meudia-progress-bar"><div class="meudia-progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="meudia-progress-text">' + doneActive + '/' + totalActive + ' · ' + pct + '%</div>' +
    '</div></div>' +
    '<div class="card"><div class="card-head"><div class="card-title">Suas tarefas de hoje</div>' +
    '<button class="btn btn-sm btn-ghost" data-goto="lista">Ver todas →</button></div>' +
    '<div class="card-body no-pad">' + contentHTML + '</div></div>';
}

function attachMeuDia() {
  var gotos = document.querySelectorAll('[data-goto]');
  for (var i = 0; i < gotos.length; i++) {
    (function(b) {
      b.addEventListener('click', function() {
        state.ui.page = b.getAttribute('data-goto');
        renderShell();
        renderPage();
      });
    })(gotos[i]);
  }

  // Banner de sugestão IA (V8.4)
  var suggBtns = document.querySelectorAll('[data-md-task-suggest]');
  for (var sb = 0; sb < suggBtns.length; sb++) {
    (function(b) {
      b.addEventListener('click', function() {
        var m = b.getAttribute('data-m'), d = b.getAttribute('data-d'), c = b.getAttribute('data-c');
        if (typeof openTaskDetailModal === 'function') openTaskDetailModal(m, parseInt(d, 10), c);
      });
    })(suggBtns[sb]);
  }

  // Toggle status diário
  var toggles = document.querySelectorAll('[data-md-toggle]');
  for (var t = 0; t < toggles.length; t++) {
    (function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        var m = el.getAttribute('data-m'), d = el.getAttribute('data-d'), c = el.getAttribute('data-c');
        var tk = getTaskTpl(c);
        var inst = peekInst(m, d, c);
        if (!canEditTask(inst, tk)) { toast('Sem permissão', 'error'); return; }
        var ns = inst.status === 'Concluído' ? 'A fazer' : 'Concluído';
        setTask(m, d, c, 'status', ns);
        logActivity('task', (ns === 'Concluído' ? 'concluiu' : 'reabriu') + ' tarefa ' + c);
        save();
        renderShell();
        renderPage();
        toast(ns === 'Concluído' ? 'Tarefa concluída ✓' : 'Tarefa reaberta', 'success');
      });
    })(toggles[t]);
  }

  // Click em row = abrir detalhe
  var rows = document.querySelectorAll('[data-md-task]');
  for (var r = 0; r < rows.length; r++) {
    (function(el) {
      el.addEventListener('click', function() {
        openTaskDetailModal(el.getAttribute('data-m'), el.getAttribute('data-d'), el.getAttribute('data-c'));
      });
    })(rows[r]);
  }

  // Toggle projeto
  var projToggles = document.querySelectorAll('[data-md-proj-toggle]');
  for (var pt = 0; pt < projToggles.length; pt++) {
    (function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        var pid = el.getAttribute('data-pid'), mid = el.getAttribute('data-mid');
        var pInst = peekProjInst(pid, mid);
        var ns = pInst.status === 'Concluído' ? 'A fazer' : 'Concluído';
        setProjMilestone(pid, mid, 'status', ns);
        logActivity('project', (ns === 'Concluído' ? 'concluiu' : 'reabriu') + ' etapa de projeto');
        save();
        renderPage();
        toast(ns === 'Concluído' ? 'Etapa concluída ✓' : 'Etapa reaberta', 'success');
      });
    })(projToggles[pt]);
  }

  var projRows = document.querySelectorAll('[data-md-proj]');
  for (var pr = 0; pr < projRows.length; pr++) {
    (function(el) {
      el.addEventListener('click', function() {
        openProjectModal(el.getAttribute('data-pid'));
      });
    })(projRows[pr]);
  }

  // Toggle campanha
  var campToggles = document.querySelectorAll('[data-md-camp-toggle]');
  for (var ct = 0; ct < campToggles.length; ct++) {
    (function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        var cid = el.getAttribute('data-cid'), tid = el.getAttribute('data-tid'), ymd = el.getAttribute('data-ymd');
        var cInst = peekCampInst(cid, tid, ymd);
        var ns = cInst.status === 'Concluído' ? 'A fazer' : 'Concluído';
        setCampTask(cid, tid, ymd, 'status', ns);
        logActivity('camp', (ns === 'Concluído' ? 'concluiu' : 'reabriu') + ' tarefa de campanha');
        renderShell();
        renderPage();
        toast(ns === 'Concluído' ? 'Tarefa concluída ✓' : 'Tarefa reaberta', 'success');
      });
    })(campToggles[ct]);
  }

  // Click em row campanha = abrir modal de detalhes
  var campRowsEls = document.querySelectorAll('[data-md-camp]');
  for (var cr = 0; cr < campRowsEls.length; cr++) {
    (function(el) {
      el.addEventListener('click', function() {
        openCampTaskModal(el.getAttribute('data-cid'), el.getAttribute('data-tid'), el.getAttribute('data-ymd'));
      });
    })(campRowsEls[cr]);
  }

  // V8.5: Toggle one-time task
  var oneTimeToggles = document.querySelectorAll('[data-md-onetime-toggle]');
  for (var ott = 0; ott < oneTimeToggles.length; ott++) {
    (function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        var tid = el.getAttribute('data-tid'), ymd = el.getAttribute('data-ymd');
        var inst = peekOneTimeInst(tid, ymd);
        var ns = inst.status === 'Concluído' ? 'A fazer' : 'Concluído';
        setOneTime(tid, ymd, 'status', ns);
        renderShell();
        renderPage();
        toast(ns === 'Concluído' ? 'Tarefa concluída ✓' : 'Tarefa reaberta', 'success');
      });
    })(oneTimeToggles[ott]);
  }

  // Click em row one-time = abrir detalhe
  var oneTimeRowsEls = document.querySelectorAll('[data-md-onetime]');
  for (var otr = 0; otr < oneTimeRowsEls.length; otr++) {
    (function(el) {
      el.addEventListener('click', function() {
        if (typeof openOneTimeDetailModal === 'function') {
          openOneTimeDetailModal(el.getAttribute('data-tid'), el.getAttribute('data-ymd'));
        }
      });
    })(oneTimeRowsEls[otr]);
  }
}

// DASHBOARD (admin only)

function renderDashboard() {
  var year = yearStats();
  var today = todayStatsFiltered();
  var projsActive = 0;
  for (var pi = 0; pi < state.projects.length; pi++) if (state.projects[pi].status === 'Em andamento') projsActive++;

  // === BARRAS POR MÊS ===
  var monthBars = '';
  for (var m = 0; m < 12; m++) {
    var s = monthStats(m);
    var barCls = s.pct >= 80 ? 'green' : s.pct >= 50 ? 'amber' : '';
    monthBars += '<div class="bar-row"><span class="bar-label">' + MONTHS[m].substring(0, 3) + '</span>' +
      '<div class="bar-track"><div class="bar-fill ' + barCls + '" style="width:' + s.pct + '%"></div></div>' +
      '<span class="bar-val">' + s.pct + '%</span></div>';
  }

  // === ÁREAS ===
  var areas = {};
  var allTasks = state.tpl.diarias.concat(state.tpl.semanais).concat(state.tpl.mensais);
  for (var t = 0; t < allTasks.length; t++) areas[allTasks[t].area] = (areas[allTasks[t].area] || 0) + 1;
  var areaKeys = [];
  for (var ak in areas) if (areas.hasOwnProperty(ak)) areaKeys.push(ak);
  areaKeys.sort(function(a, b) { return areas[b] - areas[a]; });
  var maxArea = 1;
  for (var aki = 0; aki < areaKeys.length; aki++) if (areas[areaKeys[aki]] > maxArea) maxArea = areas[areaKeys[aki]];
  var areaBars = '';
  for (var aki2 = 0; aki2 < areaKeys.length; aki2++) {
    var an = areaKeys[aki2];
    var ainfo = getArea(an);
    areaBars += '<div class="bar-row"><span class="bar-label">' + esc(ainfo.emoji + ' ' + an) + '</span>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + Math.round(areas[an] / maxArea * 100) + '%;background:' + esc(ainfo.color) + '"></div></div>' +
      '<span class="bar-val">' + areas[an] + '</span></div>';
  }
  if (!areaBars) areaBars = '<p style="color:#6B6B6B;font-size:13px">Nenhuma tarefa cadastrada</p>';

  // === RANKING DE USUÁRIOS (NOVO!) ===
  var userStats = {};
  var monthIdx = new Date().getMonth();
  var monthKey = MONTHS_KEY[monthIdx];
  var diM = new Date(2026, monthIdx + 1, 0).getDate();
  // Inicializar
  for (var ui = 0; ui < state.users.length; ui++) {
    userStats[state.users[ui].id] = { user: state.users[ui], done: 0, total: 0 };
  }
  // Contar tarefas concluídas no mês
  for (var d = 1; d <= diM; d++) {
    for (var ti = 0; ti < state.tpl.diarias.length; ti++) {
      var tk = state.tpl.diarias[ti];
      var inst = peekInst(monthKey, d, tk.code);
      var aId = inst.assigneeId || (state.tpl.diarias[ti].defaultAssigneeId);
      if (aId && userStats[aId]) {
        userStats[aId].total++;
        if (inst.status === 'Concluído') userStats[aId].done++;
      }
    }
  }
  // Converter pra array e ordenar por concluídas
  var ranking = [];
  for (var uid in userStats) {
    if (userStats.hasOwnProperty(uid) && userStats[uid].total > 0) ranking.push(userStats[uid]);
  }
  ranking.sort(function(a, b) { return b.done - a.done; });

  var rankHTML = '';
  if (ranking.length === 0) {
    rankHTML = '<p style="color:#6B6B6B;font-size:13px;text-align:center;padding:24px">Atribua tarefas aos usuários para ver o ranking</p>';
  } else {
    for (var ri = 0; ri < ranking.length; ri++) {
      var rd = ranking[ri];
      var pctU = rd.total > 0 ? Math.round((rd.done / rd.total) * 100) : 0;
      var medal = ri === 0 ? '🥇' : ri === 1 ? '🥈' : ri === 2 ? '🥉' : (ri + 1) + 'º';
      rankHTML += '<div class="rank-row">' +
        '<div class="rank-pos">' + medal + '</div>' +
        avatar(rd.user, 'sm') +
        '<div class="rank-info"><div class="rank-name">' + esc(rd.user.name) + '</div>' +
        '<div class="rank-bar"><div class="rank-bar-fill ' + (pctU >= 80 ? 'green' : pctU >= 50 ? 'amber' : '') + '" style="width:' + pctU + '%"></div></div></div>' +
        '<div class="rank-stat"><strong>' + rd.done + '</strong>/' + rd.total + '<div style="font-size:10px;color:#6B6B6B">' + pctU + '%</div></div>' +
      '</div>';
    }
  }

  // === TAREFAS DE TODOS HOJE (admin) ===
  var todayHTML = '';
  var tdy = new Date();
  if (tdy.getFullYear() === 2026) {
    var monthKeyT = MONTHS_KEY[tdy.getMonth()];
    var dayT = tdy.getDate();
    if (state.tpl.diarias.length === 0) {
      todayHTML = '<tr><td colspan="5" style="text-align:center;padding:32px;color:#6B6B6B">Nenhuma tarefa diária</td></tr>';
    } else {
      for (var ti2 = 0; ti2 < state.tpl.diarias.length; ti2++) {
        var tkT = state.tpl.diarias[ti2];
        var instTT = peekInst(monthKeyT, dayT, tkT.code);
        var u = getUser(instTT.assigneeId);
        todayHTML += '<tr style="cursor:pointer" data-tk-row data-mk="' + monthKeyT + '" data-day="' + dayT + '" data-code="' + esc(tkT.code) + '">' +
          '<td><span class="code">' + esc(tkT.code) + '</span></td>' +
          '<td style="max-width:340px;font-weight:500">' + esc(tkT.title) + '</td>' +
          '<td>' + areaTag(tkT.area) + '</td>' +
          '<td>' + (u ? avatar(u, 'sm') + ' <span style="margin-left:6px">' + esc(u.name) + '</span>' : '<span style="color:#9A9A9A">— sem responsável</span>') + '</td>' +
          '<td>' + pillStatus(instTT.status) + '</td></tr>';
      }
    }
  } else {
    todayHTML = '<tr><td colspan="5" style="text-align:center;padding:32px;color:#6B6B6B">As tarefas começam em janeiro/2026</td></tr>';
  }

  // === ATIVIDADE RECENTE ===
  var recent = state.activity.slice(0, 8);
  var actHTML = '';
  if (recent.length === 0) {
    actHTML = '<div class="empty"><div class="empty-icon">' + ICON.hist + '</div><div class="empty-title">Nenhuma atividade ainda</div></div>';
  } else {
    for (var r = 0; r < recent.length; r++) {
      var a = recent[r];
      var au = getUser(a.userId);
      actHTML += '<div class="activity-row">' +
        (au ? avatar(au, 'sm') : '<span class="activity-icon">' + ICON.user + '</span>') +
        '<div class="activity-content">' +
        '<div class="activity-text"><strong>' + esc(a.userName || 'Sistema') + '</strong> ' + esc(a.text || a.description || '') + '</div>' +
        '<div class="activity-time">' + timeAgo(a.timestamp) + '</div></div></div>';
    }
  }

  // Toggle de scope mostrar
  return '<div class="page-head"><div><h2 class="page-title">Painel Executivo</h2>' +
    '<p class="page-sub">Visão completa do mês • ' + MONTHS[monthIdx] + ' 2026</p></div></div>' +
    // Métricas principais
    '<div class="metrics">' +
      '<div class="metric accent"><div class="metric-label">Conclusão do Mês</div><div class="metric-value">' + monthStats(monthIdx).pct + '%</div><div class="metric-trend">Meta: 90%</div></div>' +
      '<div class="metric"><div class="metric-label">Hoje</div><div class="metric-value">' + today.done + '/' + today.total + '</div><div class="metric-trend">' + today.pct + '% concluídas</div></div>' +
      '<div class="metric success"><div class="metric-label">Concluídas (ano)</div><div class="metric-value">' + year.done + '</div></div>' +
      '<div class="metric warning"><div class="metric-label">Pendentes hoje</div><div class="metric-value">' + (today.total - today.done) + '</div></div>' +

        renderPage();

  // Click em linha de tarefa abre detalhe
  var rows = document.querySelectorAll('[data-tk-row]');

      });

}

function monthStats(monthIdx) {
  var monthKey = MONTHS_KEY[monthIdx];
  var daysInMonth = new Date(2026, monthIdx + 1, 0).getDate();
  var total = 0, done = 0, doing = 0, pending = 0, na = 0;
  var i, j;
  for (i = 1; i <= daysInMonth; i++) {
    for (j = 0; j < state.tpl.diarias.length; j++) {
      total++;
      var inst = peekInst(monthKey, i, state.tpl.diarias[j].code);
      if (inst.status === 'Concluído') done++;
      else if (inst.status === 'Em andamento') doing++;
      else if (inst.status === 'N/A') na++;
      else pending++;
    }
  }
  var mondays = 0;
  for (i = 1; i <= daysInMonth; i++) if (new Date(2026, monthIdx, i).getDay() === 1) mondays++;
  for (j = 0; j < state.tpl.semanais.length; j++) {
    for (i = 1; i <= mondays; i++) {
      total++;
      var inst2 = peekInst(monthKey, 'w' + i, state.tpl.semanais[j].code);
      if (inst2.status === 'Concluído') done++;
      else if (inst2.status === 'Em andamento') doing++;
      else if (inst2.status === 'N/A') na++;
      else pending++;
    }
  }
  for (j = 0; j < state.tpl.mensais.length; j++) {
    total++;
    var inst3 = peekInst(monthKey, 'm', state.tpl.mensais[j].code);
    if (inst3.status === 'Concluído') done++;
    else if (inst3.status === 'Em andamento') doing++;
    else if (inst3.status === 'N/A') na++;
    else pending++;
  }
  var eff = total - na;
  return { total: total, done: done, doing: doing, pending: pending, na: na, pct: eff > 0 ? Math.round((done / eff) * 100) : 0 };
}

function yearStats() {
  var total = 0, done = 0, doing = 0, pending = 0, na = 0;
  for (var m = 0; m < 12; m++) {
    var s = monthStats(m);
    total += s.total; done += s.done; doing += s.doing; pending += s.pending; na += s.na;
  }
  var eff = total - na;
  return { total: total, done: done, doing: doing, pending: pending, na: na, pct: eff > 0 ? Math.round((done / eff) * 100) : 0 };
}

function todayStatsFiltered() {
  var t = new Date();
  if (t.getFullYear() !== 2026) return { total: 0, done: 0, pending: 0, pct: 0 };
  var monthKey = MONTHS_KEY[t.getMonth()];
  var day = t.getDate();
  var total = 0, done = 0, pending = 0;
  for (var i = 0; i < state.tpl.diarias.length; i++) {
    var tpl = state.tpl.diarias[i];
    var inst = peekInst(monthKey, day, tpl.code);
    if (!canViewTask(inst, tpl)) continue;
    total++;
    if (inst.status === 'Concluído') done++;
    else if (inst.status !== 'N/A') pending++;
  }
  return { total: total, done: done, pending: pending, pct: total > 0 ? Math.round((done / total) * 100) : 0 };
}
