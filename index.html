<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MALBA Embalagens — Sistema 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Ctext x='32' y='46' font-family='Arial' font-size='38' font-weight='900' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
/* ===== V9.0 — Design system ultra-minimalista (Things 3 / Linear) ===== */
:root {
  /* Cores — paleta neutra reduzida */
  --accent: #E8561A;
  --accent-soft: #FFF5EE;
  --accent-hover: #D14B11;
  --bg: #FBFBFA;
  --card-bg: #FFFFFF;
  --text: #15151A;
  --text-2: #404048;
  --text-muted: #6E6E78;
  --text-subtle: #A8A8B0;
  --border: #E8E8E6;
  --border-light: #F2F2F0;
  --hover-bg: #F5F5F3;

  /* Status colors — tonos suaves */
  --status-todo: #2B6CB0;
  --status-doing: #DD6B20;
  --status-done: #2F855A;
  --status-blocked: #C53030;
  --status-na: #A0AEC0;

  /* Tipografia — escala mais refinada */
  --fs-xs: 11px;
  --fs-sm: 12px;
  --fs-base: 13px;
  --fs-md: 14px;
  --fs-lg: 16px;
  --fs-xl: 22px;
  --fs-xxl: 32px;
  --fs-display: 40px;

  /* Espaçamento */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 40px;
  --sp-8: 56px;

  /* Bordas */
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;

  /* Sombras */
  --shadow-sm: 0 1px 2px rgba(0,0,0,.03);
  --shadow-md: 0 1px 3px rgba(0,0,0,.05), 0 0 1px rgba(0,0,0,.04);
  --shadow-lg: 0 4px 24px rgba(0,0,0,.08);
}
[data-theme="dark"] {
  --accent: #FF6B30;
  --accent-soft: #2A1A0E;
  --accent-hover: #FF7B45;
  --bg: #0B0B0E;
  --card-bg: #15151A;
  --text: #F5F5F7;
  --text-2: #C8C8D0;
  --text-muted: #9A9AA5;
  --text-subtle: #6A6A75;
  --border: #2A2A30;
  --border-light: #1F1F25;
  --hover-bg: #1A1A20;
}
[data-theme="dark"] body { background: var(--bg); color: var(--text); }
[data-theme="dark"] .card,
[data-theme="dark"] .sidebar,
[data-theme="dark"] .topbar,
[data-theme="dark"] .login-box,
[data-theme="dark"] .modal,
[data-theme="dark"] .login-screen { background: var(--card-bg); border-color: var(--border); color: var(--text); }
[data-theme="dark"] .input,
[data-theme="dark"] textarea.input,
[data-theme="dark"] select.input { background: var(--card-bg); color: var(--text); border-color: var(--border); }
[data-theme="dark"] .tbl tbody tr:hover td { background: var(--hover-bg); }
[data-theme="dark"] .tbl thead th { background: var(--card-bg); color: var(--text-muted); }
[data-theme="dark"] .meudia-hero { background: var(--card-bg); }
[data-theme="dark"] .side-link:hover,
[data-theme="dark"] .btn:hover { background: var(--hover-bg); }
[data-theme="dark"] .side-link.active { background: var(--text); color: var(--card-bg); }
[data-theme="dark"] .perm-row,
[data-theme="dark"] .link-row { background: var(--hover-bg); border-color: var(--border); }
[data-theme="dark"] .area-item { background: var(--hover-bg); border-color: var(--border); }
[data-theme="dark"] .modal-tabs { border-color: var(--border); }
[data-theme="dark"] .modal-tab { color: var(--text-muted); }
[data-theme="dark"] .modal-tab.active { color: var(--text); }
[data-theme="dark"] .login-error { background: #2D1A1A; }
[data-theme="dark"] code { background: var(--bg); color: var(--text); }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: var(--fs-md);
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.011em;
  font-feature-settings: "cv02", "cv03", "cv04", "cv11";
}
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font: inherit; color: inherit; }
table { border-collapse: collapse; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 100px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-subtle); }
::-webkit-scrollbar-track { background: transparent; }

/* ===== LOGIN ===== */
.login-screen { position: fixed; inset: 0; background: #FAFAF8; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
.login-box { background: #fff; border: 1px solid #E5E5E5; border-radius: 14px; width: 100%; max-width: 400px; padding: 40px 32px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
.login-logo { text-align: center; margin-bottom: 8px; }
.login-logo-mark { font-size: 42px; font-weight: 900; letter-spacing: -2px; color: #0A0A0A; line-height: 1; }
.login-logo-sub { font-size: 14px; color: #404040; margin-top: 4px; letter-spacing: 0.5px; }
.login-tagline { text-align: center; font-size: 12px; color: #6B6B6B; margin: 12px 0 24px; }
.login-form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 11px; font-weight: 500; color: #6B6B6B; letter-spacing: 0.2px; }
.input { height: 36px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 12px; background: var(--card-bg); color: var(--text); font-size: var(--fs-md); width: 100%; transition: border-color .12s, box-shadow .12s; }
.input:hover { border-color: #C8C8C8; }
.input:focus { outline: none; border-color: var(--text); box-shadow: 0 0 0 3px rgba(10,10,10,.06); }
textarea.input { height: auto; min-height: 80px; padding: 10px 12px; resize: vertical; font-family: inherit; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card-bg); color: var(--text); font-size: var(--fs-base); font-weight: 500; transition: all .12s ease; white-space: nowrap; }
.btn:hover { background: var(--hover-bg); border-color: var(--border); }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--text); color: var(--card-bg); border-color: var(--text); font-weight: 500; }
.btn-primary:hover { background: var(--text-2); border-color: var(--text-2); }
.btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
.btn-accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--text-muted); }
.btn-ghost:hover { background: var(--hover-bg); border-color: transparent; color: var(--text); }
.btn-sm { height: 26px; padding: 0 10px; font-size: var(--fs-sm); }
.btn-lg { height: 38px; padding: 0 18px; font-size: var(--fs-md); }
.btn-block { width: 100%; }
.btn-icon { width: 28px; height: 28px; padding: 0; border-color: transparent; color: var(--text-muted); border-radius: var(--radius-sm); background: transparent; }
.btn-icon:hover { background: var(--hover-bg); color: var(--text); }
.btn-icon.danger:hover { background: #FAEDED; color: #B33A3A; }
.login-error { background: #FAEDED; color: #B33A3A; padding: 10px 12px; border-radius: var(--radius-sm); font-size: var(--fs-base); text-align: center; display: none; }
.login-error.show { display: block; }
.login-help { text-align: center; font-size: var(--fs-xs); color: var(--text-muted); margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-light); line-height: 1.7; }
.login-help code { font-family: 'SF Mono', Menlo, monospace; font-size: var(--fs-xs); background: var(--hover-bg); padding: 2px 6px; border-radius: 4px; color: var(--text); }

/* ===== APP LAYOUT ===== */
.app { display: none; }
.app.active { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.sidebar { background: var(--card-bg); border-right: 1px solid var(--border-light); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow: hidden; }
.side-brand { padding: 22px 20px 20px; display: flex; align-items: center; gap: 12px; }
.side-brand-mark { width: 30px; height: 30px; background: var(--text); border-radius: 7px; display: flex; align-items: center; justify-content: center; color: var(--card-bg); font-weight: 800; font-size: 15px; letter-spacing: -0.8px; flex-shrink: 0; }
.side-brand-text { display: flex; flex-direction: column; }
.side-brand-name { font-size: var(--fs-md); font-weight: 700; letter-spacing: -0.3px; line-height: 1.1; color: var(--text); }
.side-brand-tag { font-size: 9px; color: var(--text-subtle); letter-spacing: 0.6px; text-transform: uppercase; margin-top: 3px; font-weight: 600; }
.side-user { padding: 12px 20px; display: flex; align-items: center; gap: 10px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 11px; color: #fff; flex-shrink: 0; }
.avatar.sm { width: 22px; height: 22px; font-size: 10px; }
.avatar.lg { width: 40px; height: 40px; font-size: 14px; }
.avatar.xl { width: 56px; height: 56px; font-size: 19px; }
.side-user-info { min-width: 0; flex: 1; }
.side-user-name { font-size: var(--fs-base); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.side-user-role { font-size: 9px; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; }
.side-nav { flex: 1; padding: 4px 8px 8px; overflow-y: auto; }
.side-section { margin-bottom: 8px; }
.side-section-title { font-size: 10px; font-weight: 600; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.7px; padding: 14px 10px 6px; }
.side-link { display: flex; align-items: center; gap: 11px; padding: 7px 10px; border-radius: 6px; font-size: var(--fs-base); color: var(--text-2); font-weight: 500; width: 100%; text-align: left; transition: background-color .1s, color .1s; position: relative; }
.side-link:hover { background: var(--hover-bg); color: var(--text); }
.side-link.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side-link svg { width: 16px; height: 16px; flex-shrink: 0; stroke-width: 1.6; fill: none; stroke: currentColor; opacity: .8; }
.side-link.active svg { opacity: 1; }
.side-link .badge { position: absolute; right: 10px; background: var(--accent); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 8px; min-width: 18px; text-align: center; }
.side-link.active .badge { background: var(--accent); color: #fff; }
.side-foot { padding: 12px 16px; border-top: 1px solid var(--border-light); }

.topbar { background: var(--card-bg); border-bottom: 1px solid var(--border-light); padding: 0 28px; height: 56px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 50; }
.topbar-title { font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.4px; color: var(--text); }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search { position: relative; width: 280px; }
.search input { width: 100%; height: 32px; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 0 12px 0 32px; background: var(--hover-bg); font-size: var(--fs-base); color: var(--text); }
.search input::placeholder { color: var(--text-subtle); }
.search input:focus { outline: none; background: var(--card-bg); border-color: var(--border); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-subtle); fill: none; stroke: currentColor; stroke-width: 2; }

.scope-toggle { display: inline-flex; background: var(--hover-bg); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
.scope-toggle button { height: 26px; padding: 0 10px; font-size: 11px; font-weight: 600; border-radius: 4px; color: var(--text-muted); }
.scope-toggle button.active { background: var(--card-bg); color: var(--text); box-shadow: var(--shadow-sm); }

.content { padding: 32px 36px 100px; max-width: 1340px; margin: 0 auto; }
@media (max-width: 900px) { .content { padding: 20px 16px 100px; } }
.page { animation: fadeIn .2s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
.page-title { font-size: var(--fs-xxl); font-weight: 700; letter-spacing: -1px; line-height: 1.05; color: var(--text); }
.page-sub { font-size: var(--fs-md); color: var(--text-muted); margin-top: 8px; font-weight: 400; }

.card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius-md); margin-bottom: 16px; overflow: hidden; transition: border-color .15s; }
.card:hover { border-color: var(--border); }
.card-head { padding: 16px 20px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card-title { font-size: var(--fs-md); font-weight: 600; letter-spacing: -0.2px; color: var(--text); }
.card-body { padding: 20px; }
.card-body.no-pad { padding: 0; }

.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
.metric { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 18px; transition: border-color .15s; }
.metric:hover { border-color: var(--border); }
.metric-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }
.metric-value { font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -1.2px; font-variant-numeric: tabular-nums; color: var(--text); }
.metric-trend { font-size: var(--fs-xs); color: var(--text-muted); margin-top: 8px; font-weight: 500; }
.metric.accent .metric-value { color: var(--accent); }
.metric.success .metric-value { color: var(--status-done); }
.metric.warning .metric-value { color: var(--status-doing); }
.metric.danger .metric-value { color: var(--status-blocked); }

.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; font-size: var(--fs-base); }
.tbl thead th { color: var(--text-muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; padding: 10px 16px; text-align: left; border-bottom: 1px solid var(--border-light); white-space: nowrap; background: var(--card-bg); }
.tbl tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
.tbl tbody tr { transition: background-color .12s; }
.tbl tbody tr:hover td { background: var(--hover-bg); }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl td.center, .tbl th.center { text-align: center; }

.code { display: inline-block; font-family: 'SF Mono', Menlo, monospace; font-size: 10px; font-weight: 600; background: #F0F0EE; padding: 2px 7px; border-radius: 4px; }

.cbox { width: 18px; height: 18px; border: 1.5px solid var(--border); border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; background: var(--card-bg); flex-shrink: 0; vertical-align: middle; cursor: pointer; transition: all .15s; }
.cbox:hover { border-color: var(--text-muted); }
.cbox.checked { background: var(--accent); border-color: var(--accent); }
.cbox.checked::after { content: ''; width: 10px; height: 10px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2 6.5l2.5 2.5L10 3.5' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat center / contain; }
.cbox.lg { width: 22px; height: 22px; border-radius: 5px; }
.cbox.lg.checked::after { width: 13px; height: 13px; }
.cbox[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); font-weight: 500; padding: 3px 9px; border-radius: 12px; white-space: nowrap; height: 22px; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.pill.pending { background: rgba(21, 101, 192, .08); color: var(--status-todo); }
.pill.doing { background: rgba(245, 124, 0, .1); color: var(--status-doing); }
.pill.done { background: rgba(46, 125, 50, .1); color: var(--status-done); }
.pill.blocked { background: rgba(198, 40, 40, .1); color: var(--status-blocked); }
.pill.na { background: var(--hover-bg); color: var(--text-muted); }
[data-theme="dark"] .pill.pending { background: rgba(21, 101, 192, .15); color: #5FA8E0; }
[data-theme="dark"] .pill.doing { background: rgba(245, 124, 0, .15); color: #F5A742; }
[data-theme="dark"] .pill.done { background: rgba(46, 125, 50, .15); color: #5FBE7F; }

.prio { display: inline-flex; align-items: center; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.4px; height: 18px; }
.prio.alta { background: rgba(198, 40, 40, .08); color: var(--status-blocked); }
.prio.media { background: rgba(245, 124, 0, .08); color: var(--status-doing); }
.prio.baixa { background: var(--hover-bg); color: var(--text-muted); }
select.pill { cursor: pointer; padding-right: 22px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 12 12'><path d='M3 4.5L6 7.5L9 4.5' stroke='currentColor' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>"); background-repeat: no-repeat; background-position: right 6px center; appearance: none; }

.prio { display: inline-flex; align-items: center; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.4px; height: 18px; }
.type-bdg { display: inline-flex; align-items: center; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
.type-bdg.diaria { background: rgba(232, 86, 26, .08); color: var(--accent); }
.type-bdg.semanal { background: rgba(46, 125, 50, .08); color: var(--status-done); }
.type-bdg.mensal { background: rgba(123, 31, 162, .08); color: #7B1FA2; }
.type-bdg.projeto { background: rgba(15, 110, 86, .08); color: #0F6E56; }
.area-tag { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 4px; background: var(--hover-bg); color: var(--text-muted); white-space: nowrap; }

/* ===== MEU DIA — design ultra minimalista (Things 3 style) ===== */
.meudia-hero { background: transparent; color: var(--text); padding: 0 0 28px; margin-bottom: 8px; position: relative; }
.meudia-hero::before { display: none; }
.meudia-hello { font-size: var(--fs-base); font-weight: 500; color: var(--text-muted); margin-bottom: 4px; }
.meudia-name { font-size: var(--fs-display); font-weight: 700; letter-spacing: -1.4px; margin-bottom: 6px; line-height: 1.05; color: var(--text); }
.meudia-date { font-size: var(--fs-md); color: var(--text-muted); font-weight: 400; }
.meudia-progress { display: flex; align-items: center; gap: 14px; margin-top: 24px; max-width: 480px; }
.meudia-progress-bar { flex: 1; height: 4px; background: var(--border-light); border-radius: 2px; overflow: hidden; }
.meudia-progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .8s ease-out; }
.meudia-progress-text { font-size: var(--fs-sm); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-muted); }

.meudia-task-item { display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border-light); transition: background .12s; cursor: pointer; }
.meudia-task-item:last-child { border-bottom: none; }
.meudia-task-item:hover .meudia-task-arrow { opacity: 1; transform: translateX(0); }
.meudia-task-item.done { opacity: .5; }
.meudia-task-item.done .meudia-task-title { text-decoration: line-through; }
.meudia-task-info { flex: 1; min-width: 0; }
.meudia-task-title { font-size: var(--fs-md); font-weight: 500; line-height: 1.4; margin-bottom: 6px; color: var(--text); }
.meudia-task-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.meudia-task-arrow { opacity: 0; transition: all .15s; color: var(--text-subtle); transform: translateX(-4px); }
.meudia-task-arrow { color: #C8C8C8; align-self: center; }

/* ===== CALENDAR ===== */
.cal-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 0 20px 8px; }
.cal-dh { font-size: 11px; font-weight: 500; color: #6B6B6B; text-align: center; padding: 4px 0; text-transform: uppercase; letter-spacing: 0.5px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 0 20px 20px; }
.cal-day { min-height: 100px; background: #fff; border: 1px solid #E5E5E5; border-radius: 8px; padding: 8px; cursor: pointer; transition: all .15s; overflow: hidden; }
.cal-day:hover { border-color: #0A0A0A; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.cal-day.empty { background: transparent; border-color: transparent; cursor: default; }
.cal-day.weekend { background: #F7F7F5; }
.cal-day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cal-day-num { font-size: 13px; font-weight: 600; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.cal-day.weekend .cal-day-num { color: #6B6B6B; }
.cal-day.today .cal-day-num { color: var(--accent); font-weight: 700; }
.cal-bdg { display: block; font-size: 10px; font-weight: 500; padding: 1px 5px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-bdg.done { background: #E8F2EA; color: #2D7A3E; }
.cal-bdg.pending { background: #F0F0EE; color: #404040; }
.cal-bdg.weekly { background: #E8EFF5; color: #1E3A5F; }
.cal-bdg.monthly { background: #EFE8F0; color: #4A1F4F; }
.cal-bdg.project { background: #E5F2EE; color: #0F6E56; }
.month-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.month-nav-label { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; min-width: 140px; }

/* ===== KANBAN ===== */
.kanban { display: flex; gap: 12px; overflow-x: auto; padding: 4px 4px 12px; }
.kb-col { flex: 0 0 290px; background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 12px; max-height: calc(100vh - 220px); overflow-y: auto; transition: all .15s; }
.kb-col.drag-over { background: var(--accent-soft); border-color: var(--accent); }
.kb-col-head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 14px; font-size: var(--fs-sm); font-weight: 600; letter-spacing: -0.2px; color: var(--text); }
.kb-col-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.kb-col[data-status="A fazer"] .kb-col-dot { background: var(--status-todo); }
.kb-col[data-status="Em andamento"] .kb-col-dot { background: var(--status-doing); }
.kb-col[data-status="Concluído"] .kb-col-dot { background: var(--status-done); }
.kb-count { margin-left: auto; background: var(--hover-bg); font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; color: var(--text-muted); }
.kb-card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; cursor: grab; transition: all .12s; }
.kb-card:hover { border-color: var(--text-subtle); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.kb-card.dragging { opacity: .4; cursor: grabbing; }
.kb-card-top { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
.kb-card-title { font-size: var(--fs-base); font-weight: 500; line-height: 1.4; margin-bottom: 8px; color: var(--text); }
.kb-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: var(--fs-xs); color: var(--text-muted); }

/* ===== PROJECTS ===== */
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.proj-card { background: #fff; border: 1px solid #E5E5E5; border-radius: 10px; padding: 16px 20px; cursor: pointer; transition: all .18s; }
.proj-card:hover { border-color: #C8C8C8; box-shadow: 0 2px 8px rgba(0,0,0,.06); transform: translateY(-1px); }
.proj-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.proj-name { font-size: 14px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.3; }
.proj-desc { font-size: 13px; color: #6B6B6B; margin-bottom: 12px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.proj-meta { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.proj-prog-info { display: flex; justify-content: space-between; font-size: 11px; color: #6B6B6B; margin-bottom: 4px; }
.proj-prog-info strong { color: #0A0A0A; font-weight: 600; }
.prog-bar { height: 4px; background: #F0F0EE; border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; background: #0A0A0A; border-radius: 2px; transition: width .4s; }
.prog-fill.green { background: #2D7A3E; }
.prog-fill.amber { background: #B86E00; }
.proj-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; margin-top: 12px; border-top: 1px solid #F0F0EE; font-size: 11px; color: #6B6B6B; }

.milestone-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: #FAFAF8; border-radius: 8px; margin-bottom: 6px; border: 1px solid #F0F0EE; }
.milestone-row.done { background: #E8F2EA; border-color: #C7E2CC; }
.milestone-info { flex: 1; min-width: 0; }
.milestone-name { font-size: 13px; font-weight: 500; }
.milestone-date { font-size: 11px; color: #6B6B6B; margin-top: 2px; }

/* ===== MODAL ===== */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn .15s; overflow-y: auto; backdrop-filter: blur(4px); }
.modal { background: var(--card-bg); border-radius: var(--radius-lg); width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; animation: pop .2s cubic-bezier(.18,.89,.32,1.28); box-shadow: var(--shadow-lg); border: 1px solid var(--border-light); }
.modal.lg { max-width: 680px; }
.modal.xl { max-width: 880px; }
.modal-head { padding: 20px 24px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; background: var(--card-bg); z-index: 10; }
.modal-title { font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.3px; color: var(--text); }
.modal-close { width: 28px; height: 28px; border-radius: 50%; background: var(--hover-bg); display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; flex-shrink: 0; transition: all .12s; }
.modal-close:hover { background: var(--border); color: var(--text); }
.modal-body { padding: 20px 24px; }
.modal-foot { padding: 14px 24px; border-top: 1px solid var(--border-light); display: flex; gap: 8px; justify-content: flex-end; background: var(--card-bg); border-radius: 0 0 var(--radius-lg) var(--radius-lg); position: sticky; bottom: 0; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

/* ===== USERS ===== */
.user-row { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 16px 20px; display: flex; align-items: center; gap: 16px; margin-bottom: 8px; transition: border-color .12s; }
.user-row:hover { border-color: var(--border); }
.user-row-info { flex: 1; min-width: 0; }
.user-row-name { font-size: var(--fs-md); font-weight: 600; color: var(--text); }
.user-row-email { font-size: var(--fs-sm); color: var(--text-muted); }
.user-row-areas { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.role-tag { font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 4px; letter-spacing: 0.4px; text-transform: uppercase; }
.role-tag.admin { background: var(--text); color: var(--card-bg); }
.role-tag.user { background: var(--hover-bg); color: var(--text-2); }

/* ===== ACTIVITY ===== */
.activity-row { display: flex; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border-light); transition: background .12s; }
.activity-row:last-child { border-bottom: none; }
.activity-row:hover { background: var(--hover-bg); }
.activity-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--hover-bg); display: flex; align-items: center; justify-content: center; color: var(--text-muted); flex-shrink: 0; }
.activity-icon svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; }
.activity-content { flex: 1; min-width: 0; }
.activity-text { font-size: var(--fs-base); line-height: 1.5; color: var(--text-2); }
.activity-text strong { font-weight: 600; color: var(--text); }
.activity-time { font-size: var(--fs-xs); color: var(--text-subtle); margin-top: 3px; }

/* ===== TOAST — refinado (Things style) ===== */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: var(--card-bg); padding: 12px 18px; border-radius: var(--radius-md); font-size: var(--fs-base); font-weight: 500; z-index: 9999; transform: translateY(60px); opacity: 0; transition: all .2s cubic-bezier(.18,.89,.32,1.28); pointer-events: none; box-shadow: var(--shadow-lg); max-width: 380px; letter-spacing: -0.01em; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: var(--status-done); color: #fff; }
.toast.error { background: var(--status-blocked); color: #fff; }

/* ===== CHARTS ===== */
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
@media (max-width: 800px) { .chart-grid { grid-template-columns: 1fr; } }
.bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.bar-label { font-size: var(--fs-xs); color: var(--text-muted); width: 80px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.bar-track { flex: 1; height: 5px; background: var(--border-light); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; background: var(--text); transition: width .6s; }
.bar-fill.accent { background: var(--accent); }
.bar-fill.green { background: var(--status-done); }
.bar-fill.amber { background: var(--status-doing); }
.bar-val { font-size: var(--fs-xs); font-weight: 600; width: 40px; font-variant-numeric: tabular-nums; color: var(--text); text-align: right; }

.heatmap { display: grid; grid-template-columns: repeat(31, 1fr); gap: 2px; max-width: 100%; overflow-x: auto; padding: 4px 0; }
.heatmap-cell { aspect-ratio: 1; min-width: 14px; border-radius: 2px; background: var(--border-light); cursor: pointer; transition: transform .1s; }
.heatmap-cell:hover { transform: scale(1.3); z-index: 5; }
.heatmap-cell.l1 { background: rgba(232, 86, 26, .25); }
.heatmap-cell.l2 { background: rgba(232, 86, 26, .5); }
.heatmap-cell.l3 { background: rgba(232, 86, 26, .75); }
.heatmap-cell.l4 { background: var(--accent); }
.heatmap-legend { display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); color: var(--text-muted); margin-top: 8px; }
.heatmap-legend-cells { display: flex; gap: 2px; }
.heatmap-legend-cells span { width: 11px; height: 11px; border-radius: 2px; }

/* ===== FILTERS ===== */
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.filters-label { font-size: 11px; font-weight: 500; color: #6B6B6B; text-transform: uppercase; letter-spacing: 0.4px; margin-right: 4px; }

/* ===== COLOR PICKER ===== */
.color-grid { display: flex; gap: 6px; flex-wrap: wrap; }
.color-opt { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; transition: all .15s; border: 2px solid transparent; }
.color-opt:hover { transform: scale(1.1); }
.color-opt.selected { border-color: #0A0A0A; box-shadow: 0 0 0 2px #fff inset; }

/* ===== AREA SELECTOR ===== */
.area-selector { display: flex; flex-wrap: wrap; gap: 6px; }
.area-chip { display: inline-flex; align-items: center; padding: 5px 12px; border-radius: 16px; background: #F7F7F5; border: 1px solid #E5E5E5; font-size: 12px; font-weight: 500; cursor: pointer; transition: all .15s; user-select: none; }
.area-chip:hover { border-color: #C8C8C8; }
.area-chip.selected { background: #0A0A0A; color: #fff; border-color: #0A0A0A; }

/* ===== COMMENTS ===== */
.comment { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid #F0F0EE; }
.comment:last-child { border-bottom: none; }
.comment-content { flex: 1; min-width: 0; }
.comment-head { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.comment-author { font-size: 13px; font-weight: 600; }
.comment-time { font-size: 11px; color: #6B6B6B; }
.comment-body { font-size: 13px; color: #404040; line-height: 1.5; white-space: pre-wrap; }

/* ===== DAY DETAIL ===== */
.day-task-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F0F0EE; }
.day-task-row:last-child { border-bottom: none; }
.day-task-info { flex: 1; min-width: 0; }
.day-task-title { font-size: 13px; font-weight: 500; margin-bottom: 4px; line-height: 1.4; }
.day-task-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11px; color: #6B6B6B; }

/* ===== AREA LIST ===== */
.area-list { display: flex; flex-direction: column; gap: 8px; }
.area-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #F7F7F5; border-radius: 8px; border: 1px solid #F0F0EE; }
.area-item-name { flex: 1; font-size: 13px; font-weight: 500; }

/* ===== EMPTY ===== */
.empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-icon { width: 56px; height: 56px; margin: 0 auto 18px; background: var(--hover-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-subtle); font-size: 22px; }
.empty-icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.5; }
.empty-title { font-size: var(--fs-md); font-weight: 600; color: var(--text); margin-bottom: 6px; }
.empty-text { font-size: var(--fs-base); color: var(--text-muted); }

/* ===== INLINE EDIT ===== */
.ed { border: 1px solid transparent; border-radius: 4px; padding: 4px 8px; background: transparent; font-size: var(--fs-base); color: var(--text); width: 100%; min-width: 80px; font-family: inherit; transition: all .12s; }
.ed:hover { background: var(--hover-bg); }
.ed:focus { outline: none; background: var(--card-bg); border-color: var(--border); }
select.ed { cursor: pointer; }

/* ===== SUBTASK ===== */
.sub-list { display: flex; flex-direction: column; gap: 6px; }
.sub-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #FAFAF8; border-radius: 6px; border: 1px solid #F0F0EE; }
.sub-row.done { opacity: .55; }
.sub-row.done .sub-text { text-decoration: line-through; }
.sub-text { flex: 1; font-size: 13px; }
.sub-input-row { display: flex; gap: 6px; margin-top: 8px; }
.sub-input-row input { flex: 1; height: 32px; border: 1px solid #E5E5E5; border-radius: 6px; padding: 0 10px; font-size: 12px; }
.sub-input-row input:focus { outline: none; border-color: #0A0A0A; }

/* ===== ACCESS DENIED ===== */
.access-denied { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; text-align: center; color: #6B6B6B; }
.access-denied-icon { width: 72px; height: 72px; background: #FAEDED; color: #B33A3A; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
.access-denied-icon svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 1.5; }
.access-denied-title { font-size: 18px; font-weight: 700; color: #0A0A0A; margin-bottom: 8px; }
.access-denied-text { font-size: 13px; max-width: 400px; line-height: 1.6; }

/* ===== RESPONSIVE ===== */
@media (max-width: 960px) {
  .app.active { grid-template-columns: 56px 1fr; }
  .side-brand-text, .side-user-info, .side-section-title, .side-link span:not(.icon),
  .side-link .badge, .side-foot button span { display: none; }
  .side-link { justify-content: center; padding: 8px; }
  .side-user { justify-content: center; padding: 12px; }
  .side-brand { padding: 12px; justify-content: center; }
  .search { width: 200px; }
  .chart-grid { grid-template-columns: 1fr; }
  .field-row, .field-row-3 { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .search { display: none; }
  .topbar { padding: 0 16px; }
  .content { padding: 16px; }
  .metrics { grid-template-columns: 1fr 1fr; }
  .page-title { font-size: 20px; }
  .meudia-name { font-size: 22px; }
  .meudia-hero { padding: 20px; }
}

/* ===== V6: Modal Tabs ===== */
.modal-tabs { display: flex; border-bottom: 1px solid var(--border-light); padding: 0 24px; gap: 4px; background: var(--card-bg); }
.modal-tab { padding: 12px 16px; font-size: 13px; font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent; transition: all .15s; }
.modal-tab:hover { color: var(--text); }
.modal-tab.active { color: var(--text); border-bottom-color: var(--accent); }
.modal-tab-content { display: none; }
.modal-tab-content.active { display: block; }

/* ===== V6: Permissões (toggle switches) ===== */
.perm-list { display: flex; flex-direction: column; gap: 10px; }
.perm-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: var(--hover-bg); border-radius: 8px; border: 1px solid var(--border-light); }
.perm-toggle { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; margin-top: 2px; }
.perm-toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.perm-toggle-track { position: absolute; inset: 0; background: #C8C8C8; border-radius: 20px; transition: .2s; cursor: pointer; }
.perm-toggle-track::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; background: white; border-radius: 50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.perm-toggle input:checked + .perm-toggle-track { background: var(--accent); }
.perm-toggle input:checked + .perm-toggle-track::after { transform: translateX(16px); }
.perm-info { flex: 1; }
.perm-label { font-size: 13px; font-weight: 600; color: var(--text); }
.perm-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }

/* ===== V6: Tags (chips) ===== */
.tag-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 3px 8px; border-radius: 10px; background: var(--border-light); color: #404040; margin: 0; font-weight: 500; }
[data-theme="dark"] .tag-chip { background: var(--hover-bg); color: var(--text); }
.tag-rm { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 0; line-height: 1; margin-left: 2px; }
.tag-rm:hover { color: #B33A3A; }
.tag-list { display: flex; flex-wrap: wrap; gap: 4px; min-height: 26px; padding: 4px; background: var(--hover-bg); border-radius: 6px; border: 1px dashed var(--border); }
.tag-list:empty::before { content: 'Nenhuma tag — adicione abaixo'; color: var(--text-muted); font-size: 11px; padding: 4px 8px; }

/* ===== V6: Links ===== */
.link-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--hover-bg); border-radius: 6px; border: 1px solid var(--border-light); margin-bottom: 4px; transition: background .15s; }
.link-row:hover { background: var(--border-light); }

/* ===== V6: Avatar ===== */
.avatar-preview { width: 64px; height: 64px; border-radius: 50%; background-size: cover; background-position: center; flex-shrink: 0; }
.avatar-large { width: 96px; height: 96px; border-radius: 50%; background-size: cover; background-position: center; flex-shrink: 0; box-shadow: 0 4px 12px rgba(0,0,0,.08); }

/* ===== V6: Áreas com cor/emoji ===== */
.area-color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(0,0,0,.05); }

/* ===== V6: Emoji selector ===== */
.emoji-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; }
@media (max-width: 600px) { .emoji-grid { grid-template-columns: repeat(8, 1fr); } }
.emoji-opt { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; border-radius: 6px; border: 2px solid transparent; transition: all .12s; user-select: none; }
.emoji-opt:hover { background: var(--hover-bg); }
.emoji-opt.selected { border-color: var(--accent); background: var(--card-bg); }

/* ===== V6: Drag and drop ===== */
.drag-over-row td { border-top: 2px solid var(--accent) !important; }

/* ===== V6: btn-primary usa --accent quando customizado em algumas telas ===== */
.btn-sm { padding: 6px 10px; font-size: 12px; height: auto; }

/* ===== V7: Campanhas ===== */
.camp-card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 10px; padding: 16px; margin-bottom: 12px; transition: all .15s; }
.camp-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); transform: translateY(-1px); }
.camp-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.camp-card-name { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
.camp-card-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
.camp-card-meta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 12px; color: var(--text-muted); }
.camp-meta-item { display: flex; align-items: center; gap: 4px; }

// === BULK ASSIGN — Atribuição em massa otimizada (V8.5.1) ===
// Usa UPSERT real porque o banco tem UNIQUE (month_key, day, task_code)
window.sbBulkAssign = async function(items) {
  if (!window.sb || !items || items.length === 0) return { ok: 0, fail: 0 };

  // Preparar payload
  var payloads = items.map(function(item) {
    return {
      month_key: item.monthKey,
      day: item.day,
      task_code: item.code,
      status: item.status || 'A fazer',
      assignee_id: toUuid(item.assigneeId),
      notes: item.notes || '',
      comments: item.comments || [],
      subtasks: item.subtasks || [],
      completed_at: item.completedAt ? new Date(item.completedAt).toISOString() : null,
      completed_by: toUuid(item.completedBy)
    };
  });

  var ok = 0, fail = 0;
  // Quebrar em chunks de 100 (Supabase aceita até 1000 por request, mas 100 é seguro)
  var CHUNK = 100;
  for (var i = 0; i < payloads.length; i += CHUNK) {
    var chunk = payloads.slice(i, i + CHUNK);
    try {
      var r = await window.sb.from('malba_task_instances')
        .upsert(chunk, { onConflict: 'month_key,day,task_code' });
      if (r.error) {
        console.error('[MALBA] bulk upsert error:', r.error, 'chunk:', chunk.length);
        fail += chunk.length;
      } else {
        ok += chunk.length;
      }
    } catch(e) {
      console.error('[MALBA] bulk upsert exception:', e);
      fail += chunk.length;
    }
  }

  return { ok: ok, fail: fail };
};

// === REALTIME ===
window.sbSubscribe = function() {
  if (!window.sb || window.sbChannel) return;

  // V9.0: Notificação visual de mudanças remotas (sem bloquear nada)
  function refresh(payload) {
    // Detectar mudanças de OUTROS usuários para mostrar toast
    if (payload && payload.new && typeof toast === 'function' && window.state.user) {
      var changeBy = payload.new.completed_by || payload.new.assignee_id;
      var isFromOther = changeBy && changeBy !== window.state.user.id;
      if (isFromOther && typeof getUser === 'function') {
        // Tarefa concluída
        if (payload.new.status === 'Concluído' && payload.new.completed_at && payload.eventType === 'UPDATE') {
          var u = getUser(payload.new.completed_by);
          if (u) toast('✓ ' + u.name.split(' ')[0] + ' concluiu uma tarefa', 'success');
        }
        // Para admin: avisa quando alguém pega tarefa
        else if (window.state.user.role === 'admin' && payload.eventType === 'INSERT' && payload.new.assignee_id) {
          var u2 = getUser(payload.new.assignee_id);
          if (u2 && u2.id !== window.state.user.id) {
            // Não toast — silencioso, evita spam
          }
        }
      }
    }
    window.sbReloadAndRender();
  }

  window.sbChannel = window.sb.channel('malba_changes_' + Math.random().toString(36).slice(2,8))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'malba_task_instances' }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'malba_task_templates' }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'malba_users' }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'malba_projects' }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'malba_project_milestones' }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'malba_campaigns' }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'malba_campaign_instances' }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'malba_settings' }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'malba_one_time_tasks' }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'malba_one_time_instances' }, refresh)
    .subscribe(function(status) {
      console.log('[MALBA] Realtime:', status);
      if (status === 'SUBSCRIBED') {
        window.sbConnected = true;
        if (typeof renderShell === 'function' && window.state.user) renderShell();
      }
    });

  if (window.state.user) {
    window.sbPresence = window.sb.channel('malba_presence', {
      config: { presence: { key: window.state.user.id } }
    });
    window.sbPresence
      .on('presence', { event: 'sync' }, function() {
        var st = window.sbPresence.presenceState();
        window.sbOnlineUsers = Object.keys(st);
      })
      .subscribe(async function(status) {
        if (status === 'SUBSCRIBED') {
          await window.sbPresence.track({
            userId: window.state.user.id,
            name: window.state.user.name,
            online_at: new Date().toISOString()
          });
        }
      });
  }
};

var _reloadTimer = null;
window.sbLastUserAction = 0;
window.sbReloadAndRender = function() {
  // V9.0: SEM BLOQUEIO! Apenas debounce inteligente.
  // O sbLastUserAction agora apenas DEBOUNCES (junta múltiplas mudanças)
  // mas NÃO bloqueia o realtime de outros usuários.
  if (window.sbSyncing) return;
  if (_reloadTimer) clearTimeout(_reloadTimer);
  _reloadTimer = setTimeout(async function() {
    window.sbSyncing = true;
    try {
      await window.sbLoad();
      if (typeof applyTheme === 'function') applyTheme();
      // Preservar modais abertos
      var hasOpenModal = document.getElementById('modalBg');
      if (typeof renderShell === 'function' && window.state.user && !hasOpenModal) renderShell();
      if (typeof renderPage === 'function' && window.state.user && !hasOpenModal) renderPage();
    } finally {
      window.sbSyncing = false;
    }
  }, 300); // V9.0: debounce reduzido para 300ms (resposta mais rápida)
};

// ===== UTILS =====
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function fmtDate(t) { if (!t) return '-'; var d = new Date(t); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtShort(t) { if (!t) return '-'; var d = new Date(t); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); }
function fmtISOToBR(iso) {
  if (!iso) return '';
  var p = iso.split('-');
  if (p.length !== 3) return iso;
  return p[2] + '/' + p[1] + '/' + p[0];
}
function timeAgo(t) {
  if (!t) return '';
  var diff = Date.now() - t;
  var min = Math.floor(diff / 60000);
  var hr = Math.floor(min / 60);
  var day = Math.floor(hr / 24);
  if (min < 1) return 'agora';
  if (min < 60) return 'há ' + min + ' min';
  if (hr < 24) return 'há ' + hr + 'h';
  if (day < 7) return 'há ' + day + ' dia' + (day > 1 ? 's' : '');
  return fmtShort(t);
}
function getInitials(name) {
  if (!name) return '??';
  var p = name.trim().split(/\s+/);
  if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
  return (p[0][0] + p[p.length - 1][0]).toUpperCase();
}
function genId(prefix) { return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7); }
function genUUID() {
  // RFC4122 v4 simples
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    var r = Math.random() * 16 | 0;
    var v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

// ===== STORAGE =====
function load() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var d = JSON.parse(raw);
      if (d.users) state.users = d.users;
      if (d.tpl) state.tpl = d.tpl;
      if (d.inst) state.inst = d.inst;
      if (d.projects) state.projects = d.projects;
      if (d.projInst) state.projInst = d.projInst;
      if (d.campaigns) state.campaigns = d.campaigns;
      if (d.campInst) state.campInst = d.campInst;
      if (d.activity) state.activity = d.activity;
      if (d.settings) state.settings = d.settings;
    } else {
      // Tentar importar de versões anteriores (v6 ou v5)
      var prevRaw = localStorage.getItem('malba_v8') || localStorage.getItem('malba_v7') || localStorage.getItem('malba_v6') || localStorage.getItem('malba_v5');
      if (prevRaw) {
        try {
          var prev = JSON.parse(prevRaw);
          if (prev.users) state.users = prev.users;
          if (prev.tpl) state.tpl = prev.tpl;
          if (prev.inst) state.inst = prev.inst;
          if (prev.projects) state.projects = prev.projects;
          if (prev.projInst) state.projInst = prev.projInst;
          if (prev.activity) state.activity = prev.activity;
          if (prev.settings) state.settings = prev.settings;
          if (prev.campaigns) state.campaigns = prev.campaigns;
          console.log('Dados migrados de versão anterior');
        } catch(e) {}
      }
    }
  } catch(e) { console.warn('Erro ao ler localStorage:', e); }

  if (!state.users || state.users.length === 0) state.users = JSON.parse(JSON.stringify(DEFAULT_USERS));
  if (!state.tpl || !state.tpl.diarias || state.tpl.diarias.length === 0) state.tpl = JSON.parse(JSON.stringify(DEFAULT_TASKS));
  if (!state.campaigns) state.campaigns = [];
  if (!state.campInst) state.campInst = {};
  if (!state.settings) state.settings = {};
  if (!state.settings.areas) state.settings.areas = JSON.parse(JSON.stringify(DEFAULT_AREAS));
  if (!state.settings.company) state.settings.company = { name: 'MALBA', tagline: 'Embalagens', logo: '', primaryColor: '#E8561A', tagline2: 'Sistema de Gestão Operacional 2026' };
  if (!state.settings.theme) state.settings.theme = 'light';

  // Migração: áreas em string viram objetos
  for (var ai = 0; ai < state.settings.areas.length; ai++) {
    if (typeof state.settings.areas[ai] === 'string') {
      var name = state.settings.areas[ai];
      var def = null;
      for (var di = 0; di < DEFAULT_AREAS.length; di++) {
        if (DEFAULT_AREAS[di].name === name) { def = DEFAULT_AREAS[di]; break; }
      }
      state.settings.areas[ai] = def ? { name: name, color: def.color, emoji: def.emoji } : { name: name, color: '#6B6B6B', emoji: '📁' };
    }
  }

  // Migração: users
  for (var i = 0; i < state.users.length; i++) {
    var u = state.users[i];
    if (!u.areas) u.areas = [];
    if (u.phone === undefined) u.phone = '';
    if (u.position === undefined) u.position = '';
    if (u.bio === undefined) u.bio = '';
    if (u.avatar === undefined) u.avatar = '';
    if (u.permissions === undefined) u.permissions = null;
    if (u.dailyGoal === undefined) u.dailyGoal = 5;
  }

  // Migração: instâncias
  for (var k in state.inst) {
    if (state.inst.hasOwnProperty(k) && !state.inst[k].subtasks) state.inst[k].subtasks = [];
  }

  // Migração: tarefas template
  function migTpl(arr) {
    for (var ti = 0; ti < arr.length; ti++) {
      if (!arr[ti].desc) arr[ti].desc = '';
      if (!arr[ti].tags) arr[ti].tags = [];
      if (!arr[ti].links) arr[ti].links = [];
    }
  }
  migTpl(state.tpl.diarias);
  migTpl(state.tpl.semanais);
  migTpl(state.tpl.mensais);

  // Aplicar tema
  applyTheme();
}

function applyTheme() {
  if (typeof document !== 'undefined' && document.documentElement) {
    document.documentElement.setAttribute('data-theme', state.settings.theme || 'light');
    if (state.settings.company && state.settings.company.primaryColor) {
      document.documentElement.style.setProperty('--accent', state.settings.company.primaryColor);
    }
  }
}

// V8: save local e marca que precisa sync. Sync é feito com chamadas específicas
// pelos handlers (supaUpdate*, supaCreate*, etc).
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      users: state.users, tpl: state.tpl, inst: state.inst,
      projects: state.projects, projInst: state.projInst,
      campaigns: state.campaigns, campInst: state.campInst,
      activity: state.activity.slice(-500), settings: state.settings,
      _cachedAt: Date.now()
    }));
  } catch(e) { console.warn('Erro ao salvar cache local:', e); }
}

function loadSession() {
  try {
    var s = sessionStorage.getItem(SESSION_KEY);
    if (s) {
      var id = JSON.parse(s).userId;
      var u = null;
      for (var i = 0; i < state.users.length; i++) if (state.users[i].id === id) { u = state.users[i]; break; }
      if (u) state.user = u;
    }
  } catch(e) { console.warn('Erro session:', e); }
}

// ===== AUTH =====
function login(email, password) {
  var em = (email || '').toLowerCase().trim();
  var pw = password || '';
  for (var i = 0; i < state.users.length; i++) {
    var u = state.users[i];
    if (u.email.toLowerCase() === em && u.password === pw) {
      state.user = u;
      try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ userId: u.id })); } catch(e) {}
      logActivity('login', 'fez login no sistema');
      // Define página inicial conforme role
      state.ui.page = u.role === 'admin' ? 'dashboard' : 'meudia';
      state.ui.scope = u.role === 'admin' ? 'tudo' : 'meu';
      return true;
    }

// ===== PERMISSIONS (CORE!) =====
// canManage: criar/editar/excluir entidades estruturais (templates, projetos, usuários, áreas)
function canManage() { return isAdmin(); }
// V8.8: Apenas admin pode excluir tarefas, projetos, campanhas, tarefas pontuais
function canDelete() { return isAdmin(); }

// canViewPage: verifica se o usuário pode ver uma página específica
function canViewPage(pageKey) {
  if (!state.user) return false;
  // Admin sempre vê tudo
  if (isAdmin()) return true;
  // Se a página é admin-only, bloqueia
  for (var i = 0; i < PAGE_PERMISSIONS.length; i++) {
    if (PAGE_PERMISSIONS[i].key === pageKey) {
      if (PAGE_PERMISSIONS[i].adminOnly) return false;
      // Permissão custom?
      if (state.user.permissions && state.user.permissions[pageKey] !== undefined) {
        return !!state.user.permissions[pageKey];
      }
      return PAGE_PERMISSIONS[i].defaultUser;
    }
  }
  return false;
}

// canEditTask: pode mudar status/responsável/comentários/subtasks de uma tarefa
function canEditTask(taskInst, taskTpl) {
  if (!state.user) return false;
  if (isAdmin()) return true;
  // user comum: pode interagir se for responsável OU se a tarefa pertence à sua área
  if (taskInst && taskInst.assigneeId === state.user.id) return true;
  if (taskTpl && taskTpl.area && state.user.areas && state.user.areas.indexOf(taskTpl.area) !== -1) return true;
  return false;
}

// canViewTask: pode ver a tarefa? Filtra na renderização
function canViewTask(taskInst, taskTpl) {
  if (!state.user) return false;

  // Admin com scope='tudo' vê absolutamente tudo
  if (isAdmin() && state.ui.scope === 'tudo') return true;

  // Identifica responsável efetivo (instância OU padrão do template)
  var effectiveAssignee = (taskInst && taskInst.assigneeId) || (taskTpl && taskTpl.defaultAssigneeId);

  // Admin com scope='meu': vê tarefas dele OU sem responsável
  if (isAdmin() && state.ui.scope === 'meu') {
    if (!effectiveAssignee) return true; // sem responsável = visível
    if (effectiveAssignee === state.user.id) return true;
    return false;
  }

  // Usuário comum: vê tarefas atribuídas a ele (instância OU padrão do template)
  if (effectiveAssignee === state.user.id) return true;

  // OU tarefas da área dele que não foram atribuídas a outro
  if (taskTpl && taskTpl.area && state.user.areas && state.user.areas.indexOf(taskTpl.area) !== -1) {
    if (!effectiveAssignee || effectiveAssignee === state.user.id) return true;
  }
  return false;
}

// canViewProject: similar
function canViewProject(project) {
  if (!state.user) return false;
  if (isAdmin()) return true;
  if (project.responsibleId === state.user.id) return true;
  if (project.area && state.user.areas && state.user.areas.indexOf(project.area) !== -1) return true;
  // se há etapas atribuídas a este user, ver
  if (project.milestones) {
    for (var i = 0; i < project.milestones.length; i++) {
      var pi = peekProjInst(project.id, project.milestones[i].id);
      if (pi.assigneeId === state.user.id) return true;
    }
  }
  return false;
}

// ===== TASK INSTANCES =====
function instKey(month, day, code) { return month + '|' + day + '|' + code; }
function getInst(month, day, code) {
  var k = instKey(month, day, code);
  if (!state.inst[k]) {
    // Verificar se template tem responsável padrão
    var tpl = getTaskTpl(code);
    var defaultAssignee = tpl && tpl.defaultAssigneeId ? tpl.defaultAssigneeId : null;
    state.inst[k] = { status: 'A fazer', assigneeId: defaultAssignee, notes: '', comments: [], subtasks: [], completedAt: null, completedBy: null };
  }
  if (!state.inst[k].subtasks) state.inst[k].subtasks = [];
  if (!state.inst[k].comments) state.inst[k].comments = [];
  // Se ainda sem responsável e o template tem padrão, atribuir
  if (!state.inst[k].assigneeId) {
    var tpl2 = getTaskTpl(code);
    if (tpl2 && tpl2.defaultAssigneeId) state.inst[k].assigneeId = tpl2.defaultAssigneeId;
  }
  return state.inst[k];
}
function peekInst(month, day, code) {
  var k = instKey(month, day, code);
  if (state.inst[k]) return state.inst[k];
  // Para peekInst também aplicamos o responsável padrão (read-only)
  var tpl = getTaskTpl(code);
  var defaultAssignee = tpl && tpl.defaultAssigneeId ? tpl.defaultAssigneeId : null;
  return { status: 'A fazer', assigneeId: defaultAssignee, notes: '', comments: [], subtasks: [], completedAt: null, completedBy: null };
}
function setTask(month, day, code, field, value) {
  var inst = getInst(month, day, code);
  var oldValue = inst[field];
  inst[field] = value;
  if (field === 'status') {
    if (value === 'Concluído') {
      inst.completedAt = Date.now();
      inst.completedBy = state.user ? state.user.id : null;
    } else {
      inst.completedAt = null;
      inst.completedBy = null;
    }
    // Log detalhado
    var tpl = getTaskTpl(code);
    if (tpl && oldValue !== value && state.user) {
      logActivity('task', 'mudou status de "' + tpl.title.substring(0, 40) + '" de ' + (oldValue || 'A fazer') + ' → ' + value);
    }
  } else if (field === 'assigneeId') {
    var tpl2 = getTaskTpl(code);
    var newU = getUser(value);
    if (tpl2 && state.user) {
      logActivity('task', 'atribuiu "' + tpl2.title.substring(0, 40) + '" para ' + (newU ? newU.name : 'ninguém'));
    }
  }
  save();
  if (typeof window !== 'undefined') window.sbLastUserAction = Date.now();
  if (window.sbSaveTaskInst) window.sbSaveTaskInst(month, day, code, inst);
}

function projInstKey(projId, milestoneId) { return projId + '|' + milestoneId; }

function setProjMilestone(projId, milestoneId, field, value) {

}

// Formato YYYY-MM-DD a partir de Date local
function ymdLocal(d) {
  var y = d.getFullYear();

  if (m.length === 1) m = '0' + m;
  if (dd.length === 1) dd = '0' + dd;
  return y + '-' + m + '-' + dd;
}

function getOneTimesForDate(ymd, userId) {
  if (!state.oneTimes) return [];
  var result = [];

          '</div>' +
          '<button class="btn btn-primary btn-block btn-lg" type="submit" id="loginBtn">Entrar</button>' +
          '<div class="login-error" id="loginError">E-mail ou senha incorretos</div>' +
        '</form>' +
      '</div>' +
    '</div>';

  // Remover qualquer login screen anterior (evita acumular duplicatas)
  var existing = document.querySelectorAll('#loginScreen, .login-screen');
  for (var ex = 0; ex < existing.length; ex++) {
    if (existing[ex].parentNode) existing[ex].parentNode.removeChild(existing[ex]);
  }

  // Esconder o app principal
  var appEl = document.getElementById('app');
  if (appEl) appEl.className = 'app';

  document.body.insertAdjacentHTML('beforeend', html);

  var form = document.getElementById('loginForm');
  var btn = document.getElementById('loginBtn');
  var emailInp = document.getElementById('loginEmail');
  var passInp = document.getElementById('loginPass');

  function tryLogin(e) {
    if (e) e.preventDefault();
    var email = (emailInp.value || '').trim().toLowerCase();
    var pass = passInp.value || '';
    var err = document.getElementById('loginError');
    if (!email || !pass) {
      err.textContent = 'Preencha e-mail e senha';
      err.className = 'login-error show';
      return false;
    }

    // Verifica nas users carregadas do Supabase (ou local fallback)
    var user = null;
    for (var i = 0; i < state.users.length; i++) {
      if (state.users[i].email.toLowerCase() === email && state.users[i].password === pass) {
        user = state.users[i];
        break;
      }
    }

    if (!user) {
      err.textContent = 'E-mail ou senha incorretos';
      err.className = 'login-error show';
      passInp.value = '';
      passInp.focus();
      return false;
    }

    state.user = user;
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ userId: user.id })); } catch(e) {}

    // Remover TODAS as telas de login (caso tenha mais de uma por bug de duplo render)
    var screens = document.querySelectorAll('#loginScreen, .login-screen');
    for (var s = 0; s < screens.length; s++) {
      if (screens[s].parentNode) screens[s].parentNode.removeChild(screens[s]);
    }

    save();
    initApp();
    if (window.sbSubscribe) window.sbSubscribe();
    logActivity('user', 'fez login');
    return false;
  }

  form.addEventListener('submit', tryLogin);
  btn.addEventListener('click', tryLogin);
  setTimeout(function() { if (emailInp) emailInp.focus(); }, 100);
}

// Conta tarefas pendentes do usuário hoje
function countMyDayPending() {
  if (!state.user) return 0;
  var t = new Date();
  if (t.getFullYear() !== 2026) return 0;
  var monthKey = MONTHS_KEY[t.getMonth()];
  var day = t.getDate();
  var count = 0;
  for (var i = 0; i < state.tpl.diarias.length; i++) {
    var tk = state.tpl.diarias[i];
    if (!canViewTask(null, tk)) continue;
    var inst = peekInst(monthKey, day, tk.code);
    if (canViewTask(inst, tk) && inst.status !== 'Concluído' && inst.status !== 'N/A') count++;
  }
  // Tarefas de campanha pendentes hoje
  var todayYMD = ymdLocal(t);
  var activeCamps = getActiveCampaigns(todayYMD);
  for (var ci = 0; ci < activeCamps.length; ci++) {
    var camp = activeCamps[ci];
    if (!isInCampaign(camp, state.user.id) && !isAdmin()) continue;
    if (!camp.tasks) continue;
    for (var ti = 0; ti < camp.tasks.length; ti++) {
      var cInst = peekCampInst(camp.id, camp.tasks[ti].id, todayYMD);
      if (cInst.status !== 'Concluído') count++;
    }
  }
  return count;
}

function renderShell() {
  var u = state.user;
  if (!u) return;

  var pendingCount = countMyDayPending();
  var company = state.settings.company || { name: 'MALBA', tagline: 'Embalagens' };

  var allItems = [
    { id: 'meudia', label: 'Meu Dia', icon: 'meudia', badge: pendingCount > 0 ? pendingCount : null },
    { id: 'dashboard', label: 'Dashboard', icon: 'dashboard' },

        '<div class="side-brand-text"><div class="side-brand-name">' + esc(company.name || 'MALBA') + '</div><div class="side-brand-tag">' + esc(company.tagline || 'Embalagens') + '</div></div>' +
      '</div>' +
      '<button class="side-user" id="btnProfile" title="Meu perfil">' +
        userAvHTML +
        '<div class="side-user-info"><div class="side-user-name">' + esc(u.name) + '</div>' +
        '<div class="side-user-role">' + (u.role === 'admin' ? 'Administrador' : 'Usuário') + '</div></div>' +
      '</button>' +

        (isAdmin() ? '<div class="side-section"><div class="side-section-title">Admin</div>' + adminLinks + '</div>' : '') +
      '</nav>' +

        '<button class="btn btn-ghost btn-block" id="btnLogout"><span class="icon">' + ICON.out + '</span><span>Sair</span></button>' +
      '</div>' +
    '</aside>' +

      '<header class="topbar">' +
        '<h1 class="topbar-title" id="topbarTitle">Meu Dia</h1>' +
        '<div class="topbar-actions">' +
          // Indicador online (V8)
          (window.sbConnected ? '<div class="online-indicator" title="' + (window.sbOnlineUsers ? window.sbOnlineUsers.length : 0) + ' usuário(s) online"><span class="online-dot"></span><span>Online</span>' +
            (window.sbOnlineUsers && window.sbOnlineUsers.length > 1 ? ' <span style="font-size:10px;color:#6B6B6B">(' + window.sbOnlineUsers.length + ')</span>' : '') +
          '</div>' :
          '<div class="online-indicator offline" title="Sem conexão com servidor"><span class="online-dot"></span><span>Offline</span></div>') +
          (isAdmin() ?
            '<div class="scope-toggle" id="scopeToggle">' +
              '<button data-scope="meu"' + (state.ui.scope === 'meu' ? ' class="active"' : '') + '>Meus</button>' +
              '<button data-scope="tudo"' + (state.ui.scope === 'tudo' ? ' class="active"' : '') + '>Tudo</button>' +
            '</div>' : '') +
          '<div class="search">' + ICON.search + '<input type="text" id="globalSearch" placeholder="Buscar..."></div>' +
          (canManage() ? '<button class="btn btn-accent" id="btnQuick"><span class="icon">' + ICON.plus + '</span><span>Novo</span></button>' : '') +
        '</div>' +
      '</header>' +
      '<div class="content" id="content"></div>' +
      (canManage() ? '<button class="fab" id="fabQuick" title="Criar novo">+</button>' : '') +
    '</main>';

  document.getElementById('app').innerHTML = html;

  var links = document.querySelectorAll('.side-link');
  for (var k = 0; k < links.length; k++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        state.ui.page = btn.getAttribute('data-page');
        save();
        renderShell();
        renderPage();
      });
    })(links[k]);
  }

  document.getElementById('btnLogout').addEventListener('click', function() {
    if (confirm('Deseja sair do sistema?')) logout();
  });

  var btnProfile = document.getElementById('btnProfile');
  if (btnProfile) btnProfile.addEventListener('click', function() {
    state.ui.page = 'perfil';
    save();
    renderShell();
    renderPage();
  });

  var search = document.getElementById('globalSearch');
  if (search) {
    search.value = state.ui.fSearch || '';
    search.addEventListener('input', function() {
      state.ui.fSearch = search.value;
      var p = state.ui.page;
      if (p === 'lista' || p === 'projetos' || p === 'kanban' || p === 'catalogo' || p === 'meudia') renderPage();
    });

  var qn = document.getElementById('btnQuick');
  if (qn) qn.addEventListener('click', showQuickNew);
  var fab = document.getElementById('fabQuick');
  if (fab) fab.addEventListener('click', showQuickNew);

  var scopeBtns = document.querySelectorAll('[data-scope]');
  for (var sb = 0; sb < scopeBtns.length; sb++) {
    (function(b) {
      b.addEventListener('click', function() {
        state.ui.scope = b.getAttribute('data-scope');
        save();
        renderShell();
        renderPage();
      });
    })(scopeBtns[sb]);
  }
}

function renderPage() {
  var c = document.getElementById('content');
  var tt = document.getElementById('topbarTitle');
  if (!c) return;

  var titles = {
    meudia: 'Meu Dia', dashboard: 'Dashboard', kanban: 'Quadro Kanban', lista: 'Tarefas',
    cal: 'Calendário', meses: 'Visão por Mês', projetos: 'Projetos',
    campanhas: 'Campanhas de Vendas', gestao: 'Gestão da Equipe',
    relatorios: 'Relatórios', catalogo: 'Catálogo de Tarefas',
    usuarios: 'Usuários', atividade: 'Histórico', config: 'Configurações',
    perfil: 'Meu Perfil'
  };
  if (tt) tt.textContent = titles[state.ui.page] || 'Meu Dia';

  // Verificar permissão por página
  if (state.ui.page !== 'perfil' && !canViewPage(state.ui.page)) {
    c.innerHTML = renderAccessDenied();
    return;
  }

  var p = state.ui.page;
  if (p === 'meudia') { c.innerHTML = renderMeuDia(); attachMeuDia(); }
  else if (p === 'dashboard') { c.innerHTML = renderDashboard(); attachDashboard(); }
  else if (p === 'gestao') { c.innerHTML = renderGestao(); attachGestao(); }
  else if (p === 'kanban') { c.innerHTML = renderKanban(); attachKanban(); }
  else if (p === 'lista') { c.innerHTML = renderLista(); attachLista(); }
  else if (p === 'cal') { c.innerHTML = renderCal(); attachCal(); }
  else if (p === 'meses') { c.innerHTML = renderMeses(); attachMeses(); }
  else if (p === 'projetos') { c.innerHTML = renderProjetos(); attachProjetos(); }
  else if (p === 'campanhas') { c.innerHTML = renderCampanhas(); attachCampanhas(); }
  else if (p === 'relatorios') { c.innerHTML = renderRelatorios(); attachRelatorios(); }
  else if (p === 'catalogo') { c.innerHTML = renderCatalogo(); attachCatalogo(); }
  else if (p === 'usuarios') { c.innerHTML = renderUsuarios(); attachUsuarios(); }
  else if (p === 'atividade') { c.innerHTML = renderAtividade(); attachAtividade(); }
  else if (p === 'config') { c.innerHTML = renderConfig(); attachConfig(); }
  else if (p === 'perfil') { c.innerHTML = renderPerfil(); attachPerfil(); }
  else { c.innerHTML = renderMeuDia(); attachMeuDia(); }
  c.scrollTop = 0;
}

    '</div>';
