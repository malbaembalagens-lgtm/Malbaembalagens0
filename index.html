// Matriz de Eisenhower (importância = prioridade alta; urgência = vence hoje/atrasada)
function eisenQuadrant(t) {
  var imp = t.priority==='alta';
  var urg = t.due_date && t.due_date.split('T')[0] <= today();
  if (imp && urg) return 'fazer';
  if (imp && !urg) return 'planejar';
  if (!imp && urg) return 'delegar';
  return 'depois';
}
function matrizHTML() {
  var ts=visibleTasks().filter(function(t){ return t.status!=='feito'; });
  var Q={ fazer:[], planejar:[], delegar:[], depois:[] };
  ts.forEach(function(t){ Q[eisenQuadrant(t)].push(t); });
  var meta={
    fazer:    { t:'Fazer agora',     d:'Importante e urgente',       c:'#EF4444' },
    planejar: { t:'Planejar',        d:'Importante, sem pressa',     c:'#3B6FF7' },
    delegar:  { t:'Resolver/Delegar', d:'Urgente, menos importante', c:'#F59E0B' },
    depois:   { t:'Quando der',      d:'Pode esperar',               c:'#9aa1ad' }
  };
  function quad(k){
    var m=meta[k], items=Q[k];
    var body = items.length ? items.map(function(t){
      var late=t.due_date && t.due_date.split('T')[0]<today();
      var pr=PRIO[t.priority]||PRIO.media;
      return '<button class="mz-task" data-id="'+esc(t.id)+'"><span class="mz-dot" style="background:'+pr.color+'"></span><span class="mz-l">'+esc(t.title)+'</span>'+(t.due_date?'<span class="mz-d'+(late?' late':'')+'">'+fmtDate(t.due_date)+'</span>':'')+'</button>';
    }).join('') : '<div class="mz-empty">Nada aqui</div>';
    return '<div class="mz-quad" style="--qc:'+m.c+'"><div class="mz-head"><span class="mz-bar"></span><div class="mz-ht"><b>'+m.t+'</b><i>'+m.d+'</i></div><span class="mz-count">'+items.length+'</span></div><div class="mz-list">'+body+'</div></div>';
  }
  return '<div class="matriz-hint">Prioridade <b>alta</b> = importante · prazo de <b>hoje ou atrasado</b> = urgente. Ajuste a prioridade e a data nas tarefas para reorganizar a matriz.</div><div class="matriz">'+quad('fazer')+quad('planejar')+quad('delegar')+quad('depois')+'</div>';
}
var REC = { none:{label:'Não repete'}, diaria:{label:'Diária'}, semanal:{label:'Semanal'}, mensal:{label:'Mensal'} };
var REC_ORDER = ['none','diaria','semanal','mensal'];
// próxima ocorrência a partir de hoje
function nextDate(rec) {
  var b=new Date();
  if (rec==='diaria') b.setDate(b.getDate()+1);
  else if (rec==='semanal') b.setDate(b.getDate()+7);
  else if (rec==='mensal') b.setMonth(b.getMonth()+1);
  return b.getFullYear()+'-'+pad(b.getMonth()+1)+'-'+pad(b.getDate());
}
function isRecurring(t){ return t.recurrence && t.recurrence!=='none'; }

function taskCardHTML(t) {
  var pr=PRIO[t.priority]||PRIO.media;
  var u=t.assignee_id?userById(t.assignee_id):null;
  var av=u?'<span class="tc-av" style="background:'+(u.color||'#3B6FF7')+'" title="'+esc(u.name)+'">'+esc(iniciais(u.name))+'</span>':'';
  var hoje=today(); var late=t.due_date && t.due_date<hoje && t.status!=='feito';
  var dateChip=t.due_date?'<span class="tc-date'+(late?' late':'')+'">'+icon('cal')+fmtDate(t.due_date)+'</span>':'';
  var areaChip=t.area?'<span class="tc-chip">'+esc(t.area)+'</span>':'';
  var recBadge = isRecurring(t) ? '<span class="tc-rec">↻ '+(REC[t.recurrence]?REC[t.recurrence].label:'Repete')+'</span>' : '';
  var quick = isRecurring(t) ? '<button class="tc-done" data-done="'+esc(t.id)+'">✓ feito hoje</button>' : '';
  return '<div class="task-card" data-id="'+esc(t.id)+'"><div class="tc-top"><span class="tc-prio" style="background:'+pr.color+'" title="Prioridade '+pr.label+'"></span><span class="tc-title">'+esc(t.title)+'</span></div><div class="tc-meta">'+areaChip+recBadge+dateChip+av+'</div>'+quick+'</div>';
}
function bindTarefas() {
  var nova=document.getElementById('btnNovaTarefa');
  if (nova) nova.addEventListener('click', function(){ openTaskModal(null); });
  // botão "feito hoje" das recorrentes — reagenda para a próxima ocorrência
  var dones=app.querySelectorAll('[data-done]');
  for (var d=0;d<dones.length;d++) {
    dones[d].addEventListener('click', function(e){
      e.stopPropagation();
      var id=this.getAttribute('data-done'); var t=null;
      for (var k=0;k<ST.tasks.length;k++) if (String(ST.tasks[k].id)===String(id)) { t=ST.tasks[k]; break; }
      if (!t) return;
      var nd=nextDate(t.recurrence);
      t.due_date=nd; t.status='todo';
      sb.from('malba_vl_tasks').update({ due_date:nd, status:'todo' }).eq('id', t.id).then(function(r){ if(r.error) toast('Erro ao reagendar','error'); });
      toast('Concluída! Próxima: '+fmtDate(nd),'success');
      renderPage();
    });
  }
  var cards=app.querySelectorAll('.task-card');
  for (var i=0;i<cards.length;i++) {
    cards[i].addEventListener('click', function(){
      var id=this.getAttribute('data-id'); var t=null;
      for (var k=0;k<ST.tasks.length;k++) if (String(ST.tasks[k].id)===String(id)) { t=ST.tasks[k]; break; }
      if (t) openTaskModal(t);
    });
  }
  // alternar Quadro / Prioridades
  var vts=app.querySelectorAll('.vt-btn');
  for (var v=0;v<vts.length;v++) vts[v].addEventListener('click', function(){ ST.taskView=this.getAttribute('data-view'); renderPage(); });
  // clique nas tarefas da matriz
  var mzs=app.querySelectorAll('.mz-task');
  for (var z=0;z<mzs.length;z++) mzs[z].addEventListener('click', function(){
    var id=this.getAttribute('data-id'); var t=null;
    for (var k=0;k<ST.tasks.length;k++) if (String(ST.tasks[k].id)===String(id)) { t=ST.tasks[k]; break; }
    if (t) openTaskModal(t);
  });
}
function openTaskModal(task) {
  var isEdit=!!task;
  var t=task||{ title:'', description:'', priority:'media', status:'todo', due_date:today(), area:'', assignee_id:'' };
  var stPills=STATUS_ORDER.map(function(k){ return '<button type="button" class="pill st-pill'+(t.status===k?' on':'')+'" data-st="'+k+'" style="color:'+STATUS[k].color+'"><span class="pdot" style="background:'+STATUS[k].color+'"></span>'+STATUS[k].label+'</button>'; }).join('');
  var prPills=['alta','media','baixa'].map(function(k){ return '<button type="button" class="pill pr-pill'+(t.priority===k?' on':'')+'" data-pr="'+k+'" style="color:'+PRIO[k].color+'"><span class="pdot" style="background:'+PRIO[k].color+'"></span>'+PRIO[k].label+'</button>'; }).join('');
  var recPills=REC_ORDER.map(function(k){ return '<button type="button" class="pill rec-pill'+((t.recurrence||'none')===k?' on':'')+'" data-rec="'+k+'">'+REC[k].label+'</button>'; }).join('');
  var userOpts='<option value="">— Ninguém —</option>';
  ST.users.forEach(function(u){ userOpts += '<option value="'+esc(u.id)+'"'+(t.assignee_id===u.id?' selected':'')+'>'+esc(u.name)+'</option>'; });
  var delBtn=isEdit?'<button class="btn btn-danger btn-del-wrap" id="taskDel">Excluir</button>':'';

  var modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML =
    '<div class="modal" id="taskModal">'+
      '<input class="modal-title-input" id="tTitle" placeholder="Título da tarefa..." value="'+esc(t.title)+'">'+
      '<div class="modal-row"><label class="modal-label">Status</label><div class="pills" id="tStatus">'+stPills+'</div></div>'+
      '<div class="modal-row"><label class="modal-label">Prioridade</label><div class="pills" id="tPrio">'+prPills+'</div></div>'+
      '<div class="modal-row"><label class="modal-label">Repetição</label><div class="pills" id="tRec">'+recPills+'</div></div>'+
      '<div class="modal-grid2"><div class="modal-row"><label class="modal-label">Data</label><input type="date" id="tDate" value="'+esc((t.due_date||'').split('T')[0])+'"></div><div class="modal-row"><label class="modal-label">Área / etiqueta</label><input type="text" id="tArea" placeholder="ex: Estoque" value="'+esc(t.area||'')+'"></div></div>'+
      '<div class="modal-row"><label class="modal-label">Responsável</label><select id="tAssignee">'+userOpts+'</select></div>'+
      '<div class="modal-row"><label class="modal-label">Descrição</label><textarea id="tDesc" placeholder="Detalhes da tarefa...">'+esc(t.description||'')+'</textarea></div>'+
      '<div class="modal-foot">'+delBtn+'<button class="btn btn-ghost" id="taskCancel">Cancelar</button><button class="btn btn-primary" id="taskSave">'+(isEdit?'Salvar':'Criar tarefa')+'</button></div>'+
    '</div>';
  document.body.appendChild(modal);

  var stPick=t.status, prPick=t.priority, recPick=t.recurrence||'none';
  bindPills(modal, '#tStatus .st-pill', 'st', function(v){ stPick=v; });
  bindPills(modal, '#tPrio .pr-pill', 'pr', function(v){ prPick=v; });
  bindPills(modal, '#tRec .rec-pill', 'rec', function(v){ recPick=v; });

  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  modal.querySelector('#taskCancel').addEventListener('click', close);
  modal.querySelector('#tTitle').focus();

  modal.querySelector('#taskSave').addEventListener('click', function(){
    var title=(modal.querySelector('#tTitle').value||'').trim();
    if (!title) { toast('Informe o título da tarefa','error'); return; }
    var payload={ title:title, description:(modal.querySelector('#tDesc').value||'').trim(), priority:prPick, status:stPick, due_date:modal.querySelector('#tDate').value||today(), recurrence:recPick, area:(modal.querySelector('#tArea').value||'').trim(), assignee_id:modal.querySelector('#tAssignee').value||null, sector:ST.sector, created_by:ST.session.user.id, store_unit_id:ST.store?ST.store.id:null };
    var saveBtn=modal.querySelector('#taskSave'); saveBtn.disabled=true; saveBtn.textContent='Salvando...';
    if (isEdit) {
      sb.from('malba_vl_tasks').update(payload).eq('id', t.id).then(function(r){
        if (r.error) { toast('Erro ao salvar','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Salvar'; return; }
        for (var i=0;i<ST.tasks.length;i++) if (ST.tasks[i].id===t.id) { ST.tasks[i]=Object.assign(ST.tasks[i],payload); break; }
        close(); toast('Tarefa atualizada','success'); renderPage();
      });
    } else {
      sb.from('malba_vl_tasks').insert(payload).select().single().then(function(r){
        if (r.error || !r.data) { toast('Erro ao criar tarefa','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Criar tarefa'; return; }
        ST.tasks.unshift(r.data);
        close(); toast('Tarefa criada','success'); renderPage();
      });
    }
  });

  if (isEdit) {
    modal.querySelector('#taskDel').addEventListener('click', function(){
      if (!confirm('Excluir a tarefa "'+(t.title||'sem título')+'"?')) return;
      sb.from('malba_vl_tasks').delete().eq('id', t.id).then(function(r){
        if (r.error) { toast('Erro ao excluir','error'); return; }
        ST.tasks=ST.tasks.filter(function(x){ return x.id!==t.id; });
        close(); toast('Tarefa excluída','success'); renderPage();
      });
    });
  }
}
function bindPills(root, selector, attr, cb) {
  var pills=root.querySelectorAll(selector);
  for (var i=0;i<pills.length;i++) {
    pills[i].addEventListener('click', function(){
      for (var k=0;k<pills.length;k++) pills[k].classList.remove('on');
      this.classList.add('on');
      cb(this.getAttribute('data-'+attr));
    });
  }
}

/* ========== [10b] EQUIPE (funcionários da loja) ========== */
var FUNCOES = ['Vendedor','Caixa','Estoquista','Gerente','Atendente','Repositor','Auxiliar'];

// membros visíveis: loja vê os da própria loja; super admin vê todos.
function visibleMembers() {
  if (ST.sector==='lojas' && ST.store && !isSuper(ST.session)) {
    return ST.members.filter(function(m){ return m.store_unit_id === ST.store.id; });
  }
  // super admin / outros: mostra todos (poderá filtrar por loja no futuro)
  return ST.members;
}

function equipeHTML() {
  var ms = visibleMembers();
  var ativos = ms.filter(function(m){ return m.is_active !== false; });
  var sub = (ST.sector==='lojas' && ST.store) ? ('Equipe de '+esc(ST.store.name||('Loja '+ST.store.store_number))) : 'Equipe (todas as lojas)';
  var admin = isAdmin(ST.session);
  var cards = '';
  if (ativos.length === 0) {
    var msgVazio = admin ? 'Adicione o primeiro membro da equipe pelo botão acima.' : 'A equipe ainda não foi cadastrada pelo administrador.';
    cards = '<div class="empty-page" style="grid-column:1/-1"><div class="ep-ico">'+icon('users')+'</div><h3>Nenhum funcionário ainda</h3><p>'+msgVazio+'</p></div>';
  } else {
    ms.sort(function(a,b){ return (a.is_active===false)-(b.is_active===false); });
    ms.forEach(function(m){ cards += memberCardHTML(m, admin); });
  }
  // botão de criar só para admin
  var btn = admin ? '<button class="btn-new" id="btnNovoMembro">'+icon('plus')+'Novo funcionário</button>' : '';
  return '<div class="tasks-head"><div><h2>Equipe</h2><div class="sub">'+sub+' · '+ativos.length+' ativo(s)</div></div>'+btn+'</div><div class="team-grid">'+cards+'</div>';
}

function storeName(id) {
  for (var i=0;i<ST.storeUnits.length;i++) if (ST.storeUnits[i].id===id) return ST.storeUnits[i].name || ('Loja '+ST.storeUnits[i].store_number);
  return '';
}
function memberCardHTML(m, showStore) {
  var inativo = m.is_active === false;
  var ini = iniciais(m.name);
  var lojaChip = (showStore && m.store_unit_id) ? '<small>'+esc(storeName(m.store_unit_id))+'</small>' : (m.phone?'<small>'+esc(m.phone)+'</small>':'');
  return '<div class="member-card'+(inativo?' off':'')+'" data-id="'+esc(m.id)+'">'+
    '<span class="member-av" style="background:'+(m.color||'#3B6FF7')+'">'+esc(ini)+'</span>'+
    '<div class="member-info"><b>'+esc(m.name)+'</b><i>'+esc(m.role||'Sem função')+(inativo?' · inativo':'')+'</i>'+
    lojaChip+'</div></div>';
}

function bindEquipe() {
  var admin = isAdmin(ST.session);
  var novo = document.getElementById('btnNovoMembro');
  if (novo && admin) novo.addEventListener('click', function(){ openMemberModal(null); });
  if (!admin) return; // loja comum: somente visualização
  var cards = app.querySelectorAll('.member-card');
  for (var i=0;i<cards.length;i++) {
    cards[i].addEventListener('click', function(){
      var id=this.getAttribute('data-id'); var m=null;
      for (var k=0;k<ST.members.length;k++) if (String(ST.members[k].id)===String(id)) { m=ST.members[k]; break; }
      if (m) openMemberModal(m);
    });
  }
}

function openMemberModal(member) {
  var isNew = !member;
  var m = member || { name:'', role:'', phone:'', color:'#3B6FF7', is_active:true };
  var admin = isAdmin(ST.session);

  // Loja-alvo: se há loja logada (login de loja), usa ela. Se é admin, ele escolhe no seletor.
  var lojaFixa = ST.store ? ST.store.id : null;

  var roleOpts = '<option value="">Selecione a função</option>';
  FUNCOES.forEach(function(f){ roleOpts += '<option value="'+f+'"'+(m.role===f?' selected':'')+'>'+f+'</option>'; });

  // Seletor de loja: aparece quando NÃO há loja fixa (admin gerenciando várias lojas).
  var lojaSelectHTML = '';
  if (!lojaFixa) {
    var opts = '<option value="">Selecione a loja</option>';
    ST.storeUnits.forEach(function(s){
      var nm = s.name || ('Loja '+s.store_number);
      opts += '<option value="'+esc(s.id)+'"'+(m.store_unit_id===s.id?' selected':'')+'>'+esc(nm)+'</option>';
    });
    lojaSelectHTML = '<div class="modal-row"><label class="modal-label">Loja *</label><select id="mStore">'+opts+'</select></div>';
  }

  var colors = ['#3B6FF7','#16A34A','#F59E0B','#8B5CF6','#EF4444','#0EA5E9'];
  var colorBtns = colors.map(function(c){
    return '<button type="button" class="color-dot'+(m.color===c?' on':'')+'" data-color="'+c+'" style="background:'+c+'"></button>';
  }).join('');

  var statusToggle = isNew ? '' :
    '<div class="modal-row"><label class="modal-label">Situação</label><div class="pills" id="mStatus">'+
      '<button type="button" class="pill ms-pill'+(m.is_active!==false?' on':'')+'" data-act="1" style="color:#16A34A"><span class="pdot" style="background:#16A34A"></span>Ativo</button>'+
      '<button type="button" class="pill ms-pill'+(m.is_active===false?' on':'')+'" data-act="0" style="color:#9aa1ad"><span class="pdot" style="background:#9aa1ad"></span>Inativo</button>'+
    '</div></div>';

  var delBtn = isNew ? '' : '<button class="btn btn-danger btn-del-wrap" id="memberDel">Excluir</button>';

  var modal = document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML =
    '<div class="modal">'+
      '<input class="modal-title-input" id="mName" placeholder="Nome do funcionário..." value="'+esc(m.name)+'">'+
      lojaSelectHTML+
      '<div class="modal-row"><label class="modal-label">Função</label><select id="mRole">'+roleOpts+'</select></div>'+
      '<div class="modal-grid2"><div class="modal-row"><label class="modal-label">Telefone</label><input type="text" id="mPhone" placeholder="(11) 90000-0000" value="'+esc(m.phone||'')+'"></div><div class="modal-row"><label class="modal-label">Cor</label><div class="color-row" id="mColors">'+colorBtns+'</div></div></div>'+
      statusToggle+
      '<div class="modal-foot">'+delBtn+'<button class="btn btn-ghost" id="memberCancel">Cancelar</button><button class="btn btn-primary" id="memberSave">'+(isNew?'Adicionar':'Salvar')+'</button></div>'+
    '</div>';
  document.body.appendChild(modal);

  var colorPick = m.color || '#3B6FF7';
  var dots = modal.querySelectorAll('.color-dot');
  for (var i=0;i<dots.length;i++) {
    dots[i].addEventListener('click', function(){
      for (var k=0;k<dots.length;k++) dots[k].classList.remove('on');
      this.classList.add('on'); colorPick=this.getAttribute('data-color');
    });
  }
  var actPick = (m.is_active !== false);
  if (!isNew) bindPills(modal, '#mStatus .ms-pill', 'act', function(v){ actPick = (v==='1'); });

  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  modal.querySelector('#memberCancel').addEventListener('click', close);
  modal.querySelector('#mName').focus();

  modal.querySelector('#memberSave').addEventListener('click', function(){
    if (!admin) { toast('Apenas o administrador pode gerenciar a equipe','error'); return; }
    var name=(modal.querySelector('#mName').value||'').trim();
    if (!name) { toast('Informe o nome','error'); return; }
    // loja-alvo: loja fixa (login de loja) OU a escolhida no seletor (admin)
    var storeAlvo = lojaFixa;
    if (!storeAlvo) {
      var sel = modal.querySelector('#mStore');
      storeAlvo = sel ? sel.value : (m.store_unit_id || null);
    }
    if (!storeAlvo) { toast('Selecione a loja do funcionário','error'); return; }
    var rec = { store_unit_id:storeAlvo, name:name, role:modal.querySelector('#mRole').value||null, phone:(modal.querySelector('#mPhone').value||'').trim(), color:colorPick, is_active:actPick };
    var saveBtn=modal.querySelector('#memberSave'); saveBtn.disabled=true; saveBtn.textContent='Salvando...';
    if (isNew) {
      sb.from('malba_store_members').insert(rec).select().single().then(function(r){
        if (r.error || !r.data) { toast('Erro ao adicionar','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Adicionar'; return; }
        ST.members.push(r.data); close(); toast('Funcionário adicionado','success'); renderPage();
      });
    } else {
      sb.from('malba_store_members').update(rec).eq('id', m.id).then(function(r){
        if (r.error) { toast('Erro ao salvar','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Salvar'; return; }
        for (var i=0;i<ST.members.length;i++) if (ST.members[i].id===m.id) { ST.members[i]=Object.assign(ST.members[i],rec); break; }
        close(); toast('Funcionário atualizado','success'); renderPage();
      });
    }
  });

  if (!isNew) {
    modal.querySelector('#memberDel').addEventListener('click', function(){
      if (!confirm('Excluir o funcionário "'+(m.name||'')+'"?')) return;
      sb.from('malba_store_members').delete().eq('id', m.id).then(function(r){
        if (r.error) { toast('Erro ao excluir','error'); return; }
        ST.members = ST.members.filter(function(x){ return x.id!==m.id; });
        close(); toast('Funcionário excluído','success'); renderPage();
      });
    });
  }
}

/* ========== [10c] METAS (metas mensais por loja) ========== */
var MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function fmtBRL(v) {
  var n = Number(v)||0;
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
}

// metas visíveis: loja vê as da própria loja (e as do setor inteiro); admin vê todas.
function visibleGoals() {
  if (ST.sector==='lojas' && ST.store && !isSuper(ST.session)) {
    return ST.goals.filter(function(g){ return g.store_unit_id===ST.store.id || !g.store_unit_id; });
  }
  return ST.goals;
}

function metasHTML() {
  var admin = isAdmin(ST.session);
  var gs = visibleGoals().slice().sort(function(a,b){
    if (b.year!==a.year) return b.year-a.year;
    return b.month-a.month;
  });
  var sub = (ST.sector==='lojas' && ST.store && !admin) ? ('Metas de '+esc(ST.store.name||('Loja '+ST.store.store_number))) : 'Metas mensais';
  var btn = admin ? '<button class="btn-new" id="btnNovaMeta">'+icon('plus')+'Nova meta</button>' : '';

  var cards = '';
  if (gs.length === 0) {
    var msg = admin ? 'Crie a primeira meta mensal pelo botão acima.' : 'O administrador ainda não definiu metas.';
    cards = '<div class="empty-page" style="grid-column:1/-1"><div class="ep-ico">'+icon('target')+'</div><h3>Nenhuma meta ainda</h3><p>'+msg+'</p></div>';
  } else {
    gs.forEach(function(g){ cards += goalCardHTML(g); });
  }
  return '<div class="tasks-head"><div><h2>Metas</h2><div class="sub">'+sub+'</div></div>'+btn+'</div><div class="goals-grid">'+cards+'</div>';
}

function goalCardHTML(g) {
  var meta = Number(g.goal_value)||0;
  var real = Number(g.actual_value)||0;
  var pct = meta>0 ? Math.min(100, Math.round((real/meta)*100)) : 0;
  var alvo = (g.store_unit_id) ? storeName(g.store_unit_id) : 'Todo o setor';
  var cor = pct>=100 ? '#16A34A' : (pct>=60 ? '#3B6FF7' : (pct>=30 ? '#F59E0B' : '#EF4444'));
  // anel SVG
  var R=42, C=2*Math.PI*R, off=C*(1-pct/100);
  var ring = '<svg class="goal-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="'+R+'" fill="none" stroke="var(--u-bg2)" stroke-width="9"/><circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+cor+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 50 50)"/><text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="800" fill="var(--u-text)" font-family="Sora">'+pct+'%</text></svg>';
  return '<div class="goal-card" data-id="'+esc(g.id)+'">'+
    '<div class="goal-head"><div><b>'+esc(MESES[(g.month||1)-1])+' '+esc(g.year||'')+'</b><i>'+esc(alvo)+'</i></div></div>'+
    ring+
    '<div class="goal-vals"><div class="gv"><small>Realizado</small><span style="color:'+cor+'">'+fmtBRL(real)+'</span></div><div class="gv"><small>Meta</small><span>'+fmtBRL(meta)+'</span></div></div>'+
  '</div>';
}

function bindMetas() {
  var admin = isAdmin(ST.session);
  var nova = document.getElementById('btnNovaMeta');
  if (nova && admin) nova.addEventListener('click', function(){ openGoalModal(null); });
  if (!admin) return;
  var cards = app.querySelectorAll('.goal-card');
  for (var i=0;i<cards.length;i++) {
    cards[i].addEventListener('click', function(){
      var id=this.getAttribute('data-id'); var g=null;
      for (var k=0;k<ST.goals.length;k++) if (String(ST.goals[k].id)===String(id)) { g=ST.goals[k]; break; }
      if (g) openGoalModal(g);
    });
  }
}

function openGoalModal(goal) {
  var isNew = !goal;
  var now = new Date();
  var g = goal || { month:now.getMonth()+1, year:now.getFullYear(), goal_value:'', actual_value:0, store_unit_id:null };

  var monthOpts='';
  for (var mo=1;mo<=12;mo++) monthOpts += '<option value="'+mo+'"'+(g.month===mo?' selected':'')+'>'+MESES[mo-1]+'</option>';

  // seletor de alvo: lojas -> loja; vendas -> vendedor
  var lojaSelectHTML='';
  if (ST.sector==='lojas') {
    var opts='<option value="">Todo o setor</option>';
    ST.storeUnits.forEach(function(s){
      var nm=s.name||('Loja '+s.store_number);
      opts += '<option value="'+esc(s.id)+'"'+(g.store_unit_id===s.id?' selected':'')+'>'+esc(nm)+'</option>';
    });
    lojaSelectHTML='<div class="modal-row"><label class="modal-label">Aplicar a</label><select id="gStore">'+opts+'</select></div>';
  } else if (ST.sector==='vendas') {
    var uopts='<option value="">Meta geral do setor</option>';
    ST.users.forEach(function(u){ uopts += '<option value="'+esc(u.id)+'"'+(g.user_id===u.id?' selected':'')+'>'+esc(u.name)+'</option>'; });
    lojaSelectHTML='<div class="modal-row"><label class="modal-label">Vendedor (entra no ranking)</label><select id="gUser">'+uopts+'</select></div>';
  }

  var delBtn = isNew ? '' : '<button class="btn btn-danger btn-del-wrap" id="goalDel">Excluir</button>';

  var modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML =
    '<div class="modal">'+
      '<div class="modal-title-input" style="cursor:default">'+(isNew?'Nova meta':'Editar meta')+'</div>'+
      '<div class="modal-grid2"><div class="modal-row"><label class="modal-label">Mês</label><select id="gMonth">'+monthOpts+'</select></div><div class="modal-row"><label class="modal-label">Ano</label><input type="text" id="gYear" value="'+esc(g.year||now.getFullYear())+'"></div></div>'+
      lojaSelectHTML+
      '<div class="modal-row"><label class="modal-label">Valor da meta (R$) *</label><input type="text" id="gValue" inputmode="decimal" placeholder="0,00" value="'+(g.goal_value!=null && g.goal_value!==''?esc(g.goal_value):'')+'"></div>'+
      '<div class="modal-row"><label class="modal-label">Realizado (R$) <span style="font-weight:600;color:var(--u-text3);text-transform:none;letter-spacing:0">• será atualizado pelo Bling</span></label><input type="text" id="gActual" inputmode="decimal" placeholder="0,00" value="'+(g.actual_value?esc(g.actual_value):'')+'"><div style="font-size:11px;color:var(--u-text3);margin-top:5px">Por enquanto pode ser preenchido manualmente. Quando a integração com o Bling estiver ativa, este valor passa a ser sincronizado automaticamente.</div></div>'+
      '<div class="modal-foot">'+delBtn+'<button class="btn btn-ghost" id="goalCancel">Cancelar</button><button class="btn btn-primary" id="goalSave">'+(isNew?'Criar meta':'Salvar')+'</button></div>'+
    '</div>';
  document.body.appendChild(modal);

  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  modal.querySelector('#goalCancel').addEventListener('click', close);

  function parseNum(s){ return parseFloat(String(s||'').replace(/\./g,'').replace(',', '.')) || 0; }

  modal.querySelector('#goalSave').addEventListener('click', function(){
    if (!isAdmin(ST.session)) { toast('Apenas o administrador pode definir metas','error'); return; }
    var val = parseNum(modal.querySelector('#gValue').value);
    if (!val || val<=0) { toast('Informe o valor da meta','error'); return; }
    var lojaEl = modal.querySelector('#gStore');
    var userEl = modal.querySelector('#gUser');
    var rec = {
      sector: ST.sector,
      month: parseInt(modal.querySelector('#gMonth').value,10),
      year: parseInt(modal.querySelector('#gYear').value,10) || now.getFullYear(),
      goal_value: val,
      actual_value: parseNum(modal.querySelector('#gActual').value),
      store_unit_id: (lojaEl && lojaEl.value) ? lojaEl.value : null,
      user_id: (userEl && userEl.value) ? userEl.value : null
    };
    var saveBtn=modal.querySelector('#goalSave'); saveBtn.disabled=true; saveBtn.textContent='Salvando...';
    if (isNew) {
      sb.from('malba_sales_goals').insert(rec).select().single().then(function(r){
        if (r.error || !r.data) { toast('Erro ao criar meta','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Criar meta'; return; }
        ST.goals.push(r.data); close(); toast('Meta criada','success'); renderPage();
      });
    } else {
      sb.from('malba_sales_goals').update(rec).eq('id', g.id).then(function(r){
        if (r.error) { toast('Erro ao salvar','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Salvar'; return; }
        for (var i=0;i<ST.goals.length;i++) if (ST.goals[i].id===g.id) { ST.goals[i]=Object.assign(ST.goals[i],rec); break; }
        close(); toast('Meta atualizada','success'); renderPage();
      });
    }
  });

  if (!isNew) {
    modal.querySelector('#goalDel').addEventListener('click', function(){
      if (!confirm('Excluir a meta de '+MESES[(g.month||1)-1]+'/'+g.year+'?')) return;
      sb.from('malba_sales_goals').delete().eq('id', g.id).then(function(r){
        if (r.error) { toast('Erro ao excluir','error'); return; }
        ST.goals = ST.goals.filter(function(x){ return x.id!==g.id; });
        close(); toast('Meta excluída','success'); renderPage();
      });
    });
  }
}

/* ========== [10d] CRM (clientes) ========== */
var CRM_STATUS = {
  ativo:     { label:'Ativo',     color:'#16A34A' },
  prospecto: { label:'Prospecto', color:'#3B6FF7' },
  inativo:   { label:'Inativo',   color:'#9aa1ad' }
};
var crmBusca = '';

function crmHTML() {
  var q = crmBusca.toLowerCase();
  var list = ST.clients.filter(function(c){
    if (!q) return true;
    return (c.name||'').toLowerCase().indexOf(q)!==-1 ||
           (c.company||'').toLowerCase().indexOf(q)!==-1 ||
           (c.phone||'').toLowerCase().indexOf(q)!==-1 ||
           (c.email||'').toLowerCase().indexOf(q)!==-1;
  });

  var rows = '';
  if (list.length === 0) {
    var msg = ST.clients.length===0 ? 'Cadastre o primeiro cliente pelo botão acima.' : 'Nenhum cliente encontrado para essa busca.';
    rows = '<div class="empty-page"><div class="ep-ico">'+icon('users')+'</div><h3>Sem clientes</h3><p>'+msg+'</p></div>';
  } else {
    rows = '<div class="crm-list">';
    list.forEach(function(c){ rows += crmRowHTML(c); });
    rows += '</div>';
  }
  return ''+
    '<div class="tasks-head"><div><h2>CRM</h2><div class="sub">'+ST.clients.length+' cliente(s)</div></div><button class="btn-new" id="btnNovoCliente">'+icon('plus')+'Novo cliente</button></div>'+
    '<div class="crm-search">'+icon('search')+'<input id="crmSearch" placeholder="Buscar por nome, empresa, telefone ou e-mail..." value="'+esc(crmBusca)+'"></div>'+
    rows;
}

function crmRowHTML(c) {
  var st = CRM_STATUS[c.status] || CRM_STATUS.ativo;
  var ini = iniciais(c.name);
  var sub = [c.company, c.phone].filter(Boolean).join(' · ');
  return '<div class="crm-row" data-id="'+esc(c.id)+'">'+
    '<span class="crm-av">'+esc(ini)+'</span>'+
    '<div class="crm-main"><b>'+esc(c.name)+'</b>'+(sub?'<i>'+esc(sub)+'</i>':'')+'</div>'+
    '<span class="crm-status" style="color:'+st.color+';background:'+st.color+'18">'+st.label+'</span>'+
  '</div>';
}

function bindCRM() {
  var novo = document.getElementById('btnNovoCliente');
  if (novo) novo.addEventListener('click', function(){ openClientModal(null); });
  var search = document.getElementById('crmSearch');
  if (search) {
    search.addEventListener('input', function(){
      crmBusca = this.value;
      // re-renderiza só a lista, mantendo o foco no campo
      var pos = this.selectionStart;
      renderPage();
      var s2 = document.getElementById('crmSearch');
      if (s2) { s2.focus(); try { s2.setSelectionRange(pos,pos); } catch(e){} }
    });
  }
  var rows = app.querySelectorAll('.crm-row');
  for (var i=0;i<rows.length;i++) {
    rows[i].addEventListener('click', function(){
      var id=this.getAttribute('data-id'); var c=null;
      for (var k=0;k<ST.clients.length;k++) if (String(ST.clients[k].id)===String(id)) { c=ST.clients[k]; break; }
      if (c) openClientModal(c);
    });
  }
}

function openClientModal(client) {
  var isNew = !client;
  var c = client || { name:'', company:'', phone:'', email:'', notes:'', status:'ativo' };

  var stOpts = Object.keys(CRM_STATUS).map(function(k){
    return '<option value="'+k+'"'+(c.status===k?' selected':'')+'>'+CRM_STATUS[k].label+'</option>';
  }).join('');

  var delBtn = isNew ? '' : '<button class="btn btn-danger btn-del-wrap" id="cliDel">Excluir</button>';
  var taskBtn = isNew ? '' : '<button class="btn btn-ghost" id="cliTask">+ Tarefa</button>';

  var modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML =
    '<div class="modal">'+
      '<input class="modal-title-input" id="cName" placeholder="Nome do cliente..." value="'+esc(c.name)+'">'+
      '<div class="modal-grid2"><div class="modal-row"><label class="modal-label">Empresa</label><input type="text" id="cCompany" value="'+esc(c.company||'')+'"></div><div class="modal-row"><label class="modal-label">Telefone</label><input type="text" id="cPhone" value="'+esc(c.phone||'')+'"></div></div>'+
      '<div class="modal-grid2"><div class="modal-row"><label class="modal-label">E-mail</label><input type="text" id="cEmail" value="'+esc(c.email||'')+'"></div><div class="modal-row"><label class="modal-label">Status</label><select id="cStatus">'+stOpts+'</select></div></div>'+
      '<div class="modal-row"><label class="modal-label">Observações</label><textarea id="cNotes" placeholder="Anotações sobre o cliente...">'+esc(c.notes||'')+'</textarea></div>'+
      '<div class="modal-foot">'+delBtn+taskBtn+'<button class="btn btn-ghost" id="cliCancel">Cancelar</button><button class="btn btn-primary" id="cliSave">'+(isNew?'Criar':'Salvar')+'</button></div>'+
    '</div>';
  document.body.appendChild(modal);

  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  modal.querySelector('#cliCancel').addEventListener('click', close);
  modal.querySelector('#cName').focus();

  modal.querySelector('#cliSave').addEventListener('click', function(){
    var name=(modal.querySelector('#cName').value||'').trim();
    if (!name) { toast('Informe o nome','error'); return; }
    var rec = {
      name:name,
      company:(modal.querySelector('#cCompany').value||'').trim(),
      phone:(modal.querySelector('#cPhone').value||'').trim(),
      email:(modal.querySelector('#cEmail').value||'').trim(),
      status:modal.querySelector('#cStatus').value,
      notes:(modal.querySelector('#cNotes').value||'').trim(),
      last_contact:today(), updated_at:new Date().toISOString()
    };
    var saveBtn=modal.querySelector('#cliSave'); saveBtn.disabled=true; saveBtn.textContent='Salvando...';
    if (isNew) {
      sb.from('malba_crm_clients').insert(rec).select().single().then(function(r){
        if (r.error || !r.data) { toast('Erro ao salvar cliente','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Criar'; return; }
        ST.clients.unshift(r.data); close(); toast('Cliente criado','success'); renderPage();
      });
    } else {
      sb.from('malba_crm_clients').update(rec).eq('id', c.id).then(function(r){
        if (r.error) { toast('Erro ao salvar','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Salvar'; return; }
        for (var i=0;i<ST.clients.length;i++) if (ST.clients[i].id===c.id) { ST.clients[i]=Object.assign(ST.clients[i],rec); break; }
        close(); toast('Cliente atualizado','success'); renderPage();
      });
    }
  });

  if (!isNew) {
    // criar tarefa a partir do cliente (conecta com a espinha dorsal: tarefas)
    modal.querySelector('#cliTask').addEventListener('click', function(){
      close();
      var titulo = 'Contatar ' + c.name + (c.company ? ' ('+c.company+')' : '');
      openTaskModal({ title:titulo, description:'', priority:'media', status:'todo', due_date:today(), area:'CRM', assignee_id:'' });
    });
    modal.querySelector('#cliDel').addEventListener('click', function(){
      if (!confirm('Excluir o cliente "'+(c.name||'')+'"?')) return;
      sb.from('malba_crm_clients').delete().eq('id', c.id).then(function(r){
        if (r.error) { toast('Erro ao excluir','error'); return; }
        ST.clients = ST.clients.filter(function(x){ return x.id!==c.id; });
        close(); toast('Cliente excluído','success'); renderPage();
      });
    });
  }
}

/* ========== [10e] PROJETOS (com marcos/etapas) ========== */
var PROJ_COLORS = ['#3B6FF7','#16A34A','#F59E0B','#8B5CF6','#EF4444','#0EA5E9'];
var MS_STATUS = { todo:{label:'A fazer',color:'#9aa1ad'}, fazendo:{label:'Em andamento',color:'#3B6FF7'}, feito:{label:'Concluída',color:'#16A34A'} };

function projectMilestones(pid) {
  return ST.milestones.filter(function(m){ return String(m.project_id)===String(pid); })
    .sort(function(a,b){ return (a.position||0)-(b.position||0); });
}
function projProgress(pid) {
  var ms = projectMilestones(pid);
  if (ms.length===0) return 0;
  var done = ms.filter(function(m){ return m.status==='feito'; }).length;
  return Math.round((done/ms.length)*100);
}
function msById(id){ for(var k=0;k<ST.milestones.length;k++) if(String(ST.milestones[k].id)===String(id)) return ST.milestones[k]; return null; }

function projetosHTML() {
  // se um projeto está aberto, mostra o detalhe
  if (ST.openProject) return projetoDetalheHTML(ST.openProject);

  var ps = ST.projects;
  var cards = '';
  if (ps.length===0) {
    cards = '<div class="empty-page" style="grid-column:1/-1"><div class="ep-ico">'+icon('folder')+'</div><h3>Nenhum projeto ainda</h3><p>Crie o primeiro projeto pelo botão acima.</p></div>';
  } else {
    ps.forEach(function(pr){ cards += projectCardHTML(pr); });
  }
  return '<div class="tasks-head"><div><h2>Projetos</h2><div class="sub">'+ps.length+' projeto(s)</div></div><button class="btn-new" id="btnNovoProjeto">'+icon('plus')+'Novo projeto</button></div><div class="proj-grid">'+cards+'</div>';
}

function projectCardHTML(pr) {
  var cor = pr.color || '#3B6FF7';
  var pct = projProgress(pr.id);
  var ms = projectMilestones(pr.id);
  var membros = (pr.members||[]).map(function(uid){ var u=userById(uid); return u?'<span class="proj-av" style="background:'+(u.color||cor)+'" title="'+esc(u.name)+'">'+esc(iniciais(u.name))+'</span>':''; }).join('');
  var prazo = pr.end_date ? ('Prazo: '+fmtDate(pr.end_date)) : '';
  return '<div class="proj-card" data-id="'+esc(pr.id)+'">'+
    '<span class="proj-bar" style="background:'+cor+'"></span>'+
    '<div class="proj-body"><b>'+esc(pr.name)+'</b>'+(pr.description?'<p>'+esc(pr.description)+'</p>':'')+
    '<div class="proj-prog"><div class="proj-prog-bar"><span style="width:'+pct+'%;background:'+cor+'"></span></div><small>'+pct+'% · '+ms.length+' etapa(s)</small></div>'+
    '<div class="proj-foot"><div class="proj-avs">'+membros+'</div>'+(prazo?'<span class="proj-prazo">'+prazo+'</span>':'')+'</div>'+
    '</div></div>';
}

function bindProjetos() {
  if (ST.openProject) { bindProjetoDetalhe(); return; }
  var novo = document.getElementById('btnNovoProjeto');
  if (novo) novo.addEventListener('click', function(){ openProjectModal(null); });
  var cards = app.querySelectorAll('.proj-card');
  for (var i=0;i<cards.length;i++) {
    cards[i].addEventListener('click', function(){ ST.openProject = this.getAttribute('data-id'); renderPage(); });
  }
}

/* ----- Detalhe do projeto ----- */
var expandedMs = null; // id da etapa com painel de passos aberto

function subtaskPanelHTML(m) {
  var subs = m.subtasks || [];
  var items = subs.length ? subs.map(function(s,idx){
    return '<label class="ms-sub"><input type="checkbox" data-subtoggle="'+esc(m.id)+':'+idx+'"'+(s.done?' checked':'')+'><span'+(s.done?' class="done"':'')+'>'+esc(s.title)+'</span><button class="ms-sub-del" data-subdel="'+esc(m.id)+':'+idx+'">✕</button></label>';
  }).join('') : '<div class="ms-sub-empty">Nenhum passo ainda.</div>';
  return '<div class="ms-subs">'+items+'<div class="ms-sub-add"><input type="text" data-subinput="'+esc(m.id)+'" placeholder="Novo passo..."><button class="btn btn-ghost" data-subadd="'+esc(m.id)+'">+ Add</button></div></div>';
}

function projetoDetalheHTML(pid) {
  var pr=null;
  for (var i=0;i<ST.projects.length;i++) if (String(ST.projects[i].id)===String(pid)) { pr=ST.projects[i]; break; }
  if (!pr) { ST.openProject=null; return projetosHTML(); }
  var cor = pr.color || '#3B6FF7';
  var pct = projProgress(pr.id);
  var ms = projectMilestones(pr.id);

  var rows = '';
  if (ms.length===0) {
    rows = '<div class="col-empty">Nenhuma etapa ainda. Adicione a primeira abaixo.</div>';
  } else {
    ms.forEach(function(m){
      var st = MS_STATUS[m.status] || MS_STATUS.todo;
      var u = m.assignee_id ? userById(m.assignee_id) : null;
      var av = u ? '<span class="ms-av" style="background:'+(u.color||cor)+'" title="'+esc(u.name)+'">'+esc(iniciais(u.name))+'</span>' : '';
      var subs = m.subtasks || [];
      var subDone = subs.filter(function(s){ return s.done; }).length;
      var expanded = String(expandedMs)===String(m.id);
      var stepsChip = subs.length
        ? '<button class="ms-steps'+(expanded?' on':'')+'" data-msexp="'+esc(m.id)+'">'+subDone+'/'+subs.length+' passos</button>'
        : '<button class="ms-steps add'+(expanded?' on':'')+'" data-msexp="'+esc(m.id)+'">+ passos</button>';
      rows += '<div class="ms-block">'+
        '<div class="ms-row">'+
          '<button class="ms-check" data-mscheck="'+esc(m.id)+'" style="border-color:'+st.color+';background:'+(m.status==='feito'?st.color:'transparent')+'">'+(m.status==='feito'?icon('tasks'):'')+'</button>'+
          '<span class="ms-name'+(m.status==='feito'?' done':'')+'">'+esc(m.name)+'</span>'+
          stepsChip+
          (m.date?'<span class="ms-date">'+fmtDate(m.date)+'</span>':'')+av+
          '<button class="ms-status" data-msstatus="'+esc(m.id)+'" style="color:'+st.color+';background:'+st.color+'18">'+st.label+'</button>'+
        '</div>'+
        (expanded ? subtaskPanelHTML(m) : '')+
      '</div>';
    });
  }

  return ''+
    '<button class="btn-back" id="projBack">← Voltar aos projetos</button>'+
    '<div class="proj-detail-head" style="border-left:4px solid '+cor+'">'+
      '<div><h2>'+esc(pr.name)+'</h2>'+(pr.description?'<p>'+esc(pr.description)+'</p>':'')+'</div>'+
      '<button class="btn btn-ghost" id="projEdit">Editar projeto</button>'+
    '</div>'+
    '<div class="proj-prog big"><div class="proj-prog-bar"><span style="width:'+pct+'%;background:'+cor+'"></span></div><small>'+pct+'% concluído · '+ms.length+' etapa(s)</small></div>'+
    '<div class="ms-sec"><div class="ms-sec-h">Etapas</div>'+rows+'</div>'+
    '<div class="ms-add"><input id="msName" placeholder="Nova etapa..."><input type="date" id="msDate"><select id="msResp"><option value="">Responsável</option>'+ST.users.map(function(u){return '<option value="'+esc(u.id)+'">'+esc(u.name)+'</option>';}).join('')+'</select><button class="btn btn-primary" id="msAdd">Adicionar</button></div>';
}

function bindProjetoDetalhe() {
  var back=document.getElementById('projBack');
  if (back) back.addEventListener('click', function(){ ST.openProject=null; renderPage(); });
  var edit=document.getElementById('projEdit');
  if (edit) edit.addEventListener('click', function(){
    var pr=null; for (var i=0;i<ST.projects.length;i++) if (String(ST.projects[i].id)===String(ST.openProject)) { pr=ST.projects[i]; break; }
    if (pr) openProjectModal(pr);
  });
  // marcar etapa como feita/refazer (alterna feito <-> todo)
  var checks=app.querySelectorAll('[data-mscheck]');
  for (var i=0;i<checks.length;i++) {
    checks[i].addEventListener('click', function(e){
      e.stopPropagation();
      var id=this.getAttribute('data-mscheck'); var mm=msById(id);
      if (!mm) return;
      var novo = mm.status==='feito' ? 'todo' : 'feito';
      mm.status = novo;
      sb.from('malba_vl_milestones').update({ status:novo }).eq('id', mm.id).then(function(r){ if (r.error) toast('Erro ao atualizar etapa','error'); });
      renderPage();
    });
  }
  // status: cicla todo -> fazendo -> feito (pelo selo de status)
  var stbtns=app.querySelectorAll('[data-msstatus]');
  for (var j=0;j<stbtns.length;j++) {
    stbtns[j].addEventListener('click', function(){
      var id=this.getAttribute('data-msstatus'); var mm=msById(id);
      if (!mm) return;
      var ordem=['todo','fazendo','feito'];
      mm.status = ordem[(ordem.indexOf(mm.status||'todo')+1)%3];
      sb.from('malba_vl_milestones').update({ status:mm.status }).eq('id', mm.id);
      renderPage();
    });
  }
  // expandir/recolher painel de passos
  var exps=app.querySelectorAll('[data-msexp]');
  for (var e=0;e<exps.length;e++) {
    exps[e].addEventListener('click', function(){
      var id=this.getAttribute('data-msexp');
      expandedMs = (String(expandedMs)===String(id)) ? null : id;
      renderPage();
    });
  }
  // marcar passo (subtarefa)
  var subToggles=app.querySelectorAll('[data-subtoggle]');
  for (var s=0;s<subToggles.length;s++) {
    subToggles[s].addEventListener('change', function(){
      var pr=this.getAttribute('data-subtoggle').split(':'); var mm=msById(pr[0]);
      if (!mm || !mm.subtasks) return;
      mm.subtasks[+pr[1]].done = this.checked;
      sb.from('malba_vl_milestones').update({ subtasks:mm.subtasks }).eq('id', mm.id);
      renderPage();
    });
  }
  // excluir passo
  var subDels=app.querySelectorAll('[data-subdel]');
  for (var d=0;d<subDels.length;d++) {
    subDels[d].addEventListener('click', function(ev){
      ev.preventDefault(); ev.stopPropagation();
      var pr=this.getAttribute('data-subdel').split(':'); var mm=msById(pr[0]);
      if (!mm || !mm.subtasks) return;
      mm.subtasks.splice(+pr[1],1);
      sb.from('malba_vl_milestones').update({ subtasks:mm.subtasks }).eq('id', mm.id);
      renderPage();
    });
  }
  // adicionar passo
  var subAdds=app.querySelectorAll('[data-subadd]');
  for (var a2=0;a2<subAdds.length;a2++) {
    subAdds[a2].addEventListener('click', function(){
      var id=this.getAttribute('data-subadd'); var mm=msById(id);
      if (!mm) return;
      var inp=app.querySelector('[data-subinput="'+id+'"]');
      var titulo=(inp&&inp.value||'').trim();
      if (!titulo) return;
      mm.subtasks = mm.subtasks || [];
      mm.subtasks.push({ title:titulo, done:false });
      sb.from('malba_vl_milestones').update({ subtasks:mm.subtasks }).eq('id', mm.id);
      renderPage();
    });
  }
  // adicionar etapa
  var addBtn=document.getElementById('msAdd');
  if (addBtn) addBtn.addEventListener('click', function(){
    var name=(document.getElementById('msName').value||'').trim();
    if (!name) { toast('Informe o nome da etapa','error'); return; }
    var pos=projectMilestones(ST.openProject).length;
    var rec={ project_id:ST.openProject, name:name, date:document.getElementById('msDate').value||null, assignee_id:document.getElementById('msResp').value||null, status:'todo', position:pos, subtasks:[] };
    addBtn.disabled=true; addBtn.textContent='...';
    sb.from('malba_vl_milestones').insert(rec).select().single().then(function(r){
      if (r.error || !r.data) { toast('Erro ao adicionar etapa','error'); console.error(r.error); addBtn.disabled=false; addBtn.textContent='Adicionar'; return; }
      ST.milestones.push(r.data); toast('Etapa adicionada','success'); renderPage();
    });
  });
}

/* ----- Modal de criar/editar projeto ----- */
function openProjectModal(project) {
  var isNew=!project;
  var pr=project||{ name:'', description:'', start_date:'', end_date:'', status:'andamento', color:'#3B6FF7', members:[] };
  var membros=pr.members||[];

  var colorBtns=PROJ_COLORS.map(function(c){ return '<button type="button" class="color-dot'+(pr.color===c?' on':'')+'" data-color="'+c+'" style="background:'+c+'"></button>'; }).join('');
  var memHTML='';
  ST.users.forEach(function(u){
    var on=membros.indexOf(u.id)!==-1;
    memHTML += '<label class="member-pick'+(on?' on':'')+'"><input type="checkbox" data-member="'+esc(u.id)+'"'+(on?' checked':'')+'><span class="member-pick-av" style="background:'+(u.color||'#3B6FF7')+'">'+esc(iniciais(u.name))+'</span>'+esc(u.name)+'</label>';
  });
  if (ST.users.length===0) memHTML='<div style="font-size:12px;color:var(--u-text3)">Nenhuma pessoa no setor</div>';

  var delBtn=isNew?'':'<button class="btn btn-danger btn-del-wrap" id="projDel">Excluir</button>';

  var modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML =
    '<div class="modal">'+
      '<input class="modal-title-input" id="pName" placeholder="Nome do projeto..." value="'+esc(pr.name)+'">'+
      '<div class="modal-row"><label class="modal-label">Descrição</label><textarea id="pDesc" placeholder="Sobre o projeto...">'+esc(pr.description||'')+'</textarea></div>'+
      '<div class="modal-grid2"><div class="modal-row"><label class="modal-label">Início</label><input type="date" id="pStart" value="'+esc((pr.start_date||'').split('T')[0])+'"></div><div class="modal-row"><label class="modal-label">Prazo</label><input type="date" id="pEnd" value="'+esc((pr.end_date||'').split('T')[0])+'"></div></div>'+
      '<div class="modal-row"><label class="modal-label">Equipe do projeto</label><div class="member-picks">'+memHTML+'</div></div>'+
      '<div class="modal-row"><label class="modal-label">Cor</label><div class="color-row" id="pColors">'+colorBtns+'</div></div>'+
      '<div class="modal-foot">'+delBtn+'<button class="btn btn-ghost" id="projCancel">Cancelar</button><button class="btn btn-primary" id="projSave">'+(isNew?'Criar':'Salvar')+'</button></div>'+
    '</div>';
  document.body.appendChild(modal);

  var colorPick=pr.color||'#3B6FF7';
  var dots=modal.querySelectorAll('.color-dot');
  for (var i=0;i<dots.length;i++) dots[i].addEventListener('click', function(){ for(var k=0;k<dots.length;k++) dots[k].classList.remove('on'); this.classList.add('on'); colorPick=this.getAttribute('data-color'); });
  var memCbs=modal.querySelectorAll('[data-member]');
  for (var j=0;j<memCbs.length;j++) memCbs[j].addEventListener('change', function(){ this.closest('.member-pick').classList.toggle('on', this.checked); });

  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  modal.querySelector('#projCancel').addEventListener('click', close);
  modal.querySelector('#pName').focus();

  modal.querySelector('#projSave').addEventListener('click', function(){
    var name=(modal.querySelector('#pName').value||'').trim();
    if (!name) { toast('Informe o nome','error'); return; }
    var sel=[]; modal.querySelectorAll('[data-member]:checked').forEach(function(cb){ sel.push(cb.getAttribute('data-member')); });
    var rec={ sector:ST.sector, name:name, description:(modal.querySelector('#pDesc').value||'').trim(), start_date:modal.querySelector('#pStart').value||null, end_date:modal.querySelector('#pEnd').value||null, members:sel, store_unit_id:ST.store?ST.store.id:null, color:colorPick, status:pr.status||'andamento' };
    var saveBtn=modal.querySelector('#projSave'); saveBtn.disabled=true; saveBtn.textContent='Salvando...';
    if (isNew) {
      sb.from('malba_vl_projects').insert(rec).select().single().then(function(r){
        if (r.error || !r.data) { toast('Erro ao criar projeto','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Criar'; return; }
        ST.projects.unshift(r.data); close(); toast('Projeto criado','success'); renderPage();
      });
    } else {
      sb.from('malba_vl_projects').update(rec).eq('id', pr.id).then(function(r){
        if (r.error) { toast('Erro ao salvar','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Salvar'; return; }
        for (var i=0;i<ST.projects.length;i++) if (ST.projects[i].id===pr.id) { ST.projects[i]=Object.assign(ST.projects[i],rec); break; }
        close(); toast('Projeto atualizado','success'); renderPage();
      });
    }
  });

  if (!isNew) {
    modal.querySelector('#projDel').addEventListener('click', function(){
      if (!confirm('Excluir o projeto "'+(pr.name||'')+'" e todas as etapas?')) return;
      sb.from('malba_vl_projects').delete().eq('id', pr.id).then(function(r){
        if (r.error) { toast('Erro ao excluir','error'); return; }
        ST.projects = ST.projects.filter(function(x){ return x.id!==pr.id; });
        ST.milestones = ST.milestones.filter(function(x){ return String(x.project_id)!==String(pr.id); });
        ST.openProject=null; close(); toast('Projeto excluído','success'); renderPage();
      });
    });
  }
}

/* ========== [10f] CONFIGURAÇÕES / ADMIN (só admin) ========== */
var NIVEIS = {
  user:         { label:'Usuário',        color:'#9aa1ad' },
  sector_admin: { label:'Admin do setor', color:'#3B6FF7' },
  super:        { label:'Super Admin',    color:'#8B5CF6' }
};
// lê o nível de um registro de usuário de forma resiliente
function nivelDe(u) {
  if (u.access_level) return u.access_level;
  if (u.role==='admin') return 'super';
  if (u.role==='sector_admin' || u.sector_role==='admin') return 'sector_admin';
  return 'user';
}

function configHTML() {
  if (!isAdmin(ST.session)) {
    return '<div class="empty-page"><div class="ep-ico">'+icon('gear')+'</div><h3>Acesso restrito</h3><p>Apenas administradores acessam as configurações.</p></div>';
  }
  var tab = ST.configTab || 'usuarios';
  var tabs = '<div class="cfg-tabs">'+
    '<button class="cfg-tab'+(tab==='usuarios'?' on':'')+'" data-tab="usuarios">'+icon('users')+'Usuários</button>'+
    '<button class="cfg-tab'+(tab==='lojas'?' on':'')+'" data-tab="lojas">'+icon('store')+'Lojas</button>'+
    '<button class="cfg-tab'+(tab==='banners'?' on':'')+'" data-tab="banners">'+icon('dashboard')+'Banners</button>'+
  '</div>';

  return '<div class="tasks-head"><div><h2>Configurações</h2><div class="sub">Administração do sistema</div></div></div>'+tabs+'<div id="cfgBody">'+body+'</div>';

function openUserModal(user) {
  var isNew = !user;
  var u = user || { name:'', email:'', sector:ST.sector, color:'#3B6FF7' };

  var canSuper = isSuper(ST.session); // só super pode criar super

    ? '<div class="modal-row"><label class="modal-label">E-mail *</label><input type="text" id="uEmail" placeholder="voce@malba.com.br" value=""></div>'
    : '<div class="modal-row"><label class="modal-label">E-mail</label><input type="text" id="uEmail" value="'+esc(u.email||'')+'" disabled style="opacity:.6"></div>';
  var passField = '<div class="modal-row"><label class="modal-label">Senha '+(isNew?'*':'(deixe em branco para manter)')+'</label><input type="text" id="uPass" placeholder="'+(isNew?'senha de acesso':'•••••••• (inalterada)')+'" value=""></div>';

  var delBtn = (isNew || (u.id===ST.session.user.id)) ? '' : '<button class="btn btn-danger btn-del-wrap" id="userDel">Excluir</button>';

  var modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML =
    '<div class="modal">'+
      '<input class="modal-title-input" id="uName" placeholder="Nome do usuário..." value="'+esc(u.name||'')+'">'+
      emailField + passField +
      '<div class="modal-grid2"><div class="modal-row"><label class="modal-label">Setor</label><select id="uSector">'+sectorOpts+'</select></div><div class="modal-row"><label class="modal-label">Nível de acesso</label><select id="uLevel">'+nivelOpts+'</select></div></div>'+
      '<div class="modal-foot">'+delBtn+'<button class="btn btn-ghost" id="userCancel">Cancelar</button><button class="btn btn-primary" id="userSave">'+(isNew?'Criar usuário':'Salvar')+'</button></div>'+
    '</div>';
  document.body.appendChild(modal);

  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  modal.querySelector('#userCancel').addEventListener('click', close);
  modal.querySelector('#uName').focus();

  modal.querySelector('#userSave').addEventListener('click', function(){
    var name=(modal.querySelector('#uName').value||'').trim();
    var email=(modal.querySelector('#uEmail').value||'').trim().toLowerCase();
    var pass=(modal.querySelector('#uPass').value||'').trim();
    if (!name) { toast('Informe o nome','error'); return; }
    if (isNew && !email) { toast('Informe o e-mail','error'); return; }
    if (isNew && !pass) { toast('Defina uma senha','error'); return; }
    var lvl = modal.querySelector('#uLevel').value;
    // modelo resiliente: grava role + access_level + sector_role coerentes
    var rec = {
      name:name,
      sector:modal.querySelector('#uSector').value,
      access_level:lvl,
      sector_role:(lvl==='user'?'user':'admin'),
      role:(lvl==='super'?'admin':'user')
    };
    if (isNew) { rec.email=email; rec.color=u.color||'#3B6FF7'; rec.initials=iniciais(name); }
    if (pass) rec.password = pass; // novo sistema padroniza na coluna `password`
    var saveBtn=modal.querySelector('#userSave'); saveBtn.disabled=true; saveBtn.textContent='Salvando...';

        if (r.error) { toast('Erro ao salvar','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Salvar'; return; }
        for (var i=0;i<ST.allUsers.length;i++) if (ST.allUsers[i].id===u.id) { ST.allUsers[i]=Object.assign(ST.allUsers[i],rec); break; }
        close(); toast('Usuário atualizado','success'); renderPage();
      });
    }
  });

  if (!isNew && u.id!==ST.session.user.id) {
    modal.querySelector('#userDel').addEventListener('click', function(){
      if (!confirm('Excluir o usuário "'+(u.name||'')+'"?')) return;
      sb.from('malba_users').delete().eq('id', u.id).then(function(r){
        if (r.error) { toast('Erro ao excluir','error'); return; }
        ST.allUsers = ST.allUsers.filter(function(x){ return x.id!==u.id; });
        close(); toast('Usuário excluído','success'); renderPage();
      });
    });
  }
}

function userByIdAll(id){ for(var i=0;i<ST.allUsers.length;i++) if(ST.allUsers[i].id===id) return ST.allUsers[i]; return null; }
function blingDaLoja(id){ var b=ST.bling||[]; for(var i=0;i<b.length;i++) if(String(b[i].store_unit_id)===String(id)) return b[i]; return null; }
function openBlingModal(store) {
  var est = blingDaLoja(store.id);
  var connected = est && est.connected;
  var cid = (est && est.client_id) ? est.client_id : '';
  var modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML='<div class="modal">'+
    '<div class="modal-title-input" style="cursor:default">Bling · '+esc(store.name||('Loja '+store.store_number))+'</div>'+
    (connected?'<div class="bling-ok-note">'+icon('trend')+'Esta loja já está conectada ao Bling.</div>':'')+
    '<div class="bling-help">Cole o <b>Client ID</b> e o <b>Client Secret</b> do app criado na conta Bling <b>desta loja</b> (developer.bling.com.br → app Privado).</div>'+
    '<div class="modal-row"><label class="modal-label">Client ID</label><input type="text" id="blCid" placeholder="client_id da loja" value="'+esc(cid)+'"></div>'+
    '<div class="modal-row"><label class="modal-label">Client Secret</label><input type="password" id="blSecret" placeholder="client_secret da loja" autocomplete="new-password"></div>'+
    '<div class="bling-help" style="margin-top:2px">O Client Secret fica guardado em segurança e não é exibido de volta.'+(cid?' Já configurado antes? Deixe o Secret em branco para manter o atual.':'')+'</div>'+
    '<div class="modal-foot"><button class="btn btn-ghost" id="blCancel">Fechar</button><button class="btn btn-primary" id="blSave">Salvar e conectar</button></div>'+
  '</div>';
  document.body.appendChild(modal);
  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click',function(e){ if(e.target===modal) close(); });
  modal.querySelector('#blCancel').addEventListener('click', close);
  modal.querySelector('#blSave').addEventListener('click', function(){
    var clientId=(modal.querySelector('#blCid').value||'').trim();
    var secret=(modal.querySelector('#blSecret').value||'').trim();
    if(!clientId){ toast('Informe o Client ID','error'); return; }
    if(!secret && !cid){ toast('Informe o Client Secret','error'); return; }
    var btn=modal.querySelector('#blSave'); btn.disabled=true; btn.textContent='Salvando...';
    var now=new Date().toISOString();
    var appRow={ store_unit_id:store.id, client_id:clientId, updated_at:now };
    if(secret) appRow.client_secret=secret;
    sb.from('malba_bling_apps').upsert(appRow, { onConflict:'store_unit_id' }).then(function(r1){
      if (r1.error) { console.error('[bling apps]', r1.error); toast('Erro (apps): '+(r1.error.message||r1.error.hint||'falha'),'error'); btn.disabled=false; btn.textContent='Salvar e conectar'; return; }
      sb.from('malba_bling_estado').upsert({ store_unit_id:store.id, client_id:clientId, updated_at:now }, { onConflict:'store_unit_id' }).then(function(r2){
        if (r2.error) { console.error('[bling estado]', r2.error); toast('Erro (estado): '+(r2.error.message||r2.error.hint||'falha'),'error'); btn.disabled=false; btn.textContent='Salvar e conectar'; return; }
        toast('Credenciais salvas. Indo ao Bling para autorizar...','success');
        setTimeout(function(){ window.location.href = blingAuthUrl(clientId, store.id); }, 700);
      });
    });
  });
}

function openStoreModal(store) {
  var isNew = !store;
  var s = store || { name:'', store_number:(ST.storeUnits.length+1), district:'', address:'', phone:'', whatsapp:'', email:'', user_id:null };

var BANNER_GRADS = [
  'linear-gradient(120deg,#1a1040,#0d1b4d 45%,#0a2540)',
  'linear-gradient(135deg,#3B6FF7,#6366F1)',
  'linear-gradient(135deg,#16A34A,#0EA5E9)',
  'linear-gradient(135deg,#F59E0B,#EF4444)',
  'linear-gradient(135deg,#8B5CF6,#EC4899)',
  'linear-gradient(135deg,#0F172A,#334155)'
];
function bannersAdminHTML() {
  var list = (ST.banners||[]).slice().sort(function(a,b){ return (a.position||0)-(b.position||0); });
  var rows = '';
  if (list.length===0) {
    rows = '<div class="empty-page"><div class="ep-ico">'+icon('dashboard')+'</div><h3>Nenhum banner</h3><p>Crie um banner pra aparecer no Início dos setores.</p></div>';
  } else {
    rows = '<div class="banner-list">';
    list.forEach(function(b){
      var secs = (b.sectors||[]).map(function(s){ return SECTORS[s]?SECTORS[s].label:s; }).join(', ') || 'Todos os setores';
      var bg = b.image_url_desktop ? ('center/cover url("'+b.image_url_desktop+'")') : (b.bg_gradient||'var(--u-grad-hero)');
      var off = b.is_active===false;

        '<span class="banner-thumb" style="background:'+bg+'"></span>'+

        '<span class="crm-status" style="color:'+(off?'#9aa1ad':'#16A34A')+';background:'+(off?'#9aa1ad':'#16A34A')+'18">'+(off?'Inativo':'Ativo')+'</span>'+
      '</div>';

function openBannerModal(banner) {
  var isNew = !banner;
  var b = banner || { title:'', description:'', bg_gradient:BANNER_GRADS[0], image_url_desktop:null, link_url:'', sectors:[], is_active:true, store_unit_id:null };
  var imgData = b.image_url_desktop || null;

  var gradBtns = BANNER_GRADS.map(function(g){
    return '<button type="button" class="grad-dot'+(b.bg_gradient===g?' on':'')+'" data-grad="'+esc(g)+'" style="background:'+g+'"></button>';
  }).join('');
  var secChecks = Object.keys(SECTORS).map(function(k){
    var on=(b.sectors||[]).indexOf(k)!==-1;
    return '<label class="member-pick'+(on?' on':'')+'"><input type="checkbox" data-bsec="'+k+'"'+(on?' checked':'')+'>'+esc(SECTORS[k].label)+'</label>';
  }).join('');

  var delBtn = isNew ? '' : '<button class="btn btn-danger btn-del-wrap" id="bannerDel">Excluir</button>';

  var modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML =
    '<div class="modal">'+
      '<input class="modal-title-input" id="bTitle" placeholder="Título do banner..." value="'+esc(b.title||'')+'">'+
      '<div class="modal-row"><label class="modal-label">Subtítulo</label><input type="text" id="bSub" value="'+esc(b.description||'')+'"></div>'+
      '<div class="modal-row"><label class="modal-label">Cor de fundo</label><div class="color-row" id="bGrads">'+gradBtns+'</div></div>'+
      '<div class="modal-row"><label class="modal-label">Imagem (opcional — substitui a cor)</label><div class="banner-up" id="bUpBox"><span id="bUpTxt">'+(imgData?'Imagem carregada — clique para trocar':'Clique para enviar uma imagem')+'</span><input type="file" accept="image/*" id="bImg" style="display:none"></div><div id="bPrev" class="banner-prev" style="'+(imgData?('background:center/cover url(\''+imgData+'\');display:block'):'display:none')+'"></div></div>'+
      '<div class="modal-row"><label class="modal-label">Link ao clicar (opcional)</label><input type="text" id="bLink" placeholder="https://..." value="'+esc(b.link_url||'')+'"></div>'+
      '<div class="modal-row"><label class="modal-label">Aparece nos setores</label><div class="member-picks">'+secChecks+'</div></div>'+
      '<div class="modal-row"><label class="modal-label">Situação</label><div class="pills" id="bStatus"><button type="button" class="pill bs-pill'+(b.is_active!==false?' on':'')+'" data-act="1" style="color:#16A34A"><span class="pdot" style="background:#16A34A"></span>Ativo</button><button type="button" class="pill bs-pill'+(b.is_active===false?' on':'')+'" data-act="0" style="color:#9aa1ad"><span class="pdot" style="background:#9aa1ad"></span>Inativo</button></div></div>'+
      '<div class="modal-foot">'+delBtn+'<button class="btn btn-ghost" id="bannerCancel">Cancelar</button><button class="btn btn-primary" id="bannerSave">'+(isNew?'Criar banner':'Salvar')+'</button></div>'+
    '</div>';
  document.body.appendChild(modal);

  var gradPick = b.bg_gradient || BANNER_GRADS[0];
  var gdots = modal.querySelectorAll('.grad-dot');
  for (var i=0;i<gdots.length;i++) gdots[i].addEventListener('click', function(){ for(var k=0;k<gdots.length;k++) gdots[k].classList.remove('on'); this.classList.add('on'); gradPick=this.getAttribute('data-grad'); });

  var actPick = (b.is_active !== false);
  bindPills(modal, '#bStatus .bs-pill', 'act', function(v){ actPick=(v==='1'); });
  var secCbs = modal.querySelectorAll('[data-bsec]');
  for (var j=0;j<secCbs.length;j++) secCbs[j].addEventListener('change', function(){ this.closest('.member-pick').classList.toggle('on', this.checked); });

  // upload de imagem -> base64
  var upBox=modal.querySelector('#bUpBox'), fileEl=modal.querySelector('#bImg'), prev=modal.querySelector('#bPrev'), upTxt=modal.querySelector('#bUpTxt');
  upBox.addEventListener('click', function(){ fileEl.click(); });
  fileEl.addEventListener('change', function(){
    var f=this.files&&this.files[0]; if(!f) return;
    if (f.size > 1.5*1024*1024) { toast('Imagem muito grande (máx ~1,5MB)','error'); return; }
    var reader=new FileReader();
    reader.onload=function(ev){ imgData=ev.target.result; prev.style.background='center/cover url("'+imgData+'")'; prev.style.display='block'; upTxt.textContent='Imagem carregada — clique para trocar'; };
    reader.readAsDataURL(f);
  });

  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  modal.querySelector('#bannerCancel').addEventListener('click', close);
  modal.querySelector('#bTitle').focus();

  modal.querySelector('#bannerSave').addEventListener('click', function(){
    var title=(modal.querySelector('#bTitle').value||'').trim();
    if (!title) { toast('Informe o título','error'); return; }
    var secs=[]; modal.querySelectorAll('[data-bsec]:checked').forEach(function(cb){ secs.push(cb.getAttribute('data-bsec')); });
    var rec = {
      title:title,
      description:(modal.querySelector('#bSub').value||'').trim(),
      bg_gradient:gradPick,
      image_url_desktop:imgData||null,
      image_url_mobile:imgData||null,
      link_url:(modal.querySelector('#bLink').value||'').trim()||null,
      sectors:secs,
      is_active:actPick,
      store_unit_id:null
    };
    var saveBtn=modal.querySelector('#bannerSave'); saveBtn.disabled=true; saveBtn.textContent='Salvando...';
    if (isNew) {
      rec.position=(ST.banners||[]).length;
      sb.from('malba_banners').insert(rec).select().single().then(function(r){
        if (r.error || !r.data) { toast('Erro ao criar banner','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Criar banner'; return; }
        ST.banners.push(r.data); close(); toast('Banner criado','success'); renderPage();
      });
    } else {
      sb.from('malba_banners').update(rec).eq('id', b.id).then(function(r){
        if (r.error) { toast('Erro ao salvar','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Salvar'; return; }
        for (var i=0;i<ST.banners.length;i++) if (ST.banners[i].id===b.id) { ST.banners[i]=Object.assign(ST.banners[i],rec); break; }
        close(); toast('Banner atualizado','success'); renderPage();
      });
    }
  });

  if (!isNew) {
    modal.querySelector('#bannerDel').addEventListener('click', function(){
      if (!confirm('Excluir este banner?')) return;
      sb.from('malba_banners').delete().eq('id', b.id).then(function(r){
        if (r.error) { toast('Erro ao excluir','error'); return; }
        ST.banners = ST.banners.filter(function(x){ return x.id!==b.id; });
        close(); toast('Banner excluído','success'); renderPage();
      });
    });
  }
}

function bindConfig() {
  if (!isAdmin(ST.session)) return;
  var tabs = app.querySelectorAll('.cfg-tab');
  for (var i=0;i<tabs.length;i++) tabs[i].addEventListener('click', function(){ ST.configTab=this.getAttribute('data-tab'); renderPage(); });

  var nu = document.getElementById('btnNovoUser');
  if (nu) nu.addEventListener('click', function(){ openUserModal(null); });
  var uRows = app.querySelectorAll('.cfg-row[data-uid]');
  for (var j=0;j<uRows.length;j++) uRows[j].addEventListener('click', function(){
    var id=this.getAttribute('data-uid'); var u=userByIdAll(id);
    if (u) openUserModal(u);
  });

  var nl = document.getElementById('btnNovaLoja');
  if (nl) nl.addEventListener('click', function(){ openStoreModal(null); });
  var bs = document.getElementById('btnSyncBling');
  if (bs) bs.addEventListener('click', function(){
    var old=bs.innerHTML; bs.disabled=true; bs.textContent='Sincronizando...';
    toast('Buscando vendas no Bling...','success');
    fetch(SUPABASE_URL+'/functions/v1/bling-sync', {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'apikey':SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body:'{}'
    }).then(function(res){ return res.json().catch(function(){ return { httpStatus:res.status }; }); }).then(function(d){
      bs.disabled=false; bs.innerHTML=old;
      console.log('[bling-sync]', d);
      if (!d || d.ok!==true) { toast('Sincronização: '+((d&&(d.message||d.error))||('falha HTTP '+(d&&d.httpStatus||'')) ),'error'); return; }
      var rs=d.results||[]; var erros=rs.filter(function(x){ return x.erro; });
      if (erros.length) { toast('Sincronizou, mas '+erros.length+' loja(s) com aviso (veja o console)','error'); }
      else { toast('Bling sincronizado! '+rs.length+' loja(s)','success'); }
      loadData().then(function(){ renderPage(); });
    }).catch(function(e){ bs.disabled=false; bs.innerHTML=old; console.error(e); toast('Erro ao sincronizar: '+e.message,'error'); });
  });
  var sRows = app.querySelectorAll('.cfg-row[data-sid]');
  for (var k=0;k<sRows.length;k++) sRows[k].addEventListener('click', function(){
    var id=this.getAttribute('data-sid'); var st=null;
    for (var x=0;x<ST.storeUnits.length;x++) if (String(ST.storeUnits[x].id)===String(id)) { st=ST.storeUnits[x]; break; }
    if (st) openStoreModal(st);
  });
  var blingBtns = app.querySelectorAll('.bling-btn[data-bling]');
  for (var bb2=0;bb2<blingBtns.length;bb2++) blingBtns[bb2].addEventListener('click', function(e){
    e.stopPropagation();
    var sid=this.getAttribute('data-bling'); var st=null;
    for (var x=0;x<ST.storeUnits.length;x++) if (String(ST.storeUnits[x].id)===String(sid)) { st=ST.storeUnits[x]; break; }
    if (st) openBlingModal(st);
  });

  var nb = document.getElementById('btnNovoBanner');
  if (nb) nb.addEventListener('click', function(){ openBannerModal(null); });
  var bRows = app.querySelectorAll('.banner-item[data-bid]');
  for (var z=0;z<bRows.length;z++) bRows[z].addEventListener('click', function(){
    var id=this.getAttribute('data-bid'); var bb=null;
    for (var x=0;x<ST.banners.length;x++) if (String(ST.banners[x].id)===String(id)) { bb=ST.banners[x]; break; }
    if (bb) openBannerModal(bb);
  });
}

/* ========== [10g] CAMPANHAS (Marketing) ========== */
var CAMP_COLORS = ['#3B6FF7','#E53935','#1E88E5','#43A047','#8E24AA','#FB8C00','#D81B60','#00ACC1'];
function uid(){ return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():('c'+Date.now()+Math.random().toString(36).slice(2,8)); }

function campStatus(c) {
  var t=today();
  var ini=(c.start_date||'').split('T')[0], fim=(c.end_date||'').split('T')[0];
  if (fim && fim<t) return { label:'Encerrada', color:'#9aa1ad' };
  if (ini && ini>t) return { label:'Agendada', color:'#F59E0B' };
  return { label:'Ativa', color:'#16A34A' };
}

function campanhasHTML() {
  var admin = isAdmin(ST.session);
  var cs = ST.campaigns.slice().sort(function(a,b){ return (b.start_date||'').localeCompare(a.start_date||''); });
  var cards='';
  if (cs.length===0) {
    var msg = admin ? 'Crie a primeira campanha pelo botão acima.' : 'Nenhuma campanha cadastrada.';
    cards = '<div class="empty-page" style="grid-column:1/-1"><div class="ep-ico">'+icon('megaphone')+'</div><h3>Nenhuma campanha</h3><p>'+msg+'</p></div>';
  } else {
    cs.forEach(function(c){ cards += campCardHTML(c); });
  }
  var btn = admin ? '<button class="btn-new" id="btnNovaCamp">'+icon('plus')+'Nova campanha</button>' : '';
  return '<div class="tasks-head"><div><h2>Campanhas</h2><div class="sub">'+cs.length+' campanha(s)</div></div>'+btn+'</div><div class="camp-grid">'+cards+'</div>';
}
function campCardHTML(c) {
  var cor=c.color||'#3B6FF7';
  var st=campStatus(c);
  var nTasks=(c.tasks||[]).length, nPart=(c.user_ids||[]).length;
  var periodo = (c.start_date?fmtDate(c.start_date):'') + (c.end_date?(' → '+fmtDate(c.end_date)):'');
  return '<div class="camp-card" data-id="'+esc(c.id)+'">'+
    '<span class="camp-bar" style="background:'+cor+'"></span>'+
    '<div class="camp-body"><div class="camp-top"><b>'+esc(c.name)+'</b><span class="crm-status" style="color:'+st.color+';background:'+st.color+'18">'+st.label+'</span></div>'+
    (c.description?'<p>'+esc(c.description)+'</p>':'')+
    '<div class="camp-meta"><span class="tc-date">'+icon('cal')+(periodo||'sem datas')+'</span>'+(c.area?'<span class="tc-chip">'+esc(c.area)+'</span>':'')+'</div>'+
    '<div class="camp-foot"><span>'+nTasks+' tarefa(s)</span><span>'+nPart+' participante(s)</span></div>'+
    '</div></div>';

function bindCampanhas() {
  var admin = isAdmin(ST.session);
  var nova=document.getElementById('btnNovaCamp');
  if (nova && admin) nova.addEventListener('click', function(){ openCampaignModal(null); });
  if (!admin) return;
  var cards=app.querySelectorAll('.camp-card');
  for (var i=0;i<cards.length;i++) cards[i].addEventListener('click', function(){
    var id=this.getAttribute('data-id'); var c=null;
    for (var k=0;k<ST.campaigns.length;k++) if (String(ST.campaigns[k].id)===String(id)) { c=ST.campaigns[k]; break; }
    if (c) openCampaignModal(c);
  });

    '<div class="modal">'+

      '<div class="modal-grid2"><div class="modal-row"><label class="modal-label">Área</label><input type="text" id="cpArea" placeholder="ex: Redes sociais" value="'+esc(c.area||'')+'"></div><div class="modal-row"><label class="modal-label">Cor</label><div class="color-row" id="cpColors">'+colorBtns+'</div></div></div>'+
