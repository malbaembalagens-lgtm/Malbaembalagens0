function openUserModal(user) {
  if(!canManage()){ blockManage(); return; }
  var isNew = !user;
  var u = user || { name:'', email:'', sector:ST.sector, color:'#3B6FF7' };
  var nivel = isNew ? 'user' : nivelDe(u);
  var grantorRank = roleRank(ST.session); // só posso conceder níveis abaixo (ou igual) ao meu
  var NIV_ORDER = ['user','store_manager','sector_admin','admin_geral','super'];
  var nivelOpts = NIV_ORDER.filter(function(k){ return NIVEIS[k].rank <= grantorRank; }).map(function(k){
    return '<option value="'+k+'"'+(nivel===k?' selected':'')+'>'+NIVEIS[k].label+'</option>';
  }).join('');
  var canSuper = isSuper(ST.session);
  var sectorOpts = Object.keys(SECTORS).map(function(k){ return '<option value="'+k+'"'+(u.sector===k?' selected':'')+'>'+SECTORS[k].label+'</option>'; }).join('');

  var emailField = isNew
    ? '<div class="modal-row"><label class="modal-label">E-mail *</label><input type="text" id="uEmail" placeholder="voce@malba.com.br" value=""></div>'
    : '<div class="modal-row"><label class="modal-label">E-mail</label><input type="text" id="uEmail" value="'+esc(u.email||'')+'" disabled style="opacity:.6"></div>';
  var passField = '<div class="modal-row"><label class="modal-label">Senha '+(isNew?'*':'(deixe em branco para manter)')+'</label><input type="text" id="uPass" placeholder="'+(isNew?'senha de acesso':'•••••••• (inalterada)')+'" value=""></div>';

  var delBtn = (isNew || (u.id===ST.session.user.id)) ? '' : '<button class="btn btn-danger btn-del-wrap" id="userDel">Excluir</button>';

  var modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML =
    '<div class="modal">'+
      '<input class="modal-title-input" id="uName" placeholder="Nome do usuário..." value="'+esc(u.name||'')+'">'+
      emailField + passField +
      '<div class="modal-grid2"><div class="modal-row"><label class="modal-label">Setor</label><select id="uSector">'+sectorOpts+'</select></div><div class="modal-row"><label class="modal-label">Nível de acesso</label><select id="uLevel">'+nivelOpts+'</select></div></div>'+
      '<div class="modal-foot">'+delBtn+'<button class="btn btn-ghost" id="userCancel">Cancelar</button><button class="btn btn-primary" id="userSave">'+(isNew?'Criar usuário':'Salvar')+'</button></div>'+
    '</div>';
  document.body.appendChild(modal);

  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  modal.querySelector('#userCancel').addEventListener('click', close);
  modal.querySelector('#uName').focus();

  modal.querySelector('#userSave').addEventListener('click', function(){
    var name=(modal.querySelector('#uName').value||'').trim();
    var email=(modal.querySelector('#uEmail').value||'').trim().toLowerCase();
    var pass=(modal.querySelector('#uPass').value||'').trim();
    if (!name) { toast('Informe o nome','error'); return; }
    if (isNew && !email) { toast('Informe o e-mail','error'); return; }
    if (isNew && !pass) { toast('Defina uma senha','error'); return; }
    var lvl = modal.querySelector('#uLevel').value;
    // modelo resiliente: grava role + access_level + sector_role coerentes com a hierarquia
    var ehAdminSetor = (lvl==='sector_admin' || lvl==='admin_geral' || lvl==='super');
    var rec = {
      name:name,
      sector:modal.querySelector('#uSector').value,
      access_level:lvl,
      sector_role:(ehAdminSetor?'admin':'user'),
      role:(lvl==='super'?'admin':'user')
    };
    if (isNew) { rec.email=email; rec.color=u.color||'#3B6FF7'; rec.initials=iniciais(name); }
    if (pass) rec.password = pass; // novo sistema padroniza na coluna `password`
    var saveBtn=modal.querySelector('#userSave'); saveBtn.disabled=true; saveBtn.textContent='Salvando...';
    if (isNew) {
      sb.from('malba_users').insert(rec).select().single().then(function(r){
        if (r.error || !r.data) { toast('Erro ao criar (e-mail já existe?)','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Criar usuário'; return; }
        ST.allUsers.push(r.data); auditLog('Criou usuário', name+' · '+(NIVEIS[lvl]?NIVEIS[lvl].label:lvl)); close(); toast('Usuário criado','success'); renderPage();
      });
    } else {
      sb.from('malba_users').update(rec).eq('id', u.id).then(function(r){
        if (r.error) { toast('Erro ao salvar','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Salvar'; return; }
        for (var i=0;i<ST.allUsers.length;i++) if (ST.allUsers[i].id===u.id) { ST.allUsers[i]=Object.assign(ST.allUsers[i],rec); break; }
        close(); toast('Usuário atualizado','success'); renderPage();
      });
    }
  });

  if (!isNew && u.id!==ST.session.user.id) {
    modal.querySelector('#userDel').addEventListener('click', function(){
      if (!confirm('Excluir o usuário "'+(u.name||'')+'"?')) return;
      sb.from('malba_users').delete().eq('id', u.id).then(function(r){
        if (r.error) { toast('Erro ao excluir','error'); return; }
        ST.allUsers = ST.allUsers.filter(function(x){ return x.id!==u.id; });
        close(); toast('Usuário excluído','success'); renderPage();
      });
    });
  }
}

function userByIdAll(id){ for(var i=0;i<ST.allUsers.length;i++) if(ST.allUsers[i].id===id) return ST.allUsers[i]; return null; }
function blingDaLoja(id){ var b=ST.bling||[]; for(var i=0;i<b.length;i++) if(String(b[i].store_unit_id)===String(id)) return b[i]; return null; }
function openBlingModal(store) {
  var est = blingDaLoja(store.id);
  var connected = est && est.connected;
  var cid = (est && est.client_id) ? est.client_id : '';
  var modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML='<div class="modal">'+
    '<div class="modal-title-input" style="cursor:default">Bling · '+esc(store.name||('Loja '+store.store_number))+'</div>'+
    (connected?'<div class="bling-ok-note">'+icon('trend')+'Esta loja já está conectada ao Bling.</div>':'')+
    '<div class="bling-help">Cole o <b>Client ID</b> e o <b>Client Secret</b> do app criado na conta Bling <b>desta loja</b> (developer.bling.com.br → app Privado).</div>'+
    '<div class="modal-row"><label class="modal-label">Client ID</label><input type="text" id="blCid" placeholder="client_id da loja" value="'+esc(cid)+'"></div>'+
    '<div class="modal-row"><label class="modal-label">Client Secret</label><input type="password" id="blSecret" placeholder="client_secret da loja" autocomplete="new-password"></div>'+
    '<div class="bling-help" style="margin-top:2px">O Client Secret fica guardado em segurança e não é exibido de volta.'+(cid?' Já configurado antes? Deixe o Secret em branco para manter o atual.':'')+'</div>'+
    '<div class="modal-foot"><button class="btn btn-ghost" id="blCancel">Fechar</button><button class="btn btn-primary" id="blSave">Salvar e conectar</button></div>'+
  '</div>';
  document.body.appendChild(modal);
  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click',function(e){ if(e.target===modal) close(); });
  modal.querySelector('#blCancel').addEventListener('click', close);
  modal.querySelector('#blSave').addEventListener('click', function(){
    var clientId=(modal.querySelector('#blCid').value||'').trim();
    var secret=(modal.querySelector('#blSecret').value||'').trim();
    if(!clientId){ toast('Informe o Client ID','error'); return; }
    if(!secret && !cid){ toast('Informe o Client Secret','error'); return; }
    var btn=modal.querySelector('#blSave'); btn.disabled=true; btn.textContent='Salvando...';
    var now=new Date().toISOString();
    var appRow={ store_unit_id:store.id, client_id:clientId, updated_at:now };
    if(secret) appRow.client_secret=secret;
    sb.from('malba_bling_apps').upsert(appRow, { onConflict:'store_unit_id' }).then(function(r1){
      if (r1.error) { console.error('[bling apps]', r1.error); toast('Erro (apps): '+(r1.error.message||r1.error.hint||'falha'),'error'); btn.disabled=false; btn.textContent='Salvar e conectar'; return; }
      sb.from('malba_bling_estado').upsert({ store_unit_id:store.id, client_id:clientId, updated_at:now }, { onConflict:'store_unit_id' }).then(function(r2){
        if (r2.error) { console.error('[bling estado]', r2.error); toast('Erro (estado): '+(r2.error.message||r2.error.hint||'falha'),'error'); btn.disabled=false; btn.textContent='Salvar e conectar'; return; }
        toast('Credenciais salvas. Indo ao Bling para autorizar...','success');
        setTimeout(function(){ window.location.href = blingAuthUrl(clientId, store.id); }, 700);
      });
    });
  });
}

      rows += '<div class="banner-item'+(off?' off':'')+'" data-bid="'+esc(b.id)+'">'+

        '<div class="banner-meta"><b>'+esc(b.title||'(sem título)')+'</b><i>'+esc(secs)+'</i></div>'+
        '<span class="crm-status" style="color:'+(off?'#9aa1ad':'#16A34A')+';background:'+(off?'#9aa1ad':'#16A34A')+'18">'+(off?'Inativo':'Ativo')+'</span>'+
      '</div>';
    });
    rows += '</div>';
  }
  return '<div class="cfg-sec-head"><span>'+list.length+' banner(s)</span>'+(canManage()?'<button class="btn-new" id="btnNovoBanner">'+icon('plus')+'Novo banner</button>':'')+'</div>'+rows;
}

function openBannerModal(banner) {
  if(!canManage()){ blockManage(); return; }
  var isNew = !banner;
  var b = banner || { title:'', description:'', bg_gradient:BANNER_GRADS[0], image_url_desktop:null, link_url:'', sectors:[], is_active:true, store_unit_id:null };
  var imgData = b.image_url_desktop || null;

  var gradBtns = BANNER_GRADS.map(function(g){
    return '<button type="button" class="grad-dot'+(b.bg_gradient===g?' on':'')+'" data-grad="'+esc(g)+'" style="background:'+g+'"></button>';
  }).join('');
  var secChecks = Object.keys(SECTORS).map(function(k){
    var on=(b.sectors||[]).indexOf(k)!==-1;
    return '<label class="member-pick'+(on?' on':'')+'"><input type="checkbox" data-bsec="'+k+'"'+(on?' checked':'')+'>'+esc(SECTORS[k].label)+'</label>';
  }).join('');

  var delBtn = isNew ? '' : '<button class="btn btn-danger btn-del-wrap" id="bannerDel">Excluir</button>';

  var modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML =
    '<div class="modal">'+
      '<input class="modal-title-input" id="bTitle" placeholder="Título do banner..." value="'+esc(b.title||'')+'">'+
      '<div class="modal-row"><label class="modal-label">Subtítulo</label><input type="text" id="bSub" value="'+esc(b.description||'')+'"></div>'+
      '<div class="modal-row"><label class="modal-label">Cor de fundo</label><div class="color-row" id="bGrads">'+gradBtns+'</div></div>'+
      '<div class="modal-row"><label class="modal-label">Imagem (opcional — substitui a cor)</label><div class="banner-up" id="bUpBox"><span id="bUpTxt">'+(imgData?'Imagem carregada — clique para trocar':'Clique para enviar uma imagem')+'</span><input type="file" accept="image/*" id="bImg" style="display:none"></div><div id="bPrev" class="banner-prev" style="'+(imgData?('background:center/cover url(\''+imgData+'\');display:block'):'display:none')+'"></div></div>'+
      '<div class="modal-row"><label class="modal-label">Link ao clicar (opcional)</label><input type="text" id="bLink" placeholder="https://..." value="'+esc(b.link_url||'')+'"></div>'+
      '<div class="modal-row"><label class="modal-label">Aparece nos setores</label><div class="member-picks">'+secChecks+'</div></div>'+
      '<div class="modal-row"><label class="modal-label">Situação</label><div class="pills" id="bStatus"><button type="button" class="pill bs-pill'+(b.is_active!==false?' on':'')+'" data-act="1" style="color:#16A34A"><span class="pdot" style="background:#16A34A"></span>Ativo</button><button type="button" class="pill bs-pill'+(b.is_active===false?' on':'')+'" data-act="0" style="color:#9aa1ad"><span class="pdot" style="background:#9aa1ad"></span>Inativo</button></div></div>'+
      '<div class="modal-foot">'+delBtn+'<button class="btn btn-ghost" id="bannerCancel">Cancelar</button><button class="btn btn-primary" id="bannerSave">'+(isNew?'Criar banner':'Salvar')+'</button></div>'+
    '</div>';
  document.body.appendChild(modal);

  var gradPick = b.bg_gradient || BANNER_GRADS[0];
  var gdots = modal.querySelectorAll('.grad-dot');
  for (var i=0;i<gdots.length;i++) gdots[i].addEventListener('click', function(){ for(var k=0;k<gdots.length;k++) gdots[k].classList.remove('on'); this.classList.add('on'); gradPick=this.getAttribute('data-grad'); });

  var actPick = (b.is_active !== false);
  bindPills(modal, '#bStatus .bs-pill', 'act', function(v){ actPick=(v==='1'); });
  var secCbs = modal.querySelectorAll('[data-bsec]');
  for (var j=0;j<secCbs.length;j++) secCbs[j].addEventListener('change', function(){ this.closest('.member-pick').classList.toggle('on', this.checked); });

  // upload de imagem -> base64
  var upBox=modal.querySelector('#bUpBox'), fileEl=modal.querySelector('#bImg'), prev=modal.querySelector('#bPrev'), upTxt=modal.querySelector('#bUpTxt');
  upBox.addEventListener('click', function(){ fileEl.click(); });
  fileEl.addEventListener('change', function(){
    var f=this.files&&this.files[0]; if(!f) return;
    if (f.size > 1.5*1024*1024) { toast('Imagem muito grande (máx ~1,5MB)','error'); return; }
    var reader=new FileReader();
    reader.onload=function(ev){ imgData=ev.target.result; prev.style.background='center/cover url("'+imgData+'")'; prev.style.display='block'; upTxt.textContent='Imagem carregada — clique para trocar'; };
    reader.readAsDataURL(f);
  });

  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  modal.querySelector('#bannerCancel').addEventListener('click', close);
  modal.querySelector('#bTitle').focus();

  modal.querySelector('#bannerSave').addEventListener('click', function(){
    var title=(modal.querySelector('#bTitle').value||'').trim();
    if (!title) { toast('Informe o título','error'); return; }
    var secs=[]; modal.querySelectorAll('[data-bsec]:checked').forEach(function(cb){ secs.push(cb.getAttribute('data-bsec')); });
    var rec = {
      title:title,
      description:(modal.querySelector('#bSub').value||'').trim(),
      bg_gradient:gradPick,
      image_url_desktop:imgData||null,
      image_url_mobile:imgData||null,
      link_url:(modal.querySelector('#bLink').value||'').trim()||null,
      sectors:secs,
      is_active:actPick,
      store_unit_id:null
    };
    var saveBtn=modal.querySelector('#bannerSave'); saveBtn.disabled=true; saveBtn.textContent='Salvando...';
    if (isNew) {
      rec.position=(ST.banners||[]).length;
      sb.from('malba_banners').insert(rec).select().single().then(function(r){
        if (r.error || !r.data) { toast('Erro ao criar banner','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Criar banner'; return; }
        ST.banners.push(r.data); close(); toast('Banner criado','success'); renderPage();
      });
    } else {
      sb.from('malba_banners').update(rec).eq('id', b.id).then(function(r){
        if (r.error) { toast('Erro ao salvar','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Salvar'; return; }
        for (var i=0;i<ST.banners.length;i++) if (ST.banners[i].id===b.id) { ST.banners[i]=Object.assign(ST.banners[i],rec); break; }
        close(); toast('Banner atualizado','success'); renderPage();
      });
    }
  });

  if (!isNew) {
    modal.querySelector('#bannerDel').addEventListener('click', function(){
      if (!confirm('Excluir este banner?')) return;
      sb.from('malba_banners').delete().eq('id', b.id).then(function(r){
        if (r.error) { toast('Erro ao excluir','error'); return; }
        ST.banners = ST.banners.filter(function(x){ return x.id!==b.id; });
        close(); toast('Banner excluído','success'); renderPage();
      });
    });
  }
}

function bindConfig() {
  if (!isAdmin(ST.session)) return;
  var tabs = app.querySelectorAll('.cfg-tab');
  for (var i=0;i<tabs.length;i++) tabs[i].addEventListener('click', function(){ ST.configTab=this.getAttribute('data-tab'); renderPage(); });

  var nu = document.getElementById('btnNovoUser');
  if (nu) nu.addEventListener('click', function(){ openUserModal(null); });
  var uRows = app.querySelectorAll('.cfg-row[data-uid]');
  for (var j=0;j<uRows.length;j++) uRows[j].addEventListener('click', function(){
    var id=this.getAttribute('data-uid'); var u=userByIdAll(id);
    if (u) openUserModal(u);
  });

  var nl = document.getElementById('btnNovaLoja');
  if (nl) nl.addEventListener('click', function(){ openStoreModal(null); });
  var bs = document.getElementById('btnSyncBling');
  if (bs) bs.addEventListener('click', function(){
    var old=bs.innerHTML; bs.disabled=true; bs.textContent='Sincronizando...';
    toast('Buscando vendas no Bling...','success');
    fetch(SUPABASE_URL+'/functions/v1/bling-sync', {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'apikey':SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body:'{}'
    }).then(function(res){ return res.json().catch(function(){ return { httpStatus:res.status }; }); }).then(function(d){
      bs.disabled=false; bs.innerHTML=old;
      console.log('[bling-sync]', d);
      if (!d || d.ok!==true) { toast('Sincronização: '+((d&&(d.message||d.error))||('falha HTTP '+(d&&d.httpStatus||'')) ),'error'); return; }
      var rs=d.results||[]; var erros=rs.filter(function(x){ return x.erro; });
      if (erros.length) { toast('Sincronizou, mas '+erros.length+' loja(s) com aviso (veja o console)','error'); }
      else { toast('Bling sincronizado! '+rs.length+' loja(s)','success'); }
      loadData().then(function(){ renderPage(); });
    }).catch(function(e){ bs.disabled=false; bs.innerHTML=old; console.error(e); toast('Erro ao sincronizar: '+e.message,'error'); });
  });
  var sRows = app.querySelectorAll('.cfg-row[data-sid]');
  for (var k=0;k<sRows.length;k++) sRows[k].addEventListener('click', function(){
    var id=this.getAttribute('data-sid'); var st=null;
    for (var x=0;x<ST.storeUnits.length;x++) if (String(ST.storeUnits[x].id)===String(id)) { st=ST.storeUnits[x]; break; }
    if (st) openStoreModal(st);
  });
  var blingBtns = app.querySelectorAll('.bling-btn[data-bling]');
  for (var bb2=0;bb2<blingBtns.length;bb2++) blingBtns[bb2].addEventListener('click', function(e){
    e.stopPropagation();
    var sid=this.getAttribute('data-bling'); var st=null;
    for (var x=0;x<ST.storeUnits.length;x++) if (String(ST.storeUnits[x].id)===String(sid)) { st=ST.storeUnits[x]; break; }
    if (st) openBlingModal(st);
  });

  var nb = document.getElementById('btnNovoBanner');
  if (nb) nb.addEventListener('click', function(){ openBannerModal(null); });
  var bRows = app.querySelectorAll('.banner-item[data-bid]');
  for (var z=0;z<bRows.length;z++) bRows[z].addEventListener('click', function(){
    var id=this.getAttribute('data-bid'); var bb=null;
    for (var x=0;x<ST.banners.length;x++) if (String(ST.banners[x].id)===String(id)) { bb=ST.banners[x]; break; }
    if (bb) openBannerModal(bb);
  });
}

/* ========== [10g] CAMPANHAS (Marketing) ========== */
var CAMP_COLORS = ['#3B6FF7','#E53935','#1E88E5','#43A047','#8E24AA','#FB8C00','#D81B60','#00ACC1'];
function uid(){ return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():('c'+Date.now()+Math.random().toString(36).slice(2,8)); }

function campStatus(c) {
  var t=today();
  var ini=(c.start_date||'').split('T')[0], fim=(c.end_date||'').split('T')[0];
  if (fim && fim<t) return { label:'Encerrada', color:'#9aa1ad' };
  if (ini && ini>t) return { label:'Agendada', color:'#F59E0B' };
  return { label:'Ativa', color:'#16A34A' };
}

function campanhasHTML() {
  var admin = isAdmin(ST.session);
  var cs = ST.campaigns.slice().sort(function(a,b){ return (b.start_date||'').localeCompare(a.start_date||''); });
  var cards='';
  if (cs.length===0) {
    var msg = admin ? 'Crie a primeira campanha pelo botão acima.' : 'Nenhuma campanha cadastrada.';
    cards = '<div class="empty-page" style="grid-column:1/-1"><div class="ep-ico">'+icon('megaphone')+'</div><h3>Nenhuma campanha</h3><p>'+msg+'</p></div>';
  } else {
    cs.forEach(function(c){ cards += campCardHTML(c); });
  }
  var btn = admin ? '<button class="btn-new" id="btnNovaCamp">'+icon('plus')+'Nova campanha</button>' : '';
  return '<div class="tasks-head"><div><h2>Campanhas</h2><div class="sub">'+cs.length+' campanha(s)</div></div>'+btn+'</div><div class="camp-grid">'+cards+'</div>';
}
function campCardHTML(c) {
  var cor=c.color||'#3B6FF7';
  var st=campStatus(c);
  var tks=c.tasks||[]; var nTasks=tks.length; var done=tks.filter(function(x){return x.done;}).length;
  var pct=nTasks?Math.round(done/nTasks*100):0;
  var nPart=(c.user_ids||[]).length;
  var periodo = (c.start_date?fmtDate(c.start_date):'') + (c.end_date?(' → '+fmtDate(c.end_date)):'');
  var prog = nTasks ? '<div class="proj-prog"><div class="proj-prog-bar"><span style="width:'+pct+'%;background:'+cor+'"></span></div><small>'+pct+'% · '+done+'/'+nTasks+' tarefas</small></div>' : '';
  return '<div class="camp-card" data-id="'+esc(c.id)+'">'+
    '<span class="camp-bar" style="background:'+cor+'"></span>'+
    '<div class="camp-body"><div class="camp-top"><b>'+esc(c.name)+'</b><span class="crm-status" style="color:'+st.color+';background:'+st.color+'18">'+st.label+'</span></div>'+
    (c.description?'<p>'+esc(c.description)+'</p>':'')+
    '<div class="camp-meta"><span class="tc-date">'+icon('cal')+(periodo||'sem datas')+'</span>'+(c.area?'<span class="tc-chip">'+esc(c.area)+'</span>':'')+'</div>'+
    prog+
    '<div class="camp-foot"><span>'+nTasks+' tarefa(s)</span><span>'+nPart+' participante(s)</span></div>'+
    '</div></div>';
}
function bindCampanhas() {
  var admin = isAdmin(ST.session);
  var nova=document.getElementById('btnNovaCamp');
  if (nova && admin) nova.addEventListener('click', function(){ openCampaignModal(null); });
  if (!admin) return;
  var cards=app.querySelectorAll('.camp-card');
  for (var i=0;i<cards.length;i++) cards[i].addEventListener('click', function(){
    var id=this.getAttribute('data-id'); var c=null;
    for (var k=0;k<ST.campaigns.length;k++) if (String(ST.campaigns[k].id)===String(id)) { c=ST.campaigns[k]; break; }
    if (c) openCampaignModal(c);
  });
}

function openCampaignModal(camp) {
  if(!canManage()){ blockManage(); return; }
  var isNew=!camp;
  var t=today(); var wl=new Date(); wl.setDate(wl.getDate()+7);
  var c = camp || { name:'', description:'', start_date:t, end_date:wl.getFullYear()+'-'+pad(wl.getMonth()+1)+'-'+pad(wl.getDate()), color:'#3B6FF7', area:'', user_ids:[], tasks:[] };
  var taskList = (c.tasks||[]).slice();      // lista de tarefas da campanha (em memória)
  var partSel = (c.user_ids||[]).slice();

  var colorBtns=CAMP_COLORS.map(function(col){ return '<button type="button" class="color-dot'+(c.color===col?' on':'')+'" data-color="'+col+'" style="background:'+col+'"></button>'; }).join('');
  var partHTML=ST.users.map(function(u){
    var on=partSel.indexOf(u.id)!==-1;
    return '<label class="member-pick'+(on?' on':'')+'"><input type="checkbox" data-part="'+esc(u.id)+'"'+(on?' checked':'')+'><span class="member-pick-av" style="background:'+(u.color||'#3B6FF7')+'">'+esc(iniciais(u.name))+'</span>'+esc(u.name)+'</label>';
  }).join('');
  if (ST.users.length===0) partHTML='<div style="font-size:12px;color:var(--u-text3)">Nenhuma pessoa no setor</div>';

  var delBtn=isNew?'':'<button class="btn btn-danger btn-del-wrap" id="campDel">Excluir</button>';

  var modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML =
    '<div class="modal">'+
      '<input class="modal-title-input" id="cpName" placeholder="Nome da campanha..." value="'+esc(c.name)+'">'+
      '<div class="modal-row"><label class="modal-label">Descrição</label><textarea id="cpDesc" placeholder="Objetivo, observações...">'+esc(c.description||'')+'</textarea></div>'+
      '<div class="modal-grid2"><div class="modal-row"><label class="modal-label">Início</label><input type="date" id="cpStart" value="'+esc((c.start_date||'').split('T')[0])+'"></div><div class="modal-row"><label class="modal-label">Término</label><input type="date" id="cpEnd" value="'+esc((c.end_date||'').split('T')[0])+'"></div></div>'+
      '<div class="modal-grid2"><div class="modal-row"><label class="modal-label">Área</label><input type="text" id="cpArea" placeholder="ex: Redes sociais" value="'+esc(c.area||'')+'"></div><div class="modal-row"><label class="modal-label">Cor</label><div class="color-row" id="cpColors">'+colorBtns+'</div></div></div>'+
      '<div class="modal-row"><label class="modal-label">Tarefas da campanha</label><div id="cpTasks" class="camp-tasks"></div><div class="camp-task-add"><input type="text" id="cpNewTask" placeholder="Nova tarefa da campanha..."><select id="cpNewPrio"><option value="alta">Alta</option><option value="media" selected>Média</option><option value="baixa">Baixa</option></select><button type="button" class="btn btn-ghost" id="cpAddTask">+ Add</button></div></div>'+
      '<div class="modal-row"><label class="modal-label">Participantes</label><div class="member-picks">'+partHTML+'</div></div>'+
      '<div class="modal-foot">'+delBtn+'<button class="btn btn-ghost" id="campCancel">Cancelar</button><button class="btn btn-primary" id="campSave">'+(isNew?'Criar campanha':'Salvar')+'</button></div>'+
    '</div>';
  document.body.appendChild(modal);

  // render lista de tarefas da campanha
  function renderTaskList() {
    var box=modal.querySelector('#cpTasks');
    if (taskList.length===0) { box.innerHTML='<div style="font-size:12px;color:var(--u-text3);padding:4px 0">Nenhuma tarefa ainda.</div>'; return; }
    var respOpts=function(sel){ return '<option value="">Responsável</option>'+ST.users.map(function(u){ return '<option value="'+esc(u.id)+'"'+(String(sel)===String(u.id)?' selected':'')+'>'+esc(u.name)+'</option>'; }).join(''); };
    box.innerHTML = taskList.map(function(tk,idx){
      var pr=PRIO[tk.priority]||PRIO.media;
      return '<div class="camp-task-item'+(tk.done?' done':'')+'">'+
        '<button type="button" class="camp-task-check" data-idx="'+idx+'" style="border-color:'+(tk.done?'#16A34A':'var(--u-border)')+';background:'+(tk.done?'#16A34A':'transparent')+'">'+(tk.done?'✓':'')+'</button>'+
        '<span class="tc-prio" style="background:'+pr.color+'"></span>'+
        '<span class="camp-task-t">'+esc(tk.title)+'</span>'+
        '<input type="date" class="camp-task-date" data-dueidx="'+idx+'" value="'+esc((tk.due||'').slice(0,10))+'" title="Data">'+
        '<select class="camp-task-resp" data-respidx="'+idx+'" title="Responsável">'+respOpts(tk.assignee_id)+'</select>'+
        '<button type="button" class="camp-task-del" data-idx="'+idx+'">✕</button>'+
      '</div>';
    }).join('');
    box.querySelectorAll('.camp-task-check').forEach(function(b){ b.addEventListener('click', function(){ var i=+this.getAttribute('data-idx'); taskList[i].done=!taskList[i].done; renderTaskList(); }); });
    box.querySelectorAll('.camp-task-date').forEach(function(b){ b.addEventListener('change', function(){ taskList[+this.getAttribute('data-dueidx')].due=this.value||null; }); });
    box.querySelectorAll('.camp-task-resp').forEach(function(b){ b.addEventListener('change', function(){ taskList[+this.getAttribute('data-respidx')].assignee_id=this.value||null; }); });
    box.querySelectorAll('.camp-task-del').forEach(function(b){ b.addEventListener('click', function(){ taskList.splice(+this.getAttribute('data-idx'),1); renderTaskList(); }); });
  }
  renderTaskList();
  modal.querySelector('#cpAddTask').addEventListener('click', function(){
    var tt=(modal.querySelector('#cpNewTask').value||'').trim();
    if (!tt) return;
    taskList.push({ id:uid(), title:tt, priority:modal.querySelector('#cpNewPrio').value, done:false, due:null, assignee_id:null });
    modal.querySelector('#cpNewTask').value='';
    renderTaskList();
  });

  var colorPick=c.color||'#3B6FF7';
  var dots=modal.querySelectorAll('.color-dot');
  for (var i=0;i<dots.length;i++) dots[i].addEventListener('click', function(){ for(var k=0;k<dots.length;k++) dots[k].classList.remove('on'); this.classList.add('on'); colorPick=this.getAttribute('data-color'); });
  var partCbs=modal.querySelectorAll('[data-part]');
  for (var j=0;j<partCbs.length;j++) partCbs[j].addEventListener('change', function(){ this.closest('.member-pick').classList.toggle('on', this.checked); });

  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  modal.querySelector('#campCancel').addEventListener('click', close);
  modal.querySelector('#cpName').focus();

  modal.querySelector('#campSave').addEventListener('click', function(){
    var name=(modal.querySelector('#cpName').value||'').trim();
    if (!name) { toast('Informe o nome da campanha','error'); return; }
    var sel=[]; modal.querySelectorAll('[data-part]:checked').forEach(function(cb){ sel.push(cb.getAttribute('data-part')); });
    var rec = {
      id: isNew ? uid() : c.id,
      name:name,
      description:(modal.querySelector('#cpDesc').value||'').trim(),
      start_date:modal.querySelector('#cpStart').value||null,
      end_date:modal.querySelector('#cpEnd').value||null,
      color:colorPick,
      area:(modal.querySelector('#cpArea').value||'').trim(),
      user_ids:sel,
      tasks:taskList
    };
    var saveBtn=modal.querySelector('#campSave'); saveBtn.disabled=true; saveBtn.textContent='Salvando...';
    sb.from('malba_campaigns').upsert(rec, { onConflict:'id' }).select().single().then(function(r){
      if (r.error || !r.data) { toast('Erro ao salvar campanha','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent=(isNew?'Criar campanha':'Salvar'); return; }
      if (isNew) ST.campaigns.push(r.data);
      else { for (var i=0;i<ST.campaigns.length;i++) if (ST.campaigns[i].id===c.id) { ST.campaigns[i]=r.data; break; } }
      auditLog(isNew?'Criou campanha':'Editou campanha', name); close(); toast(isNew?'Campanha criada':'Campanha atualizada','success'); renderPage();
    });
  });

  if (!isNew) {
    modal.querySelector('#campDel').addEventListener('click', function(){
      if (!confirm('Excluir a campanha "'+(c.name||'')+'"?')) return;
      sb.from('malba_campaigns').delete().eq('id', c.id).then(function(r){
        if (r.error) { toast('Erro ao excluir','error'); return; }
        ST.campaigns = ST.campaigns.filter(function(x){ return x.id!==c.id; });
        // limpeza best-effort das instâncias diárias
        sb.from('malba_campaign_instances').delete().eq('campaign_id', c.id);
        close(); toast('Campanha excluída','success'); renderPage();
      });
    });
  }
}

/* ========== [10h] RANKING (Vendas) ========== */
function rankingHTML() {
  var y=new Date().getFullYear(), m=new Date().getMonth()+1;
  var rows = ST.users.map(function(u){
    var g = ST.goals.filter(function(x){ return x.user_id===u.id && x.month===m && x.year===y; })[0];
    return { name:u.name, color:u.color||'#3B6FF7', val:(g?Number(g.actual_value)||0:0), goal:(g?Number(g.goal_value)||0:0) };
  });
  rows.sort(function(a,b){ return b.val-a.val; });
  var max = rows.length ? Math.max(rows[0].val,1) : 1;
  var temDados = rows.some(function(r){ return r.val>0; });

  var body='';
  if (!temDados) {
    body = '<div class="empty-page"><div class="ep-ico">'+icon('trend')+'</div><h3>Ranking sem dados ainda</h3><p>As posições aparecem conforme o realizado das metas individuais for registrado (em Metas, atribua uma meta a cada vendedor).</p></div>';
  } else {
    body = '<div class="rank-list">';
    rows.forEach(function(r,i){
      var rk=i+1; var medal = rk===1?'gold':(rk===2?'silver':(rk===3?'bronze':''));
      var pct = r.val/max*100;
      var pctMeta = r.goal>0 ? (Math.round(r.val/r.goal*100)+'% da meta') : 'sem meta definida';
      body += '<div class="rank-row">'+
        '<span class="rank-pos '+medal+'">'+rk+'</span>'+
        '<span class="rank-av" style="background:'+r.color+'">'+esc(iniciais(r.name))+'</span>'+
        '<div class="rank-main"><b>'+esc(r.name)+'</b><i>'+pctMeta+'</i><div class="rank-bar"><span style="width:'+pct+'%;background:'+r.color+'"></span></div></div>'+
        '<span class="rank-val">'+fmtBRL(r.val)+'</span>'+
      '</div>';
    });
    body += '</div>';
  }
  return '<div class="tasks-head"><div><h2>Ranking de Vendedores</h2><div class="sub">'+MESES[m-1]+' / '+y+'</div></div></div>'+body;
}

function gestaoStats(filterFn){
  var hoje=today(); var o={abertas:0,atrasadas:0,concluidas:0,total:0};
  ST.tasks.forEach(function(t){
    if(!filterFn(t)) return;
    o.total++;
    var d=(t.due_date||'').slice(0,10);
    if(t.status==='feito') o.concluidas++;
    else { o.abertas++; if(d && d<hoje) o.atrasadas++; }
  });
  return o;
}
function lojaAvalMedia(lojaId){
  var soma=0,n=0;
  ST.avaliacoes.forEach(function(a){ if(String(a.store_unit_id)===String(lojaId) && a.nota_final!=null){ soma+=Number(a.nota_final); n++; } });
  return n? (soma/n):null;
}

  var colabHTML = colabRows.length ? colabRows.map(function(r){

function openComissaoModal() {
  if(!canManage()){ blockManage(); return; }
  var ls = lojasGestao();
  if (ls.length===0) { toast('Cadastre lojas primeiro','error'); return; }
  var mode='individual';
  function parseNum(s){ return parseFloat(String(s||'').replace(/\./g,'').replace(',', '.')) || 0; }

  var modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML =
    '<div class="modal">'+
      '<div class="modal-title-input" style="cursor:default">Lançar comissões</div>'+
      '<div class="modal-row"><label class="modal-label">Loja</label><select id="comLoja">'+ls.map(function(l){return '<option value="'+esc(l.id)+'">'+esc(l.name||('Loja '+l.store_number))+'</option>';}).join('')+'</select></div>'+
      '<div class="modal-grid2"><div class="modal-row"><label class="modal-label">Início</label><input type="date" id="comIni" value="'+today()+'"></div><div class="modal-row"><label class="modal-label">Fim</label><input type="date" id="comFim" value="'+today()+'"></div></div>'+
      '<div class="modal-row"><label class="modal-label">Rótulo do período (opcional)</label><input type="text" id="comLabel" placeholder="ex: Semana 1 de Junho"></div>'+
      '<div class="modal-row"><label class="modal-label">Modelo de comissão</label><div class="pills" id="comMode"><button type="button" class="pill cm-pill on" data-m="individual">Individual</button><button type="button" class="pill cm-pill" data-m="rateio">Rateio igual</button></div><div class="com-mode-hint" id="comHint"></div></div>'+
      '<div id="comBody"></div>'+
      '<div class="com-total" id="comTotal"></div>'+
      '<div class="modal-foot"><button class="btn btn-ghost" id="comCancel">Cancelar</button><button class="btn btn-primary" id="comSave">Calcular e salvar</button></div>'+
    '</div>';
  document.body.appendChild(modal);

  var body=modal.querySelector('#comBody');
  function setHint(){ modal.querySelector('#comHint').textContent = mode==='individual' ? 'Cada funcionário ganha sobre as próprias vendas (o mais usado no varejo).' : 'Um valor total dividido igualmente entre a equipe ativa.'; }
  function renderBody(){
    var membros=membrosDaLoja(modal.querySelector('#comLoja').value);
    setHint();
    if (membros.length===0){ body.innerHTML='<div class="com-prev-empty" style="color:var(--u-amber)">Esta loja não tem funcionários ativos. Cadastre em Equipe.</div>'; modal.querySelector('#comTotal').innerHTML=''; return; }
    if (mode==='individual'){
      body.innerHTML =
        '<div class="modal-row"><label class="modal-label">% padrão (aplica a quem não tiver % próprio)</label><input type="text" id="comPctPadrao" inputmode="decimal" value="5"></div>'+
        '<div class="com-emp-head"><span>Funcionário</span><span>Vendas R$</span><span>%</span><span>Comissão</span></div>'+
        '<div class="com-emp-list">'+membros.map(function(m){
          return '<div class="com-emp-row">'+
            '<span class="com-emp-n"><span class="com-pessoa-av" style="background:'+(m.color||'#3B6FF7')+'">'+esc(iniciais(m.name))+'</span><span class="cen-txt">'+esc(m.name)+(m.role?'<i>'+esc(m.role)+'</i>':'')+'</span></span>'+
            '<input type="text" class="com-emp-base" data-mid="'+esc(m.id)+'" inputmode="decimal" placeholder="0">'+
            '<input type="text" class="com-emp-pct" data-mid="'+esc(m.id)+'" inputmode="decimal" placeholder="5">'+
            '<b class="com-emp-val" data-mid="'+esc(m.id)+'">R$ 0,00</b>'+
          '</div>';
        }).join('')+'</div>';
      var ins=modal.querySelectorAll('.com-emp-base,.com-emp-pct'); for(var i=0;i<ins.length;i++) ins[i].addEventListener('input', recomp);
      modal.querySelector('#comPctPadrao').addEventListener('input', recomp);
    } else {
      body.innerHTML='<div class="modal-grid2"><div class="modal-row"><label class="modal-label">Total de vendas (R$)</label><input type="text" id="comVendas" inputmode="decimal" placeholder="0,00"></div><div class="modal-row"><label class="modal-label">% de comissão</label><input type="text" id="comPct" inputmode="decimal" value="5"></div></div><div class="com-preview" id="comPrev"></div>';
      modal.querySelector('#comVendas').addEventListener('input', recomp);
      modal.querySelector('#comPct').addEventListener('input', recomp);
    }
    recomp();
  }
  function recomp(){
    var membros=membrosDaLoja(modal.querySelector('#comLoja').value);
    var totalEl=modal.querySelector('#comTotal');
    if (membros.length===0){ totalEl.innerHTML=''; return; }
    if (mode==='individual'){
      var padrao=parseNum(modal.querySelector('#comPctPadrao').value);
      var total=0, vendas=0;
      var bases=modal.querySelectorAll('.com-emp-base');
      for (var i=0;i<bases.length;i++){
        var mid=bases[i].getAttribute('data-mid');
        var pctEl=modal.querySelector('.com-emp-pct[data-mid="'+mid+'"]');
        var pct=(pctEl && pctEl.value.trim()!=='')?parseNum(pctEl.value):padrao;
        var base=parseNum(bases[i].value);
        var val=base*pct/100; total+=val; vendas+=base;
        var vEl=modal.querySelector('.com-emp-val[data-mid="'+mid+'"]'); if(vEl) vEl.textContent=fmtBRL(val);
      }
      totalEl.innerHTML='Comissão total: <b>'+fmtBRL(total)+'</b> · Vendas lançadas '+fmtBRL(vendas);
    } else {
      var vendas2=parseNum(modal.querySelector('#comVendas').value);
      var pct2=parseNum(modal.querySelector('#comPct').value);
      var prev=modal.querySelector('#comPrev');
      if (vendas2<=0||pct2<=0){ prev.innerHTML='<div class="com-prev-empty">Preencha vendas e % para ver o rateio.</div>'; totalEl.innerHTML=''; return; }
      var total2=vendas2*pct2/100, por=total2/membros.length;
      prev.innerHTML=membros.map(function(m){ return '<div class="com-prev-row"><span class="com-pessoa-av" style="background:'+(m.color||'#3B6FF7')+'">'+esc(iniciais(m.name))+'</span><span style="flex:1">'+esc(m.name)+(m.role?' · '+esc(m.role):'')+'</span><b>'+fmtBRL(por)+'</b></div>'; }).join('');
      totalEl.innerHTML='Comissão total: <b>'+fmtBRL(total2)+'</b> · dividida entre '+membros.length+' pessoa(s)';
    }
  }

  modal.querySelector('#comLoja').addEventListener('change', renderBody);
  var pills=modal.querySelectorAll('.cm-pill');
  for (var p=0;p<pills.length;p++) pills[p].addEventListener('click', function(){ mode=this.getAttribute('data-m'); for(var x=0;x<pills.length;x++) pills[x].classList.remove('on'); this.classList.add('on'); renderBody(); });
  renderBody();

  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  modal.querySelector('#comCancel').addEventListener('click', close);

  modal.querySelector('#comSave').addEventListener('click', function(){
    var lojaId=modal.querySelector('#comLoja').value;
    var membros=membrosDaLoja(lojaId);
    if (membros.length===0){ toast('Esta loja não tem funcionários cadastrados','error'); return; }
    var rateio=[], vendasTotal=0, totalCom=0, pctRef=0;
    if (mode==='individual'){
      var padrao=parseNum(modal.querySelector('#comPctPadrao').value); pctRef=padrao;
      membros.forEach(function(m){
        var bi=modal.querySelector('.com-emp-base[data-mid="'+m.id+'"]');
        var pi=modal.querySelector('.com-emp-pct[data-mid="'+m.id+'"]');
        var base=parseNum(bi?bi.value:0);
        var pct=(pi&&pi.value.trim()!=='')?parseNum(pi.value):padrao;
        var val=Math.round(base*pct/100*100)/100;
        vendasTotal+=base; totalCom+=val;
        rateio.push({ member_id:m.id, nome:m.name, role:m.role||'', base:Math.round(base*100)/100, percentual:pct, valor:val });
      });
      if (totalCom<=0){ toast('Informe as vendas de pelo menos um funcionário','error'); return; }
    } else {
      var vendas=parseNum(modal.querySelector('#comVendas').value);
      var pct=parseNum(modal.querySelector('#comPct').value);
      if (vendas<=0){ toast('Informe o total de vendas','error'); return; }
      if (pct<=0){ toast('Informe o %','error'); return; }
      pctRef=pct; vendasTotal=vendas; totalCom=Math.round(vendas*pct/100*100)/100;
      var por=totalCom/membros.length;
      rateio=membros.map(function(m){ return { member_id:m.id, nome:m.name, role:m.role||'', base:null, percentual:pct, valor:Math.round(por*100)/100 }; });
    }
    var rec={ sector:'lojas', store_unit_id:lojaId, periodo_inicio:modal.querySelector('#comIni').value||null, periodo_fim:modal.querySelector('#comFim').value||null, periodo_label:(modal.querySelector('#comLabel').value||'').trim()||null, vendas_total:Math.round(vendasTotal*100)/100, percentual:pctRef, total_comissao:Math.round(totalCom*100)/100, rateio:rateio, created_by:ST.session.user.id };
    var saveBtn=modal.querySelector('#comSave'); saveBtn.disabled=true; saveBtn.textContent='Salvando...';
    sb.from('malba_comissoes').insert(rec).select().single().then(function(r){
      if (r.error||!r.data){ toast('Erro ao salvar comissão','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Calcular e salvar'; return; }
      ST.comissoes.unshift(r.data); auditLog('Lançou comissão', (storeName(lojaId)||'Loja')); close(); toast('Comissão salva','success'); renderPage();
    });
  });
}

function comissaoDetalhe(c) {

  var loja=storeName(c.store_unit_id)||'Loja';
  var periodo=c.periodo_label||((c.periodo_inicio?fmtDate(c.periodo_inicio):'')+(c.periodo_fim?(' a '+fmtDate(c.periodo_fim)):''));
  var rows=(c.rateio||[]).map(function(r){
    var det = (r.base!=null && r.base!==undefined) ? ('Vendas '+fmtBRL(r.base)+(r.percentual!=null?' · '+r.percentual+'%':'')) : (r.percentual!=null?(r.percentual+'% (rateio)'):'rateio');
    return '<div class="com-prev-row"><span class="com-pessoa-av" style="background:#3B6FF7">'+esc(iniciais(r.nome))+'</span><span style="flex:1">'+esc(r.nome)+(r.role?' · '+esc(r.role):'')+'<small style="display:block;color:var(--u-text3);font-size:11px">'+esc(det)+'</small></span><b>'+fmtBRL(r.valor)+'</b></div>';
  }).join('');
  var modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML='<div class="modal">'+
    '<div class="modal-title-input" style="cursor:default">'+esc(loja)+'</div>'+
    (periodo?'<div style="font-size:13px;color:var(--u-text3);margin:-6px 0 10px">'+esc(periodo)+'</div>':'')+
    '<div class="modal-row"><label class="modal-label">Rótulo do período (editável)</label><input type="text" id="comDetLabel" placeholder="ex: Semana 1 de Junho" value="'+esc(c.periodo_label||'')+'"></div>'+
    '<div class="com-det-totals"><div><span>Vendas</span><b>'+fmtBRL(c.vendas_total)+'</b></div><div><span>Comissão total</span><b style="color:var(--u-green)">'+fmtBRL(c.total_comissao)+'</b></div></div>'+
    '<div class="com-preview">'+rows+'</div>'+
    '<div class="modal-foot"><button class="btn btn-danger btn-del-wrap" id="comDel">Excluir</button><button class="btn btn-ghost" id="comDetClose">Fechar</button><button class="btn btn-primary" id="comDetSave">Salvar</button></div>'+
  '</div>';
  document.body.appendChild(modal);
  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click',function(e){ if(e.target===modal) close(); });
  modal.querySelector('#comDetClose').addEventListener('click', close);
  modal.querySelector('#comDetSave').addEventListener('click', function(){
    var lbl=(modal.querySelector('#comDetLabel').value||'').trim()||null;
    var btn=this; btn.disabled=true; btn.textContent='Salvando...';
    sb.from('malba_comissoes').update({ periodo_label:lbl }).eq('id', c.id).then(function(r){
      if(r.error){ toast('Erro ao salvar','error'); btn.disabled=false; btn.textContent='Salvar'; return; }
      c.periodo_label=lbl;
      for(var x=0;x<ST.comissoes.length;x++) if(ST.comissoes[x].id===c.id){ ST.comissoes[x].periodo_label=lbl; break; }
      auditLog('Editou comissão', (storeName(c.store_unit_id)||'Loja')); close(); toast('Atualizado','success'); renderPage();
    });
  });
  modal.querySelector('#comDel').addEventListener('click', function(){
    if(!confirm('Excluir este lançamento de comissão?')) return;
    sb.from('malba_comissoes').delete().eq('id', c.id).then(function(r){
      if(r.error){ toast('Erro ao excluir','error'); return; }
      ST.comissoes=ST.comissoes.filter(function(x){return x.id!==c.id;});
      auditLog('Excluiu comissão', (storeName(c.store_unit_id)||'Loja')); close(); toast('Comissão excluída','success'); renderPage();
    });
  });
}

/* ----- Avaliações ----- */
function avaliacoesHTML() {
  var list = ST.avaliacoes.slice();
  if (ST.sector==='lojas' && ST.store && !isSuper(ST.session)) list = list.filter(function(a){ return a.store_unit_id===ST.store.id; });
  var rows='';
  if (list.length===0) {
    rows = '<div class="empty-page"><div class="ep-ico">'+icon('target')+'</div><h3>Nenhuma avaliação</h3><p>Avalie o desempenho das lojas e dos funcionários periodicamente.</p></div>';
  } else {
    rows = '<div class="cfg-list">';
    list.forEach(function(a){
      var alvo;
      if (a.tipo==='membro') { var mm=null; for(var i=0;i<ST.members.length;i++) if(ST.members[i].id===a.member_id){mm=ST.members[i];break;} alvo = mm?mm.name:'Funcionário'; }
      else alvo = storeName(a.store_unit_id) || 'Loja';
      var stars = renderStarsRO(a.nota_final);
      rows += '<div class="aval-row" data-aid="'+esc(a.id)+'" style="cursor:pointer">'+
        '<span class="aval-tipo" style="background:'+(a.tipo==='membro'?'var(--u-accent-soft)':'var(--u-green-soft)')+';color:'+(a.tipo==='membro'?'var(--u-accent)':'var(--u-green)')+'">'+(a.tipo==='membro'?'Funcionário':'Loja')+'</span>'+
        '<div class="crm-main"><b>'+esc(alvo)+'</b><i>'+(a.periodo_label?esc(a.periodo_label)+' · ':'')+fmtDate(a.data_avaliacao)+'</i></div>'+
        '<span class="aval-stars">'+stars+' <b>'+(Number(a.nota_final)||0).toFixed(1)+'</b></span>'+
      '</div>';
    });
    rows += '</div>';
  }
  return '<div class="cfg-sec-head"><span>'+list.length+' avaliação(ões)</span>'+(canManage()?'<button class="btn-new" id="btnNovaAvaliacao">'+icon('plus')+'Nova avaliação</button>':'')+'</div>'+rows;
}
function renderStarsRO(nota) {
  var n=Math.round(Number(nota)||0); var s='';
  for (var i=1;i<=5;i++) s += '<span class="star-ro'+(i<=n?' on':'')+'">★</span>';
  return s;
}

function openAvaliacaoModal(aval) {
  if(!canManage()){ blockManage(); return; }
  var ls = lojasGestao();
  if (ls.length===0) { toast('Cadastre lojas primeiro','error'); return; }
  var editing = !!aval;
  var tipo = editing ? (aval.tipo||'membro') : 'membro';
  var pendingCrit = '';
  var form = { periodo: editing ? (aval.periodo_label||'') : '', obs: editing ? (aval.observacao||'') : '' };
  var curLoja = editing ? (aval.store_unit_id||ls[0].id) : ls[0].id;
  var curMem = editing ? (aval.member_id||null) : null;

  function defaultsFor(tp){ return (tp==='loja'?CRIT_LOJA:CRIT_MEMBRO).map(function(c){ return {id:c.id,label:c.label,nota:0}; }); }
  // critList = lista ORDENADA de {id,label,nota}. Aceita formato novo (array) e antigo (objeto).
  function parseCrit(){
    if (editing) {
      var sn=aval.notas;
      if (Array.isArray(sn)) { var a=[]; sn.forEach(function(it){ if(it&&it.id!=null) a.push({id:String(it.id),label:it.label||'Critério',nota:Number(it.nota)||0}); }); if(a.length) return a; }
      else if (sn && typeof sn==='object') {
        var labels=sn._labels||{}; var list=defaultsFor(tipo); var seen={};
        list.forEach(function(c){ seen[c.id]=1; c.label=labels[c.id]||c.label; c.nota=Number(sn[c.id])||0; });
        Object.keys(sn).forEach(function(k){ if(k==='_labels'||seen[k]) return; list.push({id:String(k),label:labels[k]||'Critério',nota:Number(sn[k])||0}); });
        return list;
      }
    }
    return defaultsFor(tipo);
  }
  var critList = parseCrit();

  function build() {
    var lojaOpts = ls.map(function(l){ return '<option value="'+esc(l.id)+'"'+(String(curLoja)===String(l.id)?' selected':'')+'>'+esc(l.name||('Loja '+l.store_number))+'</option>'; }).join('');

    var membroBlock='';
    if (tipo==='membro') {
      var mem = membrosDaLoja(curLoja);
      var memOpts = mem.length ? mem.map(function(m){ return '<option value="'+esc(m.id)+'"'+(String(curMem)===String(m.id)?' selected':'')+'>'+esc(m.name)+'</option>'; }).join('') : '<option value="">Sem funcionários nesta loja</option>';
      membroBlock = '<div class="modal-row"><label class="modal-label">Funcionário</label><select id="avMembro">'+memOpts+'</select></div>';
    }
    var critHTML = critList.map(function(c,idx){
      var stars='';
      for (var i=1;i<=5;i++) stars += '<button type="button" class="star-pick'+(i<=c.nota?' on':'')+'" data-cidx="'+idx+'" data-val="'+i+'">★</button>';
      return '<div class="aval-crit">'+
        '<input type="text" class="aval-crit-name" data-cidx="'+idx+'" value="'+esc(c.label)+'" maxlength="60" placeholder="Nome do critério">'+
        '<div class="aval-crit-right">'+
          '<div class="aval-stars-pick">'+stars+'</div>'+
          '<div class="aval-crit-tools">'+
            '<button type="button" class="aval-crit-mv" data-mvup="'+idx+'" title="Subir"'+(idx===0?' disabled':'')+'>↑</button>'+
            '<button type="button" class="aval-crit-mv" data-mvdn="'+idx+'" title="Descer"'+(idx===critList.length-1?' disabled':'')+'>↓</button>'+
            '<button type="button" class="aval-crit-del" data-rmcrit="'+idx+'" title="Remover critério">✕</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join('');
    var soma=0,n=0; critList.forEach(function(c){ if(c.nota>0){ soma+=c.nota; n++; } });
    var media = n>0 ? (soma/n) : 0;
    var delBtn = editing ? '<button class="btn btn-danger btn-del-wrap" id="avDel">Excluir</button>' : '';

    return '<div class="modal">'+
      '<div class="modal-title-input" style="cursor:default">'+(editing?'Editar avaliação':'Nova avaliação')+'</div>'+
      '<div class="modal-row"><label class="modal-label">Tipo</label><div class="pills" id="avTipo"><button type="button" class="pill av-tp'+(tipo==='membro'?' on':'')+'" data-tp="membro" style="color:var(--u-accent)"><span class="pdot" style="background:var(--u-accent)"></span>Funcionário</button><button type="button" class="pill av-tp'+(tipo==='loja'?' on':'')+'" data-tp="loja" style="color:var(--u-green)"><span class="pdot" style="background:var(--u-green)"></span>Loja</button></div></div>'+
      '<div class="modal-row"><label class="modal-label">Loja</label><select id="avLoja">'+lojaOpts+'</select></div>'+
      membroBlock+
      '<div class="modal-row"><label class="modal-label">Período (opcional)</label><input type="text" id="avPeriodo" placeholder="ex: Junho/2026" value="'+esc(form.periodo)+'"></div>'+
      '<div class="modal-row"><label class="modal-label">Critérios</label><div class="aval-crits">'+critHTML+'</div>'+
      '<div class="aval-add"><input type="text" id="avNewCrit" placeholder="Adicionar critério (ex: Apresentação pessoal)" maxlength="60" value="'+esc(pendingCrit)+'"><button type="button" class="btn-add-crit" id="avAddCrit">+ Adicionar</button></div>'+
      '<div class="aval-media" id="avMedia">'+(n>0?('Média: '+media.toFixed(1)+' de 5'):'Média: —')+'</div></div>'+
      '<div class="modal-row"><label class="modal-label">Observação (opcional)</label><textarea id="avObs" placeholder="Comentários...">'+esc(form.obs)+'</textarea></div>'+
      '<div class="modal-foot">'+delBtn+'<button class="btn btn-ghost" id="avCancel">Cancelar</button><button class="btn btn-primary" id="avSave">'+(editing?'Salvar':'Salvar avaliação')+'</button></div>'+
    '</div>';
  }

  var modal=document.createElement('div'); modal.className='modal-bg';
  function captura(){
    var l=modal.querySelector('#avLoja'); if(l) curLoja=l.value;
    var m=modal.querySelector('#avMembro'); if(m) curMem=m.value;
    var p=modal.querySelector('#avPeriodo'); if(p) form.periodo=p.value;
    var o=modal.querySelector('#avObs'); if(o) form.obs=o.value;
    var nc=modal.querySelector('#avNewCrit'); if(nc) pendingCrit=nc.value;
    var names=modal.querySelectorAll('.aval-crit-name');
    for (var i=0;i<names.length;i++){ var idx=parseInt(names[i].getAttribute('data-cidx'),10); if(critList[idx]) critList[idx].label=names[i].value; }
  }
  function addCrit(){
    captura();
    var v=(pendingCrit||'').trim();
    if(!v){ var el=modal.querySelector('#avNewCrit'); if(el) el.focus(); return; }
    critList.push({ id:'c_'+Date.now().toString(36)+Math.floor(Math.random()*900+100), label:v, nota:0 }); pendingCrit='';
    rerender(false);
    setTimeout(function(){ var n2=modal.querySelector('#avNewCrit'); if(n2) n2.focus(); },20);
  }
  function rerender(keep){ if(keep) captura(); modal.innerHTML = build(); bindAll(); }
  function bindAll() {
    var tps=modal.querySelectorAll('.av-tp');
    for (var i=0;i<tps.length;i++) tps[i].addEventListener('click', function(){ captura(); tipo=this.getAttribute('data-tp'); critList=defaultsFor(tipo); pendingCrit=''; rerender(false); });
    var lojaSel=modal.querySelector('#avLoja');
    if (lojaSel) lojaSel.addEventListener('change', function(){ captura(); curMem=null; rerender(false); });
    var stars=modal.querySelectorAll('.star-pick');
    for (var s=0;s<stars.length;s++) stars[s].addEventListener('click', function(){ captura(); var idx=parseInt(this.getAttribute('data-cidx'),10); if(critList[idx]) critList[idx].nota=parseInt(this.getAttribute('data-val'),10); rerender(false); });
    var ups=modal.querySelectorAll('[data-mvup]');
    for (var u=0;u<ups.length;u++) ups[u].addEventListener('click', function(){ captura(); var idx=parseInt(this.getAttribute('data-mvup'),10); if(idx>0){ var t=critList[idx-1]; critList[idx-1]=critList[idx]; critList[idx]=t; } rerender(false); });
    var dns=modal.querySelectorAll('[data-mvdn]');
    for (var d2=0;d2<dns.length;d2++) dns[d2].addEventListener('click', function(){ captura(); var idx=parseInt(this.getAttribute('data-mvdn'),10); if(idx<critList.length-1){ var t=critList[idx+1]; critList[idx+1]=critList[idx]; critList[idx]=t; } rerender(false); });
    var addc=modal.querySelector('#avAddCrit');
    if (addc) addc.addEventListener('click', addCrit);
    var ncEl=modal.querySelector('#avNewCrit');
    if (ncEl) ncEl.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); addCrit(); } });
    var rms=modal.querySelectorAll('[data-rmcrit]');
    for (var r=0;r<rms.length;r++) rms[r].addEventListener('click', function(){ captura(); var idx=parseInt(this.getAttribute('data-rmcrit'),10); critList.splice(idx,1); rerender(false); });
    var cancel=modal.querySelector('#avCancel'); if(cancel) cancel.addEventListener('click', close);
    var save=modal.querySelector('#avSave'); if(save) save.addEventListener('click', salvar);
    var del=modal.querySelector('#avDel'); if(del) del.addEventListener('click', excluir);
  }
  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  function alvoLabel(){
    if (tipo==='membro'){ var mm=null; for(var i=0;i<ST.members.length;i++) if(ST.members[i].id===curMem){mm=ST.members[i];break;} return mm?mm.name:'Funcionário'; }
    return storeName(curLoja)||'Loja';
  }
  function excluir(){
    if(!confirm('Excluir esta avaliação?')) return;
    sb.from('malba_avaliacoes').delete().eq('id',aval.id).then(function(r){
      if(r.error){ toast('Erro ao excluir','error'); return; }
      ST.avaliacoes=ST.avaliacoes.filter(function(x){return x.id!==aval.id;});
      auditLog('Excluiu avaliação', alvoLabel()); close(); toast('Avaliação excluída','success'); renderPage();
    });
  }
  function salvar() {
    captura();
    var memberId = (tipo==='membro') ? curMem : null;
    if (tipo==='membro' && !memberId) { toast('Selecione um funcionário','error'); return; }
    var clean = critList.filter(function(c){ return (c.label||'').trim()!==''; });
    var soma=0,n=0; clean.forEach(function(c){ if(c.nota>0){ soma+=c.nota; n++; } });
    if (n===0) { toast('Dê nota a pelo menos um critério','error'); return; }
    var media=soma/n;
    var notasToSave = clean.map(function(c){ return { id:c.id, label:(c.label||'').trim(), nota:c.nota||0 }; });
    var rec={ sector:'lojas', tipo:tipo, store_unit_id:curLoja, member_id:memberId, periodo_label:(form.periodo||'').trim()||null, data_avaliacao: editing?(aval.data_avaliacao||today()):today(), notas:notasToSave, nota_final:Math.round(media*10)/10, observacao:(form.obs||'').trim()||null, created_by: editing?(aval.created_by||ST.session.user.id):ST.session.user.id };
    var saveBtn=modal.querySelector('#avSave'); saveBtn.disabled=true; saveBtn.textContent='Salvando...';
    if (editing) {
      sb.from('malba_avaliacoes').update(rec).eq('id', aval.id).then(function(r){
        if (r.error) { toast('Erro ao salvar','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Salvar'; return; }
        for (var i=0;i<ST.avaliacoes.length;i++) if (ST.avaliacoes[i].id===aval.id) { ST.avaliacoes[i]=Object.assign(ST.avaliacoes[i],rec); break; }
        auditLog('Editou avaliação', alvoLabel()); close(); toast('Avaliação atualizada','success'); renderPage();
      });
    } else {
      sb.from('malba_avaliacoes').insert(rec).select().single().then(function(r){
        if (r.error || !r.data) { toast('Erro ao salvar avaliação','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Salvar avaliação'; return; }
        ST.avaliacoes.unshift(r.data); auditLog('Criou avaliação', alvoLabel()); close(); toast('Avaliação salva','success'); renderPage();
      });
    }
  }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  document.body.appendChild(modal);
  rerender(false);
}

function bindGestao() {
  if (!canManage()) return;
  var tabs=app.querySelectorAll('.cfg-tab');
  for (var i=0;i<tabs.length;i++) tabs[i].addEventListener('click', function(){ ST.gestaoTab=this.getAttribute('data-gtab'); renderPage(); });
  var nc=document.getElementById('btnNovaComissao'); if(nc) nc.addEventListener('click', openComissaoModal);
  var na=document.getElementById('btnNovaAvaliacao'); if(na) na.addEventListener('click', function(){ openAvaliacaoModal(); });
  var crows=app.querySelectorAll('.com-row[data-cid]');
  for (var z=0;z<crows.length;z++) crows[z].addEventListener('click', function(){
    var id=this.getAttribute('data-cid'); var c=null;
    for (var x=0;x<ST.comissoes.length;x++) if (String(ST.comissoes[x].id)===String(id)) { c=ST.comissoes[x]; break; }
    if (c) comissaoDetalhe(c);
  });
  var arows=app.querySelectorAll('.aval-row[data-aid]');
  for (var y=0;y<arows.length;y++) arows[y].addEventListener('click', function(){
    var id=this.getAttribute('data-aid'); var a=null;
    for (var x=0;x<ST.avaliacoes.length;x++) if (String(ST.avaliacoes[x].id)===String(id)) { a=ST.avaliacoes[x]; break; }
    if (a) openAvaliacaoModal(a);
  });
  if ((ST.gestaoTab||'')==='atividade') loadAtividade();
  // Visão geral: filtro de loja + drill
  var vgl=document.getElementById('vgLoja');
  if (vgl) vgl.addEventListener('change', function(){ ST.gestaoStore=this.value; renderPage(); });
  var vgLojas=app.querySelectorAll('.vg-loja[data-vgloja]');
  for (var li=0;li<vgLojas.length;li++) vgLojas[li].addEventListener('click', function(){
    ST.taskStore=this.getAttribute('data-vgloja'); ST.taskAssignee=''; ST.page='tarefas'; renderPage();
  });
  var vgColabs=app.querySelectorAll('.vg-colab[data-vgcolab]');
  for (var ci=0;ci<vgColabs.length;ci++) vgColabs[ci].addEventListener('click', function(){
    ST.taskAssignee=this.getAttribute('data-vgcolab'); ST.taskStore=ST.gestaoStore||''; ST.page='tarefas'; renderPage();
  });
  var rok=app.querySelectorAll('[data-reqok]');
  for (var ro=0;ro<rok.length;ro++) rok[ro].addEventListener('click', function(){ decidirReq(this.getAttribute('data-reqok'),'aprovado'); });
  var rno=app.querySelectorAll('[data-reqno]');
  for (var rn=0;rn<rno.length;rn++) rno[rn].addEventListener('click', function(){ decidirReq(this.getAttribute('data-reqno'),'negado'); });
}

/* ============ COLABORADOR: registrar venda, solicitações, painel "Meu Dia" ============ */
function isColaborador(s){ return roleRank(s||ST.session) <= 1; }
function meuMemberId(){ var ids=meusMemberIds(); return ids.length?ids[0]:null; }
function meuStoreId(){ var mid=meuMemberId(); if(mid){ for(var i=0;i<(ST.members||[]).length;i++) if(String(ST.members[i].id)===String(mid)) return ST.members[i].store_unit_id||null; } return ST.store?ST.store.id:null; }
function _ymNow(){ var d=new Date(); return {y:d.getFullYear(), m:d.getMonth()+1}; }
function _inMonth(dateStr){ var n=_ymNow(); var d=(dateStr||'').slice(0,10); if(!d) return false; var p=d.split('-'); return Number(p[0])===n.y && Number(p[1])===n.m; }
function vendasUserMes(uid){ var s=0; (ST.salesEntries||[]).forEach(function(e){ if(String(e.user_id)===String(uid) && _inMonth(e.sale_date)) s+=Number(e.value)||0; }); return s; }
function minhaMetaMes(){ var n=_ymNow(); var me=String(ST.session.user.id); var g=null; (ST.goals||[]).forEach(function(x){ if(x.month===n.m && x.year===n.y && String(x.user_id)===me) g=x; }); return g; }
function pendingRequests(){ var sid=boardStore(); return (ST.requests||[]).filter(function(r){ return (r.status||'pendente')==='pendente' && (!sid || String(r.store_unit_id)===String(sid)); }); }
function _parseBRL(s){ return parseFloat(String(s||'').replace(/\./g,'').replace(',', '.')) || 0; }

function openVendaModal(){
  var me=ST.session.user; var memberId=meuMemberId(); var storeId=meuStoreId();
  var modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML='<div class="modal">'+
    '<div class="modal-title-input" style="cursor:default">Registrar venda</div>'+
    '<div class="modal-grid2"><div class="modal-row"><label class="modal-label">Valor (R$) *</label><input type="text" id="vVal" inputmode="decimal" placeholder="0,00"></div><div class="modal-row"><label class="modal-label">Data</label><input type="date" id="vDate" value="'+today()+'"></div></div>'+
    '<div class="modal-row"><label class="modal-label">Cliente (opcional)</label><input type="text" id="vCli" placeholder="Nome do cliente"></div>'+
    '<div class="modal-row"><label class="modal-label">Observação (opcional)</label><input type="text" id="vObs" placeholder="ex: forma de pagamento, itens"></div>'+
    '<div class="modal-note">Sua venda entra na sua meta do mês e no acompanhamento do gestor.</div>'+
    '<div class="modal-foot"><button class="btn btn-ghost" id="vCancel">Cancelar</button><button class="btn btn-primary" id="vSave">Registrar venda</button></div>'+
  '</div>';
  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  modal.querySelector('#vCancel').addEventListener('click', close);
  modal.querySelector('#vSave').addEventListener('click', function(){

function timeAgo(ts){
  try{
    var d=new Date(ts), now=new Date(), s=Math.floor((now-d)/1000);
    if (s<60) return 'agora há pouco';
    if (s<3600) return 'há '+Math.floor(s/60)+' min';
    if (s<86400) return 'há '+Math.floor(s/3600)+' h';
    var dias=Math.floor(s/86400); if (dias===1) return 'ontem';
    if (dias<30) return 'há '+dias+' dias';
    return fmtDate(d.toISOString().slice(0,10));
  }catch(e){ return ''; }
}
