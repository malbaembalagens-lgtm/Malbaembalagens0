        (type === 'semanais' ?
          '<div class="field"><label class="field-label" style="font-size:11px">📅 Dia da semana de execução</label>' +
            '<select class="input" id="tplWeekday">' +
              '<option value="">Qualquer dia da semana</option>' +
              [['1','Segunda-feira'],['2','Terça-feira'],['3','Quarta-feira'],['4','Quinta-feira'],['5','Sexta-feira'],['6','Sábado'],['0','Domingo']].map(function(d) {
                return '<option value="' + d[0] + '"' + (String(task.weekday) === d[0] ? ' selected' : '') + '>' + d[1] + '</option>';
              }).join('') +
            '</select>' +
            '<div style="font-size:10px;color:#6B6B6B;margin-top:4px">A tarefa será disparada toda semana nesse dia</div>' +
          '</div>' : '') +

        (type === 'mensais' ?
          '<div class="field"><label class="field-label" style="font-size:11px">📅 Dia do mês de execução</label>' +
            '<select class="input" id="tplMonthDay">' +
              '<option value="">Qualquer dia (mensal genérico)</option>' +
              monthDayOpts(task.monthDay) +
            '</select>' +
            '<div style="font-size:10px;color:#6B6B6B;margin-top:4px">A tarefa aparecerá no Meu Dia neste dia do mês</div>' +
          '</div>' : '') +
      '</div>' +
      '<div class="field" style="margin-bottom:14px"><label class="field-label">Tags</label>' +
        '<div class="tag-list" id="tagList">' + tagsHTML + '</div>' +
        '<div style="display:flex;gap:6px;margin-top:6px">' +
          '<input class="input" id="newTagInput" placeholder="Nova tag (ex: urgente)" style="flex:1;height:32px">' +
          '<button class="btn btn-sm" id="btnAddTag" type="button"><span style="display:inline-flex">' + ICON.plus + '</span></button>' +
        '</div>' +
      '</div>' +
      '<div class="field"><label class="field-label">Links de referência</label>' +
        '<div id="linkList">' + linksHTML + '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr 32px;gap:6px;margin-top:6px">' +
          '<input class="input" id="newLinkLabel" placeholder="Nome do link" style="height:32px">' +
          '<input class="input" id="newLinkUrl" placeholder="https://..." style="height:32px">' +
          '<button class="btn btn-icon" id="btnAddLink" type="button"><span style="display:inline-flex">' + ICON.plus + '</span></button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="modal-foot"><button class="btn" data-close>Cancelar</button>' +
      '<button class="btn btn-primary" id="btnSaveTpl">' + (isNew ? 'Criar tarefa' : 'Salvar') + '</button></div>' +
    '</div></div>';

  showModal(html);

  var workTags = task.tags.slice();
  var workLinks = task.links.slice();

  function renderTagList() {
    var el = document.getElementById('tagList');
    if (!el) return;
    var h = '';
    for (var ti2 = 0; ti2 < workTags.length; ti2++) {
      h += '<span class="tag-chip"># ' + esc(workTags[ti2]) +
        ' <button class="tag-rm" data-tag-rm="' + esc(workTags[ti2]) + '">×</button></span>';
    }
    el.innerHTML = h;
    var rms = document.querySelectorAll('[data-tag-rm]');
    for (var r = 0; r < rms.length; r++) {
      (function(b) {
        b.addEventListener('click', function() {
          var t = b.getAttribute('data-tag-rm');
          workTags = workTags.filter(function(x) { return x !== t; });
          renderTagList();
        });
      })(rms[r]);
    }
  }
  renderTagList();

  function renderLinkList() {
    var el = document.getElementById('linkList');
    if (!el) return;
    var h = '';
    for (var li2 = 0; li2 < workLinks.length; li2++) {
      var lk = workLinks[li2];
      h += '<div class="link-row">' +
        '<span style="font-size:13px;flex:1">🔗 ' + esc(lk.label || lk.url) + '</span>' +
        '<button class="btn-icon danger" data-link-rm="' + li2 + '"><span style="display:inline-flex">' + ICON.trash + '</span></button>' +
      '</div>';
    }
    el.innerHTML = h;
    var rms = document.querySelectorAll('[data-link-rm]');
    for (var lr = 0; lr < rms.length; lr++) {
      (function(b) {
        b.addEventListener('click', function() {
          var idx = parseInt(b.getAttribute('data-link-rm'), 10);
          workLinks.splice(idx, 1);
          renderLinkList();
        });
      })(rms[lr]);
    }
  }
  renderLinkList();

  document.getElementById('btnAddTag').addEventListener('click', function() {
    var v = document.getElementById('newTagInput').value.trim();
    if (!v) return;
    if (workTags.indexOf(v) !== -1) { toast('Tag já existe', 'error'); return; }
    workTags.push(v);
    document.getElementById('newTagInput').value = '';
    renderTagList();
  });
  document.getElementById('newTagInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('btnAddTag').click(); }
  });

  document.getElementById('btnAddLink').addEventListener('click', function() {
    var lbl = document.getElementById('newLinkLabel').value.trim();
    var url = document.getElementById('newLinkUrl').value.trim();
    if (!url) { toast('Informe a URL', 'error'); return; }
    workLinks.push({ label: lbl || url, url: url });
    document.getElementById('newLinkLabel').value = '';
    document.getElementById('newLinkUrl').value = '';
    renderLinkList();
  });

  document.getElementById('btnSaveTpl').addEventListener('click', function() {
    var newCode = document.getElementById('tplCode').value.trim().toUpperCase();
    var title = document.getElementById('tplTitle').value.trim();
    var desc = document.getElementById('tplDesc').value.trim();
    var area = document.getElementById('tplArea').value;
    var prio = document.getElementById('tplPriority').value;
    var defaultAssigneeId = document.getElementById('tplDefaultAssignee').value || null;

    // V8.7: novos campos
    var startTime = document.getElementById('tplStartTime');
    var endTime = document.getElementById('tplEndTime');
    var duration = document.getElementById('tplDuration');
    var weekday = document.getElementById('tplWeekday');
    var monthDay = document.getElementById('tplMonthDay');
    var startTimeVal = startTime ? (startTime.value || null) : null;
    var endTimeVal = endTime ? (endTime.value || null) : null;
    var durationVal = duration && duration.value ? parseInt(duration.value, 10) : null;
    var weekdayVal = weekday && weekday.value !== '' ? parseInt(weekday.value, 10) : null;
    var monthDayVal = monthDay && monthDay.value ? parseInt(monthDay.value, 10) : null;

    if (!newCode || !title) { toast('Preencha código e título', 'error'); return; }
    if (isNew) {
      var all = state.tpl.diarias.concat(state.tpl.semanais).concat(state.tpl.mensais);
      for (var i2 = 0; i2 < all.length; i2++) if (all[i2].code === newCode) {
        toast('Código já existe', 'error');
        return;
      }
      var newTpl = {
        code: newCode, title: title, desc: desc, area: area, priority: prio,
        tags: workTags, links: workLinks, defaultAssigneeId: defaultAssigneeId,
        startTime: startTimeVal, endTime: endTimeVal, durationMin: durationVal,
        weekday: weekdayVal, monthDay: monthDayVal
      };
      state.tpl[type].push(newTpl);
      logActivity('catalog', 'criou tarefa ' + newCode);
      save();
      if (window.sbSaveTpl) window.sbSaveTpl(type, newTpl, state.tpl[type].length);
      toast('Tarefa criada ✓', 'success');
      closeModal();
      renderShell();
      renderPage();
    } else {
      task.title = title; task.desc = desc; task.area = area; task.priority = prio;
      task.tags = workTags; task.links = workLinks;
      task.defaultAssigneeId = defaultAssigneeId;
      task.startTime = startTimeVal; task.endTime = endTimeVal;
      task.durationMin = durationVal;
      task.weekday = weekdayVal; task.monthDay = monthDayVal;
      logActivity('catalog', 'editou tarefa ' + code);
      save();
      if (window.sbSaveTpl) window.sbSaveTpl(type, task, 0);
      toast('Salva ✓', 'success');
      closeModal();
      renderShell();
      renderPage();
    }
  });
}

    var u = state.users[i];

      for (var ai = 0; ai < u.areas.length; ai++) areasHTML += areaTag(u.areas[ai]) + ' ';
    } else {
      areasHTML = '<span style="font-size:11px;color:#9A9A9A">Sem áreas atribuídas</span>';

    rows += '<div class="user-row">' +
      avatar(u, 'lg') +

          (u.position ? ' <span style="font-size:11px;color:#6B6B6B;font-weight:400">· ' + esc(u.position) + '</span>' : '') +
        '</div>' +
        '<div class="user-row-email">' + esc(u.email) + (u.phone ? ' · ' + esc(u.phone) : '') + '</div>' +
        '<div class="user-row-areas">' + areasHTML + ' ' + customPermBadge + '</div>' +
      '</div>' +

        '<button class="btn-icon" data-edit-user="' + esc(u.id) + '" title="Editar"><span style="display:inline-flex">' + ICON.edit + '</span></button>' +
        (u.id !== state.user.id ? '<button class="btn-icon danger" data-del-user="' + esc(u.id) + '" title="Excluir"><span style="display:inline-flex">' + ICON.trash + '</span></button>' : '') +
      '</div>' +

    '<button class="btn btn-primary" id="btnNewUser"><span class="icon" style="display:inline-flex">' + ICON.plus + '</span> Novo usuário</button>' +
    '</div>' + rows;
}

function attachUsuarios() {
  var nb = document.getElementById('btnNewUser');
  if (nb) nb.addEventListener('click', function() { openUserModal(); });

  var edits = document.querySelectorAll('[data-edit-user]');
  for (var i = 0; i < edits.length; i++) {
    (function(b) {
      b.addEventListener('click', function() { openUserModal(b.getAttribute('data-edit-user')); });
    })(edits[i]);
  }

  var dels = document.querySelectorAll('[data-del-user]');
  for (var d = 0; d < dels.length; d++) {
    (function(b) {
      b.addEventListener('click', function() {
        var id = b.getAttribute('data-del-user');
        var u = getUser(id);
        if (!u) return;
        if (!confirm('Excluir o usuário "' + u.name + '"?')) return;
        state.users = state.users.filter(function(x) { return x.id !== id; });
        for (var k in state.inst) {
          if (state.inst.hasOwnProperty(k) && state.inst[k].assigneeId === id) state.inst[k].assigneeId = null;
        }
        logActivity('user', 'excluiu usuário ' + u.name);
        save();
        if (window.sbDelUser) window.sbDelUser(id);
        renderPage();
        toast('Excluído', 'success');
      });
    })(dels[d]);
  }
}

  var u = isNew ? {
    id: '', name: '', email: '', password: '', role: 'user',

    initials: '', areas: [],
    phone: '', position: '', bio: '', avatar: '',

  var colorHTML = '';
  for (var i = 0; i < COLORS.length; i++) {

      '<label class="perm-toggle">' +

      '</label>' +

    '<div class="modal-tabs">' +
      '<button class="modal-tab active" data-tab="basic">Dados básicos</button>' +
      '<button class="modal-tab" data-tab="extra">Informações</button>' +
      '<button class="modal-tab" data-tab="perms">Permissões</button>' +
    '</div>';

  var avatarPreview = u.avatar
    ? '<div class="avatar-preview" id="avPreview" style="background-image:url(' + esc(u.avatar) + ')"></div>'
    : '<div class="avatar-preview" id="avPreview" style="background:' + esc(u.color || '#0A0A0A') + ';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px">' + esc(getInitials(u.name) || '?') + '</div>';

  var html = '<div class="modal-bg" id="modalBg"><div class="modal lg">' +
    '<div class="modal-head"><div class="modal-title">' + (isNew ? 'Novo Usuário' : 'Editar Usuário') + '</div>' +
      '<button class="modal-close" data-close><span class="icon">' + ICON.close + '</span></button></div>' +
    '<div class="modal-body" style="padding:0">' +
    tabsHTML +
    // Tab 1: Básico
    '<div class="modal-tab-content active" data-tab-content="basic" style="padding:20px 24px">' +
      '<div class="field" style="margin-bottom:14px"><label class="field-label">Nome completo</label>' +
        '<input class="input" id="usrName" value="' + esc(u.name) + '"></div>' +
      '<div class="field" style="margin-bottom:14px"><label class="field-label">E-mail</label>' +
        '<input class="input" type="email" id="usrEmail" value="' + esc(u.email) + '"' + (isNew ? '' : ' disabled') + '></div>' +
      '<div class="field" style="margin-bottom:14px"><label class="field-label">' + (isNew ? 'Senha' : 'Nova senha (deixe vazio para manter atual)') + '</label>' +
        '<div style="display:flex;gap:6px">' +
          '<input class="input" type="text" id="usrPass" placeholder="' + (isNew ? 'Defina uma senha' : 'Nova senha') + '" style="flex:1">' +
          (!isNew ? '<button class="btn" id="btnGenPass" type="button" title="Gerar senha aleatória">🎲 Gerar</button>' : '') +
        '</div>' +
      '</div>' +
      '<div class="field-row" style="margin-bottom:14px">' +
        '<div class="field"><label class="field-label">Função</label>' +
          '<select class="input" id="usrRole">' +
            '<option value="user"' + (u.role === 'user' ? ' selected' : '') + '>Usuário</option>' +
            '<option value="admin"' + (u.role === 'admin' ? ' selected' : '') + '>Administrador</option>' +
          '</select>' +
        '</div>' +
        '<div class="field"><label class="field-label">Cor (fallback)</label>' +
          '<div class="color-grid" id="usrColors">' + colorHTML + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="field"><label class="field-label">Áreas de trabalho</label>' +
        '<div class="area-selector" id="usrAreas">' + (areasHTML || '<span style="color:#9A9A9A;font-size:12px">Crie áreas em Configurações</span>') + '</div>' +
        '<div style="font-size:11px;color:#6B6B6B;margin-top:6px">Usuário só vê tarefas dessas áreas (admin vê tudo).</div>' +
      '</div>' +
    '</div>' +
    // Tab 2: Extra
    '<div class="modal-tab-content" data-tab-content="extra" style="padding:20px 24px;display:none">' +
      '<div style="display:flex;gap:16px;align-items:flex-start;margin-bottom:18px">' +
        avatarPreview +
        '<div style="flex:1">' +
          '<label class="field-label">Foto de perfil</label>' +

    '</div>' +
    // Tab 3: Permissões

      '<button class="btn btn-sm" id="btnResetPerms" style="margin-top:14px" type="button">↻ Resetar para padrão da função</button>' +

  showModal(html);

  // Tabs
  var tabBtns = document.querySelectorAll('[data-tab]');
  for (var tb = 0; tb < tabBtns.length; tb++) {
    (function(b) {
      b.addEventListener('click', function() {
        var t = b.getAttribute('data-tab');
        var allTabs = document.querySelectorAll('[data-tab]');
        for (var i = 0; i < allTabs.length; i++) allTabs[i].classList.remove('active');
        b.classList.add('active');
        var contents = document.querySelectorAll('[data-tab-content]');
        for (var c = 0; c < contents.length; c++) {
          var ct = contents[c];
          if (ct.getAttribute('data-tab-content') === t) { ct.classList.add('active'); ct.style.display = 'block'; }
          else { ct.classList.remove('active'); ct.style.display = 'none'; }

    (function(el) {
      el.addEventListener('click', function() {
        for (var k = 0; k < colorOpts.length; k++) colorOpts[k].classList.remove('selected');
        el.classList.add('selected');
        selectedColor = el.getAttribute('data-color');
      });
    })(colorOpts[c2]);

  var selectedAreas = u.areas ? u.areas.slice() : [];
  var areaChips = document.querySelectorAll('[data-area]');
  for (var ax = 0; ax < areaChips.length; ax++) {
    (function(el) {
      el.addEventListener('click', function() {
        var area = el.getAttribute('data-area');
        var idx = selectedAreas.indexOf(area);
        var aInfo = getArea(area);
        if (idx === -1) {
          selectedAreas.push(area);
          el.classList.add('selected');
          el.style.background = aInfo.color;
          el.style.color = '#fff';
          el.style.borderColor = aInfo.color;
        } else {
          selectedAreas.splice(idx, 1);
          el.classList.remove('selected');
          el.style.background = '';
          el.style.color = '';
          el.style.borderColor = aInfo.color + '40';
        }
      });
    })(areaChips[ax]);
  }

  if (btnGen) btnGen.addEventListener('click', function() {

    for (var p = 0; p < 8; p++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
    document.getElementById('usrPass').value = pass;
    toast('Senha gerada — copie antes de salvar!', 'success');
  });

  var btnUp = document.getElementById('btnUpAvatar');
  var upFile = document.getElementById('upAvatarFile');
  var avUrlInp = document.getElementById('usrAvatarUrl');
  var avPreview = document.getElementById('avPreview');

    btnUp.addEventListener('click', function() { upFile.click(); });

      var f = upFile.files && upFile.files[0];
      if (!f) return;
      if (f.size > 200 * 1024) { toast('Imagem muito grande (máx 200KB)', 'error'); return; }
      var reader = new FileReader();
      reader.onload = function(ev) {
        var dataUrl = ev.target.result;
        avUrlInp.value = dataUrl;
        if (avPreview) {
          avPreview.style.backgroundImage = 'url(' + dataUrl + ')';
          avPreview.style.backgroundSize = 'cover';
          avPreview.style.backgroundPosition = 'center';
          avPreview.innerHTML = '';
          avPreview.style.background = avPreview.style.background.replace(/^[^u]*$/, '');
        }
        toast('Imagem carregada', 'success');
      };
      reader.readAsDataURL(f);
    });
  }
  var btnRm = document.getElementById('btnRmAvatar');
  if (btnRm) btnRm.addEventListener('click', function() {
    avUrlInp.value = '';
    if (avPreview) {
      avPreview.style.backgroundImage = '';
      avPreview.style.background = selectedColor;
      avPreview.innerHTML = esc(getInitials(document.getElementById('usrName').value) || '?');
      avPreview.style.color = '#fff';
      avPreview.style.display = 'flex';
      avPreview.style.alignItems = 'center';
      avPreview.style.justifyContent = 'center';
      avPreview.style.fontWeight = '700';
      avPreview.style.fontSize = '20px';
    }
  });

  // Reset perms
  var btnReset = document.getElementById('btnResetPerms');
  if (btnReset) btnReset.addEventListener('click', function() {
    var role = document.getElementById('usrRole').value;
    var perms = document.querySelectorAll('[data-perm]');
    for (var rp = 0; rp < perms.length; rp++) {
      var key = perms[rp].getAttribute('data-perm');
      var pp = null;
      for (var pi2 = 0; pi2 < PAGE_PERMISSIONS.length; pi2++) {
        if (PAGE_PERMISSIONS[pi2].key === key) { pp = PAGE_PERMISSIONS[pi2]; break; }
      }
      if (pp) perms[rp].checked = role === 'admin' ? pp.defaultAdmin : pp.defaultUser;
    }
    toast('Permissões resetadas', 'success');
  });

  document.getElementById('btnSaveUsr').addEventListener('click', function() {
    var name = document.getElementById('usrName').value.trim();
    var email = document.getElementById('usrEmail').value.trim();
    var pass = document.getElementById('usrPass').value;
    var role = document.getElementById('usrRole').value;
    var phone = document.getElementById('usrPhone').value.trim();
    var position = document.getElementById('usrPosition').value.trim();
    var bio = document.getElementById('usrBio').value.trim();
    var avatarUrl = document.getElementById('usrAvatarUrl').value.trim();
    var dailyGoal = parseInt(document.getElementById('usrGoal').value, 10) || 5;

    if (!name || !email) { toast('Preencha nome e e-mail', 'error'); return; }
    if (isNew && !pass) { toast('Defina uma senha', 'error'); return; }
    if (pass && pass.length < 4) { toast('Senha precisa ter pelo menos 4 caracteres', 'error'); return; }

    // Coletar permissões
    var permissions = {};
    var permEls = document.querySelectorAll('[data-perm]');
    var customPerm = false;
    for (var pe = 0; pe < permEls.length; pe++) {
      var key = permEls[pe].getAttribute('data-perm');
      var checked = permEls[pe].checked;
      var pp = null;
      for (var ppi = 0; ppi < PAGE_PERMISSIONS.length; ppi++) {
        if (PAGE_PERMISSIONS[ppi].key === key) { pp = PAGE_PERMISSIONS[ppi]; break; }
      }
      var defaultV = pp ? (role === 'admin' ? pp.defaultAdmin : pp.defaultUser) : false;
      if (checked !== defaultV) customPerm = true;
      permissions[key] = checked;
    }

    if (isNew) {
      for (var i2 = 0; i2 < state.users.length; i2++) {
        if (state.users[i2].email.toLowerCase() === email.toLowerCase()) {
          toast('E-mail já cadastrado', 'error');
          return;
        }
      }
      var newU = {
        id: genUUID(), name: name, email: email, password: pass, role: role,
        color: selectedColor, initials: getInitials(name), areas: selectedAreas,
        phone: phone, position: position, bio: bio, avatar: avatarUrl,
        permissions: customPerm ? permissions : null,
        dailyGoal: dailyGoal,
        createdAt: Date.now()
      };
      state.users.push(newU);
      logActivity('user', 'criou usuário ' + name);
      save();
      if (window.sbSaveUser) window.sbSaveUser(newU);
      toast('Usuário criado ✓', 'success');
      closeModal();
      renderShell();
      renderPage();
    } else {
      u.name = name; u.role = role; u.color = selectedColor;
      u.initials = getInitials(name); u.areas = selectedAreas;
      u.phone = phone; u.position = position; u.bio = bio; u.avatar = avatarUrl;
      u.permissions = customPerm ? permissions : null;
      u.dailyGoal = dailyGoal;
      if (pass) u.password = pass;
      logActivity('user', 'editou usuário ' + name);
      save();
      if (window.sbSaveUser) window.sbSaveUser(u);
      toast('Salvo ✓', 'success');
      closeModal();
      renderShell();
      renderPage();
    }
  });
}

// ATIVIDADE

function renderAtividade() {
  if (!isAdmin()) return renderAccessDenied();

  var sorted = state.activity.slice().sort(function(a, b) {
    return (b.timestamp || 0) - (a.timestamp || 0);
  });

  // Filtros
  var fUser = state.ui.fActivityUser || 'todos';
  var fType = state.ui.fActivityType || 'todos';
  var fSearch = state.ui.fActivitySearch || '';

  var filtered = sorted.filter(function(a) {
    if (fUser !== 'todos' && a.userId !== fUser) return false;
    if (fType !== 'todos' && a.type !== fType) return false;
    if (fSearch) {
      var q = fSearch.toLowerCase();
      var txt = (a.text || a.description || '').toLowerCase();
      var nm = (a.userName || '').toLowerCase();
      if (txt.indexOf(q) === -1 && nm.indexOf(q) === -1) return false;
    }
    return true;
  });

  // Stats por usuário
  var userActions = {};
  for (var ia = 0; ia < sorted.length; ia++) {
    var aa = sorted[ia];
    if (aa.userId) {
      userActions[aa.userId] = (userActions[aa.userId] || 0) + 1;
    }
  }

  // Filtro options
  var userOpts = '<option value="todos">Todos os usuários</option>';
  for (var u = 0; u < state.users.length; u++) {
    userOpts += '<option value="' + esc(state.users[u].id) + '"' + (fUser === state.users[u].id ? ' selected' : '') + '>' + esc(state.users[u].name) + ' (' + (userActions[state.users[u].id] || 0) + ')</option>';
  }
  var typeOpts = '<option value="todos">Todos os tipos</option>' +
    '<option value="task"' + (fType === 'task' ? ' selected' : '') + '>📋 Tarefas</option>' +
    '<option value="project"' + (fType === 'project' ? ' selected' : '') + '>📁 Projetos</option>' +
    '<option value="camp"' + (fType === 'camp' ? ' selected' : '') + '>🎯 Campanhas</option>' +
    '<option value="user"' + (fType === 'user' ? ' selected' : '') + '>👤 Usuários</option>' +
    '<option value="catalog"' + (fType === 'catalog' ? ' selected' : '') + '>📚 Catálogo</option>' +
    '<option value="config"' + (fType === 'config' ? ' selected' : '') + '>⚙️ Configurações</option>' +
    '<option value="login"' + (fType === 'login' ? ' selected' : '') + '>🔑 Login/Logout</option>';

  var rows = '';
  if (filtered.length === 0) {
    rows = '<div class="empty"><div class="empty-icon">' + ICON.hist + '</div><div class="empty-title">Nenhuma atividade encontrada</div></div>';
  } else {
    for (var i = 0; i < Math.min(200, filtered.length); i++) {
      var a = filtered[i];
      var au = getUser(a.userId);
      var typeIcon = '📋';
      if (a.type === 'project') typeIcon = '📁';
      else if (a.type === 'camp') typeIcon = '🎯';
      else if (a.type === 'user') typeIcon = '👤';
      else if (a.type === 'catalog') typeIcon = '📚';
      else if (a.type === 'config') typeIcon = '⚙️';
      else if (a.type === 'login' || a.type === 'logout') typeIcon = '🔑';
      rows += '<div class="activity-row">' +
        (au ? avatar(au, 'sm') : '<span class="activity-icon">' + ICON.user + '</span>') +
        '<div class="activity-content">' +
          '<div class="activity-text"><strong>' + esc(a.userName || 'Sistema') + '</strong> ' + typeIcon + ' ' + esc(a.text || a.description || '') + '</div>' +
          '<div class="activity-time">' + fmtDate(a.timestamp) + ' · ' + timeAgo(a.timestamp) + '</div>' +
        '</div></div>';
    }
  }

  return '<div class="page-head"><div><h2 class="page-title">📜 Histórico de Atividades</h2>' +
    '<p class="page-sub">' + sorted.length + ' eventos · mostrando ' + filtered.length + '</p></div>' +
    '<button class="btn" id="btnClearActivity">Limpar histórico</button></div>' +

    '<div class="card"><div class="card-body" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
      '<div style="flex:1;min-width:200px"><label class="field-label">Buscar</label><input class="input" id="actSearch" placeholder="Buscar atividade..." value="' + esc(fSearch) + '"></div>' +
      '<div style="min-width:200px"><label class="field-label">Usuário</label><select class="input" id="actUser">' + userOpts + '</select></div>' +
      '<div style="min-width:200px"><label class="field-label">Tipo</label><select class="input" id="actType">' + typeOpts + '</select></div>' +
    '</div></div>' +

    '<div class="card"><div class="card-body no-pad">' + rows + '</div></div>';
}

function attachAtividade() {
  var b = document.getElementById('btnClearActivity');
  if (b) b.addEventListener('click', function() {
    if (!confirm('Limpar todo o histórico?')) return;
    state.activity = [];
    save();
    renderPage();
    toast('Histórico limpo', 'success');
  });

  var s = document.getElementById('actSearch');
  if (s) s.addEventListener('input', function() {
    state.ui.fActivitySearch = s.value;
    renderPage();
    setTimeout(function() {
      var n = document.getElementById('actSearch');
      if (n) { n.focus(); n.setSelectionRange(s.value.length, s.value.length); }
    }, 0);
  });

  var fu = document.getElementById('actUser');
  if (fu) fu.addEventListener('change', function() {
    state.ui.fActivityUser = fu.value;
    renderPage();
  });

  var ft = document.getElementById('actType');
  if (ft) ft.addEventListener('change', function() {
    state.ui.fActivityType = ft.value;
    renderPage();
  });
}

function attachConfig() {
  // Branding
  var btnSave = document.getElementById('btnSaveBranding');
  var primarySel = (state.settings.company && state.settings.company.primaryColor) || '#E8561A';
  var themeSel = state.settings.theme || 'light';

  var primaryOpts = document.querySelectorAll('[data-primary]');
  for (var p = 0; p < primaryOpts.length; p++) {
    (function(el) {
      el.addEventListener('click', function() {
        for (var k = 0; k < primaryOpts.length; k++) primaryOpts[k].classList.remove('selected');
        el.classList.add('selected');
        primarySel = el.getAttribute('data-primary');
      });
    })(primaryOpts[p]);
  }

  var themeBtns = document.querySelectorAll('[data-theme]');
  for (var tb = 0; tb < themeBtns.length; tb++) {
    (function(el) {
      el.addEventListener('click', function() {
        for (var k = 0; k < themeBtns.length; k++) themeBtns[k].classList.remove('btn-primary');
        el.classList.add('btn-primary');
        themeSel = el.getAttribute('data-theme');
      });
    })(themeBtns[tb]);
  }

  // Logo upload
  var btnUpLogo = document.getElementById('btnUpLogo');
  var upLogoFile = document.getElementById('upLogoFile');
  if (btnUpLogo) btnUpLogo.addEventListener('click', function() { upLogoFile.click(); });
  if (upLogoFile) upLogoFile.addEventListener('change', function() {
    var f = upLogoFile.files && upLogoFile.files[0];
    if (!f) return;
    if (f.size > 200 * 1024) { toast('Imagem muito grande (máx 200KB)', 'error'); return; }
    var reader = new FileReader();
    reader.onload = function(ev) {
      document.getElementById('cfgLogoUrl').value = ev.target.result;
      toast('Logo carregada (clique em Salvar)', 'success');
    };
    reader.readAsDataURL(f);
  });
  var btnRmLogo = document.getElementById('btnRmLogo');
  if (btnRmLogo) btnRmLogo.addEventListener('click', function() {
    document.getElementById('cfgLogoUrl').value = '';
  });

  if (btnSave) btnSave.addEventListener('click', function() {
    state.settings.company = {
      name: document.getElementById('cfgName').value.trim() || 'MALBA',
      tagline: document.getElementById('cfgTagline').value.trim() || 'Embalagens',
      tagline2: document.getElementById('cfgTagline2').value.trim() || 'Sistema de Gestão Operacional 2026',
      logo: document.getElementById('cfgLogoUrl').value.trim(),
      primaryColor: primarySel
    };
    state.settings.theme = themeSel;
    save();
    applyTheme();
    if (window.sbSaveSettings) window.sbSaveSettings();
    logActivity('config', 'atualizou identidade visual');
    renderShell();
    renderPage();
    toast('Identidade visual salva ✓', 'success');
  });

  // Área: adicionar
  var btnAddArea = document.getElementById('btnAddArea');
  if (btnAddArea) btnAddArea.addEventListener('click', function() { openAreaModal(); });

  // Editar / Excluir
  var edits = document.querySelectorAll('[data-edit-area]');
  for (var ei = 0; ei < edits.length; ei++) {
    (function(b) {
      b.addEventListener('click', function() { openAreaModal(b.getAttribute('data-edit-area')); });
    })(edits[ei]);
  }
  var dels = document.querySelectorAll('[data-del-area]');
  for (var i = 0; i < dels.length; i++) {
    (function(b) {
      b.addEventListener('click', function() {
        var name = b.getAttribute('data-del-area');
        if (!confirm('Excluir a área "' + name + '"?')) return;
        state.settings.areas = state.settings.areas.filter(function(x) { return x.name !== name; });
        logActivity('config', 'excluiu área "' + name + '"');
        save();
        if (window.sbSaveSettings) window.sbSaveSettings();
        renderPage();
        toast('Área excluída', 'success');
      });
    })(dels[i]);
  }

  // Export
  var be = document.getElementById('btnExport');
  if (be) be.addEventListener('click', function() {
    var data = JSON.stringify({
      version: APP_VERSION,
      exportedAt: new Date().toISOString(),
      users: state.users, tpl: state.tpl, inst: state.inst,
      projects: state.projects, projInst: state.projInst,
      activity: state.activity, settings: state.settings
    }, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'malba-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('Backup baixado ✓', 'success');
  });

  // Export CSV
  var bcsv = document.getElementById('btnExportCSV');
  if (bcsv) bcsv.addEventListener('click', function() {
    var lines = ['Codigo,Tipo,Titulo,Descricao,Area,Prioridade,Tags'];
    function addArr(arr, type) {
      for (var i = 0; i < arr.length; i++) {
        var t = arr[i];
        var row = [
          t.code, type, '"' + (t.title || '').replace(/"/g, '""') + '"',
          '"' + (t.desc || '').replace(/"/g, '""').replace(/\n/g, ' ') + '"',
          t.area || '', t.priority || '', '"' + ((t.tags || []).join(';')) + '"'
        ];
        lines.push(row.join(','));
      }
    }
    addArr(state.tpl.diarias, 'Diaria');
    addArr(state.tpl.semanais, 'Semanal');
    addArr(state.tpl.mensais, 'Mensal');
    var csv = '\ufeff' + lines.join('\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'malba-tarefas-' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    toast('CSV exportado ✓', 'success');
  });

  // Import
  var bi = document.getElementById('btnImport');
  var imf = document.getElementById('importFile');
  if (bi && imf) {
    bi.addEventListener('click', function() { imf.click(); });
    imf.addEventListener('change', function() {
      var f = imf.files[0];
      if (!f) return;
      if (!confirm('Substituir TODOS os dados pelo backup?')) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var data = JSON.parse(e.target.result);
          if (data.users) state.users = data.users;
          if (data.tpl) state.tpl = data.tpl;
          if (data.inst) state.inst = data.inst;
          if (data.projects) state.projects = data.projects;
          if (data.projInst) state.projInst = data.projInst;
          if (data.activity) state.activity = data.activity;
          if (data.settings) state.settings = data.settings;
          save();
          load(); // reapply migrations
          applyTheme();
          renderShell();
          renderPage();
          toast('Restaurado ✓', 'success');
        } catch(err) {
          toast('Arquivo inválido', 'error');
        }
      };
      reader.readAsText(f);
    });
  }

  var br = document.getElementById('btnReset');
  if (br) br.addEventListener('click', function() {
    if (!confirm('Resetar tudo? Esta ação não pode ser desfeita.')) return;
    if (!confirm('Tem certeza ABSOLUTA? Todos os dados serão perdidos.')) return;
    try { localStorage.removeItem(STORAGE_KEY); sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
    location.reload();
  });
}

    for (var i = 0; i < state.settings.areas.length; i++) if (state.settings.areas[i].name === name) { area = state.settings.areas[i]; break; }
  }
  if (!area) area = { name: name || '', color: '#1E88E5', emoji: '📁' };

  var areaColors = ['#1E88E5','#43A047','#E53935','#FB8C00','#8E24AA','#3949AB','#00ACC1','#546E7A','#D81B60','#7CB342','#5E35B1','#039BE5'];
  var emojis = ['📁','💬','📦','🚚','📣','🎨','🎯','📋','👥','💰','📊','🔧','🚀','⚙️','🛒','📞','🖥️','🏢','📝','✨','🎪','🌟','⭐','🔥','💡','🎁'];

  var html = '<div class="modal-bg" id="modalBg"><div class="modal">' +
    '<div class="modal-head"><div class="modal-title">' + (isNew ? 'Nova Área' : 'Editar Área') + '</div>' +
      '<button class="modal-close" data-close><span class="icon">' + ICON.close + '</span></button></div>' +
    '<div class="modal-body">' +
      '<div class="field" style="margin-bottom:14px"><label class="field-label">Nome da área</label>' +
        '<input class="input" id="areaName" value="' + esc(area.name) + '" placeholder="Ex: Financeiro"' + (isNew ? '' : ' disabled') + '></div>' +
      '<div class="field" style="margin-bottom:14px"><label class="field-label">Cor</label>' +
        '<div class="color-grid">' + colorHTML + '</div>' +
      '</div>' +
      '<div class="field"><label class="field-label">Ícone</label>' +
        '<div class="emoji-grid">' + emojiHTML + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="modal-foot"><button class="btn" data-close>Cancelar</button>' +
      '<button class="btn btn-primary" id="btnSaveArea">' + (isNew ? 'Criar' : 'Salvar') + '</button></div>' +
    '</div></div>';

  showModal(html);

  var selColor = area.color, selEmoji = area.emoji;
  var cOpts = document.querySelectorAll('[data-area-color]');
  for (var co = 0; co < cOpts.length; co++) {
    (function(el) {
      el.addEventListener('click', function() {
        for (var k = 0; k < cOpts.length; k++) cOpts[k].classList.remove('selected');
        el.classList.add('selected');
        selColor = el.getAttribute('data-area-color');
      });
    })(cOpts[co]);
  }
  var eOpts = document.querySelectorAll('[data-area-emoji]');
  for (var eo = 0; eo < eOpts.length; eo++) {
    (function(el) {
      el.addEventListener('click', function() {
        for (var k = 0; k < eOpts.length; k++) eOpts[k].classList.remove('selected');
        el.classList.add('selected');
        selEmoji = el.getAttribute('data-area-emoji');
      });
    })(eOpts[eo]);
  }

  document.getElementById('btnSaveArea').addEventListener('click', function() {
    var newName = document.getElementById('areaName').value.trim();
    if (!newName) { toast('Informe o nome', 'error'); return; }
    if (isNew) {
      // Verificar duplicata
      for (var i2 = 0; i2 < state.settings.areas.length; i2++) {
        if (state.settings.areas[i2].name.toLowerCase() === newName.toLowerCase()) {
          toast('Área já existe', 'error');
          return;
        }
      }
      state.settings.areas.push({ name: newName, color: selColor, emoji: selEmoji });
      logActivity('config', 'criou área "' + newName + '"');
    } else {
      area.color = selColor;
      area.emoji = selEmoji;
      logActivity('config', 'editou área "' + newName + '"');
    }
    save();
    if (window.sbSaveSettings) window.sbSaveSettings();
    closeModal();
    renderPage();
    toast('Salvo ✓', 'success');
  });
}

function renderPerfil() {

  if (u.avatar) {
    avatarBlock = '<div class="avatar-large" style="background-image:url(' + esc(u.avatar) + ')"></div>';
  } else {
    avatarBlock = '<div class="avatar-large" style="background:' + esc(u.color || '#0A0A0A') + ';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:36px">' + esc(getInitials(u.name)) + '</div>';
  }

  // Stats do usuário
  var todayPending = 0, todayDone = 0, monthDone = 0;
  var t = new Date();
  if (t.getFullYear() === 2026) {
    var monthKey = MONTHS_KEY[t.getMonth()];
    var day = t.getDate();
    var diM = new Date(2026, t.getMonth() + 1, 0).getDate();
    for (var i = 0; i < state.tpl.diarias.length; i++) {
      var tpl = state.tpl.diarias[i];
      var instT = peekInst(monthKey, day, tpl.code);
      if (canViewTask(instT, tpl)) {
        if (instT.status === 'Concluído') todayDone++;
        else if (instT.status !== 'N/A') todayPending++;
      }
    }
    for (var d2 = 1; d2 <= diM; d2++) {
      for (var ti = 0; ti < state.tpl.diarias.length; ti++) {
        var instM = peekInst(monthKey, d2, state.tpl.diarias[ti].code);
        if (instM.completedBy === u.id) monthDone++;

  var areasHTML = '';
  if (u.areas && u.areas.length > 0) {
    for (var ai = 0; ai < u.areas.length; ai++) areasHTML += areaTag(u.areas[ai]) + ' ';

      '<div style="flex-shrink:0">' + avatarBlock +

          '<button class="btn btn-sm btn-block" id="btnChangePhoto">📷 Alterar foto</button>' +
          '<input type="file" id="profilePhotoFile" accept="image/*" style="display:none">' +
        '</div>' +
      '</div>' +
      '<div style="flex:1;min-width:280px">' +
        '<div style="font-size:24px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px">' + esc(u.name) + '</div>' +
        '<div style="font-size:13px;color:#6B6B6B;margin-bottom:12px">' + esc(u.email) +
          ' · <span class="role-tag ' + esc(u.role) + '">' + (u.role === 'admin' ? 'Admin' : 'Usuário') + '</span></div>' +
        (u.position ? '<div style="font-size:13px;margin-bottom:6px"><strong>Cargo:</strong> ' + esc(u.position) + '</div>' : '') +
        (u.phone ? '<div style="font-size:13px;margin-bottom:6px"><strong>Telefone:</strong> ' + esc(u.phone) + '</div>' : '') +
        (u.bio ? '<div style="font-size:13px;line-height:1.6;color:#404040;margin-bottom:12px">' + esc(u.bio) + '</div>' : '') +
        '<div style="margin-bottom:8px"><div class="field-label" style="margin-bottom:4px">Áreas</div>' + areasHTML + '</div>' +

    // Stats
    '<div class="metrics">' +
      '<div class="metric"><div class="metric-label">Hoje pendentes</div><div class="metric-value">' + todayPending + '</div></div>' +
      '<div class="metric success"><div class="metric-label">Hoje concluídas</div><div class="metric-value">' + todayDone + '</div><div class="metric-trend">Meta: ' + (u.dailyGoal || 5) + '</div></div>' +

function attachPerfil() {
  var u = state.user;

  var btnSave = document.getElementById('btnSavePrf');

    var name = document.getElementById('prfName').value.trim();

    renderPage();
    toast('Perfil atualizado ✓', 'success');
  });

  var btnPw = document.getElementById('btnChangePw');
  if (btnPw) btnPw.addEventListener('click', function() {
    var old = document.getElementById('pwOld').value;
    var nw = document.getElementById('pwNew').value;
    var nw2 = document.getElementById('pwNew2').value;

    if (nw !== nw2) { toast('As senhas não coincidem', 'error'); return; }
    u.password = nw;
    save();
    if (window.sbSaveUser) window.sbSaveUser(u);
    logActivity('user', 'alterou própria senha');
    document.getElementById('pwOld').value = '';
    document.getElementById('pwNew').value = '';
    document.getElementById('pwNew2').value = '';
    toast('Senha alterada ✓', 'success');
  });

  var btnPhoto = document.getElementById('btnChangePhoto');
  var photoFile = document.getElementById('profilePhotoFile');
  if (btnPhoto) btnPhoto.addEventListener('click', function() { photoFile.click(); });
  if (photoFile) photoFile.addEventListener('change', function() {
    var f = photoFile.files && photoFile.files[0];
    if (!f) return;
    if (f.size > 200 * 1024) { toast('Imagem muito grande (máx 200KB)', 'error'); return; }
    var reader = new FileReader();
    reader.onload = function(ev) {
      u.avatar = ev.target.result;
      save();
      if (window.sbSaveUser) window.sbSaveUser(u);
      renderShell();
      renderPage();
      toast('Foto atualizada ✓', 'success');
    };
    reader.readAsDataURL(f);
  });
}

// ========================================================
// BOOT V8 — Inicializa Supabase + Login
// ========================================================
async function boot() {
  try {
    console.log('[MALBA] Boot iniciado');

    // 1. Carregar cache local primeiro
    try { load(); } catch(e) { console.error('[MALBA] Erro em load():', e); }

    // 2. Tentar carregar do Supabase
    if (window.sb) {
      try {
        var ok = await window.sbLoad();
        if (!ok) {
          console.warn('[MALBA] Falha ao carregar do servidor, usando cache local');
        } else {
          console.log('[MALBA] Dados carregados do servidor');
          try { save(); } catch(e) { console.error('[MALBA] Erro em save():', e); }
        }
      } catch(e) {
        console.error('[MALBA] Erro em sbLoad:', e);
      }
    }

    try { if (typeof applyTheme === 'function') applyTheme(); } catch(e) { console.error('[MALBA] applyTheme:', e); }

    // 3. Verificar sessão
    try { loadSession(); } catch(e) { console.error('[MALBA] loadSession:', e); state.user = null; }

    if (state.user) {
      var stillExists = state.users.some(function(u) { return u.id === state.user.id; });
      if (!stillExists) {
        console.warn('[MALBA] Usuário da sessão não existe mais, fazendo logout');
        state.user = null;
        try { sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
        renderLogin();
        return;
      }
      console.log('[MALBA] Iniciando app para', state.user.email);
      try {
        initApp();
      } catch(e) {
        console.error('[MALBA] Erro fatal em initApp:', e);
        if (window.__showError) window.__showError('Erro ao iniciar: ' + e.message);
        return;
      }
      try {
        if (window.sbSubscribe) window.sbSubscribe();
      } catch(e) { console.error('[MALBA] sbSubscribe:', e); }
    } else {
      console.log('[MALBA] Sem sessão, mostrando login');
      renderLogin();
    }
  } catch(err) {
    console.error('[MALBA] Erro fatal no boot:', err);
    document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif">' +
      '<h1>Erro ao carregar sistema</h1>' +
      '<p style="color:#666">' + (err.message || String(err)) + '</p>' +
      '<button onclick="localStorage.clear();sessionStorage.clear();location.reload()" style="padding:10px 20px;margin-top:20px;background:#E8561A;color:#fff;border:none;border-radius:4px;cursor:pointer">Resetar e recarregar</button></div>';
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  setTimeout(boot, 0);
}

// CAMPANHAS DE VENDAS
// ========================================================

function renderCampanhas() {
  if (!canViewPage('campanhas')) return renderAccessDenied();

  var today = ymdLocal(new Date());
  var active = [], upcoming = [], past = [];
  for (var i = 0; i < state.campaigns.length; i++) {
    var c = state.campaigns[i];
    if (c.endDate < today) past.push(c);
    else if (c.startDate > today) upcoming.push(c);
    else active.push(c);
  }

  function diffDays(a, b) {
    var da = ymdToDate(a), db = ymdToDate(b);
    return Math.round((db - da) / 86400000);
  }

  function cardFor(c) {
    var totalDays = diffDays(c.startDate, c.endDate) + 1;
    var done = 0, total = 0;
    var todayD = ymdLocal(new Date());

    // Calcular progresso: tarefas concluídas / total de tarefas no período já passado
    var startD = ymdToDate(c.startDate);
    var endD = ymdToDate(c.endDate);
    var nowD = new Date();
    var iterEnd = endD < nowD ? endD : nowD;
    if (iterEnd >= startD && c.tasks && c.tasks.length > 0) {
      var iter = new Date(startD);
      while (iter <= iterEnd) {
        var ymd = ymdLocal(iter);
        for (var ti = 0; ti < c.tasks.length; ti++) {
          total++;
          var inst = peekCampInst(c.id, c.tasks[ti].id, ymd);
          if (inst.status === 'Concluído') done++;
        }
        iter.setDate(iter.getDate() + 1);
      }
    }
    var pct = total > 0 ? Math.round((done / total) * 100) : 0;

    var areaHTML = c.area ? areaTag(c.area) : '';
    var usersHTML = '';
    var maxAv = 4;
    var actualUsers = (c.userIds || []).map(getUser).filter(function(x){ return x; });
    for (var u = 0; u < Math.min(actualUsers.length, maxAv); u++) {
      usersHTML += avatar(actualUsers[u], 'sm');
    }
    if (actualUsers.length > maxAv) {
      usersHTML += '<span class="avatar sm" style="background:#9A9A9A;font-size:10px">+' + (actualUsers.length - maxAv) + '</span>';
    }
    if (actualUsers.length === 0) {
      usersHTML = '<span style="font-size:11px;color:#9A9A9A">Sem participantes</span>';
    }

    var statusBadge;
    if (c.endDate < todayD) statusBadge = '<span class="camp-status past">Encerrada</span>';
    else if (c.startDate > todayD) statusBadge = '<span class="camp-status upcoming">Futura</span>';
    else statusBadge = '<span class="camp-status active">Em andamento</span>';

    var tasksCount = (c.tasks || []).length;

    return '<div class="camp-card" data-camp-id="' + esc(c.id) + '" style="border-left:4px solid ' + esc(c.color || '#E8561A') + '">' +
      '<div class="camp-card-head">' +
        '<div style="flex:1">' +
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">' +
            '<div class="camp-card-name">' + esc(c.name) + '</div>' +
            statusBadge +
          '</div>' +
          (c.description ? '<div class="camp-card-desc">' + esc(c.description) + '</div>' : '') +
        '</div>' +
        (canManage() ? '<div style="display:flex;gap:4px">' +
          '<button class="btn-icon" data-edit-camp="' + esc(c.id) + '" title="Editar"><span style="display:inline-flex">' + ICON.edit + '</span></button>' +
          '<button class="btn-icon danger" data-del-camp="' + esc(c.id) + '" title="Excluir"><span style="display:inline-flex">' + ICON.trash + '</span></button>' +
        '</div>' : '') +
      '</div>' +
      '<div class="camp-card-meta">' +
        '<div class="camp-meta-item">📅 ' + fmtDateBR(c.startDate) + ' → ' + fmtDateBR(c.endDate) + ' <span style="color:#9A9A9A">(' + totalDays + ' dia' + (totalDays !== 1 ? 's' : '') + ')</span></div>' +
        (areaHTML ? '<div class="camp-meta-item">' + areaHTML + '</div>' : '') +
        '<div class="camp-meta-item">📋 ' + tasksCount + ' tarefa' + (tasksCount !== 1 ? 's' : '') + ' diária' + (tasksCount !== 1 ? 's' : '') + '</div>' +
        '<div class="camp-meta-item" style="display:flex;align-items:center;gap:6px">👥 ' + usersHTML + '</div>' +
      '</div>' +
      (total > 0 ? '<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:11px;color:#6B6B6B;margin-bottom:4px"><span>Progresso</span><span>' + done + '/' + total + ' (' + pct + '%)</span></div>' +
        '<div class="prog-bar"><div class="prog-fill ' + (pct >= 80 ? 'green' : pct >= 50 ? 'amber' : '') + '" style="width:' + pct + '%;background:' + (pct >= 50 ? '' : esc(c.color || '#E8561A')) + '"></div></div></div>' : '') +
    '</div>';
  }

  function listFor(arr, label) {
    if (arr.length === 0) return '';
    var rows = '';
    for (var i = 0; i < arr.length; i++) rows += cardFor(arr[i]);
    return '<div class="card"><div class="card-head"><div class="card-title">' + label + '</div><span class="kb-count">' + arr.length + '</span></div>' +
      '<div class="card-body">' + rows + '</div></div>';
  }

  if (state.campaigns.length === 0) {
    return '<div class="page-head"><div><h2 class="page-title">Campanhas de Vendas</h2>' +
      '<p class="page-sub">Campanhas com tarefas que aparecem todos os dias do período no Meu Dia dos envolvidos</p></div>' +
      (canManage() ? '<button class="btn btn-primary" id="btnNewCamp"><span class="icon" style="display:inline-flex">' + ICON.plus + '</span> Nova campanha</button>' : '') +
    '</div>' +
    '<div class="card"><div class="card-body" style="text-align:center;padding:48px 24px">' +
      '<div style="font-size:42px;margin-bottom:8px">🎯</div>' +
      '<div style="font-size:16px;font-weight:600;margin-bottom:4px">Nenhuma campanha cadastrada</div>' +
      '<div style="font-size:13px;color:#6B6B6B;margin-bottom:16px">Cadastre Black Friday, Dia das Mães, Liquidação, lançamentos... e defina tarefas para cada dia.</div>' +
      (canManage() ? '<button class="btn btn-primary" id="btnNewCamp2"><span style="display:inline-flex">' + ICON.plus + '</span> Criar primeira campanha</button>' : '') +
    '</div></div>';
  }

  return '<div class="page-head"><div><h2 class="page-title">Campanhas de Vendas</h2>' +
    '<p class="page-sub">' + state.campaigns.length + ' campanha' + (state.campaigns.length !== 1 ? 's' : '') + ' · tarefas aparecem no Meu Dia dos envolvidos durante o período</p></div>' +
    (canManage() ? '<button class="btn btn-primary" id="btnNewCamp"><span class="icon" style="display:inline-flex">' + ICON.plus + '</span> Nova campanha</button>' : '') +
  '</div>' +
  listFor(active, '🔥 Em andamento') +
  listFor(upcoming, '📅 Futuras') +
  listFor(past, '✓ Encerradas');
}

function attachCampanhas() {
  var nb = document.getElementById('btnNewCamp');
  var nb2 = document.getElementById('btnNewCamp2');
  if (nb) nb.addEventListener('click', function() { openCampaignModal(); });
  if (nb2) nb2.addEventListener('click', function() { openCampaignModal(); });

  var edits = document.querySelectorAll('[data-edit-camp]');
  for (var i = 0; i < edits.length; i++) {
    (function(b) {
      b.addEventListener('click', function(ev) {
        ev.stopPropagation();
        openCampaignModal(b.getAttribute('data-edit-camp'));
      });
    })(edits[i]);
  }

  var dels = document.querySelectorAll('[data-del-camp]');
  for (var d = 0; d < dels.length; d++) {
    (function(b) {
      b.addEventListener('click', function(ev) {
        ev.stopPropagation();
        if (!canManage()) return;
        var cid = b.getAttribute('data-del-camp');
        var camp = null;
        for (var ci = 0; ci < state.campaigns.length; ci++) if (state.campaigns[ci].id === cid) { camp = state.campaigns[ci]; break; }
        if (!camp) return;
        if (!canDelete()) { toast('Apenas administradores podem excluir', 'error'); return; }
        if (!confirm('⚠️ Excluir a campanha "' + camp.name + '"?\n\nTodas as tarefas e marcações dessa campanha serão removidas.\nEsta ação NÃO pode ser desfeita.')) return;
        state.campaigns = state.campaigns.filter(function(c) { return c.id !== cid; });
        for (var k in state.campInst) {
          if (state.campInst.hasOwnProperty(k) && k.indexOf(cid + '|') === 0) delete state.campInst[k];
        }
        logActivity('camp', 'excluiu campanha "' + camp.name + '"');
        save();
        if (window.sbDelCamp) window.sbDelCamp(cid);
        renderShell();
        renderPage();
        toast('Campanha excluída', 'success');
      });
    })(dels[d]);
  }

  // Click no card para abrir detalhes (opcional, abre modal de edição)
  var cards = document.querySelectorAll('[data-camp-id]');
  for (var cd = 0; cd < cards.length; cd++) {
    (function(card) {
      card.addEventListener('click', function() {
        if (canManage()) openCampaignModal(card.getAttribute('data-camp-id'));
      });
      card.style.cursor = canManage() ? 'pointer' : 'default';
    })(cards[cd]);
  }
}

// ========================================================
// MODAL DE CAMPANHA (criar/editar)
// ========================================================
function openCampaignModal(campId) {
  if (!canManage()) { toast('Apenas administradores', 'error'); return; }
  var isNew = !campId;
  var camp = null;
  if (!isNew) {
    for (var i = 0; i < state.campaigns.length; i++) if (state.campaigns[i].id === campId) { camp = state.campaigns[i]; break; }
  }
  if (!camp) {
    var today = ymdLocal(new Date());
    var weekLater = new Date();
    weekLater.setDate(weekLater.getDate() + 7);
    camp = {
      id: '', name: '', description: '',
      startDate: today, endDate: ymdLocal(weekLater),
      color: '#E8561A', area: '',
      userIds: [], tasks: []
    };
  }

  // Cores
  var palette = ['#E8561A','#E53935','#1E88E5','#43A047','#8E24AA','#FB8C00','#3949AB','#00ACC1','#D81B60','#7CB342'];
  var colorHTML = '';
  for (var ci = 0; ci < palette.length; ci++) {
    colorHTML += '<div class="color-opt' + (camp.color === palette[ci] ? ' selected' : '') + '" data-camp-color="' + esc(palette[ci]) + '" style="background:' + esc(palette[ci]) + '"></div>';
  }

  // Áreas
  var areaOpts = '<option value="">— sem área específica —</option>';
  for (var a = 0; a < state.settings.areas.length; a++) {
    var ar = state.settings.areas[a];
    areaOpts += '<option value="' + esc(ar.name) + '"' + (camp.area === ar.name ? ' selected' : '') + '>' + esc(ar.emoji) + ' ' + esc(ar.name) + '</option>';
  }

  // Usuários (multi-select)
  var usersHTML = '';
  for (var u = 0; u < state.users.length; u++) {
    var us = state.users[u];
    var sel = camp.userIds && camp.userIds.indexOf(us.id) !== -1;
    usersHTML += '<div class="user-pick' + (sel ? ' selected' : '') + '" data-user-pick="' + esc(us.id) + '">' +
      avatar(us, 'sm') +
      '<div style="flex:1"><div style="font-size:13px;font-weight:500">' + esc(us.name) + '</div>' +
      '<div style="font-size:11px;color:#6B6B6B">' + (us.position || us.email) + '</div></div>' +
      '<span class="user-pick-check">' + (sel ? '✓' : '') + '</span>' +
    '</div>';
  }

  var html = '<div class="modal-bg" id="modalBg"><div class="modal lg">' +
    '<div class="modal-head"><div class="modal-title">' + (isNew ? '🎯 Nova Campanha' : 'Editar Campanha') + '</div>' +
      '<button class="modal-close" data-close><span class="icon">' + ICON.close + '</span></button></div>' +
    '<div class="modal-body" style="padding:0">' +
      '<div class="modal-tabs">' +
        '<button class="modal-tab active" data-camp-tab="info">Informações</button>' +
        '<button class="modal-tab" data-camp-tab="tasks">Tarefas (' + (camp.tasks || []).length + ')</button>' +
        '<button class="modal-tab" data-camp-tab="users">Participantes (' + (camp.userIds || []).length + ')</button>' +
      '</div>' +

      // Tab 1: INFO
      '<div class="modal-tab-content active" data-camp-content="info" style="padding:20px 24px">' +
        '<div class="field" style="margin-bottom:14px"><label class="field-label">Nome da campanha</label>' +
          '<input class="input" id="campName" value="' + esc(camp.name) + '" placeholder="Ex: Black Friday 2026"></div>' +
        '<div class="field" style="margin-bottom:14px"><label class="field-label">Descrição</label>' +
          '<textarea class="input" id="campDesc" rows="2" placeholder="Detalhes da campanha, objetivo, observações...">' + esc(camp.description) + '</textarea></div>' +
        '<div class="field-row" style="margin-bottom:14px">' +
          '<div class="field"><label class="field-label">Data de início</label>' +
            '<input class="input" type="date" id="campStart" value="' + esc(camp.startDate) + '"></div>' +
          '<div class="field"><label class="field-label">Data de término</label>' +
            '<input class="input" type="date" id="campEnd" value="' + esc(camp.endDate) + '"></div>' +
        '</div>' +
        '<div class="field-row" style="margin-bottom:14px">' +
          '<div class="field"><label class="field-label">Área responsável</label>' +
            '<select class="input" id="campArea">' + areaOpts + '</select></div>' +
          '<div class="field"><label class="field-label">Cor (destaque no calendário)</label>' +
            '<div class="color-grid">' + colorHTML + '</div></div>' +
        '</div>' +
      '</div>' +

      // Tab 2: TASKS
      '<div class="modal-tab-content" data-camp-content="tasks" style="padding:20px 24px;display:none">' +
        '<div style="font-size:13px;color:#6B6B6B;margin-bottom:12px;padding:10px 12px;background:#F0F0EE;border-radius:6px">💡 Cada tarefa aparece <strong>todos os dias</strong> da campanha no Meu Dia dos participantes. Os usuários marcam diariamente.</div>' +
        '<div id="campTaskList"></div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr 110px 32px;gap:6px;margin-top:10px;align-items:end">' +
          '<div><label class="field-label" style="margin-bottom:4px;display:block;font-size:10px">Título</label><input class="input" id="newCTaskTitle" placeholder="Ex: Postar oferta do dia" style="height:34px"></div>' +
          '<div><label class="field-label" style="margin-bottom:4px;display:block;font-size:10px">Descrição</label><input class="input" id="newCTaskDesc" placeholder="Detalhes (opcional)" style="height:34px"></div>' +
          '<div><label class="field-label" style="margin-bottom:4px;display:block;font-size:10px">Prioridade</label>' +
            '<select class="input" id="newCTaskPrio" style="height:34px">' +
              '<option value="alta">🔴 Alta</option>' +
              '<option value="media" selected>🟡 Média</option>' +
              '<option value="baixa">⚪ Baixa</option>' +
            '</select></div>' +
          '<button class="btn btn-icon btn-primary" id="btnAddCTask" type="button" style="height:34px"><span style="display:inline-flex">' + ICON.plus + '</span></button>' +
        '</div>' +
      '</div>' +

      // Tab 3: USERS
      '<div class="modal-tab-content" data-camp-content="users" style="padding:20px 24px;display:none">' +
        '<div style="font-size:13px;color:#6B6B6B;margin-bottom:12px;padding:10px 12px;background:#F0F0EE;border-radius:6px">💡 Selecione os usuários que verão as tarefas no Meu Dia. Os marcados aqui são os <strong>participantes</strong>.</div>' +
        '<div style="display:flex;gap:6px;margin-bottom:10px">' +
          '<button class="btn btn-sm" id="campSelAll" type="button">Selecionar todos</button>' +
          '<button class="btn btn-sm" id="campSelNone" type="button">Limpar</button>' +
        '</div>' +
        '<div class="user-pick-list" id="campUserList">' + usersHTML + '</div>' +
      '</div>' +

    '</div>' +
    '<div class="modal-foot"><button class="btn" data-close>Cancelar</button>' +
      '<button class="btn btn-primary" id="btnSaveCamp">' + (isNew ? 'Criar campanha' : 'Salvar') + '</button></div>' +
    '</div></div>';

  showModal(html);

  // Tabs
  var tabBtns = document.querySelectorAll('[data-camp-tab]');
  for (var tb = 0; tb < tabBtns.length; tb++) {
    (function(b) {
      b.addEventListener('click', function() {
        var t = b.getAttribute('data-camp-tab');
        var allTabs = document.querySelectorAll('[data-camp-tab]');
        for (var ti = 0; ti < allTabs.length; ti++) allTabs[ti].classList.remove('active');
        b.classList.add('active');
        var contents = document.querySelectorAll('[data-camp-content]');
        for (var c = 0; c < contents.length; c++) {
          var ct = contents[c];
          if (ct.getAttribute('data-camp-content') === t) { ct.classList.add('active'); ct.style.display = 'block'; }
          else { ct.classList.remove('active'); ct.style.display = 'none'; }
        }
      });
    })(tabBtns[tb]);
  }

  // Cor
  var selColor = camp.color;
  var colorOpts = document.querySelectorAll('[data-camp-color]');
  for (var co = 0; co < colorOpts.length; co++) {
    (function(el) {
      el.addEventListener('click', function() {
        for (var k = 0; k < colorOpts.length; k++) colorOpts[k].classList.remove('selected');
        el.classList.add('selected');
        selColor = el.getAttribute('data-camp-color');
      });
    })(colorOpts[co]);
  }

  // Users
  var selUsers = (camp.userIds || []).slice();
  function refreshUserCount() {
    var tabUsers = null;
    var tabs = document.querySelectorAll('[data-camp-tab]');
    for (var ti = 0; ti < tabs.length; ti++) if (tabs[ti].getAttribute('data-camp-tab') === 'users') tabUsers = tabs[ti];
    if (tabUsers) tabUsers.textContent = 'Participantes (' + selUsers.length + ')';
  }
  function bindUserPicks() {
    var picks = document.querySelectorAll('[data-user-pick]');
    for (var up = 0; up < picks.length; up++) {
      (function(el) {
        el.addEventListener('click', function() {
          var uid = el.getAttribute('data-user-pick');
          var idx = selUsers.indexOf(uid);
          if (idx === -1) {
            selUsers.push(uid);
            el.classList.add('selected');
            var chk = el.querySelector('.user-pick-check');
            if (chk) chk.textContent = '✓';
          } else {
            selUsers.splice(idx, 1);
            el.classList.remove('selected');
            var chk2 = el.querySelector('.user-pick-check');
            if (chk2) chk2.textContent = '';
          }
          refreshUserCount();
        });
      })(picks[up]);
    }
  }
  bindUserPicks();

  document.getElementById('campSelAll').addEventListener('click', function() {
    selUsers = state.users.map(function(u) { return u.id; });
    var picks = document.querySelectorAll('[data-user-pick]');
    for (var p = 0; p < picks.length; p++) {
      picks[p].classList.add('selected');
      var chk = picks[p].querySelector('.user-pick-check');
      if (chk) chk.textContent = '✓';
    }
    refreshUserCount();
  });
  document.getElementById('campSelNone').addEventListener('click', function() {
    selUsers = [];
    var picks = document.querySelectorAll('[data-user-pick]');
    for (var p = 0; p < picks.length; p++) {
      picks[p].classList.remove('selected');
      var chk = picks[p].querySelector('.user-pick-check');
      if (chk) chk.textContent = '';
    }
    refreshUserCount();
  });

  // Tarefas
  var workTasks = (camp.tasks || []).slice();
  function refreshTaskCount() {
    var tabs = document.querySelectorAll('[data-camp-tab]');
    for (var ti = 0; ti < tabs.length; ti++) {
      if (tabs[ti].getAttribute('data-camp-tab') === 'tasks') tabs[ti].textContent = 'Tarefas (' + workTasks.length + ')';
    }
  }
  function renderTasksList() {
    var el = document.getElementById('campTaskList');
    if (!el) return;
    if (workTasks.length === 0) {
      el.innerHTML = '<div style="color:#9A9A9A;font-size:13px;text-align:center;padding:24px;border:1px dashed #E5E5E5;border-radius:6px">Nenhuma tarefa cadastrada. Adicione abaixo.</div>';
      return;
    }
    var h = '';
    for (var ti = 0; ti < workTasks.length; ti++) {
      var t = workTasks[ti];
      h += '<div class="ctask-row" data-ctask-idx="' + ti + '" draggable="true">' +
        '<span style="cursor:grab;color:#9A9A9A;font-size:14px">⋮⋮</span>' +
        '<span class="prio ' + esc(t.priority || 'media') + '">' + esc(t.priority || 'media') + '</span>' +
        '<div style="flex:1">' +
          '<div style="font-size:13px;font-weight:500">' + esc(t.title) + '</div>' +
          (t.desc ? '<div style="font-size:11px;color:#6B6B6B">' + esc(t.desc) + '</div>' : '') +
        '</div>' +
        '<button class="btn-icon danger" data-rm-ctask="' + ti + '" type="button"><span style="display:inline-flex">' + ICON.trash + '</span></button>' +
      '</div>';
    }
    el.innerHTML = h;
    var rms = document.querySelectorAll('[data-rm-ctask]');
    for (var r = 0; r < rms.length; r++) {
      (function(b) {
        b.addEventListener('click', function() {
          var idx = parseInt(b.getAttribute('data-rm-ctask'), 10);
          workTasks.splice(idx, 1);
          renderTasksList();
          refreshTaskCount();
        });
      })(rms[r]);
    }
  }
  renderTasksList();

  document.getElementById('btnAddCTask').addEventListener('click', function() {
    var t = document.getElementById('newCTaskTitle').value.trim();
    if (!t) { toast('Informe o título', 'error'); return; }
    var d = document.getElementById('newCTaskDesc').value.trim();
    var p = document.getElementById('newCTaskPrio').value;
    workTasks.push({ id: genId('ct'), title: t, desc: d, priority: p });
    document.getElementById('newCTaskTitle').value = '';
    document.getElementById('newCTaskDesc').value = '';
    renderTasksList();
    refreshTaskCount();
  });

  // Salvar
  document.getElementById('btnSaveCamp').addEventListener('click', function() {
    var name = document.getElementById('campName').value.trim();
    var desc = document.getElementById('campDesc').value.trim();
    var startDate = document.getElementById('campStart').value;
    var endDate = document.getElementById('campEnd').value;
    var area = document.getElementById('campArea').value;

    if (!name) { toast('Informe o nome da campanha', 'error'); return; }
    if (!startDate || !endDate) { toast('Informe as datas', 'error'); return; }
    if (startDate > endDate) { toast('A data inicial deve ser antes da final', 'error'); return; }

    if (isNew) {
      var newCamp = {
        id: genUUID(), name: name, description: desc,
        startDate: startDate, endDate: endDate,
        color: selColor, area: area,
        userIds: selUsers, tasks: workTasks,
        createdAt: Date.now()
      };
      state.campaigns.push(newCamp);
      logActivity('camp', 'criou campanha "' + name + '"');
      toast('Campanha criada ✓', 'success');
      save();
      if (window.sbSaveCamp) window.sbSaveCamp(newCamp);
    } else {
      camp.name = name; camp.description = desc;
      camp.startDate = startDate; camp.endDate = endDate;
      camp.color = selColor; camp.area = area;
      camp.userIds = selUsers; camp.tasks = workTasks;
      logActivity('camp', 'editou campanha "' + name + '"');
      toast('Salvo ✓', 'success');
      save();
      if (window.sbSaveCamp) window.sbSaveCamp(camp);
    }
    closeModal();
    renderShell();
    renderPage();
  });
}


// ========================================================
// MODAL DE TAREFA DE CAMPANHA (visualização e marcação por dia)
// ========================================================
function openCampTaskModal(campId, taskId, ymd) {
  var camp = null;
  for (var i = 0; i < state.campaigns.length; i++) if (state.campaigns[i].id === campId) { camp = state.campaigns[i]; break; }
  if (!camp) { toast('Campanha não encontrada', 'error'); return; }
  var task = null;
  for (var t = 0; t < (camp.tasks || []).length; t++) if (camp.tasks[t].id === taskId) { task = camp.tasks[t]; break; }
  if (!task) { toast('Tarefa não encontrada', 'error'); return; }

  var inst = getCampInst(campId, taskId, ymd);
  var canMark = isAdmin() || isInCampaign(camp, state.user.id);

  var completedInfo = '';
  if (inst.status === 'Concluído' && inst.completedAt) {
    var doneU = getUser(inst.completedBy);
    completedInfo = '<div style="background:#E8F2EA;color:#2D7A3E;padding:10px 12px;border-radius:6px;font-size:12px;margin-bottom:14px">✓ Concluída em ' + fmtDate(inst.completedAt) + (doneU ? ' por ' + esc(doneU.name) : '') + '</div>';
  }

  var html = '<div class="modal-bg" id="modalBg"><div class="modal">' +
    '<div class="modal-head" style="border-left:4px solid ' + esc(camp.color || '#E8561A') + ';padding-left:20px"><div>' +
      '<div style="font-size:11px;color:#6B6B6B;font-weight:500;text-transform:uppercase;letter-spacing:0.5px">🎯 ' + esc(camp.name) + ' · ' + fmtDateBR(ymd) + '</div>' +
      '<div class="modal-title">' + esc(task.title) + '</div>' +
    '</div><button class="modal-close" data-close><span class="icon">' + ICON.close + '</span></button></div>' +
    '<div class="modal-body">' +
      '<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">' +
        '<span class="prio ' + esc(task.priority || 'media') + '">' + esc(task.priority || 'media') + '</span>' +
        (camp.area ? areaTag(camp.area) : '') +
      '</div>' +
      (task.desc ? '<div style="background:#F7F7F5;border-left:3px solid #C8C8C8;padding:12px 14px;border-radius:4px;font-size:13px;line-height:1.6;color:#404040;margin-bottom:14px;white-space:pre-wrap">' + esc(task.desc) + '</div>' : '') +
      completedInfo +
      '<div class="field" style="margin-bottom:14px"><label class="field-label">Status</label>' +
        (canMark ?
          '<select class="input" id="ctStatus">' +
            '<option value="A fazer"' + (inst.status === 'A fazer' ? ' selected' : '') + '>⏳ A fazer</option>' +
            '<option value="Em andamento"' + (inst.status === 'Em andamento' ? ' selected' : '') + '>🔄 Em andamento</option>' +
            '<option value="Concluído"' + (inst.status === 'Concluído' ? ' selected' : '') + '>✓ Concluído</option>' +
          '</select>' :
          '<div class="input" style="display:flex;align-items:center">' + esc(inst.status) + '</div>'
        ) +
      '</div>' +
      '<div class="field"><label class="field-label">Observações deste dia</label>' +
        (canMark ?
          '<textarea class="input" id="ctNotes" rows="3" placeholder="Anotações de hoje...">' + esc(inst.notes || '') + '</textarea>' :
          '<div class="input" style="min-height:60px;padding:10px 12px">' + (inst.notes ? esc(inst.notes) : '<span style="color:#9A9A9A">Sem observações</span>') + '</div>'
        ) +
      '</div>' +
      '<div style="margin-top:14px;font-size:11px;color:#6B6B6B;padding:10px 12px;background:#F0F0EE;border-radius:6px">📅 Esta tarefa aparece todos os dias entre <strong>' + fmtDateBR(camp.startDate) + '</strong> e <strong>' + fmtDateBR(camp.endDate) + '</strong>. Cada dia é marcado independentemente.</div>' +
    '</div>' +
    '<div class="modal-foot">' +
      '<button class="btn" data-close>Fechar</button>' +
      (canMark ? '<button class="btn btn-primary" id="btnSaveCT">Salvar</button>' : '') +
    '</div>' +
    '</div></div>';

  showModal(html);

  if (canMark) {
    document.getElementById('btnSaveCT').addEventListener('click', function() {
      var st = document.getElementById('ctStatus').value;
      var nt = document.getElementById('ctNotes').value;
      setCampTask(campId, taskId, ymd, 'status', st);
      setCampTask(campId, taskId, ymd, 'notes', nt);
      logActivity('camp', 'atualizou tarefa de campanha "' + camp.name + '"');
      closeModal();
      renderShell();
      renderPage();
      toast('Salvo ✓', 'success');
    });
  }
}

})();
