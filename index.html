      '<div class="modal-row"><label class="modal-label">Participantes</label><div class="member-picks">'+partHTML+'</div></div>'+
      '<div class="modal-foot">'+delBtn+'<button class="btn btn-ghost" id="campCancel">Cancelar</button><button class="btn btn-primary" id="campSave">'+(isNew?'Criar campanha':'Salvar')+'</button></div>'+
    '</div>';
  document.body.appendChild(modal);

  // render lista de tarefas da campanha
  function renderTaskList() {
    var box=modal.querySelector('#cpTasks');
    if (taskList.length===0) { box.innerHTML='<div style="font-size:12px;color:var(--u-text3);padding:4px 0">Nenhuma tarefa ainda.</div>'; return; }
    box.innerHTML = taskList.map(function(tk,idx){
      var pr=PRIO[tk.priority]||PRIO.media;
      return '<div class="camp-task-item"><span class="tc-prio" style="background:'+pr.color+'"></span><span style="flex:1">'+esc(tk.title)+'</span><button type="button" class="camp-task-del" data-idx="'+idx+'">✕</button></div>';
    }).join('');
    var dels=box.querySelectorAll('.camp-task-del');
    for (var i=0;i<dels.length;i++) dels[i].addEventListener('click', function(){ taskList.splice(parseInt(this.getAttribute('data-idx'),10),1); renderTaskList(); });
  }
  renderTaskList();
  modal.querySelector('#cpAddTask').addEventListener('click', function(){
    var tt=(modal.querySelector('#cpNewTask').value||'').trim();
    if (!tt) return;
    taskList.push({ id:uid(), title:tt, priority:modal.querySelector('#cpNewPrio').value });
    modal.querySelector('#cpNewTask').value='';
    renderTaskList();
  });

  var colorPick=c.color||'#3B6FF7';
  var dots=modal.querySelectorAll('.color-dot');
  for (var i=0;i<dots.length;i++) dots[i].addEventListener('click', function(){ for(var k=0;k<dots.length;k++) dots[k].classList.remove('on'); this.classList.add('on'); colorPick=this.getAttribute('data-color'); });
  var partCbs=modal.querySelectorAll('[data-part]');
  for (var j=0;j<partCbs.length;j++) partCbs[j].addEventListener('change', function(){ this.closest('.member-pick').classList.toggle('on', this.checked); });

  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  modal.querySelector('#campCancel').addEventListener('click', close);
  modal.querySelector('#cpName').focus();

  modal.querySelector('#campSave').addEventListener('click', function(){
    var name=(modal.querySelector('#cpName').value||'').trim();
    if (!name) { toast('Informe o nome da campanha','error'); return; }
    var sel=[]; modal.querySelectorAll('[data-part]:checked').forEach(function(cb){ sel.push(cb.getAttribute('data-part')); });
    var rec = {
      id: isNew ? uid() : c.id,
      name:name,
      description:(modal.querySelector('#cpDesc').value||'').trim(),
      start_date:modal.querySelector('#cpStart').value||null,
      end_date:modal.querySelector('#cpEnd').value||null,
      color:colorPick,
      area:(modal.querySelector('#cpArea').value||'').trim(),
      user_ids:sel,
      tasks:taskList
    };
    var saveBtn=modal.querySelector('#campSave'); saveBtn.disabled=true; saveBtn.textContent='Salvando...';
    sb.from('malba_campaigns').upsert(rec, { onConflict:'id' }).select().single().then(function(r){
      if (r.error || !r.data) { toast('Erro ao salvar campanha','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent=(isNew?'Criar campanha':'Salvar'); return; }
      if (isNew) ST.campaigns.push(r.data);
      else { for (var i=0;i<ST.campaigns.length;i++) if (ST.campaigns[i].id===c.id) { ST.campaigns[i]=r.data; break; } }
      close(); toast(isNew?'Campanha criada':'Campanha atualizada','success'); renderPage();
    });
  });

  if (!isNew) {
    modal.querySelector('#campDel').addEventListener('click', function(){
      if (!confirm('Excluir a campanha "'+(c.name||'')+'"?')) return;
      sb.from('malba_campaigns').delete().eq('id', c.id).then(function(r){
        if (r.error) { toast('Erro ao excluir','error'); return; }
        ST.campaigns = ST.campaigns.filter(function(x){ return x.id!==c.id; });
        // limpeza best-effort das instâncias diárias
        sb.from('malba_campaign_instances').delete().eq('campaign_id', c.id);
        close(); toast('Campanha excluída','success'); renderPage();
      });
    });
  }
}

/* ========== [10h] RANKING (Vendas) ========== */
function rankingHTML() {
  var y=new Date().getFullYear(), m=new Date().getMonth()+1;
  var rows = ST.users.map(function(u){
    var g = ST.goals.filter(function(x){ return x.user_id===u.id && x.month===m && x.year===y; })[0];
    return { name:u.name, color:u.color||'#3B6FF7', val:(g?Number(g.actual_value)||0:0), goal:(g?Number(g.goal_value)||0:0) };
  });
  rows.sort(function(a,b){ return b.val-a.val; });
  var max = rows.length ? Math.max(rows[0].val,1) : 1;
  var temDados = rows.some(function(r){ return r.val>0; });

  var body='';
  if (!temDados) {
    body = '<div class="empty-page"><div class="ep-ico">'+icon('trend')+'</div><h3>Ranking sem dados ainda</h3><p>As posições aparecem conforme o realizado das metas individuais for registrado (em Metas, atribua uma meta a cada vendedor).</p></div>';
  } else {
    body = '<div class="rank-list">';
    rows.forEach(function(r,i){
      var rk=i+1; var medal = rk===1?'gold':(rk===2?'silver':(rk===3?'bronze':''));
      var pct = r.val/max*100;
      var pctMeta = r.goal>0 ? (Math.round(r.val/r.goal*100)+'% da meta') : 'sem meta definida';
      body += '<div class="rank-row">'+
        '<span class="rank-pos '+medal+'">'+rk+'</span>'+
        '<span class="rank-av" style="background:'+r.color+'">'+esc(iniciais(r.name))+'</span>'+
        '<div class="rank-main"><b>'+esc(r.name)+'</b><i>'+pctMeta+'</i><div class="rank-bar"><span style="width:'+pct+'%;background:'+r.color+'"></span></div></div>'+
        '<span class="rank-val">'+fmtBRL(r.val)+'</span>'+
      '</div>';
    });
    body += '</div>';
  }
  return '<div class="tasks-head"><div><h2>Ranking de Vendedores</h2><div class="sub">'+MESES[m-1]+' / '+y+'</div></div></div>'+body;
}

  var summary = list.length ? '<div class="gestao-summary"><div class="gs-card"><span>Total em comissões</span><b>'+fmtBRL(totalPago)+'</b></div><div class="gs-card"><span>Vendas no período</span><b>'+fmtBRL(totalVendas)+'</b></div><div class="gs-card"><span>Lançamentos</span><b>'+list.length+'</b></div></div>' : '';

    rows = '<div class="empty-page"><div class="ep-ico">'+icon('dollar')+'</div><h3>Nenhuma comissão</h3><p>Lance as vendas e o sistema calcula a comissão de cada funcionário.</p></div>';
  } else {
    rows = '<div class="cfg-list">';

      rows += '<div class="com-row" data-cid="'+esc(c.id)+'">'+

        '<span class="com-val">'+fmtBRL(c.total_comissao)+'</span>'+

function openComissaoModal() {
  var ls = lojasGestao();
  if (ls.length===0) { toast('Cadastre lojas primeiro','error'); return; }
  var mode='individual';
  function parseNum(s){ return parseFloat(String(s||'').replace(/\./g,'').replace(',', '.')) || 0; }

  var modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML =
    '<div class="modal">'+
      '<div class="modal-title-input" style="cursor:default">Lançar comissões</div>'+
      '<div class="modal-row"><label class="modal-label">Loja</label><select id="comLoja">'+ls.map(function(l){return '<option value="'+esc(l.id)+'">'+esc(l.name||('Loja '+l.store_number))+'</option>';}).join('')+'</select></div>'+
      '<div class="modal-grid2"><div class="modal-row"><label class="modal-label">Início</label><input type="date" id="comIni" value="'+today()+'"></div><div class="modal-row"><label class="modal-label">Fim</label><input type="date" id="comFim" value="'+today()+'"></div></div>'+
      '<div class="modal-row"><label class="modal-label">Rótulo do período (opcional)</label><input type="text" id="comLabel" placeholder="ex: Semana 1 de Junho"></div>'+
      '<div class="modal-row"><label class="modal-label">Modelo de comissão</label><div class="pills" id="comMode"><button type="button" class="pill cm-pill on" data-m="individual">Individual</button><button type="button" class="pill cm-pill" data-m="rateio">Rateio igual</button></div><div class="com-mode-hint" id="comHint"></div></div>'+
      '<div id="comBody"></div>'+
      '<div class="com-total" id="comTotal"></div>'+
      '<div class="modal-foot"><button class="btn btn-ghost" id="comCancel">Cancelar</button><button class="btn btn-primary" id="comSave">Calcular e salvar</button></div>'+
    '</div>';
  document.body.appendChild(modal);

  var body=modal.querySelector('#comBody');
  function setHint(){ modal.querySelector('#comHint').textContent = mode==='individual' ? 'Cada funcionário ganha sobre as próprias vendas (o mais usado no varejo).' : 'Um valor total dividido igualmente entre a equipe ativa.'; }
  function renderBody(){
    var membros=membrosDaLoja(modal.querySelector('#comLoja').value);
    setHint();
    if (membros.length===0){ body.innerHTML='<div class="com-prev-empty" style="color:var(--u-amber)">Esta loja não tem funcionários ativos. Cadastre em Equipe.</div>'; modal.querySelector('#comTotal').innerHTML=''; return; }
    if (mode==='individual'){
      body.innerHTML =
        '<div class="modal-row"><label class="modal-label">% padrão (aplica a quem não tiver % próprio)</label><input type="text" id="comPctPadrao" inputmode="decimal" value="5"></div>'+
        '<div class="com-emp-head"><span>Funcionário</span><span>Vendas R$</span><span>%</span><span>Comissão</span></div>'+
        '<div class="com-emp-list">'+membros.map(function(m){
          return '<div class="com-emp-row">'+
            '<span class="com-emp-n"><span class="com-pessoa-av" style="background:'+(m.color||'#3B6FF7')+'">'+esc(iniciais(m.name))+'</span><span class="cen-txt">'+esc(m.name)+(m.role?'<i>'+esc(m.role)+'</i>':'')+'</span></span>'+
            '<input type="text" class="com-emp-base" data-mid="'+esc(m.id)+'" inputmode="decimal" placeholder="0">'+
            '<input type="text" class="com-emp-pct" data-mid="'+esc(m.id)+'" inputmode="decimal" placeholder="5">'+
            '<b class="com-emp-val" data-mid="'+esc(m.id)+'">R$ 0,00</b>'+
          '</div>';
        }).join('')+'</div>';
      var ins=modal.querySelectorAll('.com-emp-base,.com-emp-pct'); for(var i=0;i<ins.length;i++) ins[i].addEventListener('input', recomp);
      modal.querySelector('#comPctPadrao').addEventListener('input', recomp);
    } else {
      body.innerHTML='<div class="modal-grid2"><div class="modal-row"><label class="modal-label">Total de vendas (R$)</label><input type="text" id="comVendas" inputmode="decimal" placeholder="0,00"></div><div class="modal-row"><label class="modal-label">% de comissão</label><input type="text" id="comPct" inputmode="decimal" value="5"></div></div><div class="com-preview" id="comPrev"></div>';
      modal.querySelector('#comVendas').addEventListener('input', recomp);
      modal.querySelector('#comPct').addEventListener('input', recomp);
    }
    recomp();
  }
  function recomp(){
    var membros=membrosDaLoja(modal.querySelector('#comLoja').value);
    var totalEl=modal.querySelector('#comTotal');
    if (membros.length===0){ totalEl.innerHTML=''; return; }
    if (mode==='individual'){
      var padrao=parseNum(modal.querySelector('#comPctPadrao').value);
      var total=0, vendas=0;
      var bases=modal.querySelectorAll('.com-emp-base');
      for (var i=0;i<bases.length;i++){
        var mid=bases[i].getAttribute('data-mid');
        var pctEl=modal.querySelector('.com-emp-pct[data-mid="'+mid+'"]');
        var pct=(pctEl && pctEl.value.trim()!=='')?parseNum(pctEl.value):padrao;
        var base=parseNum(bases[i].value);
        var val=base*pct/100; total+=val; vendas+=base;
        var vEl=modal.querySelector('.com-emp-val[data-mid="'+mid+'"]'); if(vEl) vEl.textContent=fmtBRL(val);
      }
      totalEl.innerHTML='Comissão total: <b>'+fmtBRL(total)+'</b> · Vendas lançadas '+fmtBRL(vendas);
    } else {
      var vendas2=parseNum(modal.querySelector('#comVendas').value);
      var pct2=parseNum(modal.querySelector('#comPct').value);
      var prev=modal.querySelector('#comPrev');
      if (vendas2<=0||pct2<=0){ prev.innerHTML='<div class="com-prev-empty">Preencha vendas e % para ver o rateio.</div>'; totalEl.innerHTML=''; return; }
      var total2=vendas2*pct2/100, por=total2/membros.length;
      prev.innerHTML=membros.map(function(m){ return '<div class="com-prev-row"><span class="com-pessoa-av" style="background:'+(m.color||'#3B6FF7')+'">'+esc(iniciais(m.name))+'</span><span style="flex:1">'+esc(m.name)+(m.role?' · '+esc(m.role):'')+'</span><b>'+fmtBRL(por)+'</b></div>'; }).join('');
      totalEl.innerHTML='Comissão total: <b>'+fmtBRL(total2)+'</b> · dividida entre '+membros.length+' pessoa(s)';
    }
  }

  modal.querySelector('#comLoja').addEventListener('change', renderBody);
  var pills=modal.querySelectorAll('.cm-pill');
  for (var p=0;p<pills.length;p++) pills[p].addEventListener('click', function(){ mode=this.getAttribute('data-m'); for(var x=0;x<pills.length;x++) pills[x].classList.remove('on'); this.classList.add('on'); renderBody(); });
  renderBody();

  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  modal.querySelector('#comCancel').addEventListener('click', close);

  modal.querySelector('#comSave').addEventListener('click', function(){
    var lojaId=modal.querySelector('#comLoja').value;
    var membros=membrosDaLoja(lojaId);
    if (membros.length===0){ toast('Esta loja não tem funcionários cadastrados','error'); return; }
    var rateio=[], vendasTotal=0, totalCom=0, pctRef=0;
    if (mode==='individual'){
      var padrao=parseNum(modal.querySelector('#comPctPadrao').value); pctRef=padrao;
      membros.forEach(function(m){
        var bi=modal.querySelector('.com-emp-base[data-mid="'+m.id+'"]');
        var pi=modal.querySelector('.com-emp-pct[data-mid="'+m.id+'"]');
        var base=parseNum(bi?bi.value:0);
        var pct=(pi&&pi.value.trim()!=='')?parseNum(pi.value):padrao;
        var val=Math.round(base*pct/100*100)/100;
        vendasTotal+=base; totalCom+=val;
        rateio.push({ member_id:m.id, nome:m.name, role:m.role||'', base:Math.round(base*100)/100, percentual:pct, valor:val });
      });
      if (totalCom<=0){ toast('Informe as vendas de pelo menos um funcionário','error'); return; }
    } else {
      var vendas=parseNum(modal.querySelector('#comVendas').value);
      var pct=parseNum(modal.querySelector('#comPct').value);
      if (vendas<=0){ toast('Informe o total de vendas','error'); return; }
      if (pct<=0){ toast('Informe o %','error'); return; }
      pctRef=pct; vendasTotal=vendas; totalCom=Math.round(vendas*pct/100*100)/100;
      var por=totalCom/membros.length;
      rateio=membros.map(function(m){ return { member_id:m.id, nome:m.name, role:m.role||'', base:null, percentual:pct, valor:Math.round(por*100)/100 }; });
    }
    var rec={ sector:'lojas', store_unit_id:lojaId, periodo_inicio:modal.querySelector('#comIni').value||null, periodo_fim:modal.querySelector('#comFim').value||null, periodo_label:(modal.querySelector('#comLabel').value||'').trim()||null, vendas_total:Math.round(vendasTotal*100)/100, percentual:pctRef, total_comissao:Math.round(totalCom*100)/100, rateio:rateio, created_by:ST.session.user.id };
    var saveBtn=modal.querySelector('#comSave'); saveBtn.disabled=true; saveBtn.textContent='Salvando...';
    sb.from('malba_comissoes').insert(rec).select().single().then(function(r){
      if (r.error||!r.data){ toast('Erro ao salvar comissão','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Calcular e salvar'; return; }
      ST.comissoes.unshift(r.data); close(); toast('Comissão salva','success'); renderPage();
    });
  });
}

function renderStarsRO(nota) {

function openAvaliacaoModal() {
  var ls = lojasGestao();
  if (ls.length===0) { toast('Cadastre lojas primeiro','error'); return; }
  var tipo='membro';
  var notas={};

  function build() {
    var crits = tipo==='loja' ? CRIT_LOJA : CRIT_MEMBRO;
    crits.forEach(function(c){ if(notas[c.id]==null) notas[c.id]=0; });
    var lojaOpts = ls.map(function(l){ return '<option value="'+esc(l.id)+'">'+esc(l.name||('Loja '+l.store_number))+'</option>'; }).join('');
    var lojaSel = modal ? modal.querySelector('#avLoja') : null;
    var lojaAtual = lojaSel ? lojaSel.value : ls[0].id;

    var membroBlock='';
    if (tipo==='membro') {
      var mem = membrosDaLoja(lojaAtual);
      var memOpts = mem.length ? mem.map(function(m){ return '<option value="'+esc(m.id)+'">'+esc(m.name)+'</option>'; }).join('') : '<option value="">Sem funcionários nesta loja</option>';
      membroBlock = '<div class="modal-row"><label class="modal-label">Funcionário</label><select id="avMembro">'+memOpts+'</select></div>';
    }
    var critHTML = crits.map(function(c){
      var nota=notas[c.id]||0; var stars='';
      for (var i=1;i<=5;i++) stars += '<button type="button" class="star-pick'+(i<=nota?' on':'')+'" data-crit="'+c.id+'" data-val="'+i+'">★</button>';
      return '<div class="aval-crit"><span>'+esc(c.label)+'</span><div class="aval-stars-pick">'+stars+'</div></div>';
    }).join('');

    var soma=0,n=0; crits.forEach(function(c){ if(notas[c.id]>0){ soma+=notas[c.id]; n++; } });
    var media = n>0 ? (soma/crits.length) : 0;

    return '<div class="modal">'+
      '<div class="modal-title-input" style="cursor:default">Nova avaliação</div>'+
      '<div class="modal-row"><label class="modal-label">Tipo</label><div class="pills" id="avTipo"><button type="button" class="pill av-tp'+(tipo==='membro'?' on':'')+'" data-tp="membro" style="color:var(--u-accent)"><span class="pdot" style="background:var(--u-accent)"></span>Funcionário</button><button type="button" class="pill av-tp'+(tipo==='loja'?' on':'')+'" data-tp="loja" style="color:var(--u-green)"><span class="pdot" style="background:var(--u-green)"></span>Loja</button></div></div>'+
      '<div class="modal-row"><label class="modal-label">Loja</label><select id="avLoja">'+lojaOpts+'</select></div>'+
      membroBlock+
      '<div class="modal-row"><label class="modal-label">Período (opcional)</label><input type="text" id="avPeriodo" placeholder="ex: Junho/2026"></div>'+
      '<div class="modal-row"><label class="modal-label">Critérios</label><div class="aval-crits">'+critHTML+'</div><div class="aval-media" id="avMedia">'+(n>0?('Média: '+media.toFixed(1)+' de 5'):'Média: —')+'</div></div>'+
      '<div class="modal-row"><label class="modal-label">Observação (opcional)</label><textarea id="avObs" placeholder="Comentários..."></textarea></div>'+
      '<div class="modal-foot"><button class="btn btn-ghost" id="avCancel">Cancelar</button><button class="btn btn-primary" id="avSave">Salvar avaliação</button></div>'+
    '</div>';
  }

  var modal=document.createElement('div'); modal.className='modal-bg';
  function rerender(preserveLoja){
    var lojaVal = modal.querySelector('#avLoja') ? modal.querySelector('#avLoja').value : null;
    modal.innerHTML = build();
    if (preserveLoja && lojaVal) { var ls2=modal.querySelector('#avLoja'); if(ls2) ls2.value=lojaVal; }
    bindAll();
  }
  function bindAll() {
    var tps=modal.querySelectorAll('.av-tp');
    for (var i=0;i<tps.length;i++) tps[i].addEventListener('click', function(){ tipo=this.getAttribute('data-tp'); notas={}; rerender(true); });
    var lojaSel=modal.querySelector('#avLoja');
    if (lojaSel) lojaSel.addEventListener('change', function(){ rerender(true); });
    var stars=modal.querySelectorAll('.star-pick');
    for (var s=0;s<stars.length;s++) stars[s].addEventListener('click', function(){ notas[this.getAttribute('data-crit')]=parseInt(this.getAttribute('data-val'),10); rerender(true); });
    var cancel=modal.querySelector('#avCancel'); if(cancel) cancel.addEventListener('click', close);
    var save=modal.querySelector('#avSave'); if(save) save.addEventListener('click', salvar);
  }
  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  function salvar() {
    var crits = tipo==='loja' ? CRIT_LOJA : CRIT_MEMBRO;
    var lojaId=modal.querySelector('#avLoja').value;
    var memberId=null;
    if (tipo==='membro') { var ms=modal.querySelector('#avMembro'); memberId=ms?ms.value:null; if(!memberId){ toast('Selecione um funcionário','error'); return; } }
    var soma=0,n=0; crits.forEach(function(c){ if(notas[c.id]>0){ soma+=notas[c.id]; n++; } });
    if (n===0) { toast('Dê pelo menos uma nota','error'); return; }
    var media=soma/crits.length;
    var rec={ sector:'lojas', tipo:tipo, store_unit_id:lojaId, member_id:memberId, periodo_label:(modal.querySelector('#avPeriodo').value||'').trim()||null, data_avaliacao:today(), notas:notas, nota_final:Math.round(media*10)/10, observacao:(modal.querySelector('#avObs').value||'').trim()||null, created_by:ST.session.user.id };
    var saveBtn=modal.querySelector('#avSave'); saveBtn.disabled=true; saveBtn.textContent='Salvando...';
    sb.from('malba_avaliacoes').insert(rec).select().single().then(function(r){
      if (r.error || !r.data) { toast('Erro ao salvar avaliação','error'); console.error(r.error); saveBtn.disabled=false; saveBtn.textContent='Salvar avaliação'; return; }
      ST.avaliacoes.unshift(r.data); close(); toast('Avaliação salva','success'); renderPage();
    });
  }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  document.body.appendChild(modal);
  rerender(false);
}

function bindPerfil() {
  var u=ST.session.user;
  // trocar foto (base64, máx 200KB)
  var pb=document.getElementById('prfPhotoBtn'), pf=document.getElementById('prfPhotoFile');
  if (pb && pf) {
    pb.addEventListener('click', function(){ pf.click(); });

          if (r.error) { toast('Erro ao salvar foto','error'); console.error(r.error); return; }
          u.avatar=data; saveSession(ST.session); toast('Foto atualizada','success'); renderPage();
        });
      };
      reader.readAsDataURL(f);
    });
  }
  // salvar dados do perfil
  var save=document.getElementById('prfSave');
  if (save) save.addEventListener('click', function(){
    var name=(document.getElementById('prfName').value||'').trim();
    if (!name) { toast('Nome obrigatório','error'); return; }

      if (r.error) { toast('Erro ao salvar','error'); console.error(r.error); return; }
      Object.assign(u, payload); saveSession(ST.session); toast('Perfil atualizado','success'); renderPage();

/* ========== [10k] CALENDÁRIO EDITORIAL (Marketing) ========== */
function calItemsDoDia(ds) {
  var items=[];
  ST.campaigns.forEach(function(c){
    var s=(c.start_date||'').split('T')[0], e=(c.end_date||'').split('T')[0];
    if (s && e && ds>=s && ds<=e) items.push({ k:'camp', color:c.color||'#8B5CF6', label:c.name, id:c.id });
    else if (s && !e && s===ds) items.push({ k:'camp', color:c.color||'#8B5CF6', label:c.name, id:c.id });
  });
  ST.tasks.forEach(function(t){ if ((t.due_date||'').split('T')[0]===ds) items.push({ k:'task', color:'#3B6FF7', label:t.title, id:t.id }); });
  ST.milestones.forEach(function(ms){
    if ((ms.date||'').split('T')[0]===ds) {
      var pr=null; for (var i=0;i<ST.projects.length;i++) if (String(ST.projects[i].id)===String(ms.project_id)) { pr=ST.projects[i]; break; }
      if (pr) items.push({ k:'ms', color:'#16A34A', label:ms.name, id:ms.id });
    }
  });
  return items;
}

function calendarioHTML() {
  if (ST.cal.y==null) { var n=new Date(); ST.cal.y=n.getFullYear(); ST.cal.m=n.getMonth(); }
  var y=ST.cal.y, m=ST.cal.m;
  var first=new Date(y,m,1).getDay();
  var dim=new Date(y,m+1,0).getDate();
  var hoje=today();
  var dow=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  var top='<div class="cal-top"><div><h2>Calendário editorial</h2><div class="sub">Campanhas, tarefas e marcos do mês</div></div>'+
    '<div class="cal-nav-wrap"><button class="cal-nav" id="calPrev">‹</button><span class="cal-month">'+MESES[m]+' '+y+'</span><button class="cal-nav" id="calNext">›</button></div></div>';
  var legend='<div class="cal-legend"><span class="cal-lg"><i style="background:#8B5CF6"></i>Campanha</span><span class="cal-lg"><i style="background:#3B6FF7"></i>Tarefa</span><span class="cal-lg"><i style="background:#16A34A"></i>Marco de projeto</span></div>';

  var grid='<div class="cal-grid">';
  dow.forEach(function(d){ grid+='<div class="cal-dow">'+d+'</div>'; });
  for (var b=0;b<first;b++) grid+='<div class="cal-cell empty"></div>';
  for (var d=1;d<=dim;d++) {
    var ds=y+'-'+pad(m+1)+'-'+pad(d);
    var items=calItemsDoDia(ds);
    var chips='';
    items.slice(0,3).forEach(function(it){
      chips+='<button class="cal-chip" data-ck="'+it.k+'" data-cid="'+esc(it.id)+'" style="background:'+it.color+'18;color:'+it.color+'"><i style="background:'+it.color+'"></i><span>'+esc(it.label)+'</span></button>';
    });
    if (items.length>3) chips+='<span class="cal-more">+'+(items.length-3)+'</span>';
    grid+='<div class="cal-cell'+(ds===hoje?' today':'')+'"><span class="cal-d">'+d+'</span>'+chips+'</div>';
  }
  grid+='</div>';
  return top+legend+grid;
}

/* ========== [10l] CHAT EFÊMERO (Realtime broadcast — nada é salvo) ========== */
var chatChannel=null, chatMsgs=[];
function hhmm(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function chatTeardown(){ if (chatChannel) { try{ sb.removeChannel(chatChannel); }catch(e){} chatChannel=null; } }
function chatHTML() {
  var setorLabel = SECTORS[ST.sector] ? SECTORS[ST.sector].label : '';
  return '<div class="chat-wrap">'+
    '<div class="chat-head"><div><h2>Chat da equipe</h2><div class="sub">Setor '+esc(setorLabel)+' · tempo real, sem salvar nada</div></div><div class="chat-online" id="chatOnline"><span class="chat-on-dot"></span>conectando...</div></div>'+
    '<div class="chat-note">As mensagens são ao vivo e não ficam guardadas — ao sair ou recarregar, a conversa zera.</div>'+
    '<div class="chat-msgs" id="chatMsgs"><div class="chat-empty">Comece a conversa com a equipe. 👋</div></div>'+
    '<div class="chat-input"><input type="text" id="chatInput" placeholder="Escreva uma mensagem..." autocomplete="off" maxlength="500"><button class="btn btn-primary" id="chatSend">'+icon('chat')+'Enviar</button></div>'+
  '</div>';
}
function bindChat() {
  var u=ST.session.user;
  chatMsgs=[];
  var msgsEl=document.getElementById('chatMsgs');
  var input=document.getElementById('chatInput');
  var sendBtn=document.getElementById('chatSend');
  var onlineEl=document.getElementById('chatOnline');

  function renderMsgs(){
    if (chatMsgs.length===0){ msgsEl.innerHTML='<div class="chat-empty">Comece a conversa com a equipe. 👋</div>'; return; }
    msgsEl.innerHTML=chatMsgs.map(function(m){
      var mine=m.uid===u.id;
      var av = mine?'':'<span class="chat-av" style="background:'+(m.color||'#3B6FF7')+'">'+esc(iniciais(m.name))+'</span>';
      return '<div class="chat-msg'+(mine?' mine':'')+'">'+av+'<div class="chat-bubble">'+(mine?'':'<span class="chat-name">'+esc(m.name)+'</span>')+'<span class="chat-text">'+esc(m.text)+'</span><span class="chat-time">'+esc(m.time)+'</span></div></div>';
    }).join('');
    msgsEl.scrollTop=msgsEl.scrollHeight;
  }
  function addMsg(m){ chatMsgs.push(m); if(chatMsgs.length>200) chatMsgs.shift(); renderMsgs(); }

  chatTeardown();
  var ch = sb.channel('chat-'+ST.sector, { config:{ broadcast:{ self:true }, presence:{ key:u.id } } });
  ch.on('broadcast', { event:'msg' }, function(p){ if(p && p.payload) addMsg(p.payload); });
  ch.on('presence', { event:'sync' }, function(){
    if(!onlineEl) return;
    var st=ch.presenceState(); var n=Object.keys(st).length;
    onlineEl.innerHTML='<span class="chat-on-dot"></span>'+n+' online';
  });
  ch.subscribe(function(status){
    if (status==='SUBSCRIBED') { ch.track({ name:u.name, at:Date.now() }); }
    else if (status==='CHANNEL_ERROR' || status==='TIMED_OUT') { if(onlineEl) onlineEl.innerHTML='<span class="chat-on-dot off"></span>sem conexão'; }
  });
  chatChannel=ch;

  function send(){
    var txt=(input.value||'').trim(); if(!txt) return;
    var m={ uid:u.id, name:u.name, color:u.color||'#3B6FF7', text:txt, time:hhmm() };
    ch.send({ type:'broadcast', event:'msg', payload:m });
    input.value=''; input.focus();
  }
  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); send(); } });
  input.focus();
}

  var iconFor={ task:'tasks', client:'users', project:'folder', campaign:'megaphone' };
  var bg=document.createElement('div'); bg.className='cmdk-bg'; bg.id='cmdkBg';
  bg.innerHTML='<div class="cmdk"><div class="cmdk-input-wrap">'+icon('search')+'<input id="cmdkInput" placeholder="Buscar páginas, ações, tarefas, clientes..." autocomplete="off"><span class="cmdk-esc">esc</span></div><div class="cmdk-list" id="cmdkList"></div></div>';
  document.body.appendChild(bg);
  var input=bg.querySelector('#cmdkInput'), list=bg.querySelector('#cmdkList');

  function compute(q){
    q=(q||'').toLowerCase().trim();
    var base=cmds.filter(function(c){ return !q || c.label.toLowerCase().indexOf(q)>=0; });
    var content = q ? globalSearch(q).map(function(r){ return { cat:'Resultados', label:r.label, sub:r.sub, icon:iconFor[r.k]||'dashboard', run:function(){ openSearchResult(r); } }; }) : [];
    return base.concat(content);
  }
  function render(){
    if (filtered.length===0){ list.innerHTML='<div class="cmdk-empty">Nada encontrado</div>'; return; }
    var lastCat=null, html='';
    filtered.forEach(function(c,i){
      if (c.cat!==lastCat){ html+='<div class="cmdk-cat">'+esc(c.cat)+'</div>'; lastCat=c.cat; }
      html+='<button class="cmdk-item'+(i===sel?' on':'')+'" data-i="'+i+'">'+icon(c.icon||'dashboard')+'<span class="cmdk-l">'+esc(c.label)+'</span>'+(c.sub?'<span class="cmdk-s">'+esc(c.sub)+'</span>':'')+'</button>';
    });
    list.innerHTML=html;
    var on=list.querySelector('.cmdk-item.on'); if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest'});
    var items=list.querySelectorAll('.cmdk-item');
    for (var k=0;k<items.length;k++){
      items[k].addEventListener('mousedown', function(e){ e.preventDefault(); exec(parseInt(this.getAttribute('data-i'),10)); });
      items[k].addEventListener('mousemove', function(){ var ni=parseInt(this.getAttribute('data-i'),10); if(ni!==sel){ sel=ni; var its=list.querySelectorAll('.cmdk-item'); for(var z=0;z<its.length;z++) its[z].classList.toggle('on', z===sel); } });
    }
  }
  function exec(i){ var c=filtered[i]; if(!c) return; close(); c.run(); }
  function close(){ document.removeEventListener('keydown', onKey, true); if(bg.parentNode) bg.parentNode.removeChild(bg); }
  function onKey(e){
    if (e.key==='Escape'){ e.preventDefault(); close(); }
    else if (e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1, filtered.length-1); render(); }
    else if (e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1, 0); render(); }
    else if (e.key==='Enter'){ e.preventDefault(); exec(sel); }
  }
  filtered=compute(''); render();
  input.addEventListener('input', function(){ sel=0; filtered=compute(input.value); render(); });
  document.addEventListener('keydown', onKey, true);
  bg.addEventListener('click', function(e){ if(e.target===bg) close(); });
  setTimeout(function(){ input.focus(); }, 30);
}

function openShortcutsHelp() {
  if (document.getElementById('shHelp')) return;
  var rows=[
    { k:['Ctrl/⌘','K'], d:'Abrir a paleta de comandos' },
    { k:['/'], d:'Ir para a busca' },
    { k:['N'], d:'Nova tarefa' },
    { k:['?'], d:'Mostrar estes atalhos' },
    { k:['Esc'], d:'Fechar janelas' }
  ];
  var modal=document.createElement('div'); modal.className='modal-bg'; modal.id='shHelp';
  modal.innerHTML='<div class="modal"><div class="modal-title-input" style="cursor:default">Atalhos de teclado</div><div class="sh-list">'+
    rows.map(function(r){ return '<div class="sh-row"><span class="sh-keys">'+r.k.map(function(k){ return '<kbd>'+esc(k)+'</kbd>'; }).join('<span class="sh-plus">+</span>')+'</span><span class="sh-desc">'+esc(r.d)+'</span></div>'; }).join('')+
    '</div><div class="modal-foot"><button class="btn btn-ghost" id="shClose">Fechar</button></div></div>';
  document.body.appendChild(modal);
  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  modal.querySelector('#shClose').addEventListener('click', close);
}

/* ========== [11] ROTEAMENTO DE PÁGINAS ========== */
function renderPage() {
  if (ST.page!=='chat') chatTeardown();
  // Perfil é uma página especial, fora do menu de setores
  if (ST.page==='perfil') { renderShell(perfilHTML(), 'Meu Perfil'); bindPerfil(); return; }
  var pages=PAGES[ST.sector]||PAGES.lojas; var pg=null;
  for (var i=0;i<pages.length;i++) if (pages[i].id===ST.page) { pg=pages[i]; break; }
  if (!pg || !pg.enabled) {
    // página inexistente ou ainda não construída → mostra placeholder (ou cai pra tarefas)
    if (!pg) { ST.page='inicio'; renderPage(); return; }
    renderShell('<div class="empty-page"><div class="ep-ico">'+icon(pg.icon)+'</div><h3>'+esc(pg.label)+'</h3><p>Esta área entra numa próxima fase da reconstrução.</p></div>', pg.label);
    return;
  }
  if (pg.id==='tarefas') {
    renderShell(tarefasHTML(), 'Tarefas'); bindTarefas();
  } else if (pg.id==='equipe') {
    renderShell(equipeHTML(), 'Equipe'); bindEquipe();
  } else if (pg.id==='metas') {
    renderShell(metasHTML(), 'Metas'); bindMetas();
  } else if (pg.id==='crm') {
    renderShell(crmHTML(), 'CRM'); bindCRM();
  } else if (pg.id==='projetos') {
    renderShell(projetosHTML(), 'Projetos'); bindProjetos();
  } else if (pg.id==='config') {
    renderShell(configHTML(), 'Configurações'); bindConfig();
  } else if (pg.id==='campanhas') {
    renderShell(campanhasHTML(), 'Campanhas'); bindCampanhas();
  } else if (pg.id==='calendario') {
    renderShell(calendarioHTML(), 'Calendário'); bindCalendario();
  } else if (pg.id==='ranking') {
    renderShell(rankingHTML(), 'Ranking');
  } else if (pg.id==='gestao') {
    renderShell(gestaoHTML(), 'Gestão'); bindGestao();
  } else if (pg.id==='chat') {
    renderShell(chatHTML(), 'Chat'); bindChat();
  } else if (pg.id==='inicio') {
    renderShell(dashboardHTML(), 'Início');
    bindDashboard();
  }
}

/* ========== [12] BOOT ========== */
function getTheme(){ try { return localStorage.getItem('malba_theme')||'light'; } catch(e){ return 'light'; } }
function applyTheme(t){ if(t==='dark') document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }
function toggleTheme(){ var t=getTheme()==='dark'?'light':'dark'; try{ localStorage.setItem('malba_theme', t); }catch(e){} applyTheme(t); var b=document.getElementById('themeToggle'); if(b){ b.innerHTML=icon(t==='dark'?'sun':'moon'); b.title=(t==='dark'?'Modo claro':'Modo escuro'); } }

function boot() {
  applyTheme(getTheme());
  try {
    var bp=new URLSearchParams(location.search).get('bling');
    if (bp) {
      window._blingMsg = (bp==='ok') ? ['Loja conectada ao Bling com sucesso!','success'] : ['Não foi possível conectar ao Bling. Tente de novo.','error'];
      history.replaceState(null,'', location.pathname + location.hash);
    }
  } catch(e){}
  if (!window._onlineHook) { window._onlineHook=true; window.addEventListener('online', setOnlineState); window.addEventListener('offline', setOnlineState); }
  if (!window._cmdkHook) { window._cmdkHook=true; window.addEventListener('keydown', function(e){ if ((e.metaKey||e.ctrlKey) && (e.key==='k'||e.key==='K')) { e.preventDefault(); if (ST.session) openCommandPalette(); } }); }
  if (!window._keysHook) { window._keysHook=true; window.addEventListener('keydown', function(e){
    if (!ST.session || e.metaKey || e.ctrlKey || e.altKey) return;
    var ae=document.activeElement;
    if (ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'||ae.isContentEditable)) return;
    var modalOpen=document.querySelector('.modal-bg, .cmdk-bg');
    if (e.key==='/') { e.preventDefault(); var s=document.getElementById('topSearch'); if(s) s.focus(); }
    else if (e.key==='?') { e.preventDefault(); openShortcutsHelp(); }
    else if ((e.key==='n'||e.key==='N') && !modalOpen) { e.preventDefault(); openTaskModal(null); }
  }); }
  var session=getSession();
  if (!session || !session.user) { renderSectorScreen(); return; }
  ST.session=session; ST.sector=session.sector;
  var route=currentRoute();
  ST.page = (route.length>=2) ? route[1] : 'inicio';
  if (!ST.loaded) { render('<div class="screen"><div class="spinner"></div></div>'); loadData().then(function(){ renderPage(); flushBlingMsg(); }); }
  else { renderPage(); flushBlingMsg(); }
}
function flushBlingMsg(){ if (window._blingMsg) { var m=window._blingMsg; window._blingMsg=null; setTimeout(function(){ toast(m[0], m[1]); }, 300); } }
function init() {
  render('<div class="screen"><div class="spinner"></div></div>');
  if (!sb) { render('<div class="screen"><div class="screen-inner"><div class="login-card"><h1 class="login-h">Erro</h1><p class="login-sub">Biblioteca do Supabase não carregou.</p></div></div></div>'); return; }
  pingBanco().then(function(ok){
    if (!ok) { render('<div class="screen"><div class="screen-inner"><div class="login-card"><h1 class="login-h">Sem conexão</h1><p class="login-sub">Não consegui falar com o banco. Confira URL e anon key na seção CONFIG.</p></div></div></div>'); return; }
    window.addEventListener('hashchange', boot);
    boot();
  });
}
init();

})();
