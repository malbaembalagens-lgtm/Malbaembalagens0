.caixa-obs { display:flex; align-items:flex-start; gap:8px; margin-top:12px; font-size:13px; color:var(--u-text2); background:var(--u-bg2); border-radius:10px; padding:10px 12px; }
.caixa-obs svg { width:15px; height:15px; color:var(--u-text3); flex-shrink:0; margin-top:2px; }
.caixa-by { font-size:11.5px; color:var(--u-text3); margin-top:11px; }
.cx-dif-box { text-align:center; font-size:13px; font-weight:600; color:var(--u-text3); background:var(--u-bg2); border:1.5px solid var(--u-border2); border-radius:12px; padding:11px; margin-bottom:2px; }
.cx-dif-box b { font-family:var(--u-font-display); font-size:18px; margin-left:6px; }
@media (max-width: 560px){ .caixa-vals { grid-template-columns:minmax(0, 1fr); } }
/* ===== Relatório de Lojas ===== */
.rep-launch { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--u-accent); background:var(--u-accent-soft); border:none; border-radius:8px; padding:5px 11px; cursor:pointer; margin-left:auto; }
/* ===== Visão do dia (calendário) ===== */
.dia-modal { max-width: 460px; }
.dia-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
.dia-title { font-family:var(--u-font-display); font-size:18px; font-weight:800; text-transform:capitalize; }
.dia-sub { font-size:12.5px; color:var(--u-text3); margin-top:2px; }
.dia-close { width:32px; height:32px; border-radius:9px; background:var(--u-bg2); border:none; font-size:15px; color:var(--u-text3); cursor:pointer; flex-shrink:0; }

.dia-body { max-height:52vh; overflow-y:auto; margin:0 -4px; padding:0 4px; }
.dia-sec-h { display:flex; align-items:center; gap:7px; font-size:11px; font-weight:800; color:var(--u-text3); text-transform:uppercase; letter-spacing:.4px; margin:14px 0 8px; }
.dia-sec-h:first-child { margin-top:0; }
.dia-sec-h svg { width:14px; height:14px; }
.dia-sec-h i { font-style:normal; background:var(--u-bg2); border-radius:20px; padding:1px 8px; font-size:10.5px; }
.dia-item { display:flex; align-items:center; gap:11px; padding:11px 12px; background:var(--u-bg2); border:1px solid transparent; border-radius:11px; margin-bottom:7px; cursor:pointer; transition:.12s; }
.dia-item:hover { border-color:var(--u-accent); }

.dia-dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
.dia-check { width:24px; height:24px; border-radius:7px; border:2px solid var(--u-border2); background:var(--u-card); flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
.dia-check svg { width:14px; height:14px; color:#fff; }
.dia-check.on { background:var(--u-green); border-color:var(--u-green); }
.dia-item-main { flex:1; min-width:0; } .dia-item-main b { font-size:13.5px; font-weight:600; display:block; }
.dia-item-main span { font-size:11.5px; color:var(--u-text3); }
.dia-arrow { color:var(--u-text3); font-size:18px; flex-shrink:0; }
.dia-empty { text-align:center; padding:26px 0; color:var(--u-text3); }

.dia-actions { display:flex; gap:8px; margin-top:16px; }
.dia-actions .btn { flex:1; min-width: 0;}
/* ===== Opções de repetição (criar tarefas em série) ===== */
.rec-opts { background:var(--u-accent-soft); border-radius:12px; padding:14px; margin:-4px 0 14px; }
.rec-check { display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:600; color:var(--u-text); cursor:pointer; margin-bottom:12px; }
.rec-check input { width:17px; height:17px; accent-color:var(--u-accent); cursor:pointer; }
.rec-wd-label, .rec-until .modal-label { font-size:12px; font-weight:700; color:var(--u-text2); margin-bottom:7px; }
.rec-wd { display:flex; gap:6px; margin-bottom:13px; flex-wrap:wrap; }

.rec-wd-btn.on { background:var(--u-accent); border-color:var(--u-accent); color:#fff; }

.rec-until-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.rec-until-row input[type=date] { flex:1; min-width:150px; }
.rec-quick { font-size:12px; font-weight:700; color:var(--u-accent); background:var(--u-card); border:1px solid var(--u-border); border-radius:8px; padding:8px 12px; cursor:pointer; }
.rec-quick:hover { background:var(--u-accent); color:#fff; border-color:var(--u-accent); }
.rec-preview { margin-top:12px; padding-top:11px; border-top:1px dashed var(--u-border2); font-size:13px; color:var(--u-text2); }

.rep-launch svg { width:13px; height:13px; } .rep-launch:hover { background:var(--u-accent); color:#fff; }
.rep-card-btns { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
.rep-card-btns .rep-launch { margin-left:0; }
.rep-launch.alt { color:var(--u-text2); background:var(--u-bg2); } .rep-launch.alt:hover { background:var(--u-border); color:var(--u-text); }
.lr-table-wrap { overflow-x:auto; }
.lr-table { width:100%; border-collapse:collapse; font-size:13px; }
.lr-table th { text-align:right; font-size:11px; font-weight:800; color:var(--u-text3); text-transform:uppercase; letter-spacing:.4px; padding:8px 10px; border-bottom:2px solid var(--u-border); white-space:nowrap; }

.lr-meta-badge { font-weight:800; }
.lr-hint { font-size:11.5px; color:var(--u-text3); margin-left:auto; font-weight:500; }
.lr-rank { display:flex; flex-direction:column; gap:8px; }
.lr-rank-row { display:flex; align-items:center; gap:11px; padding:9px 12px; background:var(--u-bg2); border-radius:10px; }

/* ===== Produtos mais vendidos por categoria ===== */
.lp-cats { display:flex; flex-direction:column; gap:16px; }
.lp-cat-h { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:7px; }
.lp-cat-h b { font-family:var(--u-font-display); font-size:14px; }

/* v77: feedback de interação imediato + foco previsível + mobile limpo (vale pra todas as telas) */
* { -webkit-tap-highlight-color: transparent; }
.btn:active:not(:disabled) { transform: translateY(0) scale(.985); filter: brightness(.97); }

button:focus-visible, a:focus-visible, .nav-item:focus-visible, .cfg-tab:focus-visible, .wz-step:focus-visible, .act-btn:focus-visible { outline: 2px solid var(--u-accent); outline-offset: 2px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--u-accent); outline-offset: 1px; }
/* botão em carregamento — feedback imediato ao salvar */
.btn.busy { position: relative; color: transparent !important; pointer-events: none; }
.btn.busy::after { content: ''; position: absolute; width: 16px; height: 16px; top: 50%; left: 50%; margin: -8px 0 0 -8px; border: 2px solid rgba(255,255,255,.45); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
.btn-ghost.busy::after, .btn-danger.busy::after { border-color: rgba(0,0,0,.2); border-top-color: var(--u-text2); }
/* CTA dentro da tela vazia — ação previsível "e agora?" resolvida */

.toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 8px; align-items: center; }

.toast.error { background: var(--u-red); }

@keyframes toastIn { from { transform: translateY(10px); opacity: 0; } }

.empty-page { text-align: center; padding: 60px 20px; color: var(--u-text2); }

/* Meu Espaço */

.me-ag-l { flex: 1; font-size: 13px; color: var(--u-text); min-width: 0;}
.me-aval { padding: 11px; border-radius: 11px; background: var(--u-card2); border: 1px solid var(--u-border); }

.me-aval-obs { margin-top: 6px; font-size: 12.5px; color: var(--u-text2); line-height: 1.4; }
.me-com { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--u-card2); border: 1px solid var(--u-border); }
.me-com-l { font-size: 13px; color: var(--u-text2); font-weight: 600; }
.me-com-v { font-size: 14px; font-weight: 800; color: var(--u-green); white-space: nowrap; }
@media (max-width: 760px){ .me-grid { grid-template-columns: minmax(0, 1fr); } .me-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.cal-more { font-size: 10px; color: var(--u-text3); font-weight: 700; padding-left: 4px; }
.cal-top-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cal-today-btn { height: 34px; padding: 0 14px; border-radius: 10px; background: var(--u-card); border: 1px solid var(--u-border); font-size: 13px; font-weight: 700; color: var(--u-text2); box-shadow: var(--u-shadow); }
.cal-today-btn:hover { background: var(--u-accent-soft); color: var(--u-accent); }
.cal-cell[data-date] { cursor: pointer; transition: background .12s, border-color .12s; }
.cal-cell[data-date]:hover { border-color: var(--u-accent); }
.cal-cell.drag-over { border-color: var(--u-accent); background: var(--u-accent-soft); box-shadow: 0 0 0 2px var(--u-accent-soft); }
.cal-cell-h { display: flex; align-items: center; justify-content: space-between; }
.cal-add { width: 20px; height: 20px; border-radius: 6px; border: 1px dashed var(--u-border2); color: var(--u-text3); font-size: 15px; line-height: 1; opacity: 0; transition: opacity .12s, all .12s; background: transparent; }
.cal-cell[data-date]:hover .cal-add { opacity: 1; }
.cal-add:hover { background: var(--u-accent); color: #fff; border-style: solid; border-color: var(--u-accent); }
.cal-chips { display: flex; flex-direction: column; gap: 3px; }

.cal-chip[draggable="true"]:active { cursor: grabbing; }
.cal-chip.dragging { opacity: .4; }
.cal-chip.done span { text-decoration: line-through; opacity: .65; }
/* checklist de campanha (rico) */
.camp-task-item.done .camp-task-t { text-decoration: line-through; color: var(--u-text3); }
.camp-task-check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--u-border); color: #fff; font-size: 12px; font-weight: 800; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

.camp-task-date { width: 130px; padding: 5px 7px; border-radius: 7px; border: 1px solid var(--u-border2); background: var(--u-card); font-size: 11.5px; color: var(--u-text2); }
.camp-task-resp { max-width: 130px; padding: 5px 7px; border-radius: 7px; border: 1px solid var(--u-border2); background: var(--u-card); font-size: 11.5px; color: var(--u-text2); }
@media (max-width: 720px) { .camp-task-date, .camp-task-resp { width: auto; max-width: 92px; } }

@media (max-width: 720px) {
  .cal-cell { min-height: 70px; padding: 4px; }
  .cal-chip span { display: none; }
  .cal-chip { width: auto; padding: 4px; }
}

/* ===== Perfil ===== */
.profile-wrap { max-width: 620px; display: flex; flex-direction: column; gap: 16px; }
.profile-card { background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius); box-shadow: var(--u-shadow); padding: 24px; }
.profile-head { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; }
.profile-av { width: 80px; height: 80px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 28px; font-family: var(--u-font-display); }
.profile-head-info h2 { font-family: var(--u-font-display); font-size: 20px; font-weight: 800; }
.profile-head-info p { font-size: 13px; color: var(--u-text3); margin: 2px 0 10px; }
.profile-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.prf-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.prf-field label { font-size: 12px; font-weight: 700; color: var(--u-text2); }
.prf-field input, .prf-field textarea { padding: 11px 13px; border-radius: var(--radius-sm); border: 1px solid var(--u-border2); background: var(--u-card2); font-size: 14px; color: var(--u-text); outline: none; font-family: inherit; transition: border-color .15s, box-shadow .15s; }
.prf-field textarea { min-height: 70px; resize: vertical; }
.prf-field input:focus, .prf-field textarea:focus { border-color: var(--u-accent); box-shadow: 0 0 0 3px var(--u-accent-soft); }
.prf-field input:disabled { opacity: .55; }
.profile-sec-h { font-family: var(--u-font-display); font-size: 16px; font-weight: 800; margin-bottom: 14px; }
.profile-card .btn-danger svg { display: inline-block; vertical-align: -3px; margin-right: 4px; width: 16px; height: 16px; }

@media (max-width: 600px) { .profile-grid { grid-template-columns: minmax(0, 1fr); } }
.empty-page .ep-ico { width: 64px; height: 64px; border-radius: 18px; background: var(--u-accent-soft); color: var(--u-accent); display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 16px; }
.empty-page h3 { font-family: var(--u-font-display); font-size: 18px; font-weight: 800; color: var(--u-text); margin-bottom: 6px; }

@media (max-width: 900px) { .board { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .sector-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; max-width: 100%; }
  .sector-ico { width: 72px; height: 72px; }
  .side { position: fixed; z-index: 50; transform: translateX(-100%); transition: transform .25s; }
  .content { padding: 16px; }
  .modal-grid2 { grid-template-columns: minmax(0, 1fr); }
  .crm-summary { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .crm-cp-seg { display: none; }
}
@media (max-width: 420px) { .sector-grid { grid-template-columns: minmax(0, 1fr); max-width: 100%; } }

/* ================= MOBILE / RESPONSIVO (gaveta + empilhamento) ================= */
.top-burger { display: none; }
.side-overlay { display: none; }

@media (max-width: 860px) {
  /* --- Sidebar vira gaveta deslizante --- */
  .app-shell { display: block; }
  .side {
    position: fixed; top: 0; left: 0; height: 100vh; height: 100dvh; width: 82vw; max-width: 300px;
    z-index: 1200; transform: translateX(-100%); transition: transform .25s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 24px 70px -20px rgba(15,23,42,.55); overflow-y: auto;
  }
  .app-shell.side-open .side { transform: translateX(0); }
  .side-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 1100; opacity: 0; pointer-events: none; transition: opacity .25s; display: block; }
  .app-shell.side-open .side-overlay { opacity: 1; pointer-events: auto; }
  .main { width: 100%; min-width: 0; }
  /* --- Cabeçalho compacto com hambúrguer --- */
  .top { position: sticky; top: 0; z-index: 900; height: 58px; padding: 0 12px; gap: 10px; }
  .top-burger { display: flex; flex-direction: column; justify-content: center; gap: 4px; width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; background: var(--u-bg2); }
  .top-burger span { display: block; width: 18px; height: 2px; border-radius: 2px; background: var(--u-text); margin: 0 auto; }
  .top-title { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .top-search { display: none; }
  .top-store { max-width: 128px; }
  .content { padding: 16px 14px; }
  /* --- Grades empilham --- */
  .dash-grid2, .board, .goals-grid, .team-grid, .proj-grid, .camp-grid, .gestao-summary, .dash-cards, .sector-grid, .me-grid { grid-template-columns: minmax(0, 1fr); }
  .vg-kpis, .crm-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .modal-grid2 { grid-template-columns: minmax(0, 1fr); }
  /* --- Cabeçalhos de página quebram linha --- */
  .tasks-head, .cfg-sec-head, .cfg-head-btns, .metas-head, .crm-head { flex-wrap: wrap; gap: 10px; }
  /* --- Abas roláveis na horizontal --- */
  .cfg-tabs { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
  .cfg-tabs::-webkit-scrollbar { height: 0; }
  .cfg-tabs .cfg-tab { white-space: nowrap; flex-shrink: 0; }
  /* --- Assistente de avaliação: etapas compactas --- */
  .aval-wizard { max-width: 100%; }
  .aval-steps { overflow-x: auto; gap: 4px; }
  .aval-step .as-lb { display: none; }
  .aval-step.on .as-lb { display: inline; }
  .aval-summary { flex-direction: column; text-align: center; }
  .evo-chart { min-width: 0; }
  /* --- Modais viram folha inferior (bottom-sheet) --- */
  .modal-bg { padding: 0; align-items: flex-end; }
  .modal { max-width: 100%; width: 100%; max-height: 94vh; border-radius: 20px 20px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); animation: slideup .25s cubic-bezier(.4,0,.2,1); }
  .modal-foot { flex-wrap: wrap; }
  .modal-foot .btn { flex: 1; min-width: 116px; }
  .btn-del-wrap { order: 3; flex-basis: 100%; }
  /* v77.2: assistente (wizard) e confirmação confortáveis no mobile */
  .wz-foot .wz-foot-sp { display: none; }
  .wz-foot #wzBack, .wz-foot #wzNext { flex: 1; min-width: 116px; }
  .confirm-bg { padding: 0; align-items: flex-end; }
  .confirm-card { max-width: 100%; width: 100%; border-radius: 20px 20px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); animation: slideup .25s cubic-bezier(.4,0,.2,1); }
}
@keyframes slideup { from { transform: translateY(28px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }

@media (max-width: 560px) {
  .top-novo span { display: none; }
  .top-novo { padding: 0; width: 38px; height: 38px; border-radius: 10px; justify-content: center; }
  .top-online span { display: none; }
  .content { padding: 14px 11px; }
  .cal-grid { gap: 3px; }
  .cal-cell { font-size: 11px; min-height: 46px; }
  .vg-kpis, .crm-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  h2 { font-size: 20px; }
}
@media (max-width: 620px){ .fi-kpis { grid-template-columns: repeat(2,minmax(0, 1fr)); } .fi-modal .fi-head { flex-wrap: wrap; } }

/* v91: Central de Estratégia */
.estr-wrap { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; margin-top: 14px; }
@media (max-width: 760px) { .estr-wrap { grid-template-columns: minmax(0, 1fr); } }
.estr-side { display: flex; flex-direction: column; gap: 4px; background: var(--u-card); border-radius: var(--radius); padding: 8px; box-shadow: var(--u-shadow); height: fit-content; }
.estr-side-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--u-text2); text-align: left; }
.estr-side-item:hover { background: var(--u-bg2); color: var(--u-text); }
.estr-side-item.on { background: var(--u-accent-soft); color: var(--u-accent); }
.estr-side-item.soon { opacity: .55; }
.estr-side-item.soon:hover { background: transparent; color: var(--u-text2); cursor: default; }
.estr-count { background: var(--u-bg2); color: var(--u-text2); padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.estr-side-item.on .estr-count { background: #fff; color: var(--u-accent); }
.estr-soon { font-size: 10.5px; color: var(--u-text2); text-transform: uppercase; letter-spacing: .5px; }
.estr-main { min-height: 300px; }
.estr-filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.estr-search { flex: 1; min-width: 200px; }
.estr-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 12px; }
.estr-card { background: var(--u-card); border-radius: var(--radius); padding: 14px; box-shadow: var(--u-shadow); cursor: pointer; transition: transform .12s, box-shadow .12s; border: 1px solid transparent; }
.estr-card:hover { transform: translateY(-1px); box-shadow: var(--u-shadow-lg, 0 8px 24px rgba(0,0,0,.08)); border-color: var(--u-border); }
.estr-card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.estr-status { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.estr-cat { font-size: 11.5px; color: var(--u-text2); background: var(--u-bg2); padding: 3px 9px; border-radius: 999px; font-weight: 600; }
.estr-title { font-size: 15px; font-weight: 700; margin: 0 0 6px; color: var(--u-text); line-height: 1.3; }
.estr-desc { font-size: 13px; color: var(--u-text2); margin: 0 0 10px; line-height: 1.45; }
.estr-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; }
.estr-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.estr-tag { font-size: 11px; color: var(--u-text2); background: var(--u-bg2); padding: 2px 8px; border-radius: 999px; font-weight: 500; }


/* v92: Objetivos + linha de conversão na ideia */
.obj-result { font-size: 12.5px; color: var(--u-text2); background: var(--u-bg2); border-radius: var(--radius-sm); padding: 8px 10px; margin: 6px 0 10px; line-height: 1.4; }
.obj-origem { font-size: 11.5px; color: var(--u-text2); background: var(--u-bg2); padding: 3px 9px; border-radius: 999px; font-weight: 500; }
.estr-prazo { font-size: 11.5px; color: var(--u-text2); background: var(--u-bg2); padding: 3px 9px; border-radius: 999px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.estr-prazo svg { font-size: 12px; }
.ideia-conv { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--u-border); }
.ideia-vinc { font-size: 12.5px; color: var(--u-text2); margin-bottom: 10px; }
.ideia-vinc b { color: var(--u-text); }
.ideia-vinc ul { margin: 4px 0 0 0; padding-left: 18px; }
.ideia-vinc li { margin: 2px 0; }


/* v93: Planejamento + Projetos */
.plan-list { display: flex; flex-direction: column; gap: 10px; }
.plan-card { background: var(--u-card); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--u-shadow); cursor: pointer; transition: transform .12s, box-shadow .12s; border: 1px solid transparent; }
.plan-card:hover { transform: translateY(-1px); border-color: var(--u-border); }
.plan-card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.plan-card-head h4 { font-size: 15px; font-weight: 700; margin: 0; color: var(--u-text); }
.plan-bar-wrap { background: var(--u-bg2); border-radius: 999px; height: 8px; overflow: hidden; }
.plan-bar { height: 100%; border-radius: 999px; transition: width .3s; }
.plan-bar-lb { font-size: 12.5px; color: var(--u-text2); margin-top: 6px; }
.plan-empty-hint { font-size: 12.5px; color: var(--u-text2); font-style: italic; }
.plan-conv { background: #16A34A22; color: #16A34A; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.plan-conv:hover { background: #16A34A; color: #fff; }
.plan-conv-done { font-size: 12px; color: #16A34A; background: #16A34A18; padding: 4px 10px; border-radius: 999px; font-weight: 700; white-space: nowrap; }

/* modal de planejamento */
.plan-modal-head { margin-bottom: 12px; }
.plan-modal-title { font-size: 16px; font-weight: 800; color: var(--u-text); margin-bottom: 3px; }
.plan-modal-obj { font-size: 13px; color: var(--u-text2); }
.plan-etapas { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.plan-etapa { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--u-bg2); border-radius: 9px; }
.plan-etapa.done .plan-etapa-lb span { text-decoration: line-through; color: var(--u-text3, #94a3b8); }
.plan-etapa-lb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--u-text); cursor: pointer; flex: 1; min-width: 0;}
.plan-etapa-lb input { accent-color: var(--u-accent); width: 16px; height: 16px; }
.plan-etapa-meta { display: flex; align-items: center; gap: 6px; }
.plan-etapa-av { width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 10.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.plan-etapa-due { font-size: 11px; color: var(--u-text2); background: var(--u-card); padding: 2px 8px; border-radius: 999px; font-weight: 600; }
.plan-etapa-del { background: transparent; color: var(--u-text3, #94a3b8); font-size: 16px; padding: 2px 6px; line-height: 1; }
.plan-etapa-del:hover { color: #EF4444; }
.plan-etapas-empty { text-align: center; padding: 20px; color: var(--u-text2); font-size: 13px; background: var(--u-bg2); border-radius: 9px; }
.plan-add { display: grid; grid-template-columns: minmax(0, 1fr) 140px 140px auto; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--u-border); }
.plan-add input, .plan-add select { padding: 8px 10px; border-radius: 8px; background: var(--u-bg2); border: 1px solid var(--u-border); font-size: 13px; color: var(--u-text); }
@media (max-width: 640px) { .plan-add { grid-template-columns: minmax(0, 1fr); } }


/* v94: visões extras (Kanban/Calendário) + Dashboard da Estratégia */
.estr-viewtog { margin-bottom: 14px; }

.estr-kanban { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 12px; }
.estr-kb-col { background: var(--u-bg2); border-radius: var(--radius); padding: 10px; min-height: 200px; }
.estr-kb-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; font-size: 13px; }
.estr-kb-head b { flex: 1; color: var(--u-text); min-width: 0;}
.estr-kb-dot { width: 8px; height: 8px; border-radius: 50%; }
.estr-kb-c { background: var(--u-card); color: var(--u-text2); font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.estr-kb-body { display: flex; flex-direction: column; gap: 8px; }
.estr-kb-body .estr-card { padding: 10px; }
.estr-kb-body .estr-title { font-size: 13.5px; }
.estr-kb-body .estr-desc { display: none; } /* no Kanban só título+meta */
.estr-kb-empty { text-align: center; color: var(--u-text3, #94a3b8); font-size: 12px; padding: 12px 0; }

.estr-cal { display: flex; flex-direction: column; gap: 18px; }
.estr-cal-mes-h { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--u-text2); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px dashed var(--u-border); }
.estr-cal-mes-h span { color: var(--u-text3, #94a3b8); font-weight: 500; }

/* Dashboard */
.estr-dash { display: flex; flex-direction: column; gap: 16px; }
.estr-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr)); gap: 10px; }
.estr-kpi { background: var(--u-card); border-radius: var(--radius); padding: 14px; box-shadow: var(--u-shadow); }
.estr-kpi-v { font-size: 26px; font-weight: 800; font-family: 'Sora', sans-serif; line-height: 1; }

.estr-funil, .estr-box { background: var(--u-card); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--u-shadow); }

.estr-funil-c { font-size: 13px; color: var(--u-text); font-weight: 800; text-align: right; }
.estr-rec { display: flex; flex-direction: column; gap: 4px; }

/* v95: Comentários + histórico dentro dos modais */

.estr-coment-box { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-bottom: 14px; align-items: end; }
.estr-coment-box textarea { resize: vertical; padding: 9px 12px; border-radius: 9px; background: var(--u-bg2); border: 1px solid var(--u-border); font-size: 13px; color: var(--u-text); font-family: inherit; }

.estr-coment-box .btn { white-space: nowrap; padding: 9px 16px; }
.estr-log { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
.estr-log-item { padding: 8px 10px; border-radius: 8px; font-size: 13px; }

.estr-log-item.log { display: flex; align-items: center; gap: 8px; color: var(--u-text2); font-size: 12.5px; padding: 4px 6px; }
.estr-log-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.estr-log-txt b { color: var(--u-text); }

.estr-log-head { display: flex; justify-content: space-between; margin-bottom: 4px; }
.estr-log-head b { color: var(--u-text); font-size: 12.5px; }
.estr-log-head span { color: var(--u-text3, #94a3b8); font-size: 11.5px; }
.estr-log-body { color: var(--u-text); line-height: 1.4; white-space: pre-wrap; }
.estr-log-empty { text-align: center; color: var(--u-text2); font-size: 12.5px; padding: 12px; background: var(--u-bg2); border-radius: 8px; font-style: italic; }


/* v96: Módulo Documentos */
.docs-wrap { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; margin-top: 14px; }
@media (max-width: 900px) { .docs-wrap { grid-template-columns: minmax(0, 1fr); } }

/* Sidebar */
.docs-side { background: var(--u-card); border-radius: var(--radius); padding: 10px; box-shadow: var(--u-shadow); max-height: 78vh; overflow-y: auto; }
.docs-side-group { display: flex; flex-direction: column; gap: 2px; padding: 4px 0; }
.docs-side-group + .docs-side-group { border-top: 1px solid var(--u-border); margin-top: 6px; padding-top: 10px; }
.docs-side-group-h { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; font-size: 12px; color: var(--u-text2); font-weight: 700; letter-spacing: .3px; }
.docs-side-add { background: var(--u-bg2); color: var(--u-accent); width: 22px; height: 22px; border-radius: 6px; font-size: 15px; font-weight: 800; padding: 0; }

.docs-side-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; color: var(--u-text); text-align: left; font-weight: 500; }

.docs-side-item.on .docs-count { background: #fff; color: var(--u-accent); }

.docs-folder-tree { display: flex; flex-direction: column; gap: 1px; }
.docs-folder-row {}
.docs-folder-item { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 7px; font-size: 13px; cursor: pointer; }
.docs-folder-item:hover { background: var(--u-bg2); }
.docs-folder-item.on { background: var(--u-accent-soft); color: var(--u-accent); font-weight: 700; }
.docs-folder-toggle { width: 14px; text-align: center; font-size: 10px; color: var(--u-text2); cursor: pointer; }
.docs-folder-toggle.empty { cursor: default; color: var(--u-text3, #94a3b8); }
.docs-folder-lb { flex: 1; min-width: 0;}
.docs-folder-c { font-size: 11px; color: var(--u-text2); background: var(--u-bg2); padding: 1px 7px; border-radius: 999px; font-weight: 600; }
.docs-folder-empty { padding: 8px 10px; font-size: 12px; color: var(--u-text3, #94a3b8); font-style: italic; }

/* Main */
.docs-main { min-height: 500px; }
.doc-tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(140px, 100%), 1fr)); gap: 8px; margin-bottom: 16px; }
.doc-tpl { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 10px; background: var(--u-card); border-radius: var(--radius); box-shadow: var(--u-shadow); font-size: 12.5px; font-weight: 600; color: var(--u-text); cursor: pointer; transition: transform .12s, box-shadow .12s; border: 1px solid transparent; }

.doc-tpl-ic { font-size: 22px; }

.doc-filtros { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
.doc-filtros input { flex: 1; min-width: 0;}
.doc-vtog { margin-left: auto; }

/* Tabela */
.doc-table-wrap { background: var(--u-card); border-radius: var(--radius); padding: 6px; box-shadow: var(--u-shadow); overflow-x: auto; }
.doc-table { width: 100%; border-collapse: collapse; }
.doc-table th { text-align: left; padding: 10px 12px; font-size: 11.5px; color: var(--u-text2); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; border-bottom: 1px solid var(--u-border); }

.doc-table tbody tr { cursor: pointer; }
.doc-table tbody tr:hover { background: var(--u-bg2); }
.doc-table tbody tr:last-child td { border-bottom: none; }
.doc-td-star { width: 28px; padding-right: 0 !important; }
.doc-td-title b { color: var(--u-text); }
.doc-tipo-ic { display: inline-block; margin-right: 6px; }
.doc-tags-inline { margin-left: 6px; }
.doc-tag { font-size: 10.5px; color: var(--u-text2); background: var(--u-bg2); padding: 1px 6px; border-radius: 999px; margin-right: 3px; }

/* Grade */

.doc-card { background: var(--u-card); border-radius: var(--radius); padding: 12px; box-shadow: var(--u-shadow); cursor: pointer; transition: transform .12s, box-shadow .12s; border: 1px solid transparent; }
.doc-card:hover { transform: translateY(-1px); border-color: var(--u-border); }
.doc-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 22px; }
.doc-card-title { font-size: 14px; font-weight: 700; color: var(--u-text); margin: 0 0 8px; line-height: 1.3; min-height: 36px; }
.doc-card-foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--u-text2); }

/* Editor */
.doc-editor-wrap { max-width: 900px; margin: 0 auto; }
.doc-editor-head { display: flex; align-items: center; gap: 10px; padding: 14px 0; margin-bottom: 8px; }
.doc-editor-back { background: transparent; color: var(--u-text2); font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px; }

.doc-editor-body { background: var(--u-card); border-radius: var(--radius); padding: 20px 30px; box-shadow: var(--u-shadow); min-height: 500px; }

/* EditorJS overrides — cores do MALBA */

/* Ações rápidas modal */
.doc-acoes-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 8px; }
.doc-acao { padding: 12px 8px; background: var(--u-bg2); border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--u-text); }
.doc-acao:hover { background: var(--u-accent-soft); color: var(--u-accent); }

/* v97: Compartilhamento granular de documentos */
.doc-share-doc { background: var(--u-bg2); border-radius: 9px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }

@media (max-width: 520px) { .doc-vis-grid { grid-template-columns: minmax(0, 1fr); } }
.doc-vis-opt { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border-radius: 10px; background: var(--u-bg2); border: 2px solid transparent; text-align: left; cursor: pointer; }

/* v98: Histórico de versões + pesquisa no conteúdo */

.doc-busca-aviso { font-size: 12px; color: var(--u-text2); padding: 6px 12px; background: var(--u-bg2); border-radius: 8px; margin-bottom: 12px; }

.doc-trecho { font-size: 12px; color: var(--u-text2); margin-top: 5px; line-height: 1.45; font-weight: 400; }

/* v99: comentários + pendências */
.doc-editor-cols { display: block; }
.doc-editor-cols.com-painel { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
@media (max-width: 900px) { .doc-editor-cols.com-painel { grid-template-columns: minmax(0, 1fr); } }
.doc-editor-wrap { max-width: 1180px; }

.doc-coment-painel { background: var(--u-card); border-radius: var(--radius); box-shadow: var(--u-shadow); position: sticky; top: 12px; max-height: 80vh; display: flex; flex-direction: column; }

.doc-coment-novo textarea, .doc-coment-respbox textarea { resize: vertical; padding: 9px 11px; border-radius: 9px; background: var(--u-bg2); border: 1px solid var(--u-border); font-size: 13px; color: var(--u-text); font-family: inherit; }

.doc-coment-lista { display: flex; flex-direction: column; gap: 10px; }
.doc-coment-item { background: var(--u-bg2); border-radius: 10px; padding: 10px 12px; }

.doc-coment-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }

.doc-coment-txt { font-size: 13px; color: var(--u-text); line-height: 1.45; white-space: pre-wrap; word-break: break-word; }

/* ==========================================================
   v102 — CONTENÇÃO DE LAYOUT
   Corrige a CAUSA do estouro horizontal, não o sintoma.
   Nenhum overflow-x:hidden escondendo problema.
   ========================================================== */

/* 1) A área útil nunca ultrapassa o espaço que sobra da barra lateral */
.main    { min-width: 0; max-width: 100%; }
.content { min-width: 0; max-width: 100%; }

/* 2) Texto digitado pelo usuário quebra em vez de empurrar o container.
      (nome de cliente, título de documento, descrição de projeto...) */
.content [class*="title"],
.content [class*="-tit"],
.content [class*="-nm"],
.content [class*="-name"],
.content [class*="desc"],
.content [class*="-txt"],
.content h1, .content h2, .content h3, .content h4,
.content p, .content td { overflow-wrap: break-word; }

/* 3) Rótulos que não podem quebrar viram reticências em vez de vazar */
.lr-rank-nm, .lp-prod-nm, .ms-name, .me-task-t, .dp-n, .kpi-srow-n,
.docs-folder-lb, .estr-rec-row b, .estr-kb-head b, .crm-main b,
.doc-card-title, .plan-etapa-lb span, .doc-vinc-item span {
  overflow: hidden; text-overflow: ellipsis;
}

/* 4) Componentes largos rolam DENTRO de si, nunca na página */
.lr-table-wrap, .doc-table-wrap, .ck-board { max-width: 100%; }
.lr-table, .doc-table { min-width: 640px; }   /* abaixo disso a tabela rola no wrapper */

/* 5) Mídia e blocos de código não estouram */
.content img, .content video, .content canvas, .content svg { max-width: 100%; }
.content pre, .content code { overflow-x: auto; max-width: 100%; }

/* ===== Telas de trabalho reais (1366 a 1920) ===== */

/* 1366px é a menor tela de trabalho comum: sobram ~1070px de área útil.
   Grades muito divididas ficam apertadas — reduz o número de colunas. */
@media (max-width: 1440px) {
  .adm-kpis   { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .vg-kpis,
  .crm-summary,
  .rep-kpis,
  .fi-kpis,
  .lp-kpis    { grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr)); }
  .estr-wrap  { grid-template-columns: 200px minmax(0, 1fr); }
  .docs-wrap  { grid-template-columns: 230px minmax(0, 1fr); }
  .content    { padding: 20px; }
}

/* Telas grandes: o conteúdo para de esticar e fica legível */
@media (min-width: 1700px) {
  .content > * { max-width: 1560px; }
}
