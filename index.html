<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALBA · Ponto Facial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MALBA Ponto Facial — Design System (herdado do Work OS)
   ============================================================ */
:root {
  --bg: #F4F6FB;
  --bg2: #EDF1F8;
  --card: #FFFFFF;
  --line: #E4E9F2;
  --text: #0F172A;
  --text2: #475569;
  --text3: #94A3B8;
  --accent: #3B6FF7;
  --accent-dark: #2857D1;
  --green: #16A34A;
  --red: #EF4444;
  --amber: #F59E0B;
  --purple: #8B5CF6;
  --rd-md: 8px;
  --rd-lg: 12px;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
  --shadow-md: 0 4px 12px rgba(15,23,42,.08);
  --shadow-lg: 0 10px 30px rgba(15,23,42,.12);
}
html.dark {
  --bg: #0B1220;
  --bg2: #121A2C;
  --card: #172033;
  --line: #253148;
  --text: #E6EDFB;
  --text2: #A6B4CE;
  --text3: #647391;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,.4);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}
h1, h2, h3 { font-family: 'Sora', -apple-system, sans-serif; margin: 0; }
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }
a { color: var(--accent); text-decoration: none; }

/* ============================================================
   Shell — sidebar + main
   ============================================================ */
.shell {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
}
.side {
  background: var(--card);
  border-right: 1px solid var(--line);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.side-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px 12px;
  border-bottom: 1px solid var(--line);
}
.side-logo b {
  font-family: 'Sora', sans-serif;
  font-weight: 800;
  font-size: 18px;
  color: var(--text);
}
.side-logo-badge {
  padding: 2px 8px;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  border-radius: 999px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.side-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.side-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: transparent;
  border: 0;
  border-radius: var(--rd-md);
  color: var(--text2);
  font-weight: 500;
  text-align: left;
  font-size: 14px;
  transition: all 0.15s;
}
.side-btn:hover { background: var(--bg2); color: var(--text); }
.side-btn.on { background: var(--accent); color: #fff; font-weight: 600; }
.side-btn .ico { font-size: 18px; }
.side-foot {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 8px;
}
.side-ver { font-size: 11px; color: var(--text3); }
.theme-toggle {
  background: transparent;
  border: 1px solid var(--line);
  padding: 6px 10px;
  border-radius: var(--rd-md);
  color: var(--text2);
  font-size: 14px;
}
.theme-toggle:hover { background: var(--bg2); }

.main {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
.top {
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.top h1 { font-size: 20px; font-weight: 700; color: var(--text); }
.top-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
.top-status {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: rgba(22,163,74,.1);
  color: var(--green);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}
.top-status.load { background: rgba(245,158,11,.1); color: var(--amber); }
.top-status.err { background: rgba(239,68,68,.1); color: var(--red); }
.top-status .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.content { padding: 24px; flex: 1; }

/* ============================================================
   Cards e Botões
   ============================================================ */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rd-lg);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}
.card-h {
  font-size: 11px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.card-v {
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.card-s { font-size: 12px; color: var(--text3); margin-top: 4px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  background: var(--accent);
  color: #fff;
  border: 0;
  border-radius: var(--rd-md);
  font-weight: 700;
  font-size: 14px;
  transition: all 0.15s;
}
.btn:hover:not(:disabled) { background: var(--accent-dark); transform: translateY(-1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost {
  background: transparent;
  color: var(--text2);
  border: 1px solid var(--line);
}
.btn-ghost:hover:not(:disabled) { background: var(--bg2); color: var(--text); }
.btn-lg { padding: 14px 28px; font-size: 16px; }
.btn-danger { background: var(--red); }
.btn-danger:hover:not(:disabled) { background: #DC2626; }

/* ============================================================
   Grid de KPIs
   ============================================================ */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.kpi { position: relative; }
.kpi-icon {
  position: absolute;
  top: 16px;
  right: 16px;
  font-size: 24px;
  opacity: 0.5;
}

/* ============================================================
   Tabela
   ============================================================ */
.table-wrap {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rd-lg);
  overflow: hidden;
}
.table-h {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.table-h h2 { font-size: 16px; font-weight: 700; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left;
  padding: 12px 20px;
  background: var(--bg2);
  color: var(--text3);
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
td {
  padding: 12px 20px;
  border-bottom: 1px dashed var(--line);
  vertical-align: middle;
}
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--bg2); }
.func-cell {
  display: flex;
  align-items: center;
  gap: 12px;
}
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--line);
}
.avatar-fallback {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12px;
}
.tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.tag-entrada { background: rgba(59,111,247,.15); color: var(--accent); }
.tag-saida_almoco { background: rgba(245,158,11,.15); color: #B45309; }
.tag-volta_almoco { background: rgba(245,158,11,.15); color: #B45309; }
.tag-saida { background: rgba(139,92,246,.15); color: var(--purple); }

/* ============================================================
   Cadastro / Bater Ponto — layout centralizado
   ============================================================ */
.center-form {
  max-width: 620px;
  margin: 0 auto;
}
.form-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}
.form-row label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.form-row input, .form-row select {
  padding: 12px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rd-md);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
}
.form-row input:focus, .form-row select:focus { border-color: var(--accent); }

/* Webcam */
.webcam-wrap {
  position: relative;
  background: #000;
  border-radius: var(--rd-lg);
  overflow: hidden;
  aspect-ratio: 4/3;
  margin-bottom: 16px;
  border: 3px solid var(--line);
}
.webcam-wrap.ok { border-color: var(--green); }
.webcam-wrap.err { border-color: var(--red); }
.webcam-wrap video, .webcam-wrap canvas {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transform: scaleX(-1); /* espelha pra ficar mais natural */
}
.webcam-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,.6);
  gap: 8px;
}
.webcam-overlay .oval {
  width: 60%;
  aspect-ratio: 3/4;
  border: 3px dashed rgba(255,255,255,.4);
  border-radius: 50%;
}
.webcam-msg {
  position: absolute;
  bottom: 12px;
  left: 12px;
  right: 12px;
  background: rgba(0,0,0,.7);
  color: #fff;
  padding: 8px 12px;
  border-radius: var(--rd-md);
  font-size: 12px;
  font-weight: 600;
  text-align: center;
}

/* Seletor de tipo de batida */
.tipo-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.tipo-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 16px 8px;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--rd-lg);
  color: var(--text2);
  font-weight: 700;
  font-size: 13px;
  transition: all 0.15s;
}
.tipo-btn:hover { border-color: var(--accent); color: var(--text); }
.tipo-btn.on {
  border-color: var(--accent);
  background: rgba(59,111,247,.08);
  color: var(--accent);
}
.tipo-btn .ico { font-size: 24px; }

/* Modal resultado */
.result-modal {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.result-body {
  background: var(--card);
  border-radius: var(--rd-lg);
  padding: 32px;
  max-width: 420px;
  width: 100%;
  text-align: center;
  box-shadow: var(--shadow-lg);
}
.result-ico {
  font-size: 64px;
  margin-bottom: 12px;
}
.result-body h3 { font-size: 24px; margin-bottom: 8px; }
.result-body p { color: var(--text2); margin-bottom: 20px; }
.result-sim {
  padding: 12px;
  background: var(--bg2);
  border-radius: var(--rd-md);
  font-size: 13px;
  margin-bottom: 20px;
}
.result-sim b { color: var(--text); font-size: 18px; font-variant-numeric: tabular-nums; }

/* Toast */
.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent);
  border-radius: var(--rd-md);
  padding: 12px 20px;
  box-shadow: var(--shadow-lg);
  font-size: 13px;
  font-weight: 600;
  z-index: 2000;
  animation: toastIn 0.3s;
  max-width: 320px;
}
.toast.success { border-left-color: var(--green); }
.toast.error { border-left-color: var(--red); }
.toast.warn { border-left-color: var(--amber); }
@keyframes toastIn {
  from { transform: translateY(-20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* Empty */
.empty {
  padding: 60px 20px;
  text-align: center;
  color: var(--text3);
}
.empty .ico { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty h3 { color: var(--text2); font-size: 16px; margin-bottom: 6px; }
.empty p { font-size: 13px; }

/* Config warning */
.config-warn {
  background: rgba(245,158,11,.1);
  border: 1px solid rgba(245,158,11,.3);
  color: #B45309;
  padding: 16px 20px;
  border-radius: var(--rd-lg);
  margin-bottom: 24px;
  font-size: 13px;
}
.config-warn b { display: block; margin-bottom: 4px; }
.config-warn code {
  background: rgba(0,0,0,.06);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
}

/* ============================================================
   Responsivo
   ============================================================ */
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side {
    flex-direction: row;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    overflow-x: auto;
  }
  .side-logo { border-bottom: 0; padding: 0; }
  .side-nav { flex-direction: row; gap: 4px; flex: 1; }
  .side-btn { padding: 8px 12px; font-size: 13px; }
  .side-btn .ico { display: none; }
  .side-foot { flex-direction: row; gap: 12px; margin-top: 0; }
  .side-ver { display: none; }
  .tipo-grid { grid-template-columns: repeat(2, 1fr); }
  .content { padding: 16px; }
}
@media (max-width: 500px) {
  .top { padding: 12px 16px; flex-direction: column; align-items: flex-start; gap: 8px; }
  .top h1 { font-size: 16px; }
  .side-btn { font-size: 12px; padding: 6px 10px; }
}
</style>
</head>
<body>

<div class="shell">
  <!-- SIDEBAR -->
  <aside class="side">
    <div class="side-logo">
      <b>MALBA</b>
      <span class="side-logo-badge">Ponto Facial</span>
    </div>
    <nav class="side-nav" id="sideNav">
      <button class="side-btn on" data-tela="dashboard"><span class="ico">📊</span><span>Dashboard</span></button>
      <button class="side-btn" data-tela="ponto"><span class="ico">📸</span><span>Bater Ponto</span></button>
      <button class="side-btn" data-tela="funcionarios"><span class="ico">👥</span><span>Funcionários</span></button>
      <button class="side-btn" data-tela="cadastro"><span class="ico">➕</span><span>Cadastrar</span></button>
    </nav>
    <div class="side-foot">
      <span class="side-ver">v1.0</span>
      <button class="theme-toggle" id="themeBtn" title="Alternar tema">🌙</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="top">
      <div>
        <h1 id="topTitle">Dashboard</h1>
        <div class="top-sub" id="topSub">Presença em tempo real</div>
      </div>
      <div class="top-status load" id="topStatus">
        <span class="dot"></span>
        <span id="topStatusTx">Carregando modelos...</span>
      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>

<div id="toastWrap"></div>

<!-- ============================================================
     BIBLIOTECAS EXTERNAS
     ============================================================ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.min.js"></script>

<script>
(function(){
'use strict';

/* ============================================================
   CONFIG — PREENCHA COM SUAS CREDENCIAIS DO SUPABASE
   Em Supabase: Settings → API → Project URL + anon public key
   ============================================================ */
var CONFIG = {
  SUPABASE_URL: 'https://SEU-PROJETO.supabase.co',
  SUPABASE_ANON_KEY: 'SUA_ANON_KEY_AQUI',
  SIMILARIDADE_MIN: 90,   // % mínima pra registrar (Bruno pediu 90%)
  MODELS_URL: 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model'
};

/* ============================================================
   ESTADO GLOBAL
   ============================================================ */
var ST = {
  tela: 'dashboard',
  funcionarios: [],
  batidas: [],
  modelsLoaded: false,
  supabase: null,
  cadastro: { nome: '', cargo: '', descriptor: null, fotoBlob: null },
  ponto: { tipo: 'entrada', descriptor: null, fotoBlob: null, funcionario: null, similaridade: 0 },
  webcamStream: null,
  loadingSb: false
};

var TIPOS = [
  { key: 'entrada',       label: 'Entrada',       ico: '☀️',  cor: '#3B6FF7' },
  { key: 'saida_almoco',  label: 'Saída Almoço',  ico: '🍽️', cor: '#F59E0B' },
  { key: 'volta_almoco',  label: 'Volta Almoço',  ico: '↩️',  cor: '#F59E0B' },
  { key: 'saida',         label: 'Saída',         ico: '🌙',  cor: '#8B5CF6' }
];

/* ============================================================
   HELPERS
   ============================================================ */
function $(sel){ return document.querySelector(sel); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function hoje(){ return new Date().toISOString().slice(0,10); }
function hhmm(iso){ if(!iso) return '—'; var d = new Date(iso); return d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }
function iniciais(nome){
  var p = (nome||'').split(' ').filter(Boolean);
  if (!p.length) return '?';
  if (p.length === 1) return p[0].charAt(0).toUpperCase();
  return (p[0].charAt(0) + p[p.length-1].charAt(0)).toUpperCase();
}
function toast(msg, tipo){
  tipo = tipo || 'success';
  var t = document.createElement('div');
  t.className = 'toast ' + tipo;
  t.textContent = msg;
  $('#toastWrap').appendChild(t);
  setTimeout(function(){
    t.style.opacity = '0';
    t.style.transition = 'opacity 0.3s';
    setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, 3200);
}
function setStatus(tx, tipo){
  var el = $('#topStatus');
  el.className = 'top-status ' + (tipo||'');
  $('#topStatusTx').textContent = tx;
}
function setTitulo(t, sub){
  $('#topTitle').textContent = t;
  $('#topSub').textContent = sub||'';
}

/* Distância euclidiana entre descriptors → % similaridade */
function distanciaParaSimilaridade(dist){
  // face-api: 0 = idêntico, ~0.4 = alta similaridade, ~0.6 = limiar típico
  // Mapeia 0→100%, 1→0% de forma linear invertida
  var sim = Math.max(0, (1 - dist)) * 100;
  return Math.round(sim * 10) / 10;
}

/* Detecta rosto único no video/canvas com descriptor */
async function detectarRosto(el){
  if (!ST.modelsLoaded){
    toast('Modelos ainda carregando, aguarde...', 'warn');
    return null;
  }
  try {
    var det = await faceapi
      .detectSingleFace(el, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
      .withFaceLandmarks()
      .withFaceDescriptor();
    return det || null;
  } catch(e){
    console.error('Erro detectando rosto:', e);
    return null;
  }
}

/* Captura frame da webcam em blob JPEG */
function capturarBlob(video){
  return new Promise(function(resolve){
    var canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    canvas.toBlob(function(b){ resolve(b); }, 'image/jpeg', 0.85);
  });
}

/* Upload de blob pro Supabase Storage */
async function uploadFoto(blob, prefixo){
  if (!ST.supabase) throw new Error('Supabase não configurado');
  var nome = (prefixo||'foto') + '_' + Date.now() + '.jpg';
  var { data, error } = await ST.supabase.storage.from('ponto-fotos').upload(nome, blob, {
    contentType: 'image/jpeg',
    cacheControl: '3600'
  });
  if (error) throw error;
  var pub = ST.supabase.storage.from('ponto-fotos').getPublicUrl(nome);
  return pub.data.publicUrl;
}

/* Geolocalização (opt-in do browser) */
function getGeo(){
  return new Promise(function(resolve){
    if (!navigator.geolocation) return resolve({lat:null, lng:null});
    navigator.geolocation.getCurrentPosition(
      function(pos){ resolve({lat: pos.coords.latitude, lng: pos.coords.longitude}); },
      function(){ resolve({lat:null, lng:null}); },
      { timeout: 5000, enableHighAccuracy: false }
    );
  });
}

/* Parar webcam */
function pararWebcam(){
  if (ST.webcamStream){
    ST.webcamStream.getTracks().forEach(function(t){ t.stop(); });
    ST.webcamStream = null;
  }
}

/* Iniciar webcam num video element */
async function iniciarWebcam(videoEl){
  pararWebcam();
  try {
    var stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: {ideal: 640}, height: {ideal: 480} },
      audio: false
    });
    ST.webcamStream = stream;
    videoEl.srcObject = stream;
    await new Promise(function(resolve){ videoEl.onloadedmetadata = resolve; });
    return true;
  } catch(e){
    console.error(e);
    toast('Erro ao acessar webcam: ' + e.message, 'error');
    return false;
  }
}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
async function init(){
  // Tema salvo
  if (localStorage.getItem('malba_ponto_tema') === 'dark') document.documentElement.classList.add('dark');
  atualizarTemaIcon();

  // Supabase
  if (CONFIG.SUPABASE_URL.indexOf('SEU-PROJETO') === -1 && CONFIG.SUPABASE_ANON_KEY.indexOf('SUA_ANON') === -1){
    try {
      ST.supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    } catch(e){
      console.error('Erro criando cliente Supabase:', e);
    }
  }

  // face-api models — em paralelo
  setStatus('Carregando modelos de reconhecimento...', 'load');
  try {
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(CONFIG.MODELS_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(CONFIG.MODELS_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(CONFIG.MODELS_URL)
    ]);
    ST.modelsLoaded = true;
    setStatus('Sistema pronto', '');
  } catch(e){
    console.error(e);
    setStatus('Erro ao carregar modelos', 'err');
    toast('Falha ao carregar modelos de IA', 'error');
  }

  // Carrega dados iniciais
  if (ST.supabase) await carregarDados();

  // Bind navegação
  document.querySelectorAll('#sideNav [data-tela]').forEach(function(btn){
    btn.addEventListener('click', function(){
      navegar(this.getAttribute('data-tela'));
    });
  });

  // Tema
  $('#themeBtn').addEventListener('click', toggleTema);

  // Render inicial
  renderTela();
}

function toggleTema(){
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('malba_ponto_tema', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
  atualizarTemaIcon();
}
function atualizarTemaIcon(){
  $('#themeBtn').textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
}

function navegar(tela){
  pararWebcam();
  ST.tela = tela;
  document.querySelectorAll('#sideNav [data-tela]').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-tela')===tela);
  });
  renderTela();
}

async function carregarDados(){
  if (!ST.supabase || ST.loadingSb) return;
  ST.loadingSb = true;
  try {
    var [funcs, bats] = await Promise.all([
      ST.supabase.from('ponto_facial_funcionarios').select('*').eq('ativo', true).order('nome'),
      ST.supabase.from('ponto_facial_batidas').select('*').gte('horario', hoje()+'T00:00:00').order('horario', {ascending: false})
    ]);
    if (funcs.error){ console.error(funcs.error); toast('Erro carregando funcionários','error'); }
    else ST.funcionarios = funcs.data || [];
    if (bats.error){ console.error(bats.error); toast('Erro carregando batidas','error'); }
    else ST.batidas = bats.data || [];
  } finally {
    ST.loadingSb = false;
  }
}

/* ============================================================
   RENDER — despacha por tela
   ============================================================ */
function renderTela(){
  var body = '';
  if (!ST.supabase){
    body = configWarnHTML();
  }
  switch (ST.tela){
    case 'dashboard':   setTitulo('Dashboard', 'Presença em tempo real'); body += dashboardHTML(); break;
    case 'ponto':       setTitulo('Bater Ponto', 'Reconhecimento facial'); body += pontoHTML(); break;
    case 'funcionarios':setTitulo('Funcionários', 'Cadastros ativos'); body += funcionariosHTML(); break;
    case 'cadastro':    setTitulo('Cadastrar Funcionário', 'Novo colaborador'); body += cadastroHTML(); break;
  }
  $('#content').innerHTML = body;
  switch (ST.tela){
    case 'ponto':      bindPonto(); break;
    case 'cadastro':   bindCadastro(); break;
  }
}

function configWarnHTML(){
  return '<div class="config-warn">'+
    '<b>⚠️ Configure o Supabase primeiro</b>'+
    'Edite o objeto <code>CONFIG</code> no topo do arquivo <code>index.html</code> com sua <code>SUPABASE_URL</code> e <code>SUPABASE_ANON_KEY</code>.'+
    '</div>';
}

/* ============================================================
   TELA · DASHBOARD
   ============================================================ */
function dashboardHTML(){
  // Presentes hoje = funcionários com pelo menos entrada batida hoje
  var batsHoje = ST.batidas.filter(function(b){
    return String(b.horario||'').slice(0,10) === hoje();
  });
  var presentesSet = {};
  batsHoje.forEach(function(b){ if(b.tipo==='entrada') presentesSet[b.funcionario_id]=1; });
  var presentes = Object.keys(presentesSet).length;

  // Primeira entrada / última saída
  var entradas = batsHoje.filter(function(b){return b.tipo==='entrada';}).map(function(b){return b.horario;}).sort();
  var saidas = batsHoje.filter(function(b){return b.tipo==='saida';}).map(function(b){return b.horario;}).sort();
  var primeira = entradas[0] || null;
  var ultima = saidas[saidas.length-1] || null;

  // Total horas trabalhadas (soma de todos os pares entrada→saida hoje)
  var totalMin = 0;
  Object.keys(presentesSet).forEach(function(fid){
    var b = batsHoje.filter(function(x){return String(x.funcionario_id)===String(fid);});
    var e = b.filter(function(x){return x.tipo==='entrada';}).map(function(x){return new Date(x.horario);});
    var sa = b.filter(function(x){return x.tipo==='saida_almoco';}).map(function(x){return new Date(x.horario);});
    var va = b.filter(function(x){return x.tipo==='volta_almoco';}).map(function(x){return new Date(x.horario);});
    var s = b.filter(function(x){return x.tipo==='saida';}).map(function(x){return new Date(x.horario);});
    if (e[0]){
      var fim = s[0] || new Date();
      var manha = (sa[0] || fim) - e[0];
      var tarde = (va[0] && s[0]) ? (s[0] - va[0]) : 0;
      totalMin += Math.max(0, (manha + tarde) / 60000);
    }
  });
  var totalH = Math.floor(totalMin/60);
  var totalM = Math.floor(totalMin%60);

  var kpis = '<div class="kpi-grid">'+
    '<div class="card kpi"><div class="kpi-icon">👥</div><div class="card-h">Presentes hoje</div><div class="card-v" style="color:var(--accent)">'+presentes+'</div><div class="card-s">de '+ST.funcionarios.length+' funcionários</div></div>'+
    '<div class="card kpi"><div class="kpi-icon">☀️</div><div class="card-h">Primeira entrada</div><div class="card-v">'+hhmm(primeira)+'</div><div class="card-s">'+(primeira?'hoje':'sem registro')+'</div></div>'+
    '<div class="card kpi"><div class="kpi-icon">🌙</div><div class="card-h">Última saída</div><div class="card-v">'+hhmm(ultima)+'</div><div class="card-s">'+(ultima?'hoje':'sem registro')+'</div></div>'+
    '<div class="card kpi"><div class="kpi-icon">⏱️</div><div class="card-h">Total de horas</div><div class="card-v" style="color:var(--green)">'+totalH+'h '+totalM+'m</div><div class="card-s">trabalhadas hoje</div></div>'+
  '</div>';

  // Tabela de batidas de hoje
  var tabela;
  if (!batsHoje.length){
    tabela = '<div class="table-wrap"><div class="empty"><div class="ico">📸</div><h3>Nenhuma batida hoje ainda</h3><p>As batidas aparecem aqui em tempo real.</p></div></div>';
  } else {
    var rows = batsHoje.map(function(b){
      var f = ST.funcionarios.filter(function(x){return String(x.id)===String(b.funcionario_id);})[0] || {nome:'Desconhecido', cargo:''};
      var t = TIPOS.filter(function(x){return x.key===b.tipo;})[0] || {label:b.tipo};
      var av = f.foto_url
        ? '<img class="avatar" src="'+esc(f.foto_url)+'" alt="'+esc(f.nome)+'">'
        : '<span class="avatar-fallback">'+esc(iniciais(f.nome))+'</span>';
      return '<tr>'+
        '<td><div class="func-cell">'+av+'<div><b>'+esc(f.nome)+'</b><div style="font-size:11px;color:var(--text3)">'+esc(f.cargo||'')+'</div></div></div></td>'+
        '<td><span class="tag tag-'+esc(b.tipo)+'">'+esc(t.label)+'</span></td>'+
        '<td style="font-variant-numeric:tabular-nums;font-weight:700">'+hhmm(b.horario)+'</td>'+
        '<td style="font-variant-numeric:tabular-nums;color:var(--green);font-weight:700">'+(b.similaridade!=null?Number(b.similaridade).toFixed(1)+'%':'—')+'</td>'+
      '</tr>';
    }).join('');
    tabela = '<div class="table-wrap">'+
      '<div class="table-h"><h2>Batidas de hoje</h2><span style="font-size:12px;color:var(--text3)">'+batsHoje.length+' registro(s)</span></div>'+
      '<table><thead><tr><th>Funcionário</th><th>Tipo</th><th>Horário</th><th>Similaridade</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table>'+
    '</div>';
  }

  return kpis + tabela;
}

      '<div class="form-row"><label>Cargo *</label><input type="text" id="cadCargo" placeholder="Ex: Vendedora" value="'+esc(ST.cadastro.cargo||'')+'"></div>'+

        '<button class="btn btn-ghost" id="cadAbrir">📷 Abrir câmera</button>'+

function bindCadastro(){
  var video = $('#cadVideo');
  var wrap = $('#cadWrap');
  var msg = $('#cadMsg');
  var btnAbrir = $('#cadAbrir');
  var btnCap = $('#cadCapturar');

  $('#cadNome').addEventListener('input', function(){ ST.cadastro.nome = this.value; });
  $('#cadCargo').addEventListener('input', function(){ ST.cadastro.cargo = this.value; });

  btnAbrir.addEventListener('click', async function(){
    btnAbrir.disabled = true;
    msg.textContent = 'Iniciando câmera...';
    var ok = await iniciarWebcam(video);
    if (ok){
      msg.textContent = 'Alinhe o rosto no oval e clique em Capturar';
      btnCap.disabled = false;
      btnAbrir.textContent = '🔄 Reiniciar câmera';
      btnAbrir.disabled = false;
    } else {
      msg.textContent = 'Erro ao abrir câmera';
      btnAbrir.disabled = false;
    }
  });

  btnCap.addEventListener('click', async function(){
    var nome = ($('#cadNome').value||'').trim();
    var cargo = ($('#cadCargo').value||'').trim();
    if (!nome || !cargo){ toast('Preencha nome e cargo','warn'); return; }
    if (!ST.supabase){ toast('Configure o Supabase primeiro','error'); return; }

    btnCap.disabled = true;
    msg.textContent = 'Detectando rosto...';
    wrap.classList.remove('ok','err');

    var det = await detectarRosto(video);
    if (!det){
      msg.textContent = 'Nenhum rosto detectado. Tente de novo.';
      wrap.classList.add('err');
      btnCap.disabled = false;
      return;
    }

    msg.textContent = 'Salvando foto...';
    try {
      var blob = await capturarBlob(video);
      var url = await uploadFoto(blob, 'cad');
      msg.textContent = 'Salvando cadastro...';
      var { data, error } = await ST.supabase.from('ponto_facial_funcionarios').insert({
        nome: nome,
        cargo: cargo,
        foto_url: url,
        face_descriptor: Array.from(det.descriptor),
        ativo: true
      }).select().single();
      if (error) throw error;

      ST.funcionarios.push(data);
      wrap.classList.add('ok');
      msg.textContent = '✓ Cadastrado com sucesso!';
      toast('Funcionário "'+nome+'" cadastrado ✓','success');
      // Reset
      ST.cadastro = { nome:'', cargo:'', descriptor:null, fotoBlob:null };
      setTimeout(function(){ navegar('funcionarios'); }, 1200);
    } catch(e){
      console.error(e);
      msg.textContent = 'Erro: ' + (e.message||'desconhecido');
      wrap.classList.add('err');
      btnCap.disabled = false;
      toast('Erro ao salvar cadastro','error');
    }
  });
}

      '<div class="tipo-grid" id="pontoTipos">'+tipos+'</div>'+

      '<div style="text-align:center;margin-bottom:12px;color:var(--text3);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">2. Aproxime o rosto</div>'+
      '<div class="webcam-wrap" id="pontoWrap">'+

        '<div class="webcam-overlay"><div class="oval"></div></div>'+

        '<button class="btn btn-ghost" id="pontoAbrir">📷 Abrir câmera</button>'+

      '</div>'+
    '</div>'+
  '</div>';

function bindPonto(){
  var video = $('#pontoVideo');
  var wrap = $('#pontoWrap');
  var msg = $('#pontoMsg');
  var btnAbrir = $('#pontoAbrir');
  var btnBater = $('#pontoBater');

  document.querySelectorAll('#pontoTipos [data-tipo]').forEach(function(b){
    b.addEventListener('click', function(){
      ST.ponto.tipo = this.getAttribute('data-tipo');
      document.querySelectorAll('#pontoTipos [data-tipo]').forEach(function(x){
        x.classList.toggle('on', x.getAttribute('data-tipo')===ST.ponto.tipo);
      });
    });
  });

  btnAbrir.addEventListener('click', async function(){
    btnAbrir.disabled = true;
    msg.textContent = 'Iniciando câmera...';
    var ok = await iniciarWebcam(video);
    if (ok){
      msg.textContent = 'Alinhe o rosto no oval';
      btnBater.disabled = false;
      btnAbrir.textContent = '🔄 Reiniciar câmera';
      btnAbrir.disabled = false;
    } else {
      msg.textContent = 'Erro ao abrir câmera';
      btnAbrir.disabled = false;
    }
  });

  btnBater.addEventListener('click', async function(){
    if (!ST.funcionarios.length){ toast('Cadastre um funcionário primeiro','warn'); return; }

    btnBater.disabled = true;
    wrap.classList.remove('ok','err');
    msg.textContent = 'Detectando rosto...';

    var det = await detectarRosto(video);
    if (!det){
      msg.textContent = 'Nenhum rosto detectado. Aproxime mais.';
      wrap.classList.add('err');
      btnBater.disabled = false;
      return;
    }

    msg.textContent = 'Comparando com cadastros...';
    // Compara com todos os funcionários — pega o mais próximo
    var melhor = null, menorDist = Infinity;
    var d1 = det.descriptor;
    ST.funcionarios.forEach(function(f){
      if (!f.face_descriptor || !f.face_descriptor.length) return;
      var d2 = new Float32Array(f.face_descriptor);
      var dist = faceapi.euclideanDistance(d1, d2);
      if (dist < menorDist){ menorDist = dist; melhor = f; }
    });

    var sim = distanciaParaSimilaridade(menorDist);

    if (!melhor || sim < CONFIG.SIMILARIDADE_MIN){
      wrap.classList.add('err');
      msg.textContent = 'Rosto não reconhecido (similaridade: '+sim.toFixed(1)+'%)';
      mostrarResultado(false, null, sim);
      btnBater.disabled = false;
      return;
    }

    msg.textContent = 'Reconhecido: ' + melhor.nome + ' ('+sim.toFixed(1)+'%)';
    wrap.classList.add('ok');

    // Registra
    try {
      var blob = await capturarBlob(video);
      var url = await uploadFoto(blob, 'pt_'+melhor.id);
      var geo = await getGeo();
      var { data, error } = await ST.supabase.from('ponto_facial_batidas').insert({
        funcionario_id: melhor.id,
        tipo: ST.ponto.tipo,
        horario: new Date().toISOString(),
        foto_url: url,
        similaridade: sim,
        latitude: geo.lat,
        longitude: geo.lng
      }).select().single();
      if (error) throw error;

      ST.batidas.unshift(data);
      mostrarResultado(true, melhor, sim);
      toast('✓ '+melhor.nome+' — '+(TIPOS.filter(function(x){return x.key===ST.ponto.tipo;})[0]||{label:''}).label, 'success');
    } catch(e){
      console.error(e);
      toast('Erro ao registrar: '+(e.message||'desconhecido'),'error');
      btnBater.disabled = false;
    }
  });
}

function mostrarResultado(ok, funcionario, sim){
  var m = document.createElement('div');
  m.className = 'result-modal';
  var tipo = (TIPOS.filter(function(x){return x.key===ST.ponto.tipo;})[0]||{label:''});
  var ico = ok ? '✅' : '❌';
  var titulo = ok ? 'Ponto Registrado' : 'Não Reconhecido';
  var descTx = ok
    ? (funcionario.nome+' — '+tipo.label+' às '+hhmm(new Date().toISOString()))
    : 'Similaridade abaixo do mínimo exigido ('+CONFIG.SIMILARIDADE_MIN+'%). Tente novamente ou cadastre-se.';
  m.innerHTML = '<div class="result-body">'+
    '<div class="result-ico">'+ico+'</div>'+
    '<h3>'+titulo+'</h3>'+
    '<p>'+esc(descTx)+'</p>'+
    '<div class="result-sim">Similaridade calculada<br><b style="color:'+(ok?'var(--green)':'var(--red)')+'">'+sim.toFixed(1)+'%</b></div>'+
    '<button class="btn" id="resFechar">'+(ok?'Concluir':'Tentar de novo')+'</button>'+
  '</div>';
  document.body.appendChild(m);
  document.getElementById('resFechar').addEventListener('click', function(){
    m.parentNode.removeChild(m);
    if (ok){ navegar('dashboard'); } else { $('#pontoBater').disabled = false; }
  });
}

/* Boot */
if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
