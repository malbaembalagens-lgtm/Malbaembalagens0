<style>
/* ============================================================
   MALBA Work OS — ESTILOS
   v1: Fundação · v2: módulo Tarefas. Paleta V13.
   ============================================================ */
:root {
  --u-bg: #F4F6FB; --u-bg2: #EEF1F8; --u-card: #FFFFFF; --u-card2: #FBFCFF;
  --u-border: rgba(15,23,42,.08); --u-border2: rgba(15,23,42,.13); --u-line: rgba(15,23,42,.05);
  --u-text: #0F172A; --u-text2: #5A6884; --u-text3: #94A0B8;
  --u-accent: #3B6FF7; --u-accent-soft: #EAF0FE; --u-accent-2: #6366F1; --u-accent-hover: #2657E0;
  --u-green: #16A34A; --u-green-soft: #E3F6EA; --u-red: #EF4444; --u-red-soft: #FDEBEB;
  --u-amber: #F59E0B; --u-amber-soft: #FEF3DD; --u-purple: #8B5CF6;
  --u-shadow: 0 4px 20px rgba(15,23,42,.07), 0 1px 4px rgba(15,23,42,.04);
  --u-shadow-md: 0 12px 34px rgba(15,23,42,.10);
  --u-shadow-lg: 0 20px 50px rgba(15,23,42,.13);
  --u-glow-blue: 0 8px 24px rgba(59,111,247,.28);
  --u-grad-blue: linear-gradient(135deg, #3B6FF7, #6366F1);
  --u-grad-hero: linear-gradient(120deg, #1a1040, #0d1b4d 45%, #0a2540);
  --u-font-display: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
  --u-font-body: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  --radius: 16px; --radius-sm: 12px;
}
html.dark {
  --u-bg: #0E1525; --u-bg2: #161F30; --u-card: #1A2336; --u-card2: #202B41;
  --u-border: rgba(255,255,255,.09); --u-border2: rgba(255,255,255,.15); --u-line: rgba(255,255,255,.06);
  --u-text: #E8ECF4; --u-text2: #A6B2C8; --u-text3: #6E7C96;
  --u-accent: #5A85FF; --u-accent-soft: rgba(90,133,255,.16); --u-accent-2: #7C7FF5; --u-accent-hover: #7B9DFF;
  --u-green: #22C55E; --u-green-soft: rgba(34,197,94,.16); --u-red: #F87171; --u-red-soft: rgba(248,113,113,.15);
  --u-amber: #FBBF24; --u-amber-soft: rgba(251,191,36,.15); --u-purple: #A78BFA;
  --u-shadow: 0 4px 20px rgba(0,0,0,.40), 0 1px 4px rgba(0,0,0,.30);
  --u-shadow-md: 0 12px 34px rgba(0,0,0,.46);
  --u-shadow-lg: 0 20px 50px rgba(0,0,0,.55);
  --u-glow-blue: 0 8px 24px rgba(90,133,255,.30);
  --u-grad-hero: linear-gradient(120deg, #141033, #0c1638 45%, #0a1c30);
  color-scheme: dark;
}
html.dark .sector-ico { background: color-mix(in srgb, var(--c) 24%, #161F30); }
html.dark .screen-title { color: var(--u-text2); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: var(--u-font-body); background: var(--u-bg); color: var(--u-text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, textarea, select { font-family: inherit; }
svg { width: 1em; height: 1em; display: block; }

.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: auto; background: var(--u-bg); }
.screen::before { content:''; position:absolute; inset:0; z-index:0; pointer-events:none; background:
  radial-gradient(600px 460px at 50% 8%, rgba(59,111,247,.10), transparent 55%),
  radial-gradient(500px 460px at 85% 90%, rgba(139,92,246,.07), transparent 55%); }
.screen::before { content: ''; position: absolute; inset: 0; background: radial-gradient(60% 50% at 20% 10%, rgba(99,102,241,.10), transparent 70%), radial-gradient(50% 50% at 90% 30%, rgba(59,111,247,.10), transparent 70%); pointer-events: none; }
.screen-inner { position: relative; z-index: 1; width: 100%; max-width: 880px; display: flex; flex-direction: column; align-items: center; }
.brand-mark { display: inline-flex; align-items: center; gap: 11px; font-family: var(--u-font-display); }
.brand-1 { font-size: 38px; font-weight: 800; letter-spacing: -1.5px; color: var(--u-text); line-height: 1; }
.brand-2 { font-size: 17px; font-weight: 800; color: #0B1220; letter-spacing: -.2px; background: linear-gradient(135deg, #4F7CFF 0%, #8B5CF6 100%); padding: 7px 16px; border-radius: 999px; line-height: 1; box-shadow: 0 6px 18px rgba(79,124,255,.35); }
.brand-mark-sm .brand-1 { font-size: 19px; letter-spacing: -.8px; }
.brand-mark-sm .brand-2 { font-size: 10px; padding: 4px 9px; box-shadow: 0 4px 10px rgba(79,124,255,.3); }
.brand-mark-sm { gap: 8px; }
.brand-mark-lg .brand-1 { font-size: 44px; }
.brand-mark-lg .brand-2 { font-size: 19px; padding: 8px 18px; }
html.dark .brand-2 { color: #0B1220; }
.screen-title { margin: 30px 0 28px; font-family: var(--u-font-display); font-size: 20px; font-weight: 700; color: var(--u-text2); }
.sector-grid { display: grid; grid-template-columns: repeat(var(--sector-cols, 4), minmax(0, 1fr)); gap: 18px; width: 100%; max-width: calc(var(--sector-cols, 4) * 240px); margin: 0 auto; justify-content: center; }
.sector-card { min-width: 0; }
.sector-card { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 30px 16px; border-radius: 24px; background: var(--u-card); border: 1px solid var(--u-border); box-shadow: var(--u-shadow); transition: transform .25s cubic-bezier(.4,0,.2,1), box-shadow .25s, border-color .25s; }
.sector-card:hover { transform: translateY(-6px); box-shadow: var(--u-shadow-lg); border-color: rgba(59,111,247,.3); }
.sector-ico { width: 84px; height: 84px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--c) 12%, white); color: var(--c); font-size: 36px; transition: all .25s; }
.sector-card:hover .sector-ico { background: var(--c); color: #fff; box-shadow: 0 8px 24px color-mix(in srgb, var(--c) 40%, transparent); transform: scale(1.05); }
.sector-name { font-family: var(--u-font-display); font-size: 16px; font-weight: 700; }
.sector-sub { font-size: 10px; color: var(--u-text3); font-weight: 600; letter-spacing: .6px; text-transform: uppercase; margin-top: -8px; text-align: center; }
.login-inner { max-width: 400px; }
.login-card { width: 100%; background: var(--u-card); border: 1px solid var(--u-border); border-radius: 24px; box-shadow: var(--u-shadow-md); padding: 36px 32px; display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
.login-ico { width: 64px; height: 64px; border-radius: 20px; align-self: center; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--c) 12%, white); color: var(--c); font-size: 28px; margin-bottom: 4px; }
.login-h { font-family: var(--u-font-display); font-size: 24px; font-weight: 800; text-align: center; }
.login-sub { text-align: center; color: var(--u-text2); margin: -8px 0 8px; font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 6px; }

.field input { padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--u-border2); background: var(--u-card2); font-size: 14px; color: var(--u-text); outline: none; transition: border-color .15s, box-shadow .15s; }

/* ===== Splash de abertura (sistema avançado) ===== */
.splash { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; overflow: hidden;
  background: radial-gradient(120% 120% at 50% 0%, #131C32 0%, #0B1220 55%, #070B14 100%);
  animation: splashFadeIn .25s ease both; }
.splash.out { animation: splashOut .5s cubic-bezier(.6,0,.2,1) both; }
.splash-grid { position: absolute; inset: -2px; opacity: .35;
  background-image: linear-gradient(rgba(79,124,255,.10) 1px, transparent 1px), linear-gradient(90deg, rgba(79,124,255,.10) 1px, transparent 1px);
  background-size: 38px 38px; mask-image: radial-gradient(60% 60% at 50% 45%, #000 30%, transparent 75%); -webkit-mask-image: radial-gradient(60% 60% at 50% 45%, #000 30%, transparent 75%);
  animation: splashGrid 2.4s linear both; }
.splash-c { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.splash-tile { position: relative; width: 104px; height: 104px; border-radius: 28px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #4F7CFF 0%, #8B5CF6 100%); box-shadow: 0 20px 60px rgba(79,124,255,.5), 0 0 0 1px rgba(255,255,255,.12) inset;
  animation: tileIn .7s cubic-bezier(.2,.9,.2,1.1) both; overflow: hidden; }
.splash-tile b { font-family: var(--u-font-display); font-size: 58px; font-weight: 800; color: #0B1220; line-height: 1; }
.splash-tile::after { content: ''; position: absolute; top: 0; left: -120%; width: 70%; height: 100%; transform: skewX(-18deg);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: tileSweep 1.5s ease .55s both; }
.splash-ring { position: absolute; inset: 0; border-radius: 28px; border: 2px solid rgba(124,156,255,.7); animation: ringPulse 1.7s ease-out .35s infinite; }
.splash-ring.r2 { animation-delay: .95s; }
.splash-word { animation: riseUp .6s ease .45s both; }
.splash-word .brand-1 { color: #fff; }
.splash-bar { width: 220px; height: 5px; border-radius: 99px; background: rgba(255,255,255,.10); overflow: hidden; animation: riseUp .5s ease .5s both; }
.splash-bar span { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #4F7CFF, #8B5CF6); box-shadow: 0 0 12px rgba(124,156,255,.8); animation: barFill 1.9s cubic-bezier(.5,0,.1,1) .25s both; }
.splash-status { font-family: var(--u-font-body); font-size: 12.5px; font-weight: 600; letter-spacing: .3px; color: #8FA2C9; animation: riseUp .5s ease .55s both; }
@keyframes splashFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes splashOut { to { opacity: 0; transform: scale(1.06); filter: blur(3px); } }
@keyframes splashGrid { from { opacity: 0; transform: scale(1.08); } 30% { opacity: .35; } to { opacity: .2; transform: scale(1); } }
@keyframes tileIn { 0% { opacity: 0; transform: scale(.55) rotate(-12deg); } 60% { opacity: 1; } 100% { opacity: 1; transform: scale(1) rotate(0); } }
@keyframes tileSweep { 0% { left: -120%; } 100% { left: 140%; } }
@keyframes ringPulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(2.1); opacity: 0; } }
@keyframes riseUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes barFill { 0% { width: 0; } 70% { width: 82%; } 100% { width: 100%; } }
@media (prefers-reduced-motion: reduce) { .splash, .splash * { animation-duration: .01ms !important; } }

.cmdk-empty { padding: 26px; text-align: center; color: var(--u-text3); font-size: 14px; }
.sh-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
.sh-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 6px; border-bottom: 1px solid var(--u-line); }

.sh-desc { font-size: 14px; color: var(--u-text2); }
.sh-keys { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.sh-plus { color: var(--u-text3); font-size: 12px; }
.sh-list kbd { font-family: var(--u-font-body); font-size: 11.5px; font-weight: 700; color: var(--u-text2); background: var(--u-bg2); border: 1px solid var(--u-border2); border-bottom-width: 2px; border-radius: 6px; padding: 3px 8px; min-width: 24px; text-align: center; }
@media (max-width: 600px) { .ts-kbd { display: none; } }
.top-novo svg { font-size: 16px; }
@media (max-width: 720px) { .top-online span { display: none; } .top-search input { width: 110px; } }
.top-spacer { flex: 1; min-width: 0;}
.icon-btn { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: var(--u-text2); background: var(--u-bg2); font-size: 18px; }
.content { padding: 24px; flex: 1; min-width: 0;}

.dash-hero { background: var(--u-grad-hero); border-radius: var(--radius); padding: 28px 30px; color: #fff; margin-bottom: 22px; position: relative; overflow: hidden; }
.dash-hero::after { content:''; position:absolute; right:-40px; top:-40px; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, rgba(99,102,241,.5), transparent 70%); }
.dash-hero h2 { font-family: var(--u-font-display); font-size: 24px; font-weight: 800; margin-bottom: 4px; position: relative; }
.dash-hero p { opacity: .9; font-size: 14px; position: relative; }
/* hero premium (igual ao site no ar) */
.dash-hero.hero-pro::after { content:''; position:absolute; inset:0; background:
  radial-gradient(600px 320px at 82% 18%, rgba(139,92,246,.45), transparent 60%),
  radial-gradient(520px 420px at 12% 88%, rgba(56,189,248,.32), transparent 55%);
  width:auto; height:auto; border-radius:0; top:0; right:0; }
.hero-grid { position:absolute; inset:0; opacity:.4;
  background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); }
.hero-c { position: relative; z-index: 2; }
.hero-tag { display:inline-flex; align-items:center; gap:7px; padding:6px 14px; border-radius:100px; background:rgba(56,189,248,.15); color:#38BDF8; border:1px solid rgba(56,189,248,.3); font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; margin-bottom:14px; }
.hero-tag::before { content:''; width:6px; height:6px; border-radius:50%; background:#38BDF8; box-shadow:0 0 8px #38BDF8; }
.dash-hero.hero-pro h2 { font-size: 28px; }
.hero-name { background: linear-gradient(90deg,#5b8bff,#a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
.dash-sec-h { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 14px; }
.dash-sec-h h3 { font-family: var(--u-font-display); font-size: 22px; font-weight: 800; }
.dash-sec-h span { font-size: 13px; color: var(--u-text3); font-weight: 600; text-transform: capitalize; }
.dash-sec-spacer { flex: 1; min-width: 0;}
.dash-sec-h .task-filter { text-transform: none; }
.stat-pro { background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius); box-shadow: var(--u-shadow); padding: 18px 18px 0; overflow: hidden; position: relative; transition: transform .12s, box-shadow .12s; }
.stat-pro:hover { transform: translateY(-2px); box-shadow: var(--u-shadow-md); }
.stat-pro-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.stat-pro-l { font-size: 13px; color: var(--u-text2); font-weight: 600; }
.stat-pro-v { font-family: var(--u-font-display); font-size: 30px; font-weight: 800; line-height: 1.1; margin-top: 2px; }
.stat-pro-sub { font-size: 12px; font-weight: 700; margin-top: 5px; }
.stat-pro-bar { height: 7px; border-radius: 20px; background: var(--u-bg2); overflow: hidden; margin: 12px 0 18px; }
.stat-pro-bar span { display: block; height: 100%; border-radius: 20px; transition: width .6s; }
.stat-pro-ico { width: 44px; height: 44px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stat-pro-ico svg { font-size: 22px; }
.stat-spark { display: block; width: calc(100% + 36px); height: 34px; margin: 10px -18px 0; }

/* ===== Painéis interativos do Início ===== */
.dash-grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 18px; }
.dash-panel { background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius); box-shadow: var(--u-shadow); padding: 18px 20px; margin-top: 16px; }
.dash-grid2 .dash-panel { margin-top: 0; }
.dash-panel-h { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
.dash-panel-h svg { font-size: 18px; color: var(--u-accent); }
.dash-panel-h h3 { font-family: var(--u-font-display); font-size: 15px; font-weight: 800; flex: 1; min-width: 0;}
.dash-panel-act { font-size: 12px; font-weight: 700; color: var(--u-accent); padding: 4px 8px; border-radius: 8px; }
.dash-panel-act:hover { background: var(--u-accent-soft); }
.dash-panel-b { display: flex; flex-direction: column; gap: 4px; }
.dash-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 10px; transition: background .1s; }
.dash-row:hover { background: var(--u-bg2); }
.dr-prio { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dr-av { width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 10px; }
.dr-l { flex: 1; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dr-date { font-size: 11.5px; color: var(--u-text3); font-weight: 600; flex-shrink: 0; }
.dr-date.late { color: var(--u-red); }
.dr-s { font-size: 11.5px; color: var(--u-text3); font-weight: 600; flex-shrink: 0; }
.dash-empty { font-size: 13px; color: var(--u-text3); padding: 16px 8px; text-align: center; }
.dash-goal { padding: 8px 10px; }
.dg-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.dg-top b { color: var(--u-accent); }
.dg-bar { height: 7px; border-radius: 20px; background: var(--u-bg2); overflow: hidden; }
.dg-bar span { display: block; height: 100%; border-radius: 20px; background: var(--u-accent); transition: width .5s; }
.dash-projs { display: flex; flex-direction: column; gap: 10px; }
.dash-proj { width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; background: var(--u-bg2); transition: transform .1s; }
.dash-proj:hover { transform: translateX(2px); }
.dp-top { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.dp-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.dp-n { flex: 1; font-size: 13.5px; font-weight: 700; min-width: 0;}
.dp-top b { font-size: 12.5px; color: var(--u-text2); }
@media (max-width: 760px) { .dash-grid2 { grid-template-columns: minmax(0, 1fr); } }
.dash-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 14px; margin-bottom: 22px; }
.stat-card { background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--u-shadow); }
.stat-card .stat-top { display: flex; align-items: center; gap: 8px; color: var(--u-text2); font-size: 12.5px; font-weight: 600; margin-bottom: 8px; }
.stat-card .stat-dot { width: 9px; height: 9px; border-radius: 50%; }
.stat-card .stat-num { font-family: var(--u-font-display); font-size: 30px; font-weight: 800; }

/* KPIs */
.kpi-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.kpi-store { padding: 8px 12px; border-radius: 11px; border: 1px solid var(--u-border); background: var(--u-card); color: var(--u-text); font-size: 13px; font-weight: 600; font-family: var(--u-font-body); cursor: pointer; }
.kpi-seg { display: inline-flex; background: var(--u-bg2); border: 1px solid var(--u-border); border-radius: 11px; padding: 3px; gap: 2px; }
.kpi-seg-b { padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--u-text2); transition: all .12s; }
.kpi-seg-b.on { background: var(--u-card); color: var(--u-accent); box-shadow: var(--u-shadow); }
.kpi-bars { display: flex; align-items: flex-end; gap: 6px; height: 200px; padding: 8px 2px 0; overflow-x: auto; }
.kpi-bar { flex: 1; min-width: 22px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
.kpi-bar-fill { width: 70%; max-width: 34px; min-height: 2px; background: linear-gradient(180deg, #6E9BFF, #3B6FF7); border-radius: 6px 6px 3px 3px; transition: height .3s; }
.kpi-bar-fill.today { background: linear-gradient(180deg, #34D399, #16A34A); }
.kpi-bar-x { font-size: 10px; color: var(--u-text3); font-weight: 600; white-space: nowrap; }
.kpi-srow { display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-bottom: 1px solid var(--u-border); }
.kpi-srow:last-child { border-bottom: none; }
button.kpi-srow { width: 100%; background: transparent; border-top: none; border-left: none; border-right: none; cursor: pointer; text-align: left; transition: background .12s; border-radius: 8px; }
button.kpi-srow:hover { background: var(--u-bg2); }
.kpi-medal { width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.kpi-pos { width: 24px; flex-shrink: 0; text-align: center; font-size: 12px; font-weight: 800; color: var(--u-text3); }
.kpi-srow-n { font-weight: 700; font-size: 14px; flex: 1; min-width: 0;}
.kpi-srow-mid { display: flex; flex-direction: column; align-items: flex-end; min-width: 150px; }
.kpi-srow-v { font-family: var(--u-font-display); font-weight: 800; font-size: 16px; color: var(--u-accent); }
.kpi-srow-s { font-size: 11.5px; color: var(--u-text3); }
.kpi-srow-meta { display: flex; align-items: center; gap: 8px; min-width: 130px; justify-content: flex-end; }
.kpi-meta-bar { width: 70px; height: 7px; background: var(--u-bg2); border-radius: 20px; overflow: hidden; }
.kpi-meta-bar span { display: block; height: 100%; background: var(--u-green); border-radius: 20px; }
.kpi-meta-pct { font-size: 12px; font-weight: 800; color: var(--u-green); min-width: 34px; text-align: right; }
.kpi-meta-none { font-size: 11px; color: var(--u-text3); font-weight: 600; }
.metas-resumo { background: var(--u-card); border: 1px solid var(--u-border); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; }
.mr-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.mr-top span { font-size: 14px; font-weight: 700; color: var(--u-text2); }
.mr-top b { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 800; color: var(--u-green); }
.mr-bar { height: 12px; background: var(--u-bg2); border-radius: 20px; overflow: hidden; }
.mr-bar span { display: block; height: 100%; background: linear-gradient(90deg,#16A34A,#22C55E); border-radius: 20px; }
.mr-sub { margin-top: 8px; font-size: 12.5px; color: var(--u-text3); font-weight: 600; }
/* Mural de avisos */
.mural { background: linear-gradient(135deg, var(--u-accent-soft), var(--u-card)); border: 1px solid var(--u-border); border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; }
.mural-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.mural-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; color: var(--u-text); }
.mural-title svg { font-size: 17px; color: var(--u-accent); }
.mural-add { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 10px; background: var(--u-accent); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; border: none; }
.mural-add svg { font-size: 15px; }
.mural-add:hover { filter: brightness(1.05); }
.mural-list { display: flex; flex-direction: column; gap: 8px; }
.mural-item { display: flex; align-items: flex-start; gap: 11px; background: var(--u-card); border: 1px solid var(--u-border); border-radius: 12px; padding: 11px 13px; }
.mural-ic { width: 30px; height: 30px; flex-shrink: 0; border-radius: 9px; background: var(--u-accent-soft); color: var(--u-accent); display: flex; align-items: center; justify-content: center; }
.mural-ic svg { font-size: 15px; }
.mural-body { flex: 1; min-width: 0;}
.mural-msg { font-size: 13.5px; color: var(--u-text); font-weight: 600; line-height: 1.4; white-space: pre-wrap; }
.mural-meta { margin-top: 3px; font-size: 11.5px; color: var(--u-text3); font-weight: 600; }
.mural-del { width: 24px; height: 24px; flex-shrink: 0; border-radius: 7px; background: transparent; color: var(--u-text3); font-size: 12px; cursor: pointer; border: none; }
.mural-del:hover { background: var(--u-red-soft); color: var(--u-red); }
.mural-empty { font-size: 12.5px; color: var(--u-text2); padding: 4px 2px; }
@media (max-width: 700px){ .kpi-srow-mid, .kpi-srow-s { min-width: 0; } .kpi-srow-meta { min-width: 0; } .kpi-meta-bar { width: 44px; } }

.tasks-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
.tasks-head h2 { font-family: var(--u-font-display); font-size: 20px; font-weight: 800; }
.tasks-head .sub { color: var(--u-text2); font-size: 13px; margin-top: 2px; }
.btn-new { display: flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: var(--radius-sm); background: var(--u-grad-blue); color: #fff; font-weight: 700; font-size: 14px; box-shadow: var(--u-glow-blue); }
.btn-new:hover { filter: brightness(1.05); transform: translateY(-1px); }
.btn-new svg { font-size: 17px; }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.board-hint { font-size: 12.5px; color: var(--u-text3); background: var(--u-bg2); border: 1px solid var(--u-border); border-radius: 10px; padding: 9px 13px; margin-bottom: 14px; }
.col { background: var(--u-bg2); border-radius: var(--radius); padding: 14px; min-height: 200px; }
.col-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 0 4px; }
.col-dot { width: 10px; height: 10px; border-radius: 50%; }
.col-title { font-weight: 700; font-size: 13.5px; }
.col-count { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--u-text3); background: var(--u-card); padding: 1px 9px; border-radius: 20px; }
.task-card { background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius-sm); padding: 13px 14px; margin-bottom: 10px; box-shadow: var(--u-shadow); cursor: pointer; transition: transform .12s, box-shadow .12s; }
.task-card:hover { transform: translateY(-2px); box-shadow: var(--u-shadow-md); }
.task-card .tc-top { display: flex; align-items: flex-start; gap: 8px; }
.task-card .tc-prio { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.task-card .tc-title { font-weight: 600; font-size: 13.5px; line-height: 1.35; flex: 1; min-width: 0;}
.task-card .tc-meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.tc-chip { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: var(--u-bg2); color: var(--u-text2); }
.tc-date { font-size: 11.5px; color: var(--u-text3); font-weight: 600; display: flex; align-items: center; gap: 4px; }
.tc-date svg { font-size: 13px; }
.tc-date.late { color: var(--u-red); }
.tc-late { font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 20px; background: var(--u-red-soft); color: var(--u-red); }
.rec-manage { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; background: var(--u-accent-soft); border-radius: 12px; padding: 8px 12px; margin: 2px 0 6px; }
.rec-manage-l { font-size: 12.5px; font-weight: 700; color: var(--u-accent); }
.rec-manage-btns { display: flex; gap: 6px; }
.rec-mini { padding: 5px 10px !important; font-size: 12px !important; }
.tc-av { margin-left: auto; width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #fff; }
.tc-rec { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 20px; background: var(--u-accent-soft); color: var(--u-accent); }
.tc-done { margin-top: 10px; width: 100%; padding: 7px; border-radius: 8px; background: var(--u-green-soft); color: var(--u-green); font-size: 12px; font-weight: 700; transition: all .12s; }
.tc-done:hover { background: var(--u-green); color: #fff; }
.col-empty { text-align: center; color: var(--u-text3); font-size: 12.5px; padding: 24px 8px; }

/* drag & drop */
.task-card[draggable="true"] { cursor: grab; }
.task-card[draggable="true"]:active { cursor: grabbing; }
.task-card.dragging { opacity: .45; transform: rotate(1.5deg) scale(.98); }
.col.drag-over { outline: 2px dashed var(--u-accent); outline-offset: -4px; background: var(--u-accent-soft); }
.col-body { min-height: 60px; }
/* grupos por data dentro de "A fazer" */
.grp { display: flex; align-items: center; gap: 8px; margin: 16px 4px 8px; }
.grp:first-child { margin-top: 2px; }
.grp-l { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--u-text3); }
.grp-n { font-size: 10px; font-weight: 800; color: var(--u-text3); background: var(--u-card); border: 1px solid var(--u-border); border-radius: 20px; padding: 1px 7px; }
.grp-late .grp-l, .grp-late .grp-n { color: var(--u-red); }
.grp-rot .grp-l, .grp-rot .grp-n { color: var(--u-accent); }
.rh-card { background: var(--u-card); border: 1px solid var(--u-border); border-radius: 16px; padding: 14px 16px; margin: 14px 0 18px; box-shadow: var(--u-shadow); }
.rh-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rh-title { font-family: var(--u-font-display); font-size: 16px; font-weight: 800; }
.rh-btn { font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 20px; background: var(--u-accent-soft); color: var(--u-accent); transition: all .12s; }
.rh-btn:hover { background: var(--u-accent); color: #fff; transform: translateY(-1px); }
.rh-stats { font-size: 13px; color: var(--u-text2); margin: 9px 0 8px; }
.rh-bar { height: 9px; border-radius: 20px; background: var(--u-bg2); overflow: hidden; }
.rh-bar span { display: block; height: 100%; border-radius: 20px; transition: width .3s ease; }
.rh-done { margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--u-green); }
/* etiqueta de origem (projeto / campanha) */
.tc-src { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 7px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tc-src-proj { background: rgba(251,140,0,.14); color: #C2410C; }
.tc-src-camp { background: rgba(139,92,246,.14); color: #7C3AED; }
html.dark .tc-src-proj { color: #FDBA74; }
html.dark .tc-src-camp { color: #C4B5FD; }
/* filtro de responsável */
.task-filter { height: 36px; border: 1px solid var(--u-border); border-radius: var(--radius-sm); background: var(--u-card); color: var(--u-text); font-size: 13px; font-weight: 600; padding: 0 12px; cursor: pointer; }

/* ===== Equipe ===== */
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 14px; }
.member-card { display: flex; align-items: center; gap: 13px; background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--u-shadow); cursor: pointer; transition: transform .12s, box-shadow .12s; }
.member-card:hover { transform: translateY(-2px); box-shadow: var(--u-shadow-md); }
.member-card.off { opacity: .55; }
.member-av { width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 16px; }
.member-info { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
.member-info b { font-size: 14.5px; font-weight: 700; }
.member-info i { font-style: normal; font-size: 12px; color: var(--u-text2); }
.member-info small { font-size: 11.5px; color: var(--u-text3); margin-top: 2px; }
.member-card.has-alert { border-color: rgba(245,158,11,.4); }
/* barra de filtros da equipe */
.team-bar { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.team-search { display:flex; align-items:center; gap:8px; background:var(--u-bg2); border:1px solid var(--u-border); border-radius:12px; padding:9px 13px; flex:1; min-width:180px; max-width:340px; color:var(--u-text3); }
.team-search svg { width:17px; height:17px; flex-shrink:0; }
.team-search input { border:none; background:none; outline:none; font-size:13.5px; color:var(--u-text); width:100%; }
.team-seg { display:inline-flex; background:var(--u-bg2); border:1px solid var(--u-border); border-radius:10px; padding:3px; }
.team-seg button { padding:6px 14px; border-radius:8px; font-size:12.5px; font-weight:700; color:var(--u-text2); cursor:pointer; border:none; background:none; }
.team-seg button.on { background:var(--u-card); color:var(--u-accent); box-shadow:var(--u-shadow); }
/* pendências */
.team-pend { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px; padding:10px 12px; background:var(--u-bg2); border-radius:12px; }
.team-pend-l { font-size:12px; font-weight:800; color:var(--u-text3); text-transform:uppercase; letter-spacing:.4px; margin-right:2px; }
.team-pchip { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; color:var(--u-text); background:var(--u-card); border:1px solid var(--u-border); border-radius:20px; padding:6px 12px; cursor:pointer; transition:.12s; }
.team-pchip .tpc-dot { width:8px; height:8px; border-radius:50%; background:var(--pc,#888); }
.team-pchip b { color:var(--pc); }
.team-pchip.on { border-color:var(--pc); box-shadow:0 0 0 2px color-mix(in srgb, var(--pc) 20%, transparent); }
.team-pchip.clear { color:var(--u-text3); font-weight:600; }
/* status nos cartões */
.mc-status { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:7px; }
.mc-status > span { display:inline-flex; align-items:center; gap:3px; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; }
.mc-status svg { width:11px; height:11px; }
.mc-acc.on { color:#16A34A; background:rgba(22,163,74,.12); }
.mc-acc.off { color:var(--u-text3); background:var(--u-bg2); }
.mc-meta { background:var(--u-accent-soft); }
.mc-alert { color:#EF4444; background:rgba(239,68,68,.12); }
.mc-req { color:#3B6FF7; background:var(--u-accent-soft); }
/* ===== Ficha 360 ===== */
.fi-modal { max-width: 580px; }
.fi-head { display:flex; align-items:center; gap:13px; margin-bottom:16px; }
.fi-av { width:52px; height:52px; border-radius:15px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:19px; }
.fi-id { flex:1; min-width:0; } .fi-id b { font-family:var(--u-font-display); font-size:19px; display:block; } .fi-id i { font-style:normal; font-size:13px; color:var(--u-text3); }
.fi-sit { font-size:11px; font-weight:800; padding:4px 10px; border-radius:20px; }
.fi-sit.on { color:#16A34A; background:rgba(22,163,74,.12); } .fi-sit.off { color:var(--u-text3); background:var(--u-bg2); }
.fi-edit { width:36px; height:36px; border-radius:10px; background:var(--u-bg2); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.fi-edit svg { width:17px; height:17px; color:var(--u-text2); }
.fi-kpis { display:grid; grid-template-columns:repeat(4,minmax(0, 1fr)); gap:10px; margin-bottom:18px; }
.fi-kpi { background:var(--u-bg2); border-radius:13px; padding:12px 10px; text-align:center; display:flex; flex-direction:column; gap:3px; }
.fi-kpi-v { font-family:var(--u-font-display); font-size:21px; font-weight:800; line-height:1.1; }
.fi-kpi-l { font-size:11px; font-weight:700; color:var(--u-text2); }
.fi-kpi-s { font-size:10px; color:var(--u-text3); }
.fi-sec { border-top:1px solid var(--u-border); padding-top:16px; margin-top:16px; }
.fi-sec-h { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
.fi-sec-h > span { display:inline-flex; align-items:center; gap:8px; font-family:var(--u-font-display); font-size:14px; font-weight:700; }
.fi-sec-h svg { width:17px; height:17px; color:var(--u-accent); }
.fi-link { font-size:12.5px; font-weight:700; color:var(--u-accent); background:var(--u-accent-soft); border:none; border-radius:8px; padding:6px 12px; cursor:pointer; }
.fi-link:hover { background:var(--u-accent); color:#fff; }
.fi-link.danger { color:var(--u-red); background:var(--u-red-soft); }
.fi-link.danger:hover { background:var(--u-red); color:#fff; }
.fi-empty { font-size:13px; color:var(--u-text3); padding:6px 0; }
.fi-acc { }
.fi-acc-top { display:flex; align-items:flex-start; gap:11px; }
.fi-acc-ic { width:38px; height:38px; border-radius:11px; background:var(--u-bg2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.fi-acc-ic svg { width:19px; height:19px; color:var(--u-text3); }
.fi-acc-ic.ok { background:rgba(22,163,74,.12); } .fi-acc-ic.ok svg { color:#16A34A; }
.fi-acc-tx b { font-size:14px; } .fi-acc-tx i { display:block; font-style:normal; font-size:12px; color:var(--u-text3); margin-top:1px; }
.fi-acc-actions { display:flex; gap:8px; margin-top:12px; }
.fi-acc-reset { display:flex; gap:8px; margin-top:12px; }
.fi-acc-reset input { flex:1; min-width: 0;}
.fi-acc-form { margin-top:12px; }
.fi-acc-form-row { display:flex; gap:8px; align-items:center; margin-top:2px; }
.fi-acc-form-row select { flex:1; min-width: 0;}
.fi-meta-bar { height:12px; background:var(--u-bg2); border-radius:20px; overflow:hidden; }
.fi-meta-bar span { display:block; height:100%; border-radius:20px; }
.fi-meta-sub { margin-top:8px; font-size:12.5px; color:var(--u-text3); font-weight:600; }
.fi-coms, .fi-reqs { display:flex; flex-direction:column; gap:7px; }
.fi-com { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; background:var(--u-bg2); border-radius:10px; font-size:13px; }
.fi-com b { font-family:var(--u-font-display); }
.fi-req { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; background:var(--u-bg2); border-radius:10px; }
.fi-req-main { display:flex; flex-direction:column; gap:2px; min-width:0; } .fi-req-main b { font-size:13px; } .fi-req-main span { font-size:12px; color:var(--u-text2); }
.fi-req-act { display:flex; gap:6px; flex-shrink:0; }
/* abas da ficha */
.fi-tabs { display:flex; gap:4px; background:var(--u-bg2); border-radius:11px; padding:4px; margin-bottom:16px; }
.fi-tab { flex:1; padding:9px 12px; border-radius:8px; font-size:13px; font-weight:700; color:var(--u-text2); cursor:pointer; border:none; background:none; min-width: 0;}
.fi-tab.on { background:var(--u-card); color:var(--u-accent); box-shadow:var(--u-shadow); }
.fi-sec.first { border-top:none; padding-top:0; margin-top:0; }
.fi-badge { font-size:11px; font-weight:700; color:var(--u-text2); background:var(--u-bg2); padding:4px 10px; border-radius:20px; }
/* acompanhamento: presença / notas / kudos */
.fi-checkins { display:flex; flex-direction:column; gap:6px; }
.fi-ck { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; background:var(--u-bg2); border-radius:10px; }
.fi-ck-d { font-size:12.5px; font-weight:700; }
.fi-ck-t { font-size:12px; color:var(--u-text2); }
.fi-add { display:flex; gap:8px; align-items:flex-start; margin-bottom:12px; }
.fi-add textarea { flex:1; min-height:52px; min-width: 0;}
.fi-add input[type=text] { flex:1; min-width: 0;}
.fi-add .btn { flex-shrink:0; align-self:stretch; }
.fi-notas { display:flex; flex-direction:column; gap:8px; }
.fi-nota { background:var(--u-bg2); border-radius:10px; padding:11px 13px; border-left:3px solid var(--u-accent); }
.fi-nota-h { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
.fi-nota-h b { font-size:12.5px; } .fi-nota-h span { font-size:11px; color:var(--u-text3); }
.fi-nota p { margin:0; font-size:13px; color:var(--u-text); line-height:1.5; white-space:pre-wrap; }
.fi-kudos { display:flex; flex-direction:column; gap:8px; }
.fi-kudo { background:linear-gradient(135deg, rgba(245,158,11,.1), rgba(139,92,246,.08)); border-radius:10px; padding:11px 13px; }
.fi-kudo .fk-msg { display:block; font-size:13.5px; color:var(--u-text); font-weight:600; }
.fi-kudo .fk-from { display:block; font-size:11.5px; color:var(--u-text3); margin-top:4px; }
/* Meu Dia: check-in */
.cab-checkin { display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius:16px; margin-bottom:16px; background:var(--u-card); border:1px solid var(--u-border); box-shadow:0 10px 24px -16px rgba(15,23,42,.3); }
.cab-checkin.on { background:linear-gradient(135deg, rgba(59,111,247,.1), rgba(22,163,74,.08)); border-color:rgba(59,111,247,.25); }
.cab-checkin.done { background:var(--u-green-soft); border-color:rgba(22,163,74,.25); }
.cci-info { flex:1; min-width:0; } .cci-info b { font-family:var(--u-font-display); font-size:16px; display:block; } .cci-info i { font-style:normal; font-size:12.5px; color:var(--u-text3); }
.cci-btn { flex-shrink:0; height:44px; padding:0 22px; border-radius:12px; font-size:14px; font-weight:800; cursor:pointer; border:none; color:#fff; }
.cci-btn.in { background:var(--u-accent); } .cci-btn.in:hover { filter:brightness(1.05); }
.cci-btn.out { background:var(--u-green); } .cci-btn.out:hover { filter:brightness(1.05); }
.cci-check { width:44px; height:44px; border-radius:12px; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; } .cci-check svg { width:22px; height:22px; color:var(--u-green); }
/* Meu Dia: kudos */
.cab-kudos { display:flex; flex-direction:column; gap:8px; }
.cab-kudo { background:linear-gradient(135deg, rgba(245,158,11,.12), rgba(139,92,246,.08)); border-radius:12px; padding:12px 14px; }
.cab-kudo .ck-msg { display:block; font-size:14px; font-weight:600; color:var(--u-text); }
.cab-kudo .ck-from { display:block; font-size:12px; color:var(--u-text3); margin-top:4px; }
/* comissões no painel pessoal */
.cab-coms { display:flex; flex-direction:column; gap:7px; }
.cab-com { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; background:var(--u-bg2); border-radius:10px; font-size:13px; }
.cab-com b { font-family:var(--u-font-display); }
.cab-com-l { color:var(--u-text2); font-weight:600; }
/* ===== Ponto (roster da loja) ===== */
.ponto-list { display:flex; flex-direction:column; gap:10px; max-width:640px; }
.ponto-row { display:flex; align-items:center; gap:13px; background:var(--u-card); border:1px solid var(--u-border); border-radius:14px; padding:12px 16px; box-shadow:var(--u-shadow); }
.pt-av { width:44px; height:44px; border-radius:13px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:15px; }
.pt-info { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.pt-info b { font-size:15px; }
.pt-status { font-size:12.5px; font-weight:600; }
.pt-status.none { color:var(--u-text3); } .pt-status.in { color:var(--u-accent); } .pt-status.done { color:#16A34A; }
.pt-btn { flex-shrink:0; height:42px; padding:0 22px; border-radius:12px; font-size:14px; font-weight:800; cursor:pointer; border:none; color:#fff; }
.pt-btn.in { background:var(--u-accent); } .pt-btn.in:hover { filter:brightness(1.06); }
.pt-btn.out { background:var(--u-green); } .pt-btn.out:hover { filter:brightness(1.06); }
.pt-done { width:42px; height:42px; border-radius:12px; background:var(--u-green-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; } .pt-done svg { width:20px; height:20px; color:var(--u-green); }
/* ===== Painel da loja ===== */
.loja-hero { background: radial-gradient(900px 320px at 88% -40%, #24406e 0%, #16233f 55%, #0E1A33 100%); color:#fff; border-radius:20px; padding:24px 28px; margin-bottom:16px; }
.lh-badge { display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:800; letter-spacing:1.2px; color:#9DB4FF; background:rgba(123,160,255,.14); border:1px solid rgba(123,160,255,.28); padding:5px 11px; border-radius:30px; }
.lh-badge .dot { width:7px; height:7px; border-radius:50%; background:#3BE38B; }
.lh-title { font-family:var(--u-font-display); font-size:26px; font-weight:800; margin:12px 0 4px; }
.lh-title span { background:linear-gradient(90deg,#7AA0FF,#C7B4FF); -webkit-background-clip:text; background-clip:text; color:transparent; }
.lh-sub { color:#b9c6e6; font-size:14px; margin:0; text-transform:capitalize; }
.lp-kpis { display:grid; grid-template-columns:repeat(4,minmax(0, 1fr)); gap:12px; margin-bottom:18px; }
.lp-kpi { background:var(--u-card); border:1px solid var(--u-border); border-radius:15px; padding:15px 14px; display:flex; flex-direction:column; gap:3px; box-shadow:var(--u-shadow); }
.lp-kpi-v { font-family:var(--u-font-display); font-size:24px; font-weight:800; line-height:1.1; }
.lp-kpi-l { font-size:12px; font-weight:700; color:var(--u-text2); }
.lp-kpi-s { font-size:11px; color:var(--u-text3); }
.lp-pres { display:flex; flex-wrap:wrap; gap:10px; }
.lp-pres-av { position:relative; opacity:.4; filter:grayscale(.6); }
.lp-pres-av span { width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:15px; }
.lp-pres-av.on { opacity:1; filter:none; }
.lp-pres-av.out { opacity:.7; }
.lp-pres-av .lp-dot { position:absolute; right:-2px; bottom:-2px; width:13px; height:13px; border-radius:50%; background:#16A34A; border:2.5px solid var(--u-card); }
.lp-meta-bar { height:14px; background:var(--u-bg2); border-radius:20px; overflow:hidden; }
.lp-meta-bar span { display:block; height:100%; border-radius:20px; }
.lp-meta-sub { margin-top:9px; font-size:13px; color:var(--u-text3); font-weight:600; }
@media (max-width: 620px){ .lp-kpis { grid-template-columns:repeat(2,minmax(0, 1fr)); } }
/* ===== Ficha do cliente (CRM) ===== */
.clf-modal { max-width: 500px; }
.clf-head { display:flex; align-items:center; gap:13px; margin-bottom:16px; }
.clf-av { width:50px; height:50px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--u-accent); color:#fff; font-weight:800; font-size:18px; }
.clf-id { flex:1; min-width:0; } .clf-id b { font-family:var(--u-font-display); font-size:18px; display:block; } .clf-id i { font-style:normal; font-size:12.5px; color:var(--u-text3); }
.clf-actions { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(120px, 100%), 1fr)); gap:10px; margin-bottom:16px; }
.clf-act { display:inline-flex; align-items:center; justify-content:center; gap:7px; height:44px; border-radius:12px; font-size:13.5px; font-weight:700; cursor:pointer; border:none; text-decoration:none; }
.clf-act svg { width:17px; height:17px; }
.clf-act.wa { background:#25D366; color:#fff; }
.clf-act.call { background:var(--u-accent-soft); color:var(--u-accent); }
.clf-act.buy { background:var(--u-green-soft); color:var(--u-green); }
.clf-act.wa:hover { filter:brightness(1.05); } .clf-act.call:hover { background:var(--u-accent); color:#fff; } .clf-act.buy:hover { background:var(--u-green); color:#fff; }
.clf-kpis { display:grid; grid-template-columns:repeat(3,minmax(0, 1fr)); gap:10px; margin-bottom:16px; }
.clf-kpi { background:var(--u-bg2); border-radius:12px; padding:13px 10px; text-align:center; }
.clf-kpi-v { font-family:var(--u-font-display); font-size:19px; font-weight:800; display:block; }
.clf-kpi-l { font-size:11px; font-weight:700; color:var(--u-text3); }
.clf-info { display:flex; flex-direction:column; gap:2px; margin-bottom:14px; }
.clf-ir { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--u-border); font-size:13px; }
.clf-ir span { color:var(--u-text3); } .clf-ir b { color:var(--u-text); text-align:right; }
.clf-notes { background:var(--u-bg2); border-radius:12px; padding:12px 14px; margin-bottom:6px; }
.clf-notes h5 { margin:0 0 5px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--u-text3); }
.clf-notes p { margin:0; font-size:13.5px; color:var(--u-text); line-height:1.5; white-space:pre-wrap; }
.color-row { display: flex; gap: 7px; align-items: center; padding-top: 4px; }
.color-dot { width: 28px; height: 28px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; transition: transform .1s; }
.color-dot:hover { transform: scale(1.1); }
.color-dot.on { border-color: var(--u-text); box-shadow: 0 0 0 2px var(--u-card), 0 0 0 4px currentColor; }

/* ===== Metas ===== */
.goals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 16px; }
.goal-card { background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius); padding: 20px; box-shadow: var(--u-shadow); cursor: pointer; transition: transform .12s, box-shadow .12s; text-align: center; }
.goal-card:hover { transform: translateY(-2px); box-shadow: var(--u-shadow-md); }
.goal-head { display: flex; justify-content: center; margin-bottom: 10px; }
.goal-head b { font-family: var(--u-font-display); font-size: 15px; font-weight: 800; display: block; }
.goal-head i { font-style: normal; font-size: 11.5px; color: var(--u-text3); font-weight: 600; }
.goal-ring { width: 120px; height: 120px; margin: 4px auto 12px; display: block; }
.goal-vals { display: flex; gap: 10px; }
.goal-vals .gv { flex: 1; background: var(--u-bg2); border-radius: var(--radius-sm); padding: 9px 8px; min-width: 0;}
.goal-vals .gv small { display: block; font-size: 10.5px; color: var(--u-text3); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 2px; }
.goal-vals .gv span { font-size: 13px; font-weight: 700; }

/* ===== CRM ===== */
.crm-search { display: flex; align-items: center; gap: 10px; background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius-sm); padding: 11px 15px; margin-bottom: 16px; color: var(--u-text3); box-shadow: var(--u-shadow); }
.crm-search svg { font-size: 17px; flex-shrink: 0; }
.crm-search input { flex: 1; border: none; background: none; outline: none; font-size: 14px; color: var(--u-text); min-width: 0;}
.crm-list { display: flex; flex-direction: column; gap: 8px; }
.crm-row { display: flex; align-items: center; gap: 13px; background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius-sm); padding: 13px 16px; box-shadow: var(--u-shadow); cursor: pointer; transition: transform .1s, box-shadow .1s; }
.crm-row:hover { transform: translateX(2px); box-shadow: var(--u-shadow-md); }
.crm-av { width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--u-accent-soft); color: var(--u-accent); font-weight: 800; font-size: 13px; }
.crm-main { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
.crm-main b { font-size: 14px; font-weight: 700; }
.crm-main i { font-style: normal; font-size: 12px; color: var(--u-text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crm-status { font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 20px; flex-shrink: 0; }

/* CRM inteligente */
.crm-summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.crm-stat { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius-sm); padding: 12px 14px; box-shadow: var(--u-shadow); cursor: pointer; transition: transform .1s, border-color .1s; text-align: left; }
.crm-stat:hover { transform: translateY(-1px); }
.crm-stat.on { border-color: var(--u-accent); box-shadow: 0 0 0 1px var(--u-accent); }
.crm-stat-dot { width: 9px; height: 9px; border-radius: 50%; margin-bottom: 4px; }
.crm-stat-n { font-family: var(--u-font-display); font-size: 24px; font-weight: 800; line-height: 1; }
.crm-stat-l { font-size: 12px; color: var(--u-text2); font-weight: 600; }
.crm-contact-panel { background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius); box-shadow: var(--u-shadow); padding: 14px 16px; margin-bottom: 16px; }
.crm-cp-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }

.crm-cp-head b { font-family: var(--u-font-display); font-size: 15px; font-weight: 800; }
.crm-cp-head span { margin-left: auto; font-size: 12px; color: var(--u-text3); font-weight: 600; }
.crm-cp-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--u-border); }
.crm-cp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.crm-cp-main { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }

.crm-cp-main i { font-style: normal; font-size: 11.5px; color: var(--u-text3); }
.crm-cp-seg { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; flex-shrink: 0; }
.crm-mini { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 6px 11px; border-radius: 9px; flex-shrink: 0; cursor: pointer; }

.crm-mini.wa { background: #16A34A18; color: #16A34A; }
.crm-mini.wa:hover { background: #16A34A; color: #fff; }
.crm-mini.buy { background: var(--u-accent-soft); color: var(--u-accent); }

.crm-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.crm-chip { font-size: 12.5px; font-weight: 700; padding: 7px 13px; border-radius: 20px; background: var(--u-bg2); color: var(--u-text2); border: 1px solid var(--u-border); transition: all .12s; }
.crm-chip i { font-style: normal; opacity: .6; margin-left: 3px; }
.crm-chip.on { background: var(--u-accent); color: #fff; border-color: var(--u-accent); }
.crm-chip.on i { opacity: .85; }
.crm-seg-hint { display: flex; align-items: center; gap: 10px; margin: -4px 0 14px; flex-wrap: wrap; }
.crm-seg-badge { font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 20px; }
.crm-seg-x { font-size: 12px; color: var(--u-text3); }
.pills-ro { opacity: .55; pointer-events: none; }

/* ===== Projetos ===== */
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 16px; }
.proj-card { display: flex; background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius); box-shadow: var(--u-shadow); cursor: pointer; overflow: hidden; transition: transform .12s, box-shadow .12s; }
.proj-card:hover { transform: translateY(-2px); box-shadow: var(--u-shadow-md); }
.proj-bar { width: 5px; flex-shrink: 0; }
.proj-body { padding: 16px 18px; flex: 1; min-width: 0; }
.proj-body b { font-family: var(--u-font-display); font-size: 15px; font-weight: 800; }
.proj-body p { font-size: 12.5px; color: var(--u-text2); margin: 4px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.proj-prog { margin-top: 12px; }
.proj-prog.big { margin: 0 0 22px; max-width: 480px; }
.proj-prog-bar { height: 8px; border-radius: 20px; background: var(--u-bg2); overflow: hidden; }
.proj-prog-bar span { display: block; height: 100%; border-radius: 20px; transition: width .4s; }
.proj-prog small { display: block; font-size: 11px; color: var(--u-text3); font-weight: 600; margin-top: 5px; }
.proj-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.proj-avs { display: flex; }
.proj-av { width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #fff; margin-right: -6px; border: 2px solid var(--u-card); }
.proj-prazo { font-size: 11px; color: var(--u-text3); font-weight: 600; }

.btn-back { color: var(--u-text2); font-size: 13px; font-weight: 600; margin-bottom: 16px; padding: 4px 0; }
.btn-back:hover { color: var(--u-accent); }
.proj-detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 16px 20px; background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius); box-shadow: var(--u-shadow); margin-bottom: 18px; }
.proj-detail-head h2 { font-family: var(--u-font-display); font-size: 20px; font-weight: 800; }
.proj-detail-head p { color: var(--u-text2); font-size: 13px; margin-top: 4px; }

.ms-sec { background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius); box-shadow: var(--u-shadow); padding: 8px; margin-bottom: 14px; }
.ms-sec-h { font-weight: 700; font-size: 13px; color: var(--u-text2); padding: 10px 12px 6px; }
.ms-row { display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: background .12s; }
.ms-row:hover { background: var(--u-bg2); }
.ms-check { width: 22px; height: 22px; border-radius: 7px; border: 2px solid #9aa1ad; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; }
.ms-name { flex: 1; font-size: 13.5px; font-weight: 600; min-width: 0;}
.ms-name.done { text-decoration: line-through; color: var(--u-text3); }
.ms-date { font-size: 11.5px; color: var(--u-text3); font-weight: 600; }
.ms-av { width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #fff; }
.ms-status { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; cursor: pointer; transition: filter .1s; }
.ms-status:hover { filter: brightness(.95); }
.ms-steps { font-size: 11px; font-weight: 700; color: var(--u-text2); background: var(--u-bg2); padding: 3px 10px; border-radius: 20px; cursor: pointer; transition: all .12s; }
.ms-steps:hover { background: var(--u-border); }
.ms-steps.add { color: var(--u-text3); }
.ms-steps.on { background: var(--u-accent-soft); color: var(--u-accent); }
.ms-block { border-radius: var(--radius-sm); }
.ms-subs { padding: 6px 12px 12px 44px; display: flex; flex-direction: column; gap: 4px; }
.ms-sub { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 8px; font-size: 13px; }
.ms-sub:hover { background: var(--u-bg2); }
.ms-sub input { width: 16px; height: 16px; accent-color: var(--u-accent); cursor: pointer; }
.ms-sub span { flex: 1; min-width: 0;}
.ms-sub span.done { text-decoration: line-through; color: var(--u-text3); }
.ms-sub-del { color: var(--u-text3); font-size: 13px; padding: 1px 6px; border-radius: 6px; }
.ms-sub-del:hover { background: var(--u-red-soft); color: var(--u-red); }
.ms-sub-empty { font-size: 12px; color: var(--u-text3); padding: 4px 8px; }
.ms-sub-add { display: flex; gap: 8px; margin-top: 4px; }
.ms-sub-add input { flex: 1; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--u-border2); background: var(--u-card); font-size: 12.5px; outline: none; min-width: 0;}
.ms-sub-add input:focus { border-color: var(--u-accent); box-shadow: 0 0 0 3px var(--u-accent-soft); }
.ms-add { display: flex; gap: 8px; flex-wrap: wrap; }
.ms-add input, .ms-add select { padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--u-border2); background: var(--u-card); font-size: 13px; color: var(--u-text); outline: none; }
.ms-add #msName { flex: 1; min-width: 160px; }
.ms-add input:focus, .ms-add select:focus { border-color: var(--u-accent); box-shadow: 0 0 0 3px var(--u-accent-soft); }

.member-picks { display: flex; flex-wrap: wrap; gap: 8px; }
.member-pick { display: flex; align-items: center; gap: 7px; padding: 6px 12px 6px 8px; border-radius: 20px; border: 1.5px solid var(--u-border2); font-size: 12.5px; font-weight: 600; color: var(--u-text2); cursor: pointer; transition: all .12s; }
.member-pick input { display: none; }
.member-pick.on { border-color: var(--u-accent); background: var(--u-accent-soft); color: var(--u-accent); }
.member-pick-av { width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: #fff; }

/* ===== Configurações ===== */
.cfg-tabs { display: flex; gap: 8px; margin-bottom: 18px; border-bottom: 1px solid var(--u-border); }
.cfg-tab { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 13.5px; font-weight: 600; color: var(--u-text2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.cfg-tab svg { font-size: 17px; }
.cfg-tab:hover { color: var(--u-text); }
.cfg-tab.on { color: var(--u-accent); border-bottom-color: var(--u-accent); }
.cfg-sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cfg-sec-head span { font-size: 13px; color: var(--u-text2); font-weight: 600; }
.cfg-list { display: flex; flex-direction: column; gap: 8px; }
.cfg-row { display: flex; align-items: center; gap: 13px; background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius-sm); padding: 13px 16px; box-shadow: var(--u-shadow); cursor: pointer; transition: transform .1s, box-shadow .1s; }
.cfg-row:hover { transform: translateX(2px); box-shadow: var(--u-shadow-md); }
.cfg-row .crm-av svg { font-size: 17px; }

/* ===== Banners ===== */
.dash-hero.banner { display: flex; align-items: center; text-decoration: none; color: #fff; position: relative; min-height: 210px; padding: 32px 36px; }
.dash-hero.banner .banner-ov { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,15,40,.72), rgba(10,15,40,.25)); border-radius: var(--radius); }
.dash-hero.banner .banner-c { position: relative; z-index: 1; }
.dash-hero.banner h2 { font-family: var(--u-font-display); font-size: 30px; font-weight: 800; margin-bottom: 6px; }
.dash-hero.banner p { opacity: .92; font-size: 15.5px; }
.banner-list { display: flex; flex-direction: column; gap: 8px; }
.banner-item { display: flex; align-items: center; gap: 13px; background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius-sm); padding: 11px 14px; box-shadow: var(--u-shadow); cursor: pointer; transition: transform .1s, box-shadow .1s; }
.banner-item:hover { transform: translateX(2px); box-shadow: var(--u-shadow-md); }
.banner-item.off { opacity: .6; }
.banner-thumb { width: 64px; height: 40px; border-radius: 8px; flex-shrink: 0; }
.banner-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.banner-meta b { font-size: 14px; font-weight: 700; }
.banner-meta i { font-style: normal; font-size: 12px; color: var(--u-text3); }
.grad-dot { width: 40px; height: 28px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; transition: transform .1s; }
.grad-dot:hover { transform: scale(1.08); }
.grad-dot.on { border-color: var(--u-text); box-shadow: 0 0 0 2px var(--u-card), 0 0 0 4px var(--u-accent); }
.banner-up { padding: 16px; border: 1.5px dashed var(--u-border2); border-radius: var(--radius-sm); text-align: center; font-size: 13px; color: var(--u-text3); cursor: pointer; background: var(--u-card2); }
.banner-up:hover { border-color: var(--u-accent); color: var(--u-accent); }
.banner-prev { height: 90px; border-radius: var(--radius-sm); margin-top: 8px; }

/* ===== Campanhas ===== */
.camp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 16px; }
.camp-card { display: flex; background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius); box-shadow: var(--u-shadow); cursor: pointer; overflow: hidden; transition: transform .12s, box-shadow .12s; }
.camp-card:hover { transform: translateY(-2px); box-shadow: var(--u-shadow-md); }
.camp-bar { width: 5px; flex-shrink: 0; }
.camp-body { padding: 16px 18px; flex: 1; min-width: 0; }
.camp-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.camp-top b { font-family: var(--u-font-display); font-size: 15px; font-weight: 800; }
.camp-body p { font-size: 12.5px; color: var(--u-text2); margin: 6px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.camp-meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.camp-foot { display: flex; gap: 16px; margin-top: 12px; font-size: 11.5px; color: var(--u-text3); font-weight: 600; }
.camp-tasks { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.camp-task-item { display: flex; align-items: center; gap: 9px; padding: 8px 11px; background: var(--u-bg2); border-radius: var(--radius-sm); font-size: 13px; }
.camp-task-item .tc-prio { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.camp-task-del { color: var(--u-text3); font-size: 13px; padding: 2px 6px; border-radius: 6px; }
.camp-task-del:hover { background: var(--u-red-soft); color: var(--u-red); }
.camp-task-add { display: flex; gap: 8px; }
.camp-task-add input { flex: 1; padding: 9px 12px; border-radius: var(--radius-sm); border: 1px solid var(--u-border2); background: var(--u-card); font-size: 13px; outline: none; min-width: 0;}
.camp-task-add select { padding: 9px 10px; border-radius: var(--radius-sm); border: 1px solid var(--u-border2); background: var(--u-card); font-size: 13px; outline: none; }
.camp-task-add input:focus { border-color: var(--u-accent); box-shadow: 0 0 0 3px var(--u-accent-soft); }

/* ===== Ranking ===== */
.rank-list { display: flex; flex-direction: column; gap: 8px; }
.rank-row { display: flex; align-items: center; gap: 13px; background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius-sm); padding: 13px 16px; box-shadow: var(--u-shadow); }
.rank-pos { width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; background: var(--u-bg2); color: var(--u-text2); }
.rank-pos.gold { background: linear-gradient(135deg,#FFD700,#FFA000); color: #fff; }
.rank-pos.silver { background: linear-gradient(135deg,#C0C0C0,#9E9E9E); color: #fff; }
.rank-pos.bronze { background: linear-gradient(135deg,#CD7F32,#A0522D); color: #fff; }
.rank-av { width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 13px; }
.rank-main { flex: 1; min-width: 0; }
.rank-main b { font-size: 14px; font-weight: 700; display: block; }
.rank-main i { font-style: normal; font-size: 11.5px; color: var(--u-text3); }
.rank-bar { height: 6px; border-radius: 20px; background: var(--u-bg2); overflow: hidden; margin-top: 6px; }
.rank-bar span { display: block; height: 100%; border-radius: 20px; transition: width .5s; }
.rank-val { font-family: var(--u-font-display); font-size: 14px; font-weight: 800; flex-shrink: 0; }

/* ===== Gestão: Comissões ===== */
.com-row { display: flex; align-items: center; gap: 13px; background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius-sm); padding: 13px 16px; box-shadow: var(--u-shadow); cursor: default; }
.com-val { font-family: var(--u-font-display); font-size: 15px; font-weight: 800; color: var(--u-green); flex-shrink: 0; }
.com-preview { background: var(--u-bg2); border-radius: var(--radius-sm); padding: 14px; margin: 4px 0 14px; }
.com-prev-empty { font-size: 12.5px; color: var(--u-text3); text-align: center; }
.com-prev-t { font-size: 13px; margin-bottom: 10px; color: var(--u-text2); }
.com-prev-t b { color: var(--u-text); }
.com-prev-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--u-border); font-size: 13px; }
.com-pessoa-av { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 10px; }

/* ===== Gestão melhorada ===== */
.gestao-summary { display: grid; grid-template-columns: repeat(3,minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.gs-card { background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius-sm); box-shadow: var(--u-shadow); padding: 14px 16px; }
.gs-card span { font-size: 12px; color: var(--u-text3); font-weight: 600; display: block; }
.gs-card b { font-family: var(--u-font-display); font-size: 20px; font-weight: 800; }
.com-row { cursor: pointer; transition: transform .1s, box-shadow .1s; }
.com-row:hover { transform: translateX(2px); box-shadow: var(--u-shadow-md); }
.cm-pill { cursor: pointer; }
.com-mode-hint { font-size: 11.5px; color: var(--u-text3); margin-top: 7px; }
.com-emp-head { display: grid; grid-template-columns: minmax(0, 1fr) 92px 64px 92px; gap: 8px; font-size: 11px; font-weight: 700; color: var(--u-text3); text-transform: uppercase; padding: 8px 4px 4px; }
.com-emp-head span:nth-child(2), .com-emp-head span:nth-child(3), .com-emp-head span:nth-child(4) { text-align: right; }
.com-emp-list { display: flex; flex-direction: column; gap: 6px; }
.com-emp-row { display: grid; grid-template-columns: minmax(0, 1fr) 92px 64px 92px; gap: 8px; align-items: center; }
.com-emp-n { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; font-weight: 600; }
.com-emp-n .cen-txt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.com-emp-n .cen-txt i { font-style: normal; color: var(--u-text3); font-size: 11px; display: block; }
.com-emp-base, .com-emp-pct { padding: 8px 10px; border-radius: 9px; border: 1px solid var(--u-border2); background: var(--u-card); font-size: 13px; text-align: right; outline: none; width: 100%; }
.com-emp-base:focus, .com-emp-pct:focus { border-color: var(--u-accent); box-shadow: 0 0 0 3px var(--u-accent-soft); }
.com-emp-val { font-family: var(--u-font-display); font-weight: 800; font-size: 13.5px; text-align: right; color: var(--u-green); }
.com-total { margin: 14px 0 4px; padding: 12px 14px; background: var(--u-bg2); border-radius: var(--radius-sm); font-size: 13.5px; text-align: center; }
.com-total b { font-family: var(--u-font-display); color: var(--u-green); font-size: 16px; }
.com-det-totals { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-bottom: 14px; }
.com-det-totals > div { background: var(--u-bg2); border-radius: var(--radius-sm); padding: 12px 14px; }
.com-det-totals span { font-size: 11.5px; color: var(--u-text3); font-weight: 600; display: block; }
.com-det-totals b { font-family: var(--u-font-display); font-size: 18px; font-weight: 800; }
@media (max-width: 600px) { .gestao-summary { grid-template-columns: minmax(0, 1fr); } .com-emp-head, .com-emp-row { grid-template-columns: minmax(0, 1fr) 72px 50px 76px; } }

/* ===== Gestão: Avaliações ===== */
.aval-row { display: flex; align-items: center; gap: 13px; background: var(--u-card); border: 1px solid var(--u-border); border-radius: var(--radius-sm); padding: 13px 16px; box-shadow: var(--u-shadow); }
.aval-tipo { font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 20px; flex-shrink: 0; }
.aval-stars { display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 13px; }
.star-ro { color: var(--u-border2); font-size: 14px; }
.star-ro.on { color: #F59E0B; }
.aval-crits { display: flex; flex-direction: column; gap: 6px; }
.aval-crit { display: flex; align-items: center; gap: 10px; padding: 6px 0; flex-wrap: wrap; }
.aval-crit-name { flex: 1; min-width: 150px; height: 34px; border: 1px solid transparent; border-radius: 9px; padding: 0 10px; font-family: var(--u-font); font-size: 13px; color: var(--u-text); background: var(--u-bg2); transition: border-color .12s, background .12s; }
.aval-crit-name:hover { border-color: var(--u-border); }
.aval-crit-name:focus { outline: none; border-color: var(--u-accent); background: var(--u-card); }
.aval-crit-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.aval-crit-tools { display: flex; align-items: center; gap: 2px; }
.aval-crit-mv { width: 24px; height: 24px; border-radius: 7px; font-size: 13px; color: var(--u-text3); cursor: pointer; border: none; background: transparent; line-height: 1; }
.aval-crit-mv:hover { background: var(--u-accent-soft); color: var(--u-accent); }
.aval-crit-mv:disabled { opacity: .3; cursor: default; }
.aval-stars-pick { display: flex; gap: 3px; }
.star-pick { font-size: 22px; color: var(--u-border2); line-height: 1; transition: color .1s, transform .1s; }
.star-pick:hover { transform: scale(1.15); }
.star-pick.on { color: #F59E0B; }

/* ===== Conteúdo: pipeline (kanban) ===== */

.ck-dot { width:9px; height:9px; border-radius:50%; }
.ck-col-b { display:flex; flex-direction:column; gap:8px; min-height:40px; }

.ck-card-t { font-size:13.5px; font-weight:700; line-height:1.35; margin-bottom:8px; }
.ck-card-m { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

.ck-appr-no { background:var(--u-amber-soft,rgba(245,158,11,.15)); color:#B45309; }
/* ===== Conteúdo: calendário ===== */
.cc-grid { display:grid; grid-template-columns:repeat(7,minmax(0, 1fr)); gap:6px; }
.cc-dow { text-align:center; font-size:11px; font-weight:800; color:var(--u-text3); padding:4px 0; text-transform:uppercase; letter-spacing:.4px; }
.cc-cell { min-height:96px; background:var(--u-card); border:1px solid var(--u-border); border-radius:10px; padding:6px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:4px; align-items:stretch; }
.cc-cell.empty { background:transparent; border:none; cursor:default; }
.cc-cell:not(.empty):hover { border-color:var(--u-accent); }
.cc-cell.today { border-color:var(--u-accent); box-shadow:0 0 0 1px var(--u-accent); }
.cc-day { font-size:12px; font-weight:800; color:var(--u-text2); }
.cc-chips { display:flex; flex-direction:column; gap:3px; }

@media (max-width: 700px){ .cc-cell { min-height:72px; } .cc-chip { font-size:9.5px; } }
/* ===== Biblioteca de criativos ===== */

.bib-h { display:flex; align-items:center; gap:7px; margin-bottom:8px; }

.bib-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
.bib-tag { font-size:10.5px; font-weight:700; color:var(--u-text3); background:var(--u-bg2); padding:2px 8px; border-radius:20px; }
.bib-actions { display:flex; gap:8px; margin-top:12px; }
.bib-copy { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--u-accent); background:var(--u-accent-soft); border:none; border-radius:9px; padding:7px 12px; cursor:pointer; }

.bib-copy:hover { background:var(--u-accent); color:#fff; }
.bib-open { display:inline-flex; align-items:center; font-size:12.5px; font-weight:700; color:var(--u-text2); background:var(--u-bg2); border-radius:9px; padding:7px 12px; text-decoration:none; }

/* ===== Gerador de UTM ===== */

/* ===== Seletor de permissões do colaborador (Ver / Fazer) ===== */

.perm-hd { margin-bottom:10px; }
.perm-title { font-size:13px; font-weight:800; color:var(--u-text); }
.perm-sub { font-size:11.5px; color:var(--u-text3); margin-top:2px; }
.perm-shortcuts { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:12px; }

.perm-sc { font-size:11.5px; font-weight:700; color:var(--u-accent); background:var(--u-accent-soft); border:none; border-radius:8px; padding:5px 11px; cursor:pointer; }
.perm-sc:hover { background:var(--u-accent); color:#fff; }
.perm-rows { display:flex; flex-direction:column; gap:7px; }
.perm-row { display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--u-card); border:1px solid var(--u-border); border-radius:10px; padding:8px 10px 8px 12px; }
.perm-row-l { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--u-text); min-width:0; }
.perm-ic { display:flex; } .perm-ic svg { width:15px; height:15px; color:var(--u-text3); }
.perm-seg { display:inline-flex; background:var(--u-bg2); border-radius:9px; padding:3px; flex-shrink:0; }
.perm-seg button { font-size:11.5px; font-weight:700; color:var(--u-text3); background:none; border:none; border-radius:7px; padding:5px 10px; cursor:pointer; white-space:nowrap; }
.perm-seg button.on { background:var(--u-card); box-shadow:var(--u-shadow); color:var(--u-text2); }
.perm-seg button.on.ver { color:var(--u-accent); }
.perm-seg button.on.fazer { color:#16A34A; }
.perm-note-hier { font-size:12.5px; color:var(--u-text3); background:var(--u-bg2); border-radius:10px; padding:12px 14px; line-height:1.5; }
/* ===== Rotina do dia (checklist) ===== */
.rot-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.rot-head-l { display:flex; align-items:center; gap:11px; }
.rot-head-l svg { width:20px; height:20px; color:var(--u-accent); }
.rot-head-l b { font-family:var(--u-font-display); font-size:17px; display:block; }
.rot-head-l i { font-style:normal; font-size:12.5px; color:var(--u-text3); text-transform:capitalize; }
.rot-edit { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--u-accent); background:var(--u-accent-soft); border:none; border-radius:10px; padding:8px 14px; cursor:pointer; }
.rot-edit svg { width:15px; height:15px; } .rot-edit:hover { background:var(--u-accent); color:#fff; }
.rot-blocks { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:14px; }
.rot-block { background:var(--u-card); border:1px solid var(--u-border); border-radius:16px; padding:16px 18px; box-shadow:var(--u-shadow); }
.rot-block-h { display:flex; align-items:center; gap:9px; margin-bottom:12px; }
.rot-block-h svg { width:18px; height:18px; color:var(--u-text3); }
.rot-block-h b { font-family:var(--u-font-display); font-size:15px; flex:1; min-width: 0;}
.rot-prog { font-size:12px; font-weight:800; color:var(--u-text3); background:var(--u-bg2); border-radius:20px; padding:2px 10px; }
.rot-prog.full { color:#16A34A; background:var(--u-green-soft); }
.rot-bar { height:6px; background:var(--u-bg2); border-radius:20px; overflow:hidden; margin-bottom:12px; }
.rot-bar span { display:block; height:100%; background:var(--u-green); border-radius:20px; transition:width .3s; }
.rot-items { display:flex; flex-direction:column; gap:8px; }
.rot-item { display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:var(--u-bg2); border:1px solid transparent; border-radius:11px; padding:11px 13px; cursor:pointer; transition:.12s; }
.rot-item:hover { border-color:var(--u-border2); }
.rot-item.done { background:var(--u-green-soft); }
.rot-box { width:22px; height:22px; border-radius:7px; border:2px solid var(--u-border2); background:var(--u-card); flex-shrink:0; display:flex; align-items:center; justify-content:center; }

.rot-label { flex:1; font-size:13.5px; font-weight:600; color:var(--u-text); min-width: 0;}

/* editor da rotina */
.rc-block { margin-bottom:16px; }
.rc-block-h { display:flex; align-items:center; gap:8px; font-family:var(--u-font-display); font-size:14px; font-weight:700; margin-bottom:9px; }

.rc-items { display:flex; flex-direction:column; gap:7px; margin-bottom:9px; }

.rc-input { flex:1; min-width: 0;}
.rc-del { width:38px; height:38px; border-radius:9px; background:var(--u-red-soft); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.rc-del svg { width:15px; height:15px; color:var(--u-red); }
.rc-add { display:flex; gap:8px; }
.rc-new { flex:1; min-width: 0;}
.rc-addbtn { flex-shrink:0; }
@media (max-width: 700px){ .rot-blocks { grid-template-columns:minmax(0, 1fr); } }
/* ===== Fechamento de caixa ===== */
.caixa-card { background:var(--u-card); border:1px solid var(--u-border); border-radius:16px; padding:18px 20px; margin-top:14px; box-shadow:var(--u-shadow); }
