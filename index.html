function bindPerfil() {
  var u=ST.session.user;
  // trocar foto (base64, máx 200KB)
  var pb=document.getElementById('prfPhotoBtn'), pf=document.getElementById('prfPhotoFile');
  if (pb && pf) {
    pb.addEventListener('click', function(){ pf.click(); });
    pf.addEventListener('change', function(){
      var f=pf.files && pf.files[0]; if(!f) return;
      if (f.size > 200*1024) { toast('Imagem muito grande (máx 200KB)','error'); return; }
      var reader=new FileReader();
      reader.onload=function(ev){
        var data=ev.target.result;
        sb.from('malba_users').update({ avatar:data }).eq('id', u.id).then(function(r){
          if (r.error) { toast('Erro ao salvar foto','error'); console.error(r.error); return; }
          u.avatar=data; saveSession(ST.session); toast('Foto atualizada','success'); renderPage();
        });
      };
      reader.readAsDataURL(f);
    });
  }
  // salvar dados do perfil
  var save=document.getElementById('prfSave');
  if (save) save.addEventListener('click', function(){
    var name=(document.getElementById('prfName').value||'').trim();
    if (!name) { toast('Nome obrigatório','error'); return; }
    var payload={ name:name, phone:(document.getElementById('prfPhone').value||'').trim(), position:(document.getElementById('prfPosition').value||'').trim(), bio:(document.getElementById('prfBio').value||'').trim(), initials:iniciais(name) };
    save.disabled=true; save.textContent='Salvando...';
    sb.from('malba_users').update(payload).eq('id', u.id).then(function(r){
      save.disabled=false; save.textContent='Salvar perfil';
      if (r.error) { toast('Erro ao salvar','error'); console.error(r.error); return; }
      Object.assign(u, payload); saveSession(ST.session); toast('Perfil atualizado','success'); renderPage();
    });
  });
  // trocar senha (grava na coluna `password`, que é a que o login lê)
  var ps=document.getElementById('prfPassSave');
  if (ps) ps.addEventListener('click', function(){
    var p=(document.getElementById('prfPass').value||'').trim();
    if (!p) { toast('Digite a nova senha','error'); return; }
    if (p.length<4) { toast('Senha muito curta (mín. 4)','error'); return; }
    ps.disabled=true; ps.textContent='Salvando...';
    sb.from('malba_users').update({ password:p }).eq('id', u.id).then(function(r){
      ps.disabled=false; ps.textContent='Alterar senha';
      if (r.error) { toast('Erro ao alterar senha','error'); console.error(r.error); return; }
      document.getElementById('prfPass').value=''; toast('Senha alterada','success');
    });
  });
  var out=document.getElementById('prfLogout');
  if (out) out.addEventListener('click', logout);
}

/* ========== [10k] CALENDÁRIO EDITORIAL (Marketing) ========== */
function calDayItems(ds) {
  var admin=isAdmin(ST.session), me=String(ST.session.user.id), sid=boardStore();
  var who = admin ? (ST.taskAssignee?String(ST.taskAssignee):null) : me;
  var projIds={}; (ST.projects||[]).forEach(function(p){ projIds[String(p.id)]=1; });
  var out=[];
  ST.tasks.forEach(function(t){
    if ((t.due_date||'').slice(0,10)!==ds) return;
    if (sid && String(t.store_unit_id)!==String(sid)) return;
    if (!admin) { if (String(t.assignee_id)!==me && String(t.created_by)!==me) return; }
    else if (who && String(t.assignee_id||'')!==who) return;
    out.push({ k:'task', id:t.id, label:t.title, status:t.status||'todo', priority:t.priority, assignee_id:t.assignee_id, drag:admin });
  });
  ST.milestones.forEach(function(m){
    if ((m.date||'').slice(0,10)!==ds) return;
    if (!projIds[String(m.project_id)]) return;                 // só marcos de projetos DESTE setor
    if (sid && String(projStore(m.project_id))!==String(sid)) return;
    if (who && String(m.assignee_id||'')!==who) return;
    out.push({ k:'ms', id:m.id, label:m.name, status:m.status||'todo', priority:'media', assignee_id:m.assignee_id, drag:admin, src:'Projeto' });
  });
  // campanhas só no Marketing (é onde elas existem)
  if (ST.sector==='marketing') {
    ST.campaigns.forEach(function(c){
      (c.tasks||[]).forEach(function(tk){
        if ((tk.due||'').slice(0,10)!==ds) return;
        var aid=tk.assignee_id?String(tk.assignee_id):null;
        if (who && aid!==who) return;
        out.push({ k:'camptask', id:String(c.id)+'__'+String(tk.id), label:tk.title, status:(tk.done?'feito':'todo'), priority:tk.priority||'media', assignee_id:aid, drag:admin, src:'Campanha' });
      });
    });
    ST.campaigns.forEach(function(c){
      var s=(c.start_date||'').slice(0,10), e=(c.end_date||'').slice(0,10)||s;
      if (!(s && ds>=s && ds<=e)) return;
      if (sid && c.store_unit_id && String(c.store_unit_id)!==String(sid)) return;
      out.push({ k:'camp', id:c.id, label:c.name, color:c.color||'#8B5CF6', drag:false, edge:(ds===s?'start':(ds===e?'end':'mid')) });
    });
  }
  // eventos do calendário: equipe (todos do setor) ou pessoal (só o criador)
  (ST.events||[]).forEach(function(ev){
    if (ev.kind==='aviso') return;
    if ((ev.date||'').slice(0,10)!==ds) return;
    if (String(ev.sector||'')!==String(ST.sector)) return;
    if (ev.scope==='me' && String(ev.created_by)!==me) return;
    if (ev.store_unit_id && sid && String(ev.store_unit_id)!==String(sid)) return;
    out.push({ k:'event', id:ev.id, label:ev.title, scope:ev.scope, kind:ev.kind, color:ev.color||'#8B5CF6', hora:ev.hora, drag:admin });
  });
  return out;
}
function calChipHTML(it) {
  if (it.k==='event') {
    return '<button class="cal-chip cal-chip-event'+(it.scope==='me'?' me':'')+'" data-ck="event" data-cid="'+esc(it.id)+'"'+(it.drag?' draggable="true"':'')+' title="'+(it.scope==='me'?'Só para você':'Toda a equipe')+'" style="background:'+it.color+'1f;color:'+it.color+'"><i style="background:'+it.color+'"></i><span>'+(it.hora?esc(it.hora)+' ':'')+esc(it.label)+'</span></button>';
  }
  if (it.k==='camp') {
    return '<button class="cal-chip cal-chip-camp" data-ck="camp" data-cid="'+esc(it.id)+'" style="background:'+it.color+'18;color:'+it.color+'"><i style="background:'+it.color+'"></i><span>'+esc(it.label)+'</span></button>';
  }
  var sc=(STATUS[it.status]||STATUS.todo).color;
  var pr=PRIO[it.priority]||PRIO.media;
  var done=it.status==='feito';
  var drag=it.drag?' draggable="true"':'';
  return '<button class="cal-chip'+(done?' done':'')+'" data-ck="'+it.k+'" data-cid="'+esc(it.id)+'"'+drag+' style="background:'+sc+'14;color:'+sc+'"><i style="background:'+pr.color+'"></i><span>'+esc(it.label)+'</span></button>';
}
function calendarioHTML() {
  if (ST.cal.y==null) { var n=new Date(); ST.cal.y=n.getFullYear(); ST.cal.m=n.getMonth(); }
  var y=ST.cal.y, m=ST.cal.m;
  var first=new Date(y,m,1).getDay();
  var dim=new Date(y,m+1,0).getDate();
  var hoje=today();
  var admin=isAdmin(ST.session);
  var dow=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  var filter='';
  if (admin) {
    var meIdC = String(ST.session.user.id);
    var mineSelC = (String(ST.taskAssignee)===meIdC) ? ' selected' : '';
    var othersC = ST.users.filter(function(u){ return String(u.id)!==meIdC; }).map(function(u){ return '<option value="'+esc(u.id)+'"'+(String(ST.taskAssignee)===String(u.id)?' selected':'')+'>'+esc(u.name)+'</option>'; }).join('');
    var opts='<option value="'+esc(meIdC)+'"'+mineSelC+'>Minhas tarefas</option><option value="">Todos da equipe</option>'+othersC;
    filter='<select class="task-filter" id="calAssignee" title="Ver tarefas de">'+opts+'</select>';
  }
  var sub = admin ? 'Monte o mês: clique num dia para criar tarefa, ou use "+ Evento" para reuniões e lembretes' : 'Suas tarefas e a agenda da equipe · você também pode criar lembretes só seus';
  var addEvtBtn = '<button class="btn-new cal-evt-btn" id="btnNovoEvento">'+icon('plus')+'Evento</button>';
  var top='<div class="cal-top"><div><h2>Calendário</h2><div class="sub">'+sub+'</div></div>'+
    '<div class="cal-top-r">'+filter+addEvtBtn+'<div class="cal-nav-wrap"><button class="cal-nav" id="calPrev">‹</button><span class="cal-month">'+MESES[m]+' '+y+'</span><button class="cal-nav" id="calNext">›</button><button class="cal-today-btn" id="calToday">Hoje</button></div></div></div>';
  var legend='<div class="cal-legend"><span class="cal-lg"><i style="background:#9aa1ad"></i>A fazer</span><span class="cal-lg"><i style="background:#3B6FF7"></i>Em andamento</span><span class="cal-lg"><i style="background:#16A34A"></i>Concluída</span><span class="cal-lg"><i style="background:#8B5CF6"></i>Campanha</span><span class="cal-lg"><i style="background:#0EA5E9"></i>Evento/Reunião</span></div>';

  var grid='<div class="cal-grid">';
  dow.forEach(function(d){ grid+='<div class="cal-dow">'+d+'</div>'; });
  for (var b=0;b<first;b++) grid+='<div class="cal-cell empty"></div>';
  for (var d=1;d<=dim;d++) {
    var ds=y+'-'+pad(m+1)+'-'+pad(d);
    var items=calDayItems(ds);
    var chips='';
    items.slice(0,4).forEach(function(it){ chips+=calChipHTML(it); });
    if (items.length>4) chips+='<span class="cal-more">+'+(items.length-4)+' mais</span>';
    var addBtn = admin ? '<button class="cal-add" data-add="'+ds+'" title="Nova tarefa neste dia">+</button>' : '';
    grid+='<div class="cal-cell'+(ds===hoje?' today':'')+'" data-date="'+ds+'"><div class="cal-cell-h"><span class="cal-d">'+d+'</span>'+addBtn+'</div><div class="cal-chips">'+chips+'</div></div>';
  }
  grid+='</div>';
  return top+legend+grid;
}

function bindCalendario() {
  var prev=document.getElementById('calPrev'), next=document.getElementById('calNext'), tdy=document.getElementById('calToday');
  if (prev) prev.addEventListener('click', function(){ ST.cal.m--; if(ST.cal.m<0){ ST.cal.m=11; ST.cal.y--; } renderPage(); });
  if (next) next.addEventListener('click', function(){ ST.cal.m++; if(ST.cal.m>11){ ST.cal.m=0; ST.cal.y++; } renderPage(); });
  if (tdy) tdy.addEventListener('click', function(){ var n=new Date(); ST.cal.y=n.getFullYear(); ST.cal.m=n.getMonth(); renderPage(); });
  var af=document.getElementById('calAssignee');
  if (af) af.addEventListener('change', function(){ ST.taskAssignee=this.value; renderPage(); });
  var admin=isAdmin(ST.session);

  // botão "+ Evento" (todos podem; não-admin só cria pessoal)
  var evtBtn=document.getElementById('btnNovoEvento');
  if (evtBtn) evtBtn.addEventListener('click', function(){ openEventModal(null, null); });

  // abrir item ao clicar no chip
  var chips=app.querySelectorAll('.cal-chip');
  for (var i=0;i<chips.length;i++) chips[i].addEventListener('click', function(e){
    e.stopPropagation();
    if (this.classList.contains('dragging')) return;
    var k=this.getAttribute('data-ck'), id=this.getAttribute('data-cid');
    if (k==='event') { var ev=evById(id); if(ev){ if (admin || String(ev.created_by)===String(ST.session.user.id)) openEventModal(ev, null); else toast((ev.hora?ev.hora+' · ':'')+(ev.title||'Evento'),'info'); } }
    else if (k==='camp') { var c=campById(id); if (c) { if(admin) openCampaignModal(c); else toast('Campanha "'+(c.name||'')+'"','info'); } }
    else if (k==='task') { var t=taskById(id); if (t) openTaskModal(t); }
    else if (k==='ms') { var mm=msById(id); if (mm) { ST.openProject=mm.project_id; ST.page='projetos'; navigate(ST.sector+'/projetos'); renderPage(); } }
    else if (k==='camptask') { var cc=campById(String(id).split('__')[0]); if (cc) { if(admin) openCampaignModal(cc); else toast('Tarefa de campanha','info'); } }
  });

  if (!admin) return; // gestão (criar/arrastar) só admin

  // clique no dia (ou no +) cria tarefa naquele dia
  var adds=app.querySelectorAll('[data-add]');
  for (var a=0;a<adds.length;a++) adds[a].addEventListener('click', function(e){ e.stopPropagation(); openTaskModal(null, { due:this.getAttribute('data-add') }); });
  var cells=app.querySelectorAll('.cal-cell[data-date]');
  for (var z=0;z<cells.length;z++) cells[z].addEventListener('click', function(e){
    if (e.target.closest('.cal-chip')) return;
    openTaskModal(null, { due:this.getAttribute('data-date') });
  });

  // DRAG & DROP entre dias
  var dragData=null;
  var dgs=app.querySelectorAll('.cal-chip[draggable="true"]');
  for (var g=0;g<dgs.length;g++) {
    dgs[g].addEventListener('dragstart', function(e){ dragData={ k:this.getAttribute('data-ck'), id:this.getAttribute('data-cid') }; this.classList.add('dragging'); if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',this.getAttribute('data-cid'));}catch(_){} } });
    dgs[g].addEventListener('dragend', function(){ this.classList.remove('dragging'); dragData=null; var ov=app.querySelectorAll('.cal-cell.drag-over'); for(var k=0;k<ov.length;k++) ov[k].classList.remove('drag-over'); });
  }
  for (var c2=0;c2<cells.length;c2++) {
    cells[c2].addEventListener('dragover', function(e){ if(!dragData) return; e.preventDefault(); if(e.dataTransfer) e.dataTransfer.dropEffect='move'; this.classList.add('drag-over'); });
    cells[c2].addEventListener('dragleave', function(e){ if(e.target===this) this.classList.remove('drag-over'); });
    cells[c2].addEventListener('drop', function(e){ e.preventDefault(); this.classList.remove('drag-over'); if(!dragData) return; calMove(dragData.k, dragData.id, this.getAttribute('data-date')); });
  }
}
function calMove(k, id, ds) {
  if (k==='task') { var t=taskById(id); if(!t||((t.due_date||'').slice(0,10)===ds)) return; t.due_date=ds; sb.from('malba_vl_tasks').update({ due_date:ds }).eq('id', id).then(function(r){ if(r.error) toast('Erro ao mover','error'); }); toast('Tarefa movida para '+fmtDate(ds),'success'); renderPage(); }
  else if (k==='ms') { var m=msById(id); if(!m||((m.date||'').slice(0,10)===ds)) return; m.date=ds; sb.from('malba_vl_milestones').update({ date:ds }).eq('id', id).then(function(r){ if(r.error) toast('Erro ao mover','error'); }); toast('Marco movido para '+fmtDate(ds),'success'); renderPage(); }
  else if (k==='camptask') { var parts=String(id).split('__'); var c=campById(parts[0]); if(!c) return; var tk=null; (c.tasks||[]).forEach(function(x){ if(String(x.id)===String(parts[1])) tk=x; }); if(!tk||((tk.due||'').slice(0,10)===ds)) return; tk.due=ds; sb.from('malba_campaigns').update({ tasks:c.tasks }).eq('id', c.id).then(function(r){ if(r.error) toast('Erro ao mover','error'); }); toast('Tarefa movida para '+fmtDate(ds),'success'); renderPage(); }
  else if (k==='event') { var ev=evById(id); if(!ev||((ev.date||'').slice(0,10)===ds)) return; ev.date=ds; sb.from('malba_events').update({ date:ds }).eq('id', id).then(function(r){ if(r.error) toast('Erro ao mover','error'); }); toast('Evento movido para '+fmtDate(ds),'success'); renderPage(); }
}
function evById(id){ for(var i=0;i<ST.events.length;i++) if(String(ST.events[i].id)===String(id)) return ST.events[i]; return null; }
function openEventModal(ev, presetDate){
  var admin=isAdmin(ST.session);
  var me=ST.session.user;
  var editing=!!ev;
  var canEdit = !editing || admin || String(ev.created_by)===String(me.id);
  if (editing && !canEdit){ toast('Você não pode editar este evento','error'); return; }
  var EK={ evento:{label:'Evento',color:'#0EA5E9'}, reuniao:{label:'Reunião',color:'#8B5CF6'}, lembrete:{label:'Lembrete',color:'#F59E0B'} };
  var kind = editing ? (ev.kind||'evento') : 'evento';
  var scope = admin ? (editing ? (ev.scope||'team') : 'team') : 'me';
  var lojas = (ST.sector==='lojas') ? lojasGestao() : [];
  var curStore = editing ? (ev.store_unit_id||'') : '';
  var dateVal = editing ? (ev.date||'').slice(0,10) : (presetDate || today());
  var kindPills = Object.keys(EK).map(function(k){ return '<button type="button" class="pill ev-kind'+(kind===k?' on':'')+'" data-k="'+k+'" style="color:'+EK[k].color+'"><span class="pdot" style="background:'+EK[k].color+'"></span>'+EK[k].label+'</button>'; }).join('');
  var scopeRow = admin ? ('<div class="modal-row"><label class="modal-label">Quem vê</label><div class="pills" id="evScope"><button type="button" class="pill ev-scope'+(scope==='team'?' on':'')+'" data-s="team" style="color:var(--u-accent)"><span class="pdot" style="background:var(--u-accent)"></span>Toda a equipe</button><button type="button" class="pill ev-scope'+(scope==='me'?' on':'')+'" data-s="me" style="color:var(--u-purple)"><span class="pdot" style="background:var(--u-purple)"></span>Só para mim</button></div></div>') : '<div class="modal-note">Este lembrete fica visível só para você.</div>';
  var storeRow = (admin && lojas.length) ? ('<div class="modal-row"><label class="modal-label">Loja (opcional)</label><select id="evStore"><option value="">Todas / nenhuma</option>'+lojas.map(function(s){return '<option value="'+esc(s.id)+'"'+(String(curStore)===String(s.id)?' selected':'')+'>'+esc(s.name||('Loja '+s.store_number))+'</option>';}).join('')+'</select></div>') : '';
  var delBtn = (editing && canEdit) ? '<button class="btn btn-danger btn-del-wrap" id="evDel">Excluir</button>' : '';
  var modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML='<div class="modal">'+
    '<div class="modal-title-input" style="cursor:default">'+(editing?'Editar evento':'Novo no calendário')+'</div>'+
    '<div class="modal-row"><label class="modal-label">Título</label><input type="text" id="evTitle" placeholder="ex: Reunião de equipe" value="'+esc(editing?(ev.title||''):'')+'" maxlength="120"></div>'+
    '<div class="modal-row"><label class="modal-label">Tipo</label><div class="pills" id="evKind">'+kindPills+'</div></div>'+
    '<div class="modal-grid2"><div class="modal-row"><label class="modal-label">Data</label><input type="date" id="evDate" value="'+esc(dateVal)+'"></div><div class="modal-row"><label class="modal-label">Hora (opcional)</label><input type="time" id="evHora" value="'+esc(editing?(ev.hora||''):'')+'"></div></div>'+
    scopeRow+ storeRow+
    '<div class="modal-foot">'+delBtn+'<button class="btn btn-ghost" id="evCancel">Cancelar</button><button class="btn btn-primary" id="evSave">'+(editing?'Salvar':'Adicionar')+'</button></div>'+
  '</div>';
  function close(){ if(modal.parentNode) modal.parentNode.removeChild(modal); }
  modal.querySelectorAll('.ev-kind').forEach(function(b){ b.addEventListener('click', function(){ kind=this.getAttribute('data-k'); modal.querySelectorAll('.ev-kind').forEach(function(x){x.classList.remove('on');}); this.classList.add('on'); }); });
  modal.querySelectorAll('.ev-scope').forEach(function(b){ b.addEventListener('click', function(){ scope=this.getAttribute('data-s'); modal.querySelectorAll('.ev-scope').forEach(function(x){x.classList.remove('on');}); this.classList.add('on'); }); });
  modal.querySelector('#evCancel').addEventListener('click', close);
  var del=modal.querySelector('#evDel');
  if (del) del.addEventListener('click', function(){
    if(!confirm('Excluir este evento?')) return;
    sb.from('malba_events').delete().eq('id', ev.id).then(function(r){
      if(r.error){ toast('Erro ao excluir','error'); return; }
      ST.events=ST.events.filter(function(x){return x.id!==ev.id;});
      auditLog('Excluiu evento', ev.title||''); close(); toast('Evento excluído','success'); renderPage();
    });
  });
  modal.querySelector('#evSave').addEventListener('click', function(){
    var title=(modal.querySelector('#evTitle').value||'').trim();
    if(!title){ toast('Dê um título','error'); return; }
    var rec={ sector:ST.sector, title:title, date:modal.querySelector('#evDate').value||today(), hora:(modal.querySelector('#evHora').value||'')||null, kind:kind, scope:(admin?scope:'me'), color:EK[kind].color, store_unit_id:(modal.querySelector('#evStore')?(modal.querySelector('#evStore').value||null):null), created_by:(editing?(ev.created_by||me.id):me.id), created_by_name:(editing?(ev.created_by_name||me.name):me.name) };
    var btn=this; btn.disabled=true; btn.textContent='Salvando...';
    if (editing){
      sb.from('malba_events').update(rec).eq('id', ev.id).then(function(r){
        if(r.error){ toast('Erro ao salvar','error'); console.error(r.error); btn.disabled=false; btn.textContent='Salvar'; return; }
        for(var i=0;i<ST.events.length;i++) if(ST.events[i].id===ev.id){ ST.events[i]=Object.assign(ST.events[i],rec); break; }
        auditLog('Editou evento', title); close(); toast('Evento atualizado','success'); renderPage();
      });
    } else {
      sb.from('malba_events').insert(rec).select().single().then(function(r){
        if(r.error||!r.data){ toast('Erro ao adicionar (rodou o SQL de eventos?)','error'); console.error(r.error); btn.disabled=false; btn.textContent='Adicionar'; return; }
        ST.events.push(r.data); auditLog('Criou evento', title); close(); toast('Adicionado ao calendário','success'); renderPage();
      });
    }
  });
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  document.body.appendChild(modal);
}

/* ========== [10l] CHAT EFÊMERO (Realtime broadcast — nada é salvo) ========== */
var chatChannel=null, chatMsgs=[];
function hhmm(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function chatTeardown(){ if (chatChannel) { try{ sb.removeChannel(chatChannel); }catch(e){} chatChannel=null; } }
function chatStartOfDayISO(){ var d=new Date(); d.setHours(0,0,0,0); return d.toISOString(); }
function chatTime(ts){ try{ var d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }catch(e){ return ''; } }
function chatHTML() {
  var setorLabel = SECTORS[ST.sector] ? SECTORS[ST.sector].label : '';
  return '<div class="chat-wrap">'+
    '<div class="chat-head"><div><h2>Chat da equipe</h2><div class="sub">Setor '+esc(setorLabel)+' · mensagens de hoje</div></div><div class="chat-online" id="chatOnline"><span class="chat-on-dot"></span>conectando…</div></div>'+
    '<div class="chat-note">As mensagens ficam guardadas só durante o dia e são limpas automaticamente à meia-noite, para não pesar o sistema.</div>'+
    '<div class="chat-msgs" id="chatMsgs"><div class="chat-empty">Carregando…</div></div>'+
    '<div class="chat-input">'+
      '<input type="file" id="chatFile" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt" style="display:none">'+
      '<button class="chat-attach" id="chatAttach" title="Anexar imagem ou arquivo">'+icon('folder')+'</button>'+
      '<input type="text" id="chatInput" placeholder="Escreva uma mensagem…" autocomplete="off" maxlength="500">'+
      '<button class="btn btn-primary" id="chatSend">'+icon('chat')+'Enviar</button>'+
    '</div>'+
  '</div>';
}
function bindChat() {
  var u=ST.session.user;
  var sector=ST.sector;
  var storeId=ST.store?ST.store.id:(scopeStore()||null);
  chatMsgs=[]; var seen={};
  var msgsEl=document.getElementById('chatMsgs');
  var input=document.getElementById('chatInput');
  var sendBtn=document.getElementById('chatSend');
  var attachBtn=document.getElementById('chatAttach');
  var fileEl=document.getElementById('chatFile');
  var onlineEl=document.getElementById('chatOnline');

  function bubbleContent(m){
    if (m.kind==='image' && m.file_url) return '<a href="'+esc(m.file_url)+'" target="_blank" rel="noopener"><img class="chat-img" src="'+esc(m.file_url)+'" alt="imagem"></a>';
    if (m.kind==='file' && m.file_url) return '<a class="chat-file" href="'+esc(m.file_url)+'" target="_blank" rel="noopener" download>'+icon('folder')+'<span>'+esc(m.file_name||'arquivo')+'</span></a>';
    return '<span class="chat-text">'+esc(m.body||'')+'</span>';
  }
  function renderMsgs(){
    if (chatMsgs.length===0){ msgsEl.innerHTML='<div class="chat-empty">Comece a conversa com a equipe.</div>'; return; }
    msgsEl.innerHTML=chatMsgs.map(function(m){
      var mine=String(m.user_id)===String(u.id);
      var av = mine?'':'<span class="chat-av" style="background:'+(m.user_color||'#3B6FF7')+'">'+esc(iniciais(m.user_name||'?'))+'</span>';
      return '<div class="chat-msg'+(mine?' mine':'')+'">'+av+'<div class="chat-bubble">'+(mine?'':'<span class="chat-name">'+esc(m.user_name||'')+'</span>')+bubbleContent(m)+'<span class="chat-time">'+chatTime(m.created_at)+'</span></div></div>';
    }).join('');
    msgsEl.scrollTop=msgsEl.scrollHeight;
  }
  function addMsg(m){ if(!m||!m.id||seen[m.id]) return; seen[m.id]=1; chatMsgs.push(m); if(chatMsgs.length>300) chatMsgs.shift(); renderMsgs(); }

  // 1) carrega as mensagens de HOJE
  sb.from('malba_chat_messages').select('*').eq('sector',sector).gte('created_at',chatStartOfDayISO()).order('created_at',{ascending:true}).limit(400).then(function(r){
    if (r.error){ msgsEl.innerHTML='<div class="chat-empty">Não foi possível carregar o chat.</div>'; console.error(r.error); return; }
    (r.data||[]).forEach(addMsg);
    if (chatMsgs.length===0) renderMsgs();
  });

  // 2) tempo real via broadcast (entrega imediata) + presença (online)
  chatTeardown();
  var ch = sb.channel('chat-'+sector, { config:{ broadcast:{ self:false }, presence:{ key:u.id } } });
  ch.on('broadcast', { event:'msg' }, function(p){ if(p && p.payload) addMsg(p.payload); });
  ch.on('presence', { event:'sync' }, function(){ if(onlineEl){ var st=ch.presenceState(); onlineEl.innerHTML='<span class="chat-on-dot"></span>'+Object.keys(st).length+' online'; } });
  ch.subscribe(function(status){
    if (status==='SUBSCRIBED') ch.track({ name:u.name, at:Date.now() });
    else if (status==='CHANNEL_ERROR' || status==='TIMED_OUT') { if(onlineEl) onlineEl.innerHTML='<span class="chat-on-dot off"></span>sem conexão'; }
  });
  chatChannel=ch;

  function persistAndBroadcast(row){
    sb.from('malba_chat_messages').insert(row).select().single().then(function(r){
      if (r.error || !r.data){ toast('Erro ao enviar','error'); console.error(r.error); return; }
      addMsg(r.data);
      try{ ch.send({ type:'broadcast', event:'msg', payload:r.data }); }catch(e){}
    });
  }
  function sendText(){
    var txt=(input.value||'').trim(); if(!txt) return;
    input.value=''; input.focus();
    persistAndBroadcast({ sector:sector, store_unit_id:storeId, user_id:u.id, user_name:u.name, user_color:u.color||'#3B6FF7', kind:'text', body:txt });
  }
  sendBtn.addEventListener('click', sendText);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); sendText(); } });

  // 3) anexos (imagem / arquivo)
  attachBtn.addEventListener('click', function(){ fileEl.click(); });
  fileEl.addEventListener('change', function(){
    var file=fileEl.files && fileEl.files[0]; if(!file) return;
    if (file.size > 10*1024*1024){ toast('Arquivo muito grande (máx. 10MB)','error'); fileEl.value=''; return; }
    attachBtn.disabled=true; var oldOnline=onlineEl?onlineEl.innerHTML:''; if(onlineEl) onlineEl.innerHTML='<span class="chat-on-dot"></span>enviando anexo…';
    var clean=(file.name||'arquivo').replace(/[^\w.\-]+/g,'_').slice(-60);
    var path=sector+'/'+u.id+'-'+Date.now()+'-'+clean;
    sb.storage.from('chat-anexos').upload(path, file, { cacheControl:'3600', upsert:false }).then(function(up){
      attachBtn.disabled=false; if(onlineEl) onlineEl.innerHTML=oldOnline;
      if (up.error){ toast('Falha no upload','error'); console.error(up.error); fileEl.value=''; return; }
      var pub=sb.storage.from('chat-anexos').getPublicUrl(path);
      var url=pub && pub.data ? pub.data.publicUrl : null;
      var isImg=/^image\//.test(file.type);
      persistAndBroadcast({ sector:sector, store_unit_id:storeId, user_id:u.id, user_name:u.name, user_color:u.color||'#3B6FF7', kind:isImg?'image':'file', body:null, file_url:url, file_name:file.name, file_type:file.type });

/* ========== [10m] PALETA DE COMANDOS (Ctrl/Cmd+K) — padrão dos melhores sistemas ========== */
function goToPage(id){ ST.page=id; ST.openProject=null; navigate(ST.sector+'/'+id); renderPage(); }
function buildCommands() {
  var cmds=[]; var admin=isAdmin(ST.session);
  var pages=PAGES[ST.sector]||PAGES.lojas;
  pages = pages.filter(function(pg){
    if (pg.id==='config') return isTopAdmin(ST.session);
    if (pg.id==='gestao')  return canManage();
    return true;
  });
  pages.forEach(function(pg){ if(pg.enabled) cmds.push({ cat:'Ir para', label:pg.label, icon:pg.icon, run:function(){ goToPage(pg.id); } }); });
  cmds.push({ cat:'Ir para', label:'Meu Perfil', icon:'users', run:function(){ ST.page='perfil'; navigate(ST.sector+'/perfil'); renderPage(); } });
  // ações de criação
  cmds.push({ cat:'Criar', label:'Nova tarefa', icon:'plus', run:function(){ openTaskModal(null); } });
  if (admin) {
    if (ST.sector==='marketing') cmds.push({ cat:'Criar', label:'Nova campanha', icon:'plus', run:function(){ openCampaignModal(null); } });
    cmds.push({ cat:'Criar', label:'Novo cliente', icon:'plus', run:function(){ openClientModal(null); } });
    cmds.push({ cat:'Criar', label:'Novo projeto', icon:'plus', run:function(){ openProjectModal(null); } });
    cmds.push({ cat:'Criar', label:'Nova meta', icon:'plus', run:function(){ openGoalModal(null); } });
    if (ST.sector==='lojas') {
      cmds.push({ cat:'Criar', label:'Cadastrar funcionário', icon:'plus', run:function(){ openMemberModal(null); } });
      cmds.push({ cat:'Criar', label:'Lançar comissão', icon:'dollar', run:function(){ ST.page='gestao'; ST.gestaoTab='comissoes'; navigate(ST.sector+'/gestao'); renderPage(); setTimeout(openComissaoModal,60); } });
    }
  }
  cmds.push({ cat:'Ajuda', label:'Atalhos de teclado', icon:'search', run:openShortcutsHelp });
  cmds.push({ cat:'Conta', label:'Sair da conta', icon:'logout', run:logout });
  return cmds;
}
function openCommandPalette() {
  if (document.getElementById('cmdkBg') || !ST.session) return;
  var cmds=buildCommands(), sel=0, filtered=cmds;
  var iconFor={ task:'tasks', client:'users', project:'folder', campaign:'megaphone' };
  var bg=document.createElement('div'); bg.className='cmdk-bg'; bg.id='cmdkBg';
  bg.innerHTML='<div class="cmdk"><div class="cmdk-input-wrap">'+icon('search')+'<input id="cmdkInput" placeholder="Buscar páginas, ações, tarefas, clientes..." autocomplete="off"><span class="cmdk-esc">esc</span></div><div class="cmdk-list" id="cmdkList"></div></div>';
  document.body.appendChild(bg);
  var input=bg.querySelector('#cmdkInput'), list=bg.querySelector('#cmdkList');

  function compute(q){
    q=(q||'').toLowerCase().trim();
    var base=cmds.filter(function(c){ return !q || c.label.toLowerCase().indexOf(q)>=0; });
    var content = q ? globalSearch(q).map(function(r){ return { cat:'Resultados', label:r.label, sub:r.sub, icon:iconFor[r.k]||'dashboard', run:function(){ openSearchResult(r); } }; }) : [];
    return base.concat(content);
  }
  function render(){
    if (filtered.length===0){ list.innerHTML='<div class="cmdk-empty">Nada encontrado</div>'; return; }
    var lastCat=null, html='';
    filtered.forEach(function(c,i){
      if (c.cat!==lastCat){ html+='<div class="cmdk-cat">'+esc(c.cat)+'</div>'; lastCat=c.cat; }
      html+='<button class="cmdk-item'+(i===sel?' on':'')+'" data-i="'+i+'">'+icon(c.icon||'dashboard')+'<span class="cmdk-l">'+esc(c.label)+'</span>'+(c.sub?'<span class="cmdk-s">'+esc(c.sub)+'</span>':'')+'</button>';
    });
    list.innerHTML=html;
    var on=list.querySelector('.cmdk-item.on'); if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest'});
    var items=list.querySelectorAll('.cmdk-item');
    for (var k=0;k<items.length;k++){
      items[k].addEventListener('mousedown', function(e){ e.preventDefault(); exec(parseInt(this.getAttribute('data-i'),10)); });
      items[k].addEventListener('mousemove', function(){ var ni=parseInt(this.getAttribute('data-i'),10); if(ni!==sel){ sel=ni; var its=list.querySelectorAll('.cmdk-item'); for(var z=0;z<its.length;z++) its[z].classList.toggle('on', z===sel); } });
    }
  }
  function exec(i){ var c=filtered[i]; if(!c) return; close(); c.run(); }
  function close(){ document.removeEventListener('keydown', onKey, true); if(bg.parentNode) bg.parentNode.removeChild(bg); }
  function onKey(e){
    if (e.key==='Escape'){ e.preventDefault(); close(); }
    else if (e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1, filtered.length-1); render(); }
    else if (e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1, 0); render(); }
    else if (e.key==='Enter'){ e.preventDefault(); exec(sel); }
  }
  filtered=compute(''); render();
  input.addEventListener('input', function(){ sel=0; filtered=compute(input.value); render(); });
  document.addEventListener('keydown', onKey, true);
  bg.addEventListener('click', function(e){ if(e.target===bg) close(); });
  setTimeout(function(){ input.focus(); }, 30);
}

/* ========== [12] BOOT ========== */
function getTheme(){ try { return localStorage.getItem('malba_theme')||'light'; } catch(e){ return 'light'; } }
function applyTheme(t){ if(t==='dark') document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }
function toggleTheme(){ var t=getTheme()==='dark'?'light':'dark'; try{ localStorage.setItem('malba_theme', t); }catch(e){} applyTheme(t); var b=document.getElementById('themeToggle'); if(b){ b.innerHTML=icon(t==='dark'?'sun':'moon'); b.title=(t==='dark'?'Modo claro':'Modo escuro'); } }

function boot() {
  applyTheme(getTheme());
  try {
    var bp=new URLSearchParams(location.search).get('bling');
    if (bp) {
      window._blingMsg = (bp==='ok') ? ['Loja conectada ao Bling com sucesso!','success'] : ['Não foi possível conectar ao Bling. Tente de novo.','error'];
      history.replaceState(null,'', location.pathname + location.hash);
    }
  } catch(e){}
  if (!window._onlineHook) { window._onlineHook=true; window.addEventListener('online', setOnlineState); window.addEventListener('offline', setOnlineState); }
  if (!window._cmdkHook) { window._cmdkHook=true; window.addEventListener('keydown', function(e){ if ((e.metaKey||e.ctrlKey) && (e.key==='k'||e.key==='K')) { e.preventDefault(); if (ST.session) openCommandPalette(); } }); }
  if (!window._keysHook) { window._keysHook=true; window.addEventListener('keydown', function(e){
    if (!ST.session || e.metaKey || e.ctrlKey || e.altKey) return;
    var ae=document.activeElement;
    if (ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'||ae.isContentEditable)) return;
    var modalOpen=document.querySelector('.modal-bg, .cmdk-bg');
    if (e.key==='/') { e.preventDefault(); var s=document.getElementById('topSearch'); if(s) s.focus(); }
    else if (e.key==='?') { e.preventDefault(); openShortcutsHelp(); }
    else if ((e.key==='n'||e.key==='N') && !modalOpen) { e.preventDefault(); openTaskModal(null); }
  }); }
  var session=getSession();
  if (!session || !session.user) { renderSectorScreen(); return; }
  ST.session=session; ST.sector=session.sector;
  var route=currentRoute();
  ST.page = (route.length>=2) ? route[1] : 'inicio';
  if (!ST.loaded) { render('<div class="screen"><div class="spinner"></div></div>'); loadData().then(function(){ renderPage(); flushBlingMsg(); }); }
  else { renderPage(); flushBlingMsg(); }
}
function flushBlingMsg(){ if (window._blingMsg) { var m=window._blingMsg; window._blingMsg=null; setTimeout(function(){ toast(m[0], m[1]); }, 300); } }
function init() {
  startSplash();
  render('<div class="screen"><div class="spinner"></div></div>');
  if (!sb) { render('<div class="screen"><div class="screen-inner"><div class="login-card"><h1 class="login-h">Erro</h1><p class="login-sub">Biblioteca do Supabase não carregou.</p></div></div></div>'); return; }
  pingBanco().then(function(ok){
    if (!ok) { render('<div class="screen"><div class="screen-inner"><div class="login-card"><h1 class="login-h">Sem conexão</h1><p class="login-sub">Não consegui falar com o banco. Confira URL e anon key na seção CONFIG.</p></div></div></div>'); return; }
    window.addEventListener('hashchange', boot);
    boot();
  });
}
init();

})();
</script>
