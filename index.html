// MESES
// ========================================================
function renderMeses() {
  var monthIdx = state.ui.monthSel;
  var monthName = MONTHS[monthIdx];
  var stats = monthStats(monthIdx);

  var monthOpts = '';
  for (var i = 0; i < 12; i++) {
    monthOpts += '<option value="' + i + '"' + (i === monthIdx ? ' selected' : '') + '>' + MONTHS[i] + '</option>';
  }

  var rows = '';
  for (var m = 0; m < 12; m++) {
    var s = monthStats(m);
    var lb = s.pct >= 80 ? 'Excelente' : s.pct >= 50 ? 'Atenção' : 'Crítico';
    var cls = s.pct >= 80 ? 'done' : s.pct >= 50 ? 'doing' : 'pending';
    rows += '<tr><td><strong>' + MONTHS[m] + '</strong></td>' +
      '<td class="center">' + s.total + '</td>' +
      '<td class="center">' + s.done + '</td>' +
      '<td class="center">' + s.doing + '</td>' +
      '<td class="center">' + s.pending + '</td>' +
      '<td class="center"><strong>' + s.pct + '%</strong></td>' +
      '<td><span class="pill ' + cls + '">' + lb + '</span></td>' +
      '<td><button class="btn btn-sm btn-ghost" data-month-detail="' + m + '">Ver →</button></td></tr>';
  }

  return '<div class="page-head"><div><h2 class="page-title">Visão por mês</h2>' +
    '<p class="page-sub">Performance detalhada de cada mês de 2026</p></div></div>' +
    '<div class="month-nav">' +
      '<div class="month-nav-label">' + monthName + ' 2026</div>' +
      '<select class="input" id="mesesPicker" style="width:auto;min-width:140px;height:36px">' + monthOpts + '</select>' +
    '</div>' +
    '<div class="metrics">' +
      '<div class="metric accent"><div class="metric-label">Conclusão</div><div class="metric-value">' + stats.pct + '%</div></div>' +
      '<div class="metric"><div class="metric-label">Concluídas</div><div class="metric-value">' + stats.done + '</div></div>' +
      '<div class="metric"><div class="metric-label">Pendentes</div><div class="metric-value">' + stats.pending + '</div></div>' +
      '<div class="metric"><div class="metric-label">Em andamento</div><div class="metric-value">' + stats.doing + '</div></div>' +
      '<div class="metric"><div class="metric-label">Total</div><div class="metric-value">' + stats.total + '</div></div>' +
      '<div class="metric"><div class="metric-label">Não aplicáveis</div><div class="metric-value">' + stats.na + '</div></div>' +
    '</div>' +
    '<div class="card"><div class="card-head"><div class="card-title">Resumo de todos os meses</div></div>' +
    '<div class="tbl-wrap"><table class="tbl">' +
    '<thead><tr><th>Mês</th><th class="center">Total</th><th class="center">Concluídas</th><th class="center">Em andamento</th><th class="center">Pendentes</th><th class="center">% Conclusão</th><th>Status</th><th></th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div></div>';
}

function attachMeses() {
  var mp = document.getElementById('mesesPicker');
  if (mp) mp.addEventListener('change', function() { state.ui.monthSel = parseInt(mp.value, 10); renderPage(); });
  var btns = document.querySelectorAll('[data-month-detail]');
  for (var i = 0; i < btns.length; i++) {
    (function(b) {
      b.addEventListener('click', function() {
        state.ui.monthSel = parseInt(b.getAttribute('data-month-detail'), 10);
        state.ui.page = 'lista';
        renderShell();
        renderPage();
      });
    })(btns[i]);
  }
}

// ========================================================
// PROJETOS — com etapas que aparecem no calendário!
// ========================================================
function renderProjetos() {
  var visibleProjects = state.projects.filter(canViewProject);

  if (state.ui.fSearch) {
    var q = state.ui.fSearch.toLowerCase();
    visibleProjects = visibleProjects.filter(function(p) {
      return p.name.toLowerCase().indexOf(q) !== -1 || (p.desc || '').toLowerCase().indexOf(q) !== -1;
    });
  }

  if (visibleProjects.length === 0) {
    var emptyMsg = state.projects.length === 0 ? 'Nenhum projeto criado' : 'Nenhum projeto visível';
    var emptyTxt = canManage()
      ? 'Clique em "Novo" para criar seu primeiro projeto'
      : 'Você não tem projetos atribuídos no momento';
    return '<div class="page-head"><div><h2 class="page-title">Projetos</h2>' +
      '<p class="page-sub">Gerencie projetos e suas etapas com prazos</p></div>' +
      (canManage() ? '<button class="btn btn-primary" id="btnNewProj"><span class="icon" style="display:inline-flex">' + ICON.plus + '</span> Novo projeto</button>' : '') +
      '</div>' +
      '<div class="empty"><div class="empty-icon">' + ICON.folder + '</div>' +
      '<div class="empty-title">' + emptyMsg + '</div>' +
      '<div class="empty-text">' + emptyTxt + '</div></div>';
  }

  var cards = '';
  for (var i = 0; i < visibleProjects.length; i++) {
    var p = visibleProjects[i];
    // Calcular progresso pelas milestones
    var msTotal = (p.milestones || []).length;
    var msDone = 0;
    for (var mi = 0; mi < msTotal; mi++) {
      var pInst = peekProjInst(p.id, p.milestones[mi].id);
      if (pInst.status === 'Concluído') msDone++;
    }
    var prog = msTotal > 0 ? Math.round((msDone / msTotal) * 100) : (p.progress || 0);

    var u = getUser(p.responsibleId);
    var fillCls = prog >= 80 ? 'green' : prog >= 50 ? 'amber' : '';
    cards += '<div class="proj-card" data-proj="' + esc(p.id) + '">' +
      '<div class="proj-head"><div class="proj-name">' + esc(p.name) + '</div></div>' +
      (p.desc ? '<div class="proj-desc">' + esc(p.desc) + '</div>' : '') +
      '<div class="proj-meta">' +
        '<span class="pill ' + (p.status === 'Concluído' ? 'done' : p.status === 'Em andamento' ? 'doing' : 'pending') + '">' + esc(p.status || 'A fazer') + '</span>' +
        '<span class="prio ' + esc(p.priority || 'media') + '">' + esc(p.priority || 'media') + '</span>' +
        (p.area ? areaTag(p.area) : '') +
      '</div>' +
      '<div class="proj-prog-info"><span>Progresso</span><strong>' + prog + '%</strong></div>' +
      '<div class="prog-bar"><div class="prog-fill ' + fillCls + '" style="width:' + prog + '%"></div></div>' +
      '<div class="proj-foot">' +
        (u ? avatar(u, 'sm') + '<span style="margin-left:4px">' + esc(u.name) + '</span>' : '<span>Sem responsável</span>') +
        (p.deadline ? '<span>📅 ' + fmtISOToBR(p.deadline) + '</span>' : (msTotal > 0 ? '<span>📋 ' + msDone + '/' + msTotal + ' etapas</span>' : '<span></span>')) +
      '</div></div>';
  }

  return '<div class="page-head"><div><h2 class="page-title">Projetos</h2>' +
    '<p class="page-sub">' + visibleProjects.length + ' projeto' + (visibleProjects.length !== 1 ? 's' : '') + ' visíve' + (visibleProjects.length !== 1 ? 'is' : 'l') + '</p></div>' +
    (canManage() ? '<button class="btn btn-primary" id="btnNewProj"><span class="icon" style="display:inline-flex">' + ICON.plus + '</span> Novo projeto</button>' : '') +
    '</div>' +
    '<div class="proj-grid">' + cards + '</div>';
}

function attachProjetos() {
  var nb = document.getElementById('btnNewProj');
  if (nb) nb.addEventListener('click', function() { openProjectModal(); });

  var cards = document.querySelectorAll('[data-proj]');
  for (var i = 0; i < cards.length; i++) {
    (function(card) {
      card.addEventListener('click', function() { openProjectModal(card.getAttribute('data-proj')); });
    })(cards[i]);
  }
}

function openProjectModal(projId) {
  var isNew = !projId;
  if (isNew && !canManage()) { toast('Apenas administradores criam projetos', 'error'); return; }
  var p = isNew ? {
    id: '', name: '', desc: '', status: 'A fazer', priority: 'media',
    progress: 0, responsibleId: '', area: '', deadline: '', startDate: '', milestones: []
  } : (getProject(projId) || {});
  if (!isNew && !canViewProject(p)) { toast('Sem permissão', 'error'); return; }
  if (!p.milestones) p.milestones = [];

  var canMng = canManage();

  // Milestones HTML
  var msHTML = '';
  if (p.milestones.length === 0) {
    msHTML = '<div style="color:#6B6B6B;font-size:12px;text-align:center;padding:12px">Nenhuma etapa. ' + (canMng ? 'Adicione etapas com data — elas aparecem no calendário.' : '') + '</div>';
  } else {
    var sorted = p.milestones.slice().sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); });
    for (var mi = 0; mi < sorted.length; mi++) {
      var ms = sorted[mi];
      var inst = isNew ? { status: 'A fazer' } : peekProjInst(p.id, ms.id);
      var au = getUser(ms.assigneeId || inst.assigneeId);
      msHTML += '<div class="milestone-row' + (inst.status === 'Concluído' ? ' done' : '') + '">' +
        (!isNew ? '<span class="cbox' + (inst.status === 'Concluído' ? ' checked' : '') + '" data-msTog data-mid="' + esc(ms.id) + '"></span>' : '') +
        '<div class="milestone-info">' +
          '<div class="milestone-name">' + esc(ms.name) + '</div>' +
          '<div class="milestone-date">📅 ' + (ms.date ? fmtISOToBR(ms.date) : 'sem data') + (au ? ' · ' + esc(au.name) : '') + '</div>' +
        '</div>' +
        (canMng ? '<button class="btn-icon danger" data-msDel data-mid="' + esc(ms.id) + '"><span style="display:inline-flex">' + ICON.trash + '</span></button>' : '') +
      '</div>';
    }
  }

  var areaOpts = '<option value="">— Sem área —</option>';
  for (var a = 0; a < state.settings.areas.length; a++) {
    areaOpts += '<option value="' + esc(state.settings.areas[a]) + '"' + (p.area === state.settings.areas[a] ? ' selected' : '') + '>' + esc(state.settings.areas[a]) + '</option>';
  }

  var html = '<div class="modal-bg" id="modalBg"><div class="modal lg">' +
    '<div class="modal-head"><div class="modal-title">' + (isNew ? 'Novo Projeto' : esc(p.name)) + '</div>' +
      '<button class="modal-close" data-close><span class="icon">' + ICON.close + '</span></button></div>' +
    '<div class="modal-body">' +
      '<div class="field" style="margin-bottom:14px"><label class="field-label">Nome do projeto</label>' +
        (canMng ?
          '<input class="input" id="prjName" value="' + esc(p.name) + '">' :
          '<div class="input">' + esc(p.name) + '</div>'
        ) + '</div>' +
      '<div class="field" style="margin-bottom:14px"><label class="field-label">Descrição</label>' +
        (canMng ?
          '<textarea class="input" id="prjDesc" rows="2">' + esc(p.desc || '') + '</textarea>' :
          '<div class="input" style="min-height:60px;padding:10px 12px">' + (p.desc ? esc(p.desc) : '<span style="color:#9A9A9A">Sem descrição</span>') + '</div>'
        ) + '</div>' +
      '<div class="field-row" style="margin-bottom:14px">' +
        '<div class="field"><label class="field-label">Status</label>' +
          (canMng ?
            '<select class="input" id="prjStatus">' +
              '<option value="A fazer"' + (p.status === 'A fazer' ? ' selected' : '') + '>A fazer</option>' +
              '<option value="Em Andamento"' + (p.status === 'Em andamento' ? ' selected' : '') + '>Em Andamento</option>' +
              '<option value="Concluído"' + (p.status === 'Concluído' ? ' selected' : '') + '>Concluído</option>' +
            '</select>' :
            '<div class="input">' + esc(p.status) + '</div>'
          ) + '</div>' +
        '<div class="field"><label class="field-label">Prioridade</label>' +
          (canMng ?
            '<select class="input" id="prjPriority">' +
              '<option value="alta"' + (p.priority === 'alta' ? ' selected' : '') + '>Alta</option>' +
              '<option value="media"' + (p.priority === 'media' ? ' selected' : '') + '>Média</option>' +
              '<option value="baixa"' + (p.priority === 'baixa' ? ' selected' : '') + '>Baixa</option>' +
            '</select>' :
            '<div class="input">' + esc(p.priority) + '</div>'
          ) + '</div>' +
      '</div>' +
      '<div class="field-row" style="margin-bottom:14px">' +
        '<div class="field"><label class="field-label">Responsável</label>' +
          (canMng ?
            '<select class="input" id="prjResponsible">' + userOpts(p.responsibleId) + '</select>' :
            '<div class="input">' + (getUser(p.responsibleId) ? esc(getUser(p.responsibleId).name) : '—') + '</div>'
          ) + '</div>' +
        '<div class="field"><label class="field-label">Área</label>' +
          (canMng ?
            '<select class="input" id="prjArea">' + areaOpts + '</select>' :
            '<div class="input">' + esc(p.area || '—') + '</div>'
          ) + '</div>' +
      '</div>' +
      '<div class="field-row" style="margin-bottom:14px">' +
        '<div class="field"><label class="field-label">Início</label>' +
          (canMng ?
            '<input class="input" type="date" id="prjStart" value="' + esc(p.startDate || '') + '">' :
            '<div class="input">' + (p.startDate ? fmtISOToBR(p.startDate) : '—') + '</div>'
          ) + '</div>' +
        '<div class="field"><label class="field-label">Prazo final</label>' +
          (canMng ?
            '<input class="input" type="date" id="prjDeadline" value="' + esc(p.deadline || '') + '">' :
            '<div class="input">' + (p.deadline ? fmtISOToBR(p.deadline) : '—') + '</div>'
          ) + '</div>' +
      '</div>' +
      '<div style="border-top:1px solid #F0F0EE;padding-top:16px;margin-top:16px">' +
        '<label class="field-label" style="margin-bottom:8px;display:block">Etapas do projeto (aparecem no calendário)</label>' +
        '<div id="msList">' + msHTML + '</div>' +
        (canMng ?
          '<div style="margin-top:8px;display:grid;grid-template-columns:1fr 130px 130px 32px;gap:6px;align-items:end">' +
            '<input class="input" id="newMsName" placeholder="Nome da etapa" style="height:32px">' +
            '<input class="input" type="date" id="newMsDate" style="height:32px">' +
            '<select class="input" id="newMsAssignee" style="height:32px">' + userOpts() + '</select>' +
            '<button class="btn btn-icon" id="btnAddMs"><span style="display:inline-flex">' + ICON.plus + '</span></button>' +
          '</div>' : '') +
      '</div>' +
    '</div>' +
    '<div class="modal-foot">' +
      (!isNew && canMng ? '<button class="btn" id="btnDelProj" style="color:#B33A3A">Excluir</button><div style="flex:1"></div>' : '') +
      '<button class="btn" data-close>' + (canMng ? 'Cancelar' : 'Fechar') + '</button>' +
      (canMng ? '<button class="btn btn-primary" id="btnSaveProj">' + (isNew ? 'Criar' : 'Salvar') + '</button>' : '') +
    '</div></div></div>';

  showModal(html);

  if (canMng) {
    // Adicionar etapa
    var btnAddMs = document.getElementById('btnAddMs');
    if (btnAddMs) {
      btnAddMs.addEventListener('click', function() {
        var name = document.getElementById('newMsName').value.trim();
        var date = document.getElementById('newMsDate').value;
        var aId = document.getElementById('newMsAssignee').value;
        if (!name) { toast('Informe o nome da etapa', 'error'); return; }
        if (!date) { toast('Informe a data', 'error'); return; }
        p.milestones.push({ id: genUUID(), name: name, date: date, assigneeId: aId || null });
        // Se for projeto novo, vamos criar agora para poder aceitar mais etapas
        if (isNew) {
          if (!document.getElementById('prjName').value.trim()) {
            toast('Informe o nome do projeto antes de adicionar etapas', 'error');
            p.milestones.pop();
            return;
          }
          p.id = genUUID();
          p.name = document.getElementById('prjName').value.trim();
          p.desc = document.getElementById('prjDesc').value.trim();
          p.status = document.getElementById('prjStatus').value;
          p.priority = document.getElementById('prjPriority').value;
          p.responsibleId = document.getElementById('prjResponsible').value || null;
          p.area = document.getElementById('prjArea').value;
          p.startDate = document.getElementById('prjStart').value;
          p.deadline = document.getElementById('prjDeadline').value;
          state.projects.push(p);
          isNew = false;
          projId = p.id;
          logActivity('project', 'criou projeto "' + p.name + '"');
        }
        // Pre-create instance with assignee
        if (aId) {
          var pinst = getProjInst(p.id, p.milestones[p.milestones.length - 1].id);
          pinst.assigneeId = aId;
        }
        save();
        if (window.sbSaveProject) window.sbSaveProject(p);
        closeModal();
        openProjectModal(projId);
      });
    }

    var msDels = document.querySelectorAll('[data-msDel]');
    for (var d = 0; d < msDels.length; d++) {
      (function(b) {
        b.addEventListener('click', function() {
          if (!confirm('Excluir esta etapa?')) return;
          var mid = b.getAttribute('data-mid');
          p.milestones = p.milestones.filter(function(x) { return x.id !== mid; });
          delete state.projInst[projInstKey(p.id, mid)];
          save();
          if (window.sbSaveProject) window.sbSaveProject(p);
          closeModal();
          openProjectModal(projId);
        });
      })(msDels[d]);
    }

    document.getElementById('btnSaveProj').addEventListener('click', function() {
      var name = document.getElementById('prjName').value.trim();
      if (!name) { toast('Nome obrigatório', 'error'); return; }
      var data = {
        name: name,
        desc: document.getElementById('prjDesc').value.trim(),
        status: document.getElementById('prjStatus').value,
        priority: document.getElementById('prjPriority').value,
        responsibleId: document.getElementById('prjResponsible').value || null,
        area: document.getElementById('prjArea').value,
        startDate: document.getElementById('prjStart').value,
        deadline: document.getElementById('prjDeadline').value
      };
      if (isNew) {
        var newP = { id: genUUID(), milestones: [] };
        for (var k in data) newP[k] = data[k];
        state.projects.push(newP);
        logActivity('project', 'criou projeto "' + name + '"');
        toast('Projeto criado', 'success');
        save();
        if (window.sbSaveProject) window.sbSaveProject(newP);
      } else {
        for (var k2 in data) p[k2] = data[k2];
        logActivity('project', 'atualizou projeto "' + name + '"');
        toast('Salvo ✓', 'success');
        save();
        if (window.sbSaveProject) window.sbSaveProject(p);
      }
      closeModal();
      renderShell();
      renderPage();
    });

    var btnDel = document.getElementById('btnDelProj');
    if (btnDel) {
      btnDel.addEventListener('click', function() {
        if (!canDelete()) { toast('Apenas administradores podem excluir', 'error'); return; }
        if (!confirm('⚠️ Excluir o projeto "' + p.name + '"?\n\nTodas as etapas e marcações serão removidas.\nEsta ação NÃO pode ser desfeita.')) return;
        var pid = p.id;
        state.projects = state.projects.filter(function(x) { return x.id !== pid; });
        for (var k in state.projInst) {
          if (k.indexOf(pid + '|') === 0) delete state.projInst[k];
        }
        logActivity('project', 'excluiu projeto "' + p.name + '"');
        save();
        if (window.sbDelProject) window.sbDelProject(pid);
        closeModal();
        renderPage();
        toast('Projeto excluído', 'success');
      });
    }
  }

  // Toggle milestone (qualquer um com permissão de ver pode marcar — admin sempre pode)
  if (!isNew) {
    var msTogs = document.querySelectorAll('[data-msTog]');
    for (var mt = 0; mt < msTogs.length; mt++) {
      (function(el) {
        el.addEventListener('click', function() {
          var mid = el.getAttribute('data-mid');
          var inst = peekProjInst(p.id, mid);
          // Permissão: admin sempre, ou assignee da milestone
          if (!isAdmin() && inst.assigneeId !== state.user.id) { toast('Sem permissão', 'error'); return; }
          var ns = inst.status === 'Concluído' ? 'A fazer' : 'Concluído';
          setProjMilestone(p.id, mid, 'status', ns);
          logActivity('project', (ns === 'Concluído' ? 'concluiu' : 'reabriu') + ' etapa');
          save();
          closeModal();
          openProjectModal(projId);
        });
      })(msTogs[mt]);
    }
  }
}

// RELATÓRIOS AVANÇADOS
// ========================================================
function renderRelatorios() {
  // Top performers
  var perfMap = {};  // userId -> { done, total, name, color }
  for (var i = 0; i < state.users.length; i++) {
    var u = state.users[i];
    perfMap[u.id] = { done: 0, total: 0, name: u.name, color: u.color || '#0A0A0A', user: u };
  }
  // Sem responsável
  perfMap['_no'] = { done: 0, total: 0, name: 'Sem responsável', color: '#9A9A9A' };

  // Por área
  var areaMap = {};
  for (var ai = 0; ai < state.settings.areas.length; ai++) {
    areaMap[state.settings.areas[ai]] = { done: 0, total: 0, pending: 0, name: state.settings.areas[ai] };
  }

  // Loop instâncias
  var k;
  for (k in state.inst) {
    if (!state.inst.hasOwnProperty(k)) continue;
    var inst = state.inst[k];
    if (inst.status === 'N/A') continue;
    var parts = k.split('|');
    var code = parts[2];
    var tpl = getTaskTpl(code);
    if (!tpl) continue;
    // Counted only if status differs from default
    if (inst.status === 'Concluído' || inst.status === 'A fazer' || inst.status === 'Em andamento') {
      var owner = inst.assigneeId || '_no';
      if (!perfMap[owner]) perfMap[owner] = { done: 0, total: 0, name: 'Desconhecido', color: '#9A9A9A' };
      perfMap[owner].total++;
      if (inst.status === 'Concluído') perfMap[owner].done++;

      if (areaMap[tpl.area]) {
        areaMap[tpl.area].total++;
        if (inst.status === 'Concluído') areaMap[tpl.area].done++;
        else areaMap[tpl.area].pending++;
      }
    }
  }

  // Top performers (excluir sem responsável e quem não tem total)
  var topList = [];
  for (var uid in perfMap) {
    if (perfMap.hasOwnProperty(uid) && perfMap[uid].total > 0 && uid !== '_no') {
      topList.push({
        id: uid, name: perfMap[uid].name, color: perfMap[uid].color, user: perfMap[uid].user,
        done: perfMap[uid].done, total: perfMap[uid].total,
        pct: Math.round((perfMap[uid].done / perfMap[uid].total) * 100)
      });
    }
  }
  topList.sort(function(a, b) { return b.done - a.done; });
  var topHTML = '';
  if (topList.length === 0) {
    topHTML = '<div class="empty"><div class="empty-text">Sem dados de performance ainda</div></div>';
  } else {
    var maxDone = topList[0].done || 1;
    for (var t = 0; t < Math.min(5, topList.length); t++) {
      var tp = topList[t];
      var medal = t === 0 ? '🥇' : t === 1 ? '🥈' : t === 2 ? '🥉' : '⭐';
      topHTML += '<div class="bar-row" style="margin-bottom:12px">' +
        '<span style="font-size:18px;width:30px;text-align:center">' + medal + '</span>' +
        (tp.user ? avatar(tp.user, 'sm') : '<span class="avatar sm" style="background:' + esc(tp.color) + '">' + esc(getInitials(tp.name)) + '</span>') +
        '<div style="flex:1;margin:0 10px;min-width:0">' +
          '<div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(tp.name) + '</div>' +
          '<div class="bar-track" style="margin-top:4px"><div class="bar-fill green" style="width:' + Math.round(tp.done / maxDone * 100) + '%"></div></div>' +
        '</div>' +
        '<div style="text-align:right;min-width:90px">' +
          '<div style="font-size:14px;font-weight:700">' + tp.done + '</div>' +
          '<div style="font-size:10px;color:#6B6B6B">' + tp.pct + '% conclusão</div>' +
        '</div>' +
      '</div>';
    }
  }

  // Áreas
  var areaList = [];
  for (var ak in areaMap) {
    if (areaMap.hasOwnProperty(ak) && areaMap[ak].total > 0) {
      areaList.push(areaMap[ak]);
    }
  }
  areaList.sort(function(a, b) { return b.total - a.total; });
  var areaHTML = '';
  if (areaList.length === 0) {
    areaHTML = '<div class="empty"><div class="empty-text">Sem dados de áreas ainda</div></div>';
  } else {
    for (var ar = 0; ar < areaList.length; ar++) {
      var arr = areaList[ar];
      var arPct = Math.round((arr.done / arr.total) * 100);
      var arCls = arPct >= 80 ? 'green' : arPct >= 50 ? '' : '';
      areaHTML += '<div class="bar-row">' +
        '<span class="bar-label" style="text-align:left;width:120px">' + esc(arr.name) + '</span>' +
        '<div class="bar-track"><div class="bar-fill ' + arCls + '" style="width:' + arPct + '%"></div></div>' +
        '<span class="bar-val">' + arPct + '%</span>' +
      '</div>';
    }
  }

  // Heatmap: 12 meses × 31 dias - cor = % de conclusão do dia
  var heatmapHTML = '';
  for (var hm = 0; hm < 12; hm++) {
    var monthKey = MONTHS_KEY[hm];
    var diM = new Date(2026, hm + 1, 0).getDate();
    heatmapHTML += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">' +
      '<span style="font-size:10px;color:#6B6B6B;width:28px;font-weight:500">' + MONTHS[hm].substring(0, 3) + '</span>' +
      '<div class="heatmap" style="flex:1">';
    for (var dy = 1; dy <= 31; dy++) {
      if (dy > diM) {
        heatmapHTML += '<div class="heatmap-cell" style="visibility:hidden"></div>';
        continue;
      }
      var hDone = 0, hTotal = 0;
      for (var hi = 0; hi < state.tpl.diarias.length; hi++) {
        var hInst = peekInst(monthKey, dy, state.tpl.diarias[hi].code);
        if (hInst.status === 'N/A') continue;
        hTotal++;
        if (hInst.status === 'Concluído') hDone++;
      }
      var hPct = hTotal > 0 ? (hDone / hTotal) : 0;
      var lvl = '';
      if (hPct > 0 && hPct <= 0.25) lvl = 'l1';
      else if (hPct <= 0.5) lvl = 'l2';
      else if (hPct <= 0.75) lvl = 'l3';
      else if (hPct > 0.75) lvl = 'l4';
      heatmapHTML += '<div class="heatmap-cell ' + lvl + '" title="' + dy + '/' + (hm + 1) + ': ' + hDone + '/' + hTotal + '"></div>';
    }
    heatmapHTML += '</div></div>';
  }

  // Stats globais
  var ys = yearStats();

  return '<div class="page-head"><div><h2 class="page-title">Relatórios</h2>' +
    '<p class="page-sub">Análise detalhada de performance e produtividade</p></div></div>' +
    '<div class="metrics">' +
      '<div class="metric accent"><div class="metric-label">Performance Anual</div><div class="metric-value">' + ys.pct + '%</div></div>' +
      '<div class="metric success"><div class="metric-label">Concluídas</div><div class="metric-value">' + ys.done + '</div></div>' +
      '<div class="metric"><div class="metric-label">Total Tarefas</div><div class="metric-value">' + ys.total + '</div></div>' +
      '<div class="metric"><div class="metric-label">Pessoas ativas</div><div class="metric-value">' + topList.length + '</div></div>' +
    '</div>' +
    '<div class="chart-grid">' +
      '<div class="card"><div class="card-head"><div class="card-title">🏆 Top Performers</div></div>' +
        '<div class="card-body">' + topHTML + '</div></div>' +
      '<div class="card"><div class="card-head"><div class="card-title">📊 Performance por Área</div></div>' +
        '<div class="card-body">' + areaHTML + '</div></div>' +
    '</div>' +
    '<div class="card"><div class="card-head"><div class="card-title">🔥 Mapa de Calor — Conclusões 2026</div></div>' +
      '<div class="card-body">' + heatmapHTML +
      '<div class="heatmap-legend">' +
        '<span>Menos</span>' +
        '<div class="heatmap-legend-cells">' +
          '<span style="background:#F0F0EE"></span>' +
          '<span style="background:#C8E5CF"></span>' +
          '<span style="background:#95CDA3"></span>' +
          '<span style="background:#5FA873"></span>' +
          '<span style="background:#2D7A3E"></span>' +
        '</div>' +
        '<span>Mais</span>' +
      '</div></div></div>';
}

// === VIEW 1: VISÃO GERAL DA EQUIPE ===
function renderGestaoOverview() {
  var monthIdx = gestaoState.monthIdx;
  var monthKey = MONTHS_KEY[monthIdx];
  var diM = new Date(2026, monthIdx + 1, 0).getDate();
  var today = new Date();
  var todayDay = (today.getFullYear() === 2026 && today.getMonth() === monthIdx) ? today.getDate() : 0;

  // Para cada usuário, calcular estatísticas
  var userCards = '';
  var users = state.users.slice();

  if (users.length === 0) {
    userCards = '<div class="empty"><div class="empty-title">Cadastre usuários primeiro</div></div>';
  } else {
    for (var u = 0; u < users.length; u++) {
      var usr = users[u];
      var totalAssigned = 0;
      var done = 0;
      var pending = 0;
      var overdue = 0;
      var todayPending = 0;
      var todayDone = 0;

      // Diárias
      for (var d = 1; d <= diM; d++) {
        for (var ti = 0; ti < state.tpl.diarias.length; ti++) {
          var tk = state.tpl.diarias[ti];
          var inst = peekInst(monthKey, d, tk.code);
          var aId = inst.assigneeId || tk.defaultAssigneeId;
          if (aId !== usr.id) continue;
          totalAssigned++;
          if (inst.status === 'Concluído') done++;
          else {
            pending++;
            if (todayDay > 0 && d < todayDay) overdue++;
          }
          if (d === todayDay) {
            if (inst.status === 'Concluído') todayDone++;
            else todayPending++;
          }
        }
      }

      var pct = totalAssigned > 0 ? Math.round((done / totalAssigned) * 100) : 0;
      var statusColor = pct >= 80 ? '#43A047' : pct >= 50 ? '#FB8C00' : pct > 0 ? '#E53935' : '#9A9A9A';

      // Tarefas de hoje
      var todayHTML = '';
      if (todayDay > 0) {
        var todayItems = [];
        for (var ti2 = 0; ti2 < state.tpl.diarias.length; ti2++) {
          var tkT = state.tpl.diarias[ti2];
          var instT = peekInst(monthKey, todayDay, tkT.code);
          var aIdT = instT.assigneeId || tkT.defaultAssigneeId;
          if (aIdT !== usr.id) continue;
          todayItems.push({ tpl: tkT, inst: instT });
        }
        if (todayItems.length > 0) {
          todayHTML = '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-light)"><div style="font-size:11px;font-weight:600;color:#6B6B6B;margin-bottom:6px">📅 HOJE</div>';
          for (var hi = 0; hi < todayItems.length; hi++) {
            var item = todayItems[hi];
            var icon = item.inst.status === 'Concluído' ? '✅' : '⏳';
            todayHTML += '<div style="font-size:12px;padding:3px 0;display:flex;align-items:center;gap:6px">' +
              '<span>' + icon + '</span>' +
              '<span style="flex:1;color:' + (item.inst.status === 'Concluído' ? '#9A9A9A' : 'var(--text)') + ';' + (item.inst.status === 'Concluído' ? 'text-decoration:line-through' : '') + '">' +
              esc(item.tpl.code) + ' - ' + esc(item.tpl.title.substring(0, 50)) + (item.tpl.title.length > 50 ? '...' : '') + '</span></div>';
          }
          todayHTML += '</div>';
        }
      }

      userCards += '<div class="user-mgmt-card">' +
        '<div class="user-mgmt-head">' +
          avatar(usr, 'md') +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-weight:600;font-size:14px">' + esc(usr.name) + '</div>' +
            '<div style="font-size:11px;color:#6B6B6B">' + esc(usr.position || usr.role) + '</div>' +
          '</div>' +
          '<div style="text-align:right">' +
            '<div style="font-size:24px;font-weight:700;color:' + statusColor + '">' + pct + '%</div>' +
            '<div style="font-size:10px;color:#6B6B6B">no mês</div>' +
          '</div>' +
        '</div>' +
        '<div class="user-mgmt-bar">' +
          '<div class="user-mgmt-fill" style="width:' + pct + '%;background:' + statusColor + '"></div>' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:10px">' +
          '<div style="text-align:center;padding:6px;background:#E8F5E9;border-radius:6px">' +
            '<div style="font-size:16px;font-weight:700;color:#2E7D32">' + done + '</div>' +
            '<div style="font-size:9px;color:#666">CONCLUÍDAS</div>' +
          '</div>' +
          '<div style="text-align:center;padding:6px;background:#FFF3E0;border-radius:6px">' +
            '<div style="font-size:16px;font-weight:700;color:#F57C00">' + pending + '</div>' +
            '<div style="font-size:9px;color:#666">PENDENTES</div>' +
          '</div>' +
          '<div style="text-align:center;padding:6px;background:#FFEBEE;border-radius:6px">' +
            '<div style="font-size:16px;font-weight:700;color:#C62828">' + overdue + '</div>' +
            '<div style="font-size:9px;color:#666">ATRASADAS</div>' +
          '</div>' +
          '<div style="text-align:center;padding:6px;background:#E3F2FD;border-radius:6px">' +
            '<div style="font-size:16px;font-weight:700;color:#1565C0">' + totalAssigned + '</div>' +
            '<div style="font-size:9px;color:#666">TOTAL</div>' +
          '</div>' +
        '</div>' +
        todayHTML +
      '</div>';
    }
  }

  // Stats globais
  var totalGlobalDone = 0, totalGlobalAssigned = 0, totalOverdue = 0;
  for (var d2 = 1; d2 <= diM; d2++) {
    for (var ti3 = 0; ti3 < state.tpl.diarias.length; ti3++) {
      var tk2 = state.tpl.diarias[ti3];
      var i2 = peekInst(monthKey, d2, tk2.code);
      var aId2 = i2.assigneeId || tk2.defaultAssigneeId;
      if (!aId2) continue;
      totalGlobalAssigned++;
      if (i2.status === 'Concluído') totalGlobalDone++;
      else if (todayDay > 0 && d2 < todayDay) totalOverdue++;
    }
  }
  var globalPct = totalGlobalAssigned > 0 ? Math.round((totalGlobalDone / totalGlobalAssigned) * 100) : 0;
  var alertOverdue = totalOverdue > 0 ?
    '<div class="alert-overdue">⚠️ <strong>' + totalOverdue + '</strong> tarefa(s) atrasada(s) na equipe! Ação necessária.</div>' : '';

  return alertOverdue +
    '<div class="metrics" style="margin-bottom:20px">' +
      '<div class="metric accent"><div class="metric-label">Conclusão Equipe</div><div class="metric-value">' + globalPct + '%</div><div class="metric-trend">' + totalGlobalDone + ' de ' + totalGlobalAssigned + '</div></div>' +
      '<div class="metric"><div class="metric-label">Pessoas ativas</div><div class="metric-value">' + state.users.length + '</div></div>' +
      '<div class="metric warning"><div class="metric-label">Atrasadas</div><div class="metric-value">' + totalOverdue + '</div></div>' +
      '<div class="metric success"><div class="metric-label">Concluídas no mês</div><div class="metric-value">' + totalGlobalDone + '</div></div>' +
    '</div>' +
    '<div class="user-mgmt-grid">' + userCards + '</div>';
}

// === VIEW 2: MATRIZ DE CONCLUSÃO ===
function renderGestaoMatrix() {
  var monthIdx = gestaoState.monthIdx;
  var monthKey = MONTHS_KEY[monthIdx];
  var diM = new Date(2026, monthIdx + 1, 0).getDate();
  var today = new Date();
  var todayDay = (today.getFullYear() === 2026 && today.getMonth() === monthIdx) ? today.getDate() : 0;

  // Mês selector
  var monthOpts = '';
  for (var m = 0; m < 12; m++) {
    monthOpts += '<option value="' + m + '"' + (m === monthIdx ? ' selected' : '') + '>' + MONTHS[m] + '</option>';
  }

  // Cabeçalho com dias
  var daysHeader = '<th style="position:sticky;left:0;background:var(--card-bg);z-index:2;min-width:200px">Tarefa / Dia</th><th style="min-width:100px">Responsável</th>';
  for (var d = 1; d <= diM; d++) {
    var isWeekend = false;
    var dayDate = new Date(2026, monthIdx, d);
    if (dayDate.getDay() === 0 || dayDate.getDay() === 6) isWeekend = true;
    var isToday = d === todayDay;
    daysHeader += '<th class="matrix-day' + (isWeekend ? ' weekend' : '') + (isToday ? ' today' : '') + '">' + d + '</th>';
  }

  // Linhas — uma por tarefa diária
  var rows = '';
  for (var ti = 0; ti < state.tpl.diarias.length; ti++) {
    var tk = state.tpl.diarias[ti];
    var assigneeId = tk.defaultAssigneeId;
    var assignee = getUser(assigneeId);

    // Calcular linha
    var cells = '';
    var done = 0, total = 0;
    for (var d2 = 1; d2 <= diM; d2++) {
      var inst = peekInst(monthKey, d2, tk.code);
      var st = inst.status;
      var actualAssignee = inst.assigneeId || tk.defaultAssigneeId;
      if (actualAssignee) total++;

      var cls = 'matrix-cell';
      var ico = '';
      if (st === 'Concluído') { cls += ' done'; ico = '✓'; done++; }
      else if (st === 'Em andamento' || st === 'Doing') { cls += ' doing'; ico = '◐'; }
      else if (st === 'N/A') { cls += ' na'; ico = '—'; }
      else if (actualAssignee) {
        cls += ' assigned';
        ico = '○';
        if (todayDay > 0 && d2 < todayDay) { cls += ' overdue'; }
      } else {
        cls += ' unassigned';
        ico = '·';
      }

      var dayDate2 = new Date(2026, monthIdx, d2);
      if (dayDate2.getDay() === 0 || dayDate2.getDay() === 6) cls += ' weekend';
      if (d2 === todayDay) cls += ' today';

      cells += '<td class="' + cls + '" data-mk="' + monthKey + '" data-day="' + d2 + '" data-code="' + esc(tk.code) + '" title="Dia ' + d2 + ' - ' + esc(tk.title) + '">' + ico + '</td>';
    }

    var pct = total > 0 ? Math.round((done / total) * 100) : 0;
    rows += '<tr>' +
      '<td style="position:sticky;left:0;background:var(--card-bg);z-index:1;font-size:11px"><strong>' + esc(tk.code) + '</strong> - ' + esc(tk.title.substring(0, 50)) + (tk.title.length > 50 ? '...' : '') + '<div style="font-size:10px;color:#6B6B6B">' + done + '/' + total + ' = ' + pct + '%</div></td>' +
      '<td style="font-size:11px">' + (assignee ? avatar(assignee, 'sm') + ' ' + esc(assignee.name.split(' ')[0]) : '<span style="color:#9A9A9A">—</span>') + '</td>' +
      cells +
    '</tr>';
  }

  if (state.tpl.diarias.length === 0) {
    rows = '<tr><td colspan="' + (diM + 2) + '" style="text-align:center;padding:32px">Nenhuma tarefa diária cadastrada</td></tr>';
  }

  return '<div class="card"><div class="card-head" style="gap:12px;flex-wrap:wrap">' +
    '<div class="card-title">📋 Matriz de Conclusão · Visão por dia</div>' +
    '<select class="input" id="matrixMonthSel" style="height:32px;width:auto">' + monthOpts + '</select>' +
    '<div style="display:flex;gap:10px;font-size:11px;color:#6B6B6B;flex-wrap:wrap">' +
      '<span>✓ Concluído</span><span>○ Pendente</span><span style="color:#C62828">○ Atrasado</span><span>· Sem responsável</span>' +
    '</div></div>' +
    '<div class="matrix-wrap"><table class="matrix-tbl"><thead><tr>' + daysHeader + '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}

// === VIEW 3: ATRIBUIÇÃO EM MASSA ===
function renderGestaoBulk() {
  var monthIdx = gestaoState.monthIdx;
  var monthKey = MONTHS_KEY[monthIdx];
  var diM = new Date(2026, monthIdx + 1, 0).getDate();

  // Step 1: Tarefas
  var taskCards = '';
  for (var ti = 0; ti < state.tpl.diarias.length; ti++) {
    var tk = state.tpl.diarias[ti];
    var checked = gestaoState.selectedTasks.indexOf(tk.code) !== -1;
    var owner = getUser(tk.defaultAssigneeId);
    taskCards += '<label class="bulk-item' + (checked ? ' selected' : '') + '">' +
      '<input type="checkbox" data-bulk-task="' + esc(tk.code) + '"' + (checked ? ' checked' : '') + '>' +
      '<div style="flex:1"><div style="font-weight:600;font-size:13px">' + esc(tk.code) + ' - ' + esc(tk.title.substring(0, 50)) + (tk.title.length > 50 ? '...' : '') + '</div>' +
        '<div style="font-size:11px;color:#6B6B6B">' + areaTag(tk.area) + (owner ? ' · padrão: ' + esc(owner.name) : '') + '</div></div>' +
    '</label>';
  }
  if (state.tpl.diarias.length === 0) taskCards = '<p style="color:#6B6B6B">Nenhuma tarefa diária cadastrada</p>';

  // Step 2: Período
  var dayBtns = '';
  for (var d = 1; d <= diM; d++) {
    var sel = gestaoState.selectedDays.indexOf(d) !== -1;
    var dayDate = new Date(2026, monthIdx, d);
    var dow = ['D','S','T','Q','Q','S','S'][dayDate.getDay()];
    var weekend = dayDate.getDay() === 0 || dayDate.getDay() === 6;
    dayBtns += '<button class="day-pick' + (sel ? ' selected' : '') + (weekend ? ' weekend' : '') + '" data-bulk-day="' + d + '"><div style="font-size:9px">' + dow + '</div><div>' + d + '</div></button>';

  // Quick actions period
  var quickPeriod =

      '<button class="btn btn-sm" data-period-quick="all">Mês todo</button>' +
      '<button class="btn btn-sm" data-period-quick="weekdays">Só dias úteis</button>' +
      '<button class="btn btn-sm" data-period-quick="this-week">Esta semana</button>' +
      '<button class="btn btn-sm" data-period-quick="next-week">Próxima semana</button>' +
      '<button class="btn btn-sm" data-period-quick="rest">Resto do mês</button>' +
      '<button class="btn btn-sm" data-period-quick="clear">Limpar</button>' +
    '</div>';

  // Step 3: Responsável
  var userOpts = '<option value="">— Selecione —</option>';
  for (var u = 0; u < state.users.length; u++) {
    var usr = state.users[u];
    userOpts += '<option value="' + esc(usr.id) + '"' + (gestaoState.selectedAssignee === usr.id ? ' selected' : '') + '>' + esc(usr.name) + ' (' + esc(usr.position || usr.role) + ')</option>';
  }

  // Mês selector
  var monthOpts = '';
  for (var m = 0; m < 12; m++) {
    monthOpts += '<option value="' + m + '"' + (m === monthIdx ? ' selected' : '') + '>' + MONTHS[m] + '</option>';
  }

  // Preview
  var willAffect = gestaoState.selectedTasks.length * gestaoState.selectedDays.length;
  var canApply = gestaoState.selectedTasks.length > 0 && gestaoState.selectedDays.length > 0 && gestaoState.selectedAssignee;

  var previewBox = '';
  if (canApply) {
    var u = getUser(gestaoState.selectedAssignee);
    previewBox = '<div class="bulk-preview">' +
      '<div style="font-weight:600;margin-bottom:8px">📋 Pré-visualização</div>' +
      '<p>Vai atribuir <strong>' + gestaoState.selectedTasks.length + '</strong> tarefa(s) em <strong>' + gestaoState.selectedDays.length + '</strong> dia(s) para <strong>' + esc(u.name) + '</strong>.</p>' +
      '<p style="font-size:12px;color:#6B6B6B">Total: ' + willAffect + ' instância(s) de tarefa serão criadas/atualizadas.</p>' +
    '</div>';
  }

  return '<div class="bulk-grid">' +
    // Step 1
    '<div class="card"><div class="card-head"><div class="card-title">1️⃣ Selecione as tarefas</div>' +
      '<button class="btn btn-sm" id="bulkSelectAllTasks">Todas</button>' +
      '<button class="btn btn-sm btn-ghost" id="bulkClearTasks">Limpar</button></div>' +
    '<div class="card-body" style="max-height:400px;overflow-y:auto">' + taskCards + '</div></div>' +

    // Step 2
    '<div class="card"><div class="card-head" style="gap:8px;flex-wrap:wrap">' +
      '<div class="card-title">2️⃣ Selecione os dias</div>' +

    '</div>' +
    '<div class="card-body">' + quickPeriod + '<div class="day-grid">' + dayBtns + '</div></div></div>' +

    '<div class="card"><div class="card-head"><div class="card-title">3️⃣ Responsável</div></div>' +

        '<button class="btn btn-primary btn-block" id="bulkApply"' + (!canApply ? ' disabled' : '') + '>⚡ Atribuir em Massa</button>' +
      '</div>' +
    '</div></div>' +

    '</div>';
}

window.attachGestao = function() {
  // Tabs
  var tabs = document.querySelectorAll('[data-gestao-tab]');
  for (var t = 0; t < tabs.length; t++) {
    (function(b) {
      b.addEventListener('click', function() {
        gestaoState.view = b.getAttribute('data-gestao-tab');
        renderPage();
      });
    })(tabs[t]);
  }

  // V8.5: One-time tasks tab
  if (gestaoState.view === 'onetime') {
    var btnNew = document.getElementById('btnNewOneTime');
    if (btnNew) btnNew.addEventListener('click', function() {
      openOneTimeModal();
    });
    var cards = document.querySelectorAll('[data-onetime-edit]');
    for (var c = 0; c < cards.length; c++) {
      (function(card) {
        card.addEventListener('click', function() {
          openOneTimeModal(card.getAttribute('data-onetime-edit'));
        });
      })(cards[c]);
    }
  }

  // Matrix view
  if (gestaoState.view === 'matrix') {
    var ms = document.getElementById('matrixMonthSel');
    if (ms) ms.addEventListener('change', function() {
      gestaoState.monthIdx = parseInt(ms.value, 10);
      renderPage();
    });
    // Click em célula abre detalhe
    var cells = document.querySelectorAll('.matrix-cell');
    for (var c = 0; c < cells.length; c++) {
      (function(cell) {
        cell.addEventListener('click', function() {
          var mk = cell.getAttribute('data-mk');
          var day = parseInt(cell.getAttribute('data-day'), 10);
          var code = cell.getAttribute('data-code');
          if (mk && day && code && typeof openTaskDetailModal === 'function') {
            openTaskDetailModal(mk, day, code);
          }
        });
      })(cells[c]);
    }
  }

  // Bulk view
  if (gestaoState.view === 'bulk') {
    // Task selection
    var taskInputs = document.querySelectorAll('[data-bulk-task]');
    for (var ti = 0; ti < taskInputs.length; ti++) {
      (function(inp) {
        inp.addEventListener('change', function() {
          var code = inp.getAttribute('data-bulk-task');
          if (inp.checked) {
            if (gestaoState.selectedTasks.indexOf(code) === -1) gestaoState.selectedTasks.push(code);
          } else {
            gestaoState.selectedTasks = gestaoState.selectedTasks.filter(function(c) { return c !== code; });
          }
          renderPage();
        });
      })(taskInputs[ti]);
    }

    var btnAllTasks = document.getElementById('bulkSelectAllTasks');
    if (btnAllTasks) btnAllTasks.addEventListener('click', function() {
      gestaoState.selectedTasks = state.tpl.diarias.map(function(t) { return t.code; });
      renderPage();
    });
    var btnClearTasks = document.getElementById('bulkClearTasks');
    if (btnClearTasks) btnClearTasks.addEventListener('click', function() {
      gestaoState.selectedTasks = [];
      renderPage();
    });

    // Day selection
    var dayBtns = document.querySelectorAll('[data-bulk-day]');
    for (var dd = 0; dd < dayBtns.length; dd++) {
      (function(b) {
        b.addEventListener('click', function() {
          var d = parseInt(b.getAttribute('data-bulk-day'), 10);
          if (gestaoState.selectedDays.indexOf(d) === -1) gestaoState.selectedDays.push(d);
          else gestaoState.selectedDays = gestaoState.selectedDays.filter(function(x) { return x !== d; });
          renderPage();
        });
      })(dayBtns[dd]);
    }

    // Quick periods
    var quickBtns = document.querySelectorAll('[data-period-quick]');
    for (var qb = 0; qb < quickBtns.length; qb++) {
      (function(b) {
        b.addEventListener('click', function() {
          var which = b.getAttribute('data-period-quick');
          var monthIdx = gestaoState.monthIdx;
          var diM = new Date(2026, monthIdx + 1, 0).getDate();
          var today = new Date();
          var todayDay = (today.getFullYear() === 2026 && today.getMonth() === monthIdx) ? today.getDate() : 1;

          if (which === 'all') {
            var arr = [];
            for (var d = 1; d <= diM; d++) arr.push(d);
            gestaoState.selectedDays = arr;
          } else if (which === 'weekdays') {
            var arrW = [];
            for (var dw = 1; dw <= diM; dw++) {
              var dt = new Date(2026, monthIdx, dw);
              if (dt.getDay() !== 0 && dt.getDay() !== 6) arrW.push(dw);
            }
            gestaoState.selectedDays = arrW;
          } else if (which === 'this-week') {
            // Esta semana (segunda a domingo) baseado em hoje
            var arrTW = [];
            if (todayDay > 0) {
              var todayDt = new Date(2026, monthIdx, todayDay);
              var dayOfWeek = todayDt.getDay(); // 0=dom, 1=seg
              var diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
              var monday = todayDay + diff;
              for (var dtw = 0; dtw < 7; dtw++) {
                var dn = monday + dtw;
                if (dn >= 1 && dn <= diM) arrTW.push(dn);
              }
            }
            gestaoState.selectedDays = arrTW;
          } else if (which === 'next-week') {
            var arrNW = [];
            if (todayDay > 0) {
              var todayDt2 = new Date(2026, monthIdx, todayDay);
              var dayOfWeek2 = todayDt2.getDay();
              var diff2 = dayOfWeek2 === 0 ? -6 : 1 - dayOfWeek2;
              var nextMon = todayDay + diff2 + 7;
              for (var dnw = 0; dnw < 7; dnw++) {
                var dnn = nextMon + dnw;
                if (dnn >= 1 && dnn <= diM) arrNW.push(dnn);
              }
            }
            gestaoState.selectedDays = arrNW;
          } else if (which === 'rest') {
            var arrR = [];
            var startDay = todayDay > 0 ? todayDay : 1;
            for (var dr = startDay; dr <= diM; dr++) arrR.push(dr);
            gestaoState.selectedDays = arrR;
          } else if (which === 'clear') {
            gestaoState.selectedDays = [];
          }
          renderPage();
        });
      })(quickBtns[qb]);
    }

    // Month change
    var bms = document.getElementById('bulkMonthSel');
    if (bms) bms.addEventListener('change', function() {
      gestaoState.monthIdx = parseInt(bms.value, 10);
      gestaoState.selectedDays = [];
      renderPage();
    });

    // Assignee
    var sa = document.getElementById('bulkAssignee');
    if (sa) sa.addEventListener('change', function() {
      gestaoState.selectedAssignee = sa.value;
      renderPage();
    });

    // Apply
    var btnApply = document.getElementById('bulkApply');
    if (btnApply) btnApply.addEventListener('click', async function() {
      if (!gestaoState.selectedTasks.length || !gestaoState.selectedDays.length || !gestaoState.selectedAssignee) {
        toast('Selecione tarefas, dias e responsável', 'error');
        return;
      }
      var assignedUser = getUser(gestaoState.selectedAssignee);
      if (!assignedUser) { toast('Responsável inválido', 'error'); return; }

      var monthKey = MONTHS_KEY[gestaoState.monthIdx];
      var items = [];

      btnApply.disabled = true;
      btnApply.textContent = 'Aplicando 0%...';

      // Atualizar local primeiro (UX rápido)
      for (var ti2 = 0; ti2 < gestaoState.selectedTasks.length; ti2++) {
        var code = gestaoState.selectedTasks[ti2];
        for (var di = 0; di < gestaoState.selectedDays.length; di++) {
          var day = gestaoState.selectedDays[di];
          var inst = getInst(monthKey, day, code);
          inst.assigneeId = gestaoState.selectedAssignee;
          items.push({
            monthKey: monthKey,
            day: day,
            code: code,
            status: inst.status || 'A fazer',
            assigneeId: gestaoState.selectedAssignee,
            notes: inst.notes,
            comments: inst.comments,
            subtasks: inst.subtasks,
            completedAt: inst.completedAt,
            completedBy: inst.completedBy
          });
        }
      }

      save();
      window.sbLastUserAction = Date.now();

      // Bulk no servidor com progresso
      var totalItems = items.length;
      var result = { ok: 0, fail: 0 };

      if (window.sbBulkAssign) {
        // Atualizar progresso enquanto roda (poll)
        var progressInterval = setInterval(function() {
          if (btnApply) btnApply.textContent = 'Aplicando ' + Math.round(result.ok / totalItems * 100) + '%...';
        }, 300);

        try {
          result = await window.sbBulkAssign(items);
        } catch(e) {
          console.error('Bulk error:', e);
        }

        clearInterval(progressInterval);
      }

      logActivity('task', 'atribuiu ' + gestaoState.selectedTasks.length + ' tarefas em ' + gestaoState.selectedDays.length + ' dias para ' + assignedUser.name + ' (' + result.ok + ' instâncias salvas)');

      if (result.fail > 0) {
        toast('⚠️ ' + result.ok + ' salvas, ' + result.fail + ' falharam', 'error');
      } else {
        toast('✅ ' + result.ok + ' atribuição(ões) aplicada(s)!', 'success');
      }

      gestaoState.selectedTasks = [];
      gestaoState.selectedDays = [];
      gestaoState.selectedAssignee = '';
      btnApply.disabled = false;
      btnApply.textContent = '⚡ Atribuir em Massa';
      renderPage();
    });
  }
};

// === VIEW 4: TAREFAS PONTUAIS (V8.5) ===
function renderGestaoOneTime() {
  var oneTimes = state.oneTimes || [];

  // Lista das tarefas pontuais existentes
  var listHTML = '';
  if (oneTimes.length === 0) {
    listHTML = '<div class="empty"><div class="empty-icon">📌</div><div class="empty-title">Nenhuma tarefa pontual</div><div class="empty-text">Tarefas pontuais aparecem só nas datas que você definir</div></div>';
  } else {
    // Ordenar por data mais próxima
    var sorted = oneTimes.slice().sort(function(a, b) {
      var aDate = (a.dates || []).slice().sort()[0] || '9999';
      var bDate = (b.dates || []).slice().sort()[0] || '9999';
      return aDate.localeCompare(bDate);
    });
    for (var i = 0; i < sorted.length; i++) {
      var t = sorted[i];
      var assignee = getUser(t.assigneeId);
      var datesHTML = '';
      var sortedDates = (t.dates || []).slice().sort();
      for (var di = 0; di < sortedDates.length; di++) {
        var dymd = sortedDates[di];
        var dInst = peekOneTimeInst(t.id, dymd);
        var dCls = dInst.status === 'Concluído' ? 'done' : 'pending';
        // Verifica se passou
        var dDate = ymdToDate(dymd);
        var todayDate = new Date(); todayDate.setHours(0,0,0,0);
        var isPast = dDate < todayDate && dInst.status !== 'Concluído';
        if (isPast) dCls = 'overdue';
        datesHTML += '<span class="date-pill ' + dCls + '">' + fmtDateBR(dymd) + '</span>';
      }

      // Stats
      var doneCount = 0;
      for (var dc = 0; dc < sortedDates.length; dc++) {
        if (peekOneTimeInst(t.id, sortedDates[dc]).status === 'Concluído') doneCount++;
      }
      var totalCount = sortedDates.length;
      var pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

      listHTML += '<div class="onetime-card" data-onetime-edit="' + esc(t.id) + '">' +
        '<div style="display:flex;align-items:flex-start;gap:12px">' +
          '<div style="flex:1;min-width:0">' +
            '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">' +
              '<span class="prio ' + esc(t.priority || 'media') + '">' + esc(t.priority || 'media') + '</span>' +
              (t.area ? areaTag(t.area) : '') +
            '</div>' +
            '<div style="font-weight:600;font-size:14px;margin-bottom:4px">' + esc(t.title) + '</div>' +
            (t.description ? '<div style="font-size:12px;color:#6B6B6B;margin-bottom:6px">' + esc(t.description.substring(0, 100)) + (t.description.length > 100 ? '...' : '') + '</div>' : '') +
            '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">' + datesHTML + '</div>' +
          '</div>' +
          '<div style="text-align:right;flex-shrink:0">' +
            (assignee ? avatar(assignee, 'sm') + '<div style="font-size:10px;color:#6B6B6B;margin-top:2px">' + esc(assignee.name.split(' ')[0]) + '</div>' : '<span style="color:#9A9A9A;font-size:11px">Sem responsável</span>') +
            '<div style="margin-top:8px;font-size:18px;font-weight:700;color:' + (pct >= 100 ? '#43A047' : pct >= 50 ? '#FB8C00' : '#9A9A9A') + '">' + pct + '%</div>' +
            '<div style="font-size:10px;color:#6B6B6B">' + doneCount + '/' + totalCount + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
  }

  return '<div style="margin-bottom:16px">' +
    '<button class="btn btn-primary" id="btnNewOneTime"><span class="icon">+</span> Nova Tarefa Pontual</button>' +
    '<p style="font-size:12px;color:#6B6B6B;margin-top:8px">Tarefas pontuais aparecem só nas datas escolhidas — não são recorrentes. Ideal para reuniões, eventos, lançamentos, etc.</p>' +
  '</div>' +
  '<div class="onetime-grid">' + listHTML + '</div>';
}

// Modal: criar/editar tarefa pontual
window.openOneTimeModal = function(taskId) {

  if (!task) task = { id: '', title: '', description: '', area: state.settings.areas[0] ? state.settings.areas[0].name : '', priority: 'media', dates: [], assigneeId: null, tags: [], links: [] };

  var areaOpts = '';
  for (var a = 0; a < state.settings.areas.length; a++) {
    var ar = state.settings.areas[a];
    areaOpts += '<option value="' + esc(ar.name) + '"' + (task.area === ar.name ? ' selected' : '') + '>' + esc(ar.emoji) + ' ' + esc(ar.name) + '</option>';

  var userOpts = '<option value="">— Sem responsável —</option>';

          '<select class="input" id="otPriority">' +
            '<option value="alta"' + (task.priority === 'alta' ? ' selected' : '') + '>🔴 Alta</option>' +

          '</select></div>' +
      '</div>' +
      '<div class="field" style="margin-bottom:14px"><label class="field-label">Responsável</label>' +
        '<select class="input" id="otAssignee">' + userOpts + '</select></div>' +
      '<div class="field" style="margin-bottom:14px"><label class="field-label">Datas (uma ou várias) *</label>' +
        '<div style="display:flex;gap:6px;align-items:flex-start">' +
          '<input type="date" class="input" id="otNewDate" min="2026-01-01" max="2026-12-31" style="flex:1">' +
          '<button class="btn btn-primary btn-sm" id="otAddDate" type="button">Adicionar</button>' +
        '</div>' +
        '<div id="otDatesList" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;min-height:30px;padding:8px;background:var(--hover-bg);border-radius:6px">' + datesSummary + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="modal-foot">' +
      (isNew ? '' : '<button class="btn danger" id="otDelete">Excluir</button>') +
      '<button class="btn" data-close>Cancelar</button>' +
      '<button class="btn btn-primary" id="otSave">' + (isNew ? 'Criar tarefa' : 'Salvar') + '</button>' +
    '</div>' +
  '</div></div>';

  showModal(html);

  function refreshDates() {
    var el = document.getElementById('otDatesList');
    if (!el) return;
    if (workDates.length === 0) {
      el.innerHTML = '<span style="color:#9A9A9A;font-size:12px">Nenhuma data adicionada ainda</span>';
      return;
    }
    workDates.sort();
    var html2 = '';
    for (var i = 0; i < workDates.length; i++) {
      html2 += '<span class="date-pill pending" data-rm-date="' + esc(workDates[i]) + '" style="cursor:pointer" title="Clique para remover">' + fmtDateBR(workDates[i]) + ' ✕</span>';
    }
    el.innerHTML = html2;
    // re-attach
    var pills = el.querySelectorAll('[data-rm-date]');
    for (var p = 0; p < pills.length; p++) {
      (function(pill) {
        pill.addEventListener('click', function() {
          var d = pill.getAttribute('data-rm-date');
          workDates = workDates.filter(function(x) { return x !== d; });
          refreshDates();
        });
      })(pills[p]);
    }
  }
  refreshDates();

  document.getElementById('otAddDate').addEventListener('click', function() {
    var inp = document.getElementById('otNewDate');
    var v = inp.value;
    if (!v) { toast('Selecione uma data', 'error'); return; }
    if (workDates.indexOf(v) !== -1) { toast('Data já adicionada', 'error'); return; }
    workDates.push(v);
    inp.value = '';
    refreshDates();
  });

  // Save
  document.getElementById('otSave').addEventListener('click', function() {
    var title = document.getElementById('otTitle').value.trim();
    if (!title) { toast('Título é obrigatório', 'error'); return; }
    if (workDates.length === 0) { toast('Adicione ao menos uma data', 'error'); return; }

    var data = {
      id: task.id || genUUID(),
      title: title,
      description: document.getElementById('otDesc').value.trim(),
      area: document.getElementById('otArea').value,
      priority: document.getElementById('otPriority').value,
      assigneeId: document.getElementById('otAssignee').value || null,
      dates: workDates,
      tags: [], links: [],
      createdBy: state.user ? state.user.id : null,
      createdAt: task.createdAt || Date.now()
    };

    if (isNew) {
      state.oneTimes.push(data);
      logActivity('task', 'criou tarefa pontual "' + title + '" em ' + workDates.length + ' data(s)');
    } else {
      // Atualiza in-place
      for (var i = 0; i < state.oneTimes.length; i++) {
        if (state.oneTimes[i].id === data.id) { state.oneTimes[i] = data; break; }
      }
      logActivity('task', 'editou tarefa pontual "' + title + '"');
    }

    save();
    if (typeof window !== 'undefined') window.sbLastUserAction = Date.now();
    if (window.sbSaveOneTimeTask) window.sbSaveOneTimeTask(data);
    closeModal();
    renderShell();
    renderPage();
    toast(isNew ? 'Tarefa pontual criada ✓' : 'Salva ✓', 'success');
  });

  // Delete
  var delBtn = document.getElementById('otDelete');
  if (delBtn) delBtn.addEventListener('click', function() {
    if (!canDelete()) { toast('Apenas administradores podem excluir', 'error'); return; }
    if (!confirm('⚠️ Excluir esta tarefa pontual?\n\nTodas as datas e status serão removidos.\nEsta ação NÃO pode ser desfeita.')) return;
    var tid = task.id;
    state.oneTimes = state.oneTimes.filter(function(t) { return t.id !== tid; });
    // Limpar instâncias
    for (var k in state.oneTimeInst) {
      if (state.oneTimeInst.hasOwnProperty(k) && k.indexOf(tid + '|') === 0) delete state.oneTimeInst[k];
    }
    logActivity('task', 'excluiu tarefa pontual "' + task.title + '"');
    save();
    if (window.sbDelOneTimeTask) window.sbDelOneTimeTask(tid);
    closeModal();
    renderShell();
    renderPage();
    toast('Tarefa excluída', 'success');
  });
};

function renderCatalogo() {
  function rowsFor(arr, type) {
    if (arr.length === 0) {
      return '<tr><td colspan="6" style="text-align:center;padding:32px;color:#6B6B6B">Nenhuma tarefa cadastrada</td></tr>';
    }
    var rows = '';
    var filtered = arr;
    if (state.ui.fSearch) {
      var q = state.ui.fSearch.toLowerCase();
      filtered = arr.filter(function(t) {
        return t.title.toLowerCase().indexOf(q) !== -1
            || t.code.toLowerCase().indexOf(q) !== -1
            || (t.tags || []).some(function(tg) { return tg.toLowerCase().indexOf(q) !== -1; });
      });
    }
    for (var i = 0; i < filtered.length; i++) {
      var t = filtered[i];
      var tagsCell = '';
      if (t.tags && t.tags.length > 0) {
        tagsCell = t.tags.slice(0, 3).map(function(tg) { return '<span class="tag-chip">#' + esc(tg) + '</span>'; }).join(' ');
        if (t.tags.length > 3) tagsCell += ' <span style="font-size:10px;color:#9A9A9A">+' + (t.tags.length - 3) + '</span>';
      }
      rows += '<tr' + (canManage() ? ' draggable="true" data-tpl-row data-tpl-type="' + type + '" data-tpl-code="' + esc(t.code) + '"' : '') + ' style="cursor:' + (canManage() ? 'grab' : 'default') + '">' +
        '<td><span class="code">' + esc(t.code) + '</span></td>' +
        '<td><div style="font-weight:500">' + esc(t.title) + '</div>' +
          (t.desc ? '<div style="font-size:11px;color:#6B6B6B;margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden">' + esc(t.desc) + '</div>' : '') +
        '</td>' +
        '<td>' + areaTag(t.area) + '</td>' +
        '<td><span class="prio ' + esc(t.priority || 'media') + '">' + esc(t.priority || 'media') + '</span></td>' +
        '<td>' + tagsCell + '</td>' +
        '<td class="center">' +
          (canManage() ?
            '<button class="btn-icon" data-edit-tpl data-type="' + type + '" data-code="' + esc(t.code) + '" title="Editar"><span style="display:inline-flex">' + ICON.edit + '</span></button>' +
            '<button class="btn-icon danger" data-del-tpl data-type="' + type + '" data-code="' + esc(t.code) + '" title="Excluir"><span style="display:inline-flex">' + ICON.trash + '</span></button>' :
            '<span style="color:#9A9A9A;font-size:11px">só leitura</span>'
          ) +
        '</td></tr>';
    }
    return rows;
  }

  return '<div class="page-head"><div><h2 class="page-title">Catálogo de Tarefas</h2>' +
    '<p class="page-sub">' + (canManage() ? 'Gerencie modelos de tarefas, com descrição, tags e links. Arraste para reordenar.' : 'Modelos de tarefas recorrentes') + '</p></div>' +
    (canManage() ? '<div style="display:flex;gap:8px">' +
      '<button class="btn" data-new-tpl="diarias"><span class="icon" style="display:inline-flex">' + ICON.plus + '</span> Diária</button>' +
      '<button class="btn" data-new-tpl="semanais"><span class="icon" style="display:inline-flex">' + ICON.plus + '</span> Semanal</button>' +
      '<button class="btn" data-new-tpl="mensais"><span class="icon" style="display:inline-flex">' + ICON.plus + '</span> Mensal</button>' +
    '</div>' : '') +
    '</div>' +
    '<div class="card" data-tpl-section="diarias"><div class="card-head"><div class="card-title">📅 Tarefas Diárias</div>' +
      '<span class="kb-count">' + state.tpl.diarias.length + '</span></div>' +
      '<div class="tbl-wrap"><table class="tbl">' +
      '<thead><tr><th style="width:80px">Código</th><th>Tarefa</th><th>Área</th><th>Prioridade</th><th>Tags</th><th class="center" style="width:90px">Ações</th></tr></thead>' +
      '<tbody data-tbody-type="diarias">' + rowsFor(state.tpl.diarias, 'diarias') + '</tbody></table></div></div>' +
    '<div class="card" data-tpl-section="semanais"><div class="card-head"><div class="card-title">📊 Tarefas Semanais</div>' +
      '<span class="kb-count">' + state.tpl.semanais.length + '</span></div>' +
      '<div class="tbl-wrap"><table class="tbl">' +
      '<thead><tr><th style="width:80px">Código</th><th>Tarefa</th><th>Área</th><th>Prioridade</th><th>Tags</th><th class="center" style="width:90px">Ações</th></tr></thead>' +
      '<tbody data-tbody-type="semanais">' + rowsFor(state.tpl.semanais, 'semanais') + '</tbody></table></div></div>' +
    '<div class="card" data-tpl-section="mensais"><div class="card-head"><div class="card-title">🗓️ Tarefas Mensais</div>' +
      '<span class="kb-count">' + state.tpl.mensais.length + '</span></div>' +
      '<div class="tbl-wrap"><table class="tbl">' +
      '<thead><tr><th style="width:80px">Código</th><th>Tarefa</th><th>Área</th><th>Prioridade</th><th>Tags</th><th class="center" style="width:90px">Ações</th></tr></thead>' +
      '<tbody data-tbody-type="mensais">' + rowsFor(state.tpl.mensais, 'mensais') + '</tbody></table></div></div>';

function attachCatalogo() {
  var news = document.querySelectorAll('[data-new-tpl]');
  for (var i = 0; i < news.length; i++) {
    (function(b) {
      b.addEventListener('click', function() { openTaskTplModal(b.getAttribute('data-new-tpl')); });
    })(news[i]);
  }
  var edits = document.querySelectorAll('[data-edit-tpl]');
  for (var e = 0; e < edits.length; e++) {
    (function(b) {
      b.addEventListener('click', function(ev) {
        ev.stopPropagation();
        openTaskTplModal(b.getAttribute('data-type'), b.getAttribute('data-code'));
      });
    })(edits[e]);
  }
  var dels = document.querySelectorAll('[data-del-tpl]');
  for (var d = 0; d < dels.length; d++) {
    (function(b) {
      b.addEventListener('click', function(ev) {
        ev.stopPropagation();
        if (!canManage()) { toast('Apenas administradores', 'error'); return; }
        var type = b.getAttribute('data-type'), code = b.getAttribute('data-code');
        var task = null;
        for (var i2 = 0; i2 < state.tpl[type].length; i2++) if (state.tpl[type][i2].code === code) { task = state.tpl[type][i2]; break; }
        if (!task) return;
        if (!confirm('Excluir "' + task.title + '"?')) return;
        state.tpl[type] = state.tpl[type].filter(function(t) { return t.code !== code; });
        for (var k in state.inst) {
          if (state.inst.hasOwnProperty(k) && k.indexOf('|' + code) !== -1) delete state.inst[k];
        }
        logActivity('catalog', 'excluiu tarefa ' + code);
        save();
        if (window.sbDelTpl) window.sbDelTpl(code);
        renderShell();
        renderPage();
        toast('Excluída', 'success');
      });
    })(dels[d]);
  }

  // Click na linha = editar
  var rows = document.querySelectorAll('[data-tpl-row]');
  for (var r = 0; r < rows.length; r++) {
    (function(row) {
      row.addEventListener('click', function() {
        if (canManage()) openTaskTplModal(row.getAttribute('data-tpl-type'), row.getAttribute('data-tpl-code'));
      });
    })(rows[r]);
  }

  // Drag and drop para reordenar
  if (canManage()) {
    var draggedRow = null;
    for (var dr = 0; dr < rows.length; dr++) {
      (function(row) {
        row.addEventListener('dragstart', function(e) {
          draggedRow = row;
          row.style.opacity = '0.4';
          if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
        });
        row.addEventListener('dragend', function() {
          row.style.opacity = '';
          draggedRow = null;
          var hovers = document.querySelectorAll('.drag-over-row');
          for (var h = 0; h < hovers.length; h++) hovers[h].classList.remove('drag-over-row');
        });
        row.addEventListener('dragover', function(e) {
          if (!draggedRow || draggedRow === row) return;
          if (draggedRow.getAttribute('data-tpl-type') !== row.getAttribute('data-tpl-type')) return;
          e.preventDefault();
          row.classList.add('drag-over-row');
        });
        row.addEventListener('dragleave', function() {
          row.classList.remove('drag-over-row');
        });
        row.addEventListener('drop', function(e) {
          e.preventDefault();
          row.classList.remove('drag-over-row');
          if (!draggedRow || draggedRow === row) return;
          var type = draggedRow.getAttribute('data-tpl-type');
          if (type !== row.getAttribute('data-tpl-type')) return;
          var fromCode = draggedRow.getAttribute('data-tpl-code');
          var toCode = row.getAttribute('data-tpl-code');
          var arr = state.tpl[type];
          var fromIdx = -1, toIdx = -1;
          for (var fi = 0; fi < arr.length; fi++) {
            if (arr[fi].code === fromCode) fromIdx = fi;
            if (arr[fi].code === toCode) toIdx = fi;
          }
          if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
          var moved = arr.splice(fromIdx, 1)[0];
          arr.splice(toIdx, 0, moved);
          save();
          logActivity('catalog', 'reordenou tarefas');
          renderPage();
          toast('Ordem atualizada', 'success');
        });
      })(rows[dr]);
    }
  }
}

function openTaskTplModal(type, code) {
  if (!canManage()) { toast('Apenas administradores', 'error'); return; }
  var isNew = !code;
  var task = null;
  if (!isNew) {
    for (var i = 0; i < state.tpl[type].length; i++) if (state.tpl[type][i].code === code) { task = state.tpl[type][i]; break; }
  }
  if (!task) task = { code: '', title: '', desc: '', area: state.settings.areas[0] ? state.settings.areas[0].name : 'Equipe', priority: 'media', tags: [], links: [] };
  if (!task.tags) task.tags = [];
  if (!task.links) task.links = [];

  var typeNames = { diarias: 'Diária', semanais: 'Semanal', mensais: 'Mensal' };
  var prefix = type === 'diarias' ? 'D' : type === 'semanais' ? 'S' : 'M';

  var areaOpts = '';
  for (var a = 0; a < state.settings.areas.length; a++) {

        '<div class="field"><label class="field-label">Prioridade</label>' +
          '<select class="input" id="tplPriority">' +
            '<option value="alta"' + (task.priority === 'alta' ? ' selected' : '') + '>🔴 Alta</option>' +
            '<option value="media"' + (task.priority === 'media' ? ' selected' : '') + '>🟡 Média</option>' +
            '<option value="baixa"' + (task.priority === 'baixa' ? ' selected' : '') + '>⚪ Baixa</option>' +
          '</select></div>' +
      '</div>' +
      '<div class="field" style="margin-bottom:14px"><label class="field-label">Título</label>' +
        '<input class="input" id="tplTitle" value="' + esc(task.title) + '" placeholder="O que precisa ser feito?"></div>' +
      '<div class="field" style="margin-bottom:14px"><label class="field-label">Descrição detalhada</label>' +
        '<textarea class="input" id="tplDesc" rows="3" placeholder="Detalhe a tarefa: como executar, critérios de sucesso, observações...">' + esc(task.desc || '') + '</textarea>' +
        '<div style="font-size:11px;color:#6B6B6B;margin-top:4px">Aparece quando o usuário abre os detalhes da tarefa</div>' +
